name: Final paper figure evidence
on:
  push:
    branches: [ops/paper-final-figures-20260917]
    paths: [.github/workflows/paper-final-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: d1131666542853a24ef686af1dcfce1c6ba0959c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Fetch primary paper bytes and review pages
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request,subprocess,zipfile
          from pathlib import Path
          import fitz
          out=Path('final-evidence');out.mkdir()
          rows=[('besag','https://web.engr.oregonstate.edu/~bulatov/cs539/0.pdf',list(range(1,23))),('cpc','https://arxiv.org/pdf/1807.03748v2',[2,3,6]),('supcon','https://arxiv.org/pdf/2004.11362v5',[1,2,3,4])]
          receipt=[]
          for key,url,pages in rows:
              try:
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 scholarly-figure-review'}),timeout=45) as response:
                              data=response.read();resolved=response.url
                          assert data.startswith(b'%PDF-')
                          break
                      except Exception:
                          if attempt==2:raise
                          time.sleep(2)
                  (out/(key+'.pdf')).write_bytes(data)
                  doc=fitz.open(stream=data,filetype='pdf')
                  receipt.append({'paper':key,'source':url,'resolved':resolved,'sha256':hashlib.sha256(data).hexdigest(),'pages':len(doc),'bytes':len(data)})
                  (out/(key+'-text.txt')).write_text('\n\n'.join('PAGE '+str(i+1)+'\n'+p.get_text() for i,p in enumerate(doc)))
                  for page in pages:
                      if page>len(doc):continue
                      p=doc[page-1]
                      p.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(out/f'{key}-page-{page}.png')
                      (out/f'{key}-page-{page}.json').write_text(json.dumps({'rect':list(p.rect),'blocks':p.get_text('blocks')},ensure_ascii=False))
              except Exception as error:
                  receipt.append({'paper':key,'source':url,'error':repr(error)})
          (out/'sources.json').write_text(json.dumps(receipt,indent=2))
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=Path(name)
                  if p.is_file() and name.startswith(('spaceship-ui/','.github/','scripts/')):
                      archive.write(p,name)
          assert all('error' not in row for row in receipt),receipt
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-paper-figure-evidence
          path: final-evidence/
          retention-days: 7
          if-no-files-found: error
