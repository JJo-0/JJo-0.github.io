name: SoC 00 reviewed visual import

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - 'scripts/prepare_soc00_real_visuals.py'
      - 'scripts/templates/SocSourceFigures.astro'
      - '.github/workflows/soc-00-visual-import.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'content/soc-00-real-visuals-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed image rendering tools
        run: python -m pip install 'PyMuPDF==1.26.4' 'Pillow==11.3.0'
      - name: Validate script and prepare the reviewed sources
        run: |
          python -m py_compile scripts/prepare_soc00_real_visuals.py
          python scripts/prepare_soc00_real_visuals.py | tee soc00-visual-preparation.log
      - name: Commit only the prepared SoC 00 assets and pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui/public/images/posts/soc-00 \
            spaceship-ui/src/data/soc-00-real-media.json \
            spaceship-ui/src/components/post/SocSourceFigures.astro \
            spaceship-ui/site/content/posts/2026-09-28-soc-00-system-map.mdx \
            spaceship-ui/site/content/english/en-soc-00-system-map.mdx \
            spaceship-ui/scripts/soc-overview-browser-check.mjs
          git diff --cached --stat
          git commit -m 'content: connect SoC 00 to a real Pico photo and original datasheet figure'
          python scripts/prepare_soc00_real_visuals.py --manifest-only
          git add spaceship-ui/site/english-edition.json
          git commit -m 'content: record the prepared Korean and English source hashes'
          git push origin HEAD:refs/heads/content/soc-00-real-visuals-20260928
      - name: Record the prepared commit
        if: always()
        run: git rev-parse HEAD > soc00-visual-prepared-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc00-real-visuals-${{ github.run_id }}
          path: |
            soc00-visual-preparation.log
            soc00-visual-prepared-commit.txt
            spaceship-ui/public/images/posts/soc-00/
            spaceship-ui/src/data/soc-00-real-media.json
            spaceship-ui/src/components/post/SocSourceFigures.astro
            spaceship-ui/site/content/posts/2026-09-28-soc-00-system-map.mdx
            spaceship-ui/site/content/english/en-soc-00-system-map.mdx
            spaceship-ui/docs/research/soc-00-visual-design.md
          retention-days: 14
