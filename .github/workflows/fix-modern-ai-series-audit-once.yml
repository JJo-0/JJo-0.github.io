name: Fix Modern AI series rendered contract once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
    paths:
      - .github/workflows/fix-modern-ai-series-audit-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0
      - name: Remove the obsolete reader-preamble assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spaceship-ui/scripts/modern-ai-series-audit.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  if (post.order === 1) requiredRenderedText.push('총 8편');\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete Part I assertion, found {text.count(old)}')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-modern-ai-series-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align series audit with the reader-clean Part I'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
