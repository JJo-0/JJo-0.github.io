name: Sep21 figure probe
on:
  push:
    branches: [ops/sep21-source-review]
    paths: [.github/workflows/sep21-figure-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/ops/sep21-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Probe source figure URLs
        run: |
          python - <<'PY'
          import requests,io,json,hashlib
          from pathlib import Path
          from PIL import Image
          out=Path('probe');out.mkdir()
          papers={
            'fiber':('s41467-026-77550-9','41467_2026_77550'),
            'erled':('s41467-026-77851-z','41467_2026_77851'),
          }
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          rec=[]
          for key,(doi,stem) in papers.items():
            root=out/key;root.mkdir()
            for n in range(1,8):
              url=f'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2F{doi}/MediaObjects/{stem}_Fig{n}_HTML.png'
              try:
                r=s.get(url,timeout=(10,45))
                if not r.ok or len(r.content)<1000: continue
                im=Image.open(io.BytesIO(r.content));im.load()
                name=f'fig-{n}.png';(root/name).write_bytes(r.content)
                thumb=im.copy();thumb.thumbnail((1600,1800));thumb.convert('RGB').save(root/f'fig-{n}-review.jpg',quality=92)
                rec.append({'paper':key,'figure':n,'url':url,'width':im.width,'height':im.height,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content)})
              except Exception as e: print(key,n,e)
          (out/'manifest.json').write_text(json.dumps(rec,indent=2))
          print(json.dumps(rec,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep21-figure-probe
          path: probe/
          retention-days: 5
