name: Frontier source probe 20260912
on:
  push:
    branches: [content/lithium-sulfur-visuals-20260912]
    paths: [.github/workflows/frontier-source-probe-20260912.yml]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'JJo-0/JJo-0.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read public sources without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontier-probe/pages"
          git archive HEAD | gzip > "$RUNNER_TEMP/frontier-probe/repository.tar.gz"
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frontier-probe'
          sources = {
            'lithium': 'https://www.nature.com/articles/s41560-026-02120-8',
            'lithium-fig1': 'https://www.nature.com/articles/s41560-026-02120-8/figures/1',
            'solid': 'https://www.nature.com/articles/s41467-026-77590-1',
            'solid-fig1': 'https://www.nature.com/articles/s41467-026-77590-1/figures/1',
            'embryo': 'https://www.uochb.cz/en/news/821/a-study-in-nature-sheds-new-light-on-dna-repair-in-early-human-embryos-with-implications-for-future-gene-correction',
            'umd': 'https://energy.umd.edu/news/story/university-of-maryland-researchers-develop-three-materials-strategies-for-higherenergy-lithium-batteries',
            'imec': 'https://www.imec-int.com/en/articles/entering-high-na-euv-lithography-era',
            'commons': 'https://commons.wikimedia.org/wiki/File:Large_Sulfur_Crystal.jpg',
            'site-home': 'https://jjo-0.github.io/',
            'site-news': 'https://jjo-0.github.io/news',
            'site-sitemap': 'https://jjo-0.github.io/sitemap-index.xml',
            'site-robots': 'https://jjo-0.github.io/robots.txt',
          }
          class Images(HTMLParser):
            def __init__(self):
              super().__init__(); self.items = []
            def handle_starttag(self, tag, attrs):
              a = dict(attrs)
              if tag in ('img', 'source') or (tag == 'meta' and a.get('property') == 'og:image'):
                self.items.append(a)
          def fetch(pair):
            key, url = pair; result = {'key':key, 'url':url}
            try:
              t = time.monotonic()
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; JJoResearchSourceAudit/1.0)'})
              with urllib.request.urlopen(req, timeout=35) as r:
                data = r.read(6000001)
                if len(data) > 6000000: raise ValueError('source exceeds review size limit')
                result.update(status=r.status, final_url=r.url, seconds=round(time.monotonic()-t,3), bytes=len(data), sha256=hashlib.sha256(data).hexdigest(), headers={k:v for k,v in r.headers.items() if k.lower() in ('server','x-served-by','x-cache','age','cache-control','content-type','x-timer','vary')})
              (root/'pages'/f'{key}.html').write_bytes(data)
              parser = Images(); parser.feed(data.decode('utf-8',errors='replace')); result['images']=parser.items
            except Exception as e: result['error']=str(e)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            results = list(pool.map(fetch, sources.items()))
          (root/'probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          for r in results: print(r['key'], r.get('status'), r.get('bytes'), r.get('error',''))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-source-probe-20260912
          path: ${{ runner.temp }}/frontier-probe/
          retention-days: 3
          if-no-files-found: error
