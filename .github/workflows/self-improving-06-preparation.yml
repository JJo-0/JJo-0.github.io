name: Temporary Self-Improving 06 source preparation
on:
  push:
    branches: [content/self-improving-ai-06]
    paths:
      - '.github/workflows/self-improving-06-preparation.yml'
      - '.github/self-improving-06-integrate.py'
      - 'docs/self-improving-ai/tools/render_06.py'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/self-improving-ai-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render only hash-pinned source images
        run: |
          python -m pip install --quiet PyMuPDF==1.26.7
          python docs/self-improving-ai/tools/render_06.py
      - name: Verify calculations and integrate scoped chapter files
        run: |
          python docs/self-improving-ai/reviews/verify_examples_06.py
          python .github/self-improving-06-integrate.py
          python scripts/normalize_tags_current.py --check
          node --check spaceship-ui/scripts/browser-self-improving-audit.mjs
      - name: Commit only chapter images, records, navigation and taxonomy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- spaceship-ui/site/assets/assets/posts/self-improving-ai-06-self-evaluation-and-entropy docs/self-improving-ai/source-assets/06/manifest.json docs/self-improving-ai/progress.json docs/self-improving-ai/publishing/2026-11-17-chapter-06-request.json docs/self-improving-ai/reviews/numeric-checks-06.json docs/self-improving-ai/reviews/2026-11-17-chapter-06-preparation.json docs/self-improving-ai/drafts/06-RESUME.md spaceship-ui/site/content/posts/self-improving-ai-05-reward-design-to-ai-feedback.mdx scripts/normalize_tags_current.py
          git diff --cached --stat
          git commit -m 'content: integrate reviewed chapter 06 figures and series continuation'
          git pull --rebase origin content/self-improving-ai-06
          git push origin HEAD:content/self-improving-ai-06
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: self-improving-06-rendered
          path: |
            spaceship-ui/site/assets/assets/posts/self-improving-ai-06-self-evaluation-and-entropy/
            docs/self-improving-ai/source-assets/06/manifest.json
            docs/self-improving-ai/reviews/*06*
          retention-days: 7
