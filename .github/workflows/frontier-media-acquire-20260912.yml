name: Frontier media acquire 20260912
on:
  push:
    branches: [content/lithium-sulfur-visuals-20260912]
    paths: [.github/workflows/frontier-media-acquire-20260912.yml]
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'JJo-0/JJo-0.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public media and rights pages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontier-media"
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'frontier-media'
          sources={
            'sulfur-fig1.png':'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41560-026-02120-8/MediaObjects/41560_2026_2120_Fig1_HTML.png',
            'sulfur-crystal.jpg':'https://upload.wikimedia.org/wikipedia/commons/5/56/Large_Sulfur_Crystal.jpg',
            'embryo-blastocyst.png':'https://www.uochb.cz/upload/files/a9/1b/a91b32d51decfe9e30ac56f4a9a633dab62a306b.png',
            'embryo-repair.png':'https://www.uochb.cz/upload/files/12/5a/125a4e29fc53fec6415012680c703c7604288a43.png',
            'high-na-lab.jpg':'https://drupal.imec-int.com/sites/default/files/2024-06/Figure%201%20-%20High-NA%20-%20first%20wafer%20exposures.jpg',
            'solid-reference.pdf':'https://www.nature.com/articles/s41467-026-77590-1_reference.pdf',
            'i18n-google.html':'https://developers.google.com/search/docs/specialty/international/localized-versions',
            'imec-rights.html':'https://www.imec-int.com/en/terms-use-imec-pictures',
            'iocb-press.html':'https://www.uochb.cz/en/press-room',
            'site-sitemap-0.xml':'https://jjo-0.github.io/sitemap-0.xml',
            'site-ads.txt':'https://jjo-0.github.io/ads.txt',
          }
          def fetch(pair):
            name,url=pair; row={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; JJoResearchSourceAudit/1.0)'})
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(25000001)
                if len(data)>25000000:raise ValueError('file over 25MB review limit')
                if name.endswith('.pdf') and not data.startswith(b'%PDF-'):raise ValueError('expected PDF bytes')
                if name.endswith('.png') and not data.startswith(b'\x89PNG\r\n\x1a\n'):raise ValueError('expected PNG bytes')
                if name.endswith('.jpg') and not data.startswith(b'\xff\xd8'):raise ValueError('expected JPEG bytes')
                row.update(status=r.status,final_url=r.url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),content_type=r.headers.get('Content-Type'))
              (root/name).write_bytes(data)
            except Exception as e:row['error']=str(e)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: rows=list(pool.map(fetch,sources.items()))
          (root/'downloads.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          for r in rows:print(r['name'],r.get('status'),r.get('bytes'),r.get('error',''))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-media-acquire-20260912
          path: ${{ runner.temp }}/frontier-media/
          retention-days: 3
          if-no-files-found: error
