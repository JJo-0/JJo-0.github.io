name: All-post legacy semantic equivalence

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prove all-post semantic equivalence
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist .astro /tmp/dist-baseline
          pnpm exec astro build >/tmp/baseline-build.log 2>&1
          cp -a dist /tmp/dist-baseline

          node scripts/_legacy-finalize-migration-v5.mjs

          rm -rf dist .astro
          pnpm exec astro build >/tmp/migrated-build.log 2>&1

          node scripts/rendered-markdown-audit.mjs
          node scripts/post-content-contract.mjs
          node scripts/content-integrity.mjs
          node scripts/modern-ai-formula-audit.mjs

          test ! -d site/assets/image
          test ! -f src/lib/remark-repair-literal-strong.mjs
          test ! -f src/lib/remark/restore-legacy-html.mjs
          test ! -f src/lib/rehype/fix-legacy-fragments.mjs
          ! grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist '/image/' site/content src | grep .
          ! grep -RIl '/image/' dist | grep .
          ! grep -nE 'restoreLegacyHtml|fixLegacyFragments|remarkRepairLiteralStrong' astro.config.mjs

          python <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          import textwrap

          before_root = Path('/tmp/dist-baseline/posts')
          after_root = Path('dist/posts')

          # These two routes intentionally change only the local image src URL.
          asset_route_exceptions = {
              '2024-06-04-2024-06-04-2/index.html',
              '2025-02-07-human-pose-estimate/index.html',
          }

          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S | re.I)

          def post_files(root):
              out = {}
              for path in root.glob('*/index.html'):
                  if path.parent.name == 'tag':
                      continue
                  text = path.read_text(encoding='utf-8')
                  if article_re.search(text):
                      out[path.relative_to(root).as_posix()] = path
              return out

          class CanonicalArticle(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.events = []
                  self.stack = []

              def handle_starttag(self, tag, attrs):
                  normalized_attrs = tuple(sorted((k, v or '') for k, v in attrs))
                  self.events.append(('start', tag, normalized_attrs))
                  self.stack.append(tag)

              def handle_startendtag(self, tag, attrs):
                  normalized_attrs = tuple(sorted((k, v or '') for k, v in attrs))
                  self.events.append(('void', tag, normalized_attrs))

              def handle_endtag(self, tag):
                  self.events.append(('end', tag))
                  if self.stack:
                      self.stack.pop()

              def handle_data(self, data):
                  parent = self.stack[-1] if self.stack else ''
                  if parent in {'script', 'style'}:
                      value = '\n'.join(
                          line.rstrip()
                          for line in textwrap.dedent(data).strip().splitlines()
                      )
                  else:
                      value = re.sub(r'\s+', ' ', data).strip()
                  if value:
                      self.events.append(('data', parent, value))

              def handle_comment(self, data):
                  # Build-time comments are not user-visible DOM semantics.
                  pass

          def canonical(path):
              text = path.read_text(encoding='utf-8')
              match = article_re.search(text)
              if not match:
                  raise RuntimeError(f'no <article> in {path}')
              parser = CanonicalArticle()
              parser.feed(match.group(0))
              return parser.events

          before = post_files(before_root)
          after = post_files(after_root)
          if set(before) != set(after):
              raise SystemExit(
                  f'post route set changed: before-only={sorted(set(before)-set(after))}, '
                  f'after-only={sorted(set(after)-set(before))}'
              )

          print(f'actual_post_routes={len(before)}')
          mismatches = []
          for rel in sorted(before):
              b = canonical(before[rel])
              a = canonical(after[rel])
              if b == a:
                  continue

              if rel in asset_route_exceptions:
                  # Verify the only semantic difference is exactly one image src URL.
                  if len(b) != len(a):
                      mismatches.append((rel, 'asset route event count changed', None, None))
                      continue
                  diffs = [(i, x, y) for i, (x, y) in enumerate(zip(b, a)) if x != y]
                  if len(diffs) != 1:
                      mismatches.append((rel, f'asset route has {len(diffs)} semantic diffs', diffs[:3], None))
                      continue
                  i, x, y = diffs[0]
                  if x[0] not in {'start', 'void'} or y[0] != x[0] or x[1] != 'img' or y[1] != 'img':
                      mismatches.append((rel, 'asset route diff is not an img element', x, y))
                      continue
                  xattrs, yattrs = dict(x[2]), dict(y[2])
                  old_src, new_src = xattrs.pop('src', None), yattrs.pop('src', None)
                  if xattrs != yattrs or not old_src or not new_src or old_src == new_src:
                      mismatches.append((rel, 'asset route changed beyond src', x, y))
                      continue
                  print(f'asset_src_only {rel}: {old_src} -> {new_src}')
                  continue

              first = None
              for i in range(min(len(b), len(a))):
                  if b[i] != a[i]:
                      first = (i, b[i], a[i])
                      break
              if first is None and len(b) != len(a):
                  first = ('length', len(b), len(a))
              mismatches.append((rel, 'unexpected semantic difference', first, None))

          if mismatches:
              print(f'unexpected_semantic_mismatches={len(mismatches)}')
              for item in mismatches[:20]:
                  print('MISMATCH', repr(item)[:3000])
              raise SystemExit(1)

          # Explicit regression check for the original swallowed-HTML failure mode.
          swallowed = []
          code_html_pattern = re.compile(
              r'<pre\b[^>]*data-language="plaintext"[^>]*>.*?&#x3C;(?:div|section|table|script|style)\b',
              re.S | re.I,
          )
          for rel, path in after.items():
              if code_html_pattern.search(path.read_text(encoding='utf-8')):
                  swallowed.append(rel)
          print('swallowed_html_routes=', swallowed)
          if swallowed:
              raise SystemExit(f'HTML remains swallowed as plaintext code: {swallowed}')

          print('ALL_POST_SEMANTIC_EQUIVALENCE=PASS')
          PY
