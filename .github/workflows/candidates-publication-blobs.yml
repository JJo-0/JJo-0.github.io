name: Candidate publication bytes
on:
  push:
    branches: [ops/news-candidates-evidence-20260918]
    paths: [.github/workflows/candidates-publication-blobs.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1354c5763eed00a85f0a8ca50130bd2776d2d456
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install brotli==1.1.0 PyMuPDF==1.26.7
      - name: Materialize exact data and immutable blobs without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, urllib.request, urllib.error, zipfile
          from pathlib import Path, PurePosixPath
          import brotli, fitz
          repo='JJo-0/JJo-0.github.io'
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'candidate-publication-verifier'}
          def sha(data): return hashlib.sha256(data).hexdigest()
          def gitsha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          def request(route, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(api+route,data=data,headers={**headers,'Content-Type':'application/json'},method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          parts=['b775e9d44ce7a1b49ded0db507345a1c7c17e353','46d10fe17abf90b8b81a2b5864e7def58d87393b','32db3bb1147a37f67bd6dd6c55913e0b2a065ed0','6da38f1c773a5251e8dca53a707f2bfb719f91e9']
          chunks=[]
          for digest in parts:
              result=request('/git/blobs/'+digest)
              data=base64.b64decode(result['content']);assert gitsha(data)==digest
              chunks.append(data)
          raw=brotli.decompress(b''.join(chunks))
          assert len(raw)==187846 and sha(raw)=='f8bdccd37e9318c9e3c8efd46e87a02648857ccb63aa6f14a963a5b24155a6a0'
          packet=json.loads(raw)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==packet['base']
          assert len(packet['files'])==27
          out=Path('candidate-publication');out.mkdir()
          # Content is treated as data; never execute decoded source or a writer.
          for row in packet['files']:
              path=PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True)
              if 'content' in row:
                  assert not p.exists(),str(p)
                  p.write_bytes(row['content'].encode())
              elif 'diff' in row:
                  assert sha(p.read_bytes())==row['baseSha256'],str(p)
                  diff=row['diff'].encode()
                  subprocess.run(['git','apply','--check','-'],input=diff,check=True)
                  subprocess.run(['git','apply','-'],input=diff,check=True)
              else:
                  assert p.suffix=='.png' and not p.exists(),str(p)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):return None
          def artifact(number, expected):
              req=urllib.request.Request(api+f'/actions/artifacts/{number}/zip',headers=headers)
              try:
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=90) as response:data=response.read()
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,303,307,308):raise
                  location=error.headers['Location'];assert location.startswith('https://')
                  # Signed object-storage URLs receive no GitHub Authorization.
                  with urllib.request.urlopen(location,timeout=120) as response:data=response.read()
              assert sha(data)==expected,'Artifact identity changed'
              return zipfile.ZipFile(io.BytesIO(data))
          primary=artifact(10533339335,'39aa00907b1da17baa13476e91ea28e1f30871ce0b9ce205551926b3fc152911')
          supplement=artifact(10534070857,'39545ffe578778d7835268844cb4f4545d4c2516d3fe848dd1074bc331613750')
          def member(archive,name):
              names=[p for p in archive.namelist() if PurePosixPath(p).name==name]
              assert len(names)==1,(name,names)
              return archive.read(names[0])
          dest=Path('spaceship-ui/site/assets/assets/posts/news-20260918-candidates')
          source_map={
            'delphy-emat.png':'delphy-figure-1-image-2.png',
            'delphy-h5n1.png':'delphy-figure-4-image-2.png',
            'panxeon-workflow.png':'panxeon-figure-1-image-2.png',
            'panxeon-performance.png':'panxeon-figure-4-image-2.png',
            'photonics-integration.png':'photonics-figure-1-image-2.png',
            'photonics-bto.png':'photonics-figure-2-image-2.png',
          }
          for target,source in source_map.items():(dest/target).write_bytes(member(primary,source))
          pdf=member(supplement,'muscle-accepted.pdf')
          assert sha(pdf)=='1c9a4f28f3c5ed27773950d9a7e95f6c19307305dc623a83b9ee21aad2e558eb'
          doc=fitz.open(stream=pdf,filetype='pdf')
          for name,index,rect in [('soft-muscles-hardware.png',6,[39,44,561,259]),('soft-muscles-controller.png',7,[39,44,561,149])]:
              doc[index].get_pixmap(matrix=fitz.Matrix(5,5),clip=fitz.Rect(rect),alpha=False).save(dest/name)
          results=[]
          for row in packet['files']:
              p=Path(row['path']);data=p.read_bytes()
              assert len(data)==row['bytes'] and sha(data)==row['sha256'] and gitsha(data)==row['gitSha'],row['path']
              blob=request('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert blob['sha']==row['gitSha']
              results.append({k:row[k] for k in ['path','bytes','sha256','gitSha']})
              target=out/'files'/row['path'];target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              print('verified',row['path'],row['gitSha'])
          (out/'blobs.json').write_text(json.dumps({'base':packet['base'],'packetSha256':sha(raw),'files':results},indent=2)+'\n')
          print('PASS',len(results),'exact files; eight original figures; no ref/branch changes')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidates-publication-verified
          path: candidate-publication/
          retention-days: 14
          if-no-files-found: error
