name: One-time experience foundation verification

on:
  push:
    branches: [agent/experience-motion-foundation-phase123]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experience-motion-foundation-phase123
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Harden pointer cleanup lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path('spaceship-ui/src/components/experience/MotionRuntime.svelte')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "      const context = gsap.context(() => {\n",
              "      let pointerCleanup = () => {};\n\n      const context = gsap.context(() => {\n",
              1,
          )
          old = """          context.add(() => {
            visual.removeEventListener('pointermove', onPointerMove);
            visual.removeEventListener('pointerleave', onPointerLeave);
          });
"""
          new = """          pointerCleanup = () => {
            visual.removeEventListener('pointermove', onPointerMove);
            visual.removeEventListener('pointerleave', onPointerLeave);
          };
"""
          if old not in source:
              raise SystemExit('expected pointer cleanup block was not found')
          source = source.replace(old, new, 1)
          source = source.replace(
              "      cleanup = () => {\n        context.revert();\n",
              "      cleanup = () => {\n        pointerCleanup();\n        context.revert();\n",
              1,
          )
          path.write_text(source, encoding='utf-8')
      - name: Install dependencies
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile
      - name: Format changed source
        working-directory: spaceship-ui
        run: pnpm exec prettier --write src/components/experience/MotionRuntime.svelte src/pages/index.astro src/pages/research.astro src/styles/experience.css scripts/experience-contract.mjs
      - name: Lint
        working-directory: spaceship-ui
        run: pnpm lint
      - name: Type check
        working-directory: spaceship-ui
        run: pnpm check
      - name: SEO metadata check
        working-directory: spaceship-ui
        run: pnpm seo:check
      - name: Production build
        working-directory: spaceship-ui
        run: pnpm build
      - name: Content and experience contracts
        working-directory: spaceship-ui
        run: pnpm content:check
      - name: Remove one-time workflows and commit verified state
        shell: bash
        run: |
          rm -f .github/workflows/experience-deps-once.yml
          rm -f .github/workflows/experience-verify-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "feat: finalize progressive motion foundation"
          git push origin HEAD:agent/experience-motion-foundation-phase123
