name: Repair September 15 rendered emphasis
on:
  push:
    branches: [content/news-20260915-biosensing-candidates]
    paths: [.github/workflows/news-20260915-format-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260915-biosensing-candidates
      - name: Fix only the failed emphasis and its reviewed digest
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          post=Path('spaceship-ui/site/content/posts/2026-09-15-mspa-fpba-nanopore-news.mdx')
          manifest=Path('spaceship-ui/site/news-edition-20260915.json')
          edition=json.loads(manifest.read_text())
          entry=edition['entries'][0]
          assert hashlib.sha256(post.read_bytes()).hexdigest()==entry['postSha256']
          text=post.read_text()
          old='**검증 정확도는 98.7%, 별도 시험 세트 정확도는 96.7%**'
          new='<strong>검증 정확도는 98.7%, 별도 시험 세트 정확도는 96.7%</strong>'
          assert text.count(old)==1
          post.write_text(text.replace(old,new))
          entry['postSha256']=hashlib.sha256(post.read_bytes()).hexdigest()
          manifest.write_text(json.dumps(edition,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['node','scripts/news-20260915-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['node','scripts/post-content-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['git','add','--',str(post),str(manifest)],check=True)
          subprocess.run(['git','rm','.github/workflows/news-20260915-format-fix.yml'],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','fix: render nanopore accuracy emphasis without literal Markdown markers (#118)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260915-biosensing-candidates'],check=True)
          print('FORMAT FIX HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
