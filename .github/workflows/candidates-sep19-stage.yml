name: September 19 candidate staging
on:
  push:
    branches: [ops/candidates-20260919-sources]
    paths: [.github/workflows/candidates-sep19-stage.yml]
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40e19f9193fd6c8741c7e9cbebce1c07dd1571e1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Apply the exact reviewed text patch and original figure blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path,PurePosixPath
          repo=os.environ['GITHUB_REPOSITORY'];out=Path('staging-evidence');out.mkdir()
          def blob(sha):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r: result=json.load(r)
              assert result['encoding']=='base64' and result['sha']==sha
              b=base64.b64decode(result['content'])
              assert hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==sha
              return b
          chunks=['191584dd6f2019e8b50ddcdb58d46d94ff0d8d17','e9e35a506879088ad38bbe3ada9fd03aad9d08ba','260743cc10c7e8c3e46f17ccfefa3e4abd6d2717']
          payload=lzma.decompress(base64.b64decode(b''.join(blob(s) for s in chunks),validate=True))
          assert hashlib.sha256(payload).hexdigest()=='d885c77c2c5f6ed1ecdf3e606bc55e43aa753b4f5d41f7d70f958e0ece4685a0'
          data=json.loads(payload)
          assert len(data['receipt'])==14
          for row in data['receipt']:
              p=PurePosixPath(row['path']);assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith(('spaceship-ui/','scripts/','.github/workflows/'))
          patch=out/'changes.patch';patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          receipt=data['receipt']
          for row in receipt:assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest()==row['sha256'],row['path']
          originals=json.loads(Path('spaceship-ui/site/assets/assets/posts/candidates-20260919/provenance.json').read_text())
          assert len(originals)==7
          for row in originals:
              dest=Path('spaceship-ui/site/assets')/row['src'].lstrip('/')
              assert dest.parent==Path('spaceship-ui/site/assets/assets/posts/candidates-20260919')
              raw=blob(row['blobSha']);assert hashlib.sha256(raw).hexdigest()==row['sha256']
              dest.write_bytes(raw);receipt.append({'path':str(dest),'sha256':row['sha256'],'blobSha':row['blobSha']})
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          (out/'base-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          print('Applied 14 exact text files and 7 original figures; no repository reference updated.')
          PY
      - name: Dependencies and Korean browser fonts
        working-directory: spaceship-ui
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -n "$(fc-list :lang=ko family)"
      - name: Source and mutation checks
        working-directory: spaceship-ui
        run: node scripts/news-candidates-20260919-contract.mjs
      - name: Build actual Astro site
        working-directory: spaceship-ui
        run: pnpm build
      - name: Rendered checks
        working-directory: spaceship-ui
        run: node scripts/news-candidates-20260919-contract.mjs
      - name: Native article reading
        working-directory: spaceship-ui
        timeout-minutes: 6
        run: node scripts/browser-sep19-candidates.mjs
      - name: Store verified final files as immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          receipt=json.loads(Path('staging-evidence/receipt.json').read_text());repo=os.environ['GITHUB_REPOSITORY']
          for row in receipt:
              raw=Path(row['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==row['sha256']
              sha=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              if 'blobSha' not in row:
                  req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs',data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=60) as r:result=json.load(r)
                  assert result['sha']==sha
              row['blobSha']=sha
          Path('staging-evidence/final-blobs.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Preserve exact source and rendered reading evidence
        if: always()
        run: |
          python - <<'PY'
          import json,shutil,zipfile
          from pathlib import Path
          out=Path('staging-evidence');out.mkdir(exist_ok=True)
          receipt=out/'receipt.json'
          if receipt.exists():
              with zipfile.ZipFile(out/'candidate-files.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for row in json.loads(receipt.read_text()):
                      p=Path(row['path'])
                      if p.exists():z.write(p,str(p))
          review=Path('spaceship-ui/sep19-review')
          if review.exists():shutil.copytree(review,out/'reading',dirs_exist_ok=True)
          for p in Path('spaceship-ui/dist/posts').glob('2026-09-19-*/index.html'):
              shutil.copyfile(p,out/(p.parent.name+'.html'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: september19-candidate-staging
          path: staging-evidence/
          retention-days: 3
          if-no-files-found: error
