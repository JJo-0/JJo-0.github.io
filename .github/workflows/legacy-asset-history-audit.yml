name: Legacy asset history audit

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trace legacy asset ownership through history
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            'AMR_.png'
            'AMR_Sample_V1.mp4'
            'AMR_Sample_V2.mp4'
            'HPE_general_pipline.png'
            'circle_face.JPG'
            'graph_example_1.png'
            'mouse_surprised.gif'
            'raspberrypi_info.jpeg'
            'raspberrypi_setting.jpeg'
            '증명사진.jpeg'
          )

          for asset in "${assets[@]}"; do
            echo "=== HISTORY ${asset} ==="
            git log --all -S "${asset}" \
              --date=iso-strict \
              --format='COMMIT %H %ad %s' \
              --name-only \
              -- '*.md' '*.mdx' '*.html' '*.astro' '*.yml' '*.yaml' \
              | sed '/^$/d' \
              | head -n 160 || true
          done
