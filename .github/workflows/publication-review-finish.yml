name: Prepare publication review fixes
on:
  push:
    branches: [ops/news-publication-finish-20260918]
    paths: [.github/workflows/publication-review-finish.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9485aaa4ee93e81118e2882739381346bbb87665
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Execute the exact reviewed preparation script as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request,yaml
          url='https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs/3709a8c0c3073a108961c21bc5611b439822d0c4'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: record=json.load(response)
          data=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='3709a8c0c3073a108961c21bc5611b439822d0c4'
          command=yaml.safe_load(data)['jobs']['prepare']['steps'][1]['run']
          assert command.startswith("python3 - <<'PY'\n")
          source=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          # The source is loaded after Actions expression expansion. Its target
          # workflow expressions now remain literal rather than becoming this
          # preparation run's IDs. Correct the earlier isolated prepared name.
          marker='changes[name]=data.decode()'
          assert source.count(marker)==1
          expression='$'+'{{ github.run_id }}'
          replacement=marker+"\n    if name=='.github/workflows/blog-pages-deploy.yml': changes[name]=changes[name].replace('paper2agent-feedback-live-35334165626', 'paper2agent-feedback-live-'+"+repr(expression)+")"
          source=source.replace(marker,replacement,1)
          exec(compile(source,'reviewed-publication-preparation','exec'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-review-finish
          path: review-finish/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
