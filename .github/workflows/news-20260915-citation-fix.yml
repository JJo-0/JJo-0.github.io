name: Repair September 15 FDA reader citation
on:
  push:
    branches: [content/news-20260915-biosensing-candidates]
    paths: [.github/workflows/news-20260915-citation-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260915-biosensing-candidates
      - name: Replace only the failed citation and preserve failed-fetch history
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          post=Path('spaceship-ui/site/content/posts/2026-09-15-mspa-fpba-nanopore-news.mdx')
          manifest=Path('spaceship-ui/site/news-edition-20260915.json')
          contract=Path('spaceship-ui/scripts/news-20260915-contract.mjs')
          edition=json.loads(manifest.read_text());entry=edition['entries'][0]
          assert hashlib.sha256(post.read_bytes()).hexdigest()==entry['postSha256']
          dead='https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-first-therapy-target-muscle-loss-spinal-muscular-atrophy'
          listing='https://www.fda.gov/drugs/novel-drug-approvals-fda/novel-drug-approvals-2026'
          text=post.read_text();old=text[text.index('[4] FDA, [Isembyld 승인 공지]'):]
          assert dead in old and '[5] FDA,' in old
          new='[4] FDA, [2026년 신규 의약품 승인 목록]('+listing+'). 2026-09-15 검색 수록본의 Isembyld 항목에서 9월 11일 승인과 적응증을 확인했다. 이 목록은 접속 가능한 FDA 공식 확인 경로이며, 열람 환경에 따라 갱신 시점이 다른 캐시가 보일 수 있다.\n\n[5] FDA, “FDA Approves First Therapy to Target Muscle Loss in Spinal Muscular Atrophy”, 2026-09-11. 안전성 문구는 FDA 공식 공지의 검색 수록 본문에서 확인했다. 공지 직접 수집은 차단 안내로 이동한 뒤 404를 반환했고 직접 열람도 확인하지 못했으므로, 정상 접속을 확인한 링크처럼 제시하지 않는다. 승인 확인에는 위 FDA 목록을 사용한다.\n'
          text=text[:-len(old)]+new
          assert dead not in text
          post.write_text(text);entry['postSha256']=hashlib.sha256(post.read_bytes()).hexdigest()
          edition['reserve'][0]['source']=listing
          edition['reserve'][0]['verification']='FDA approval listing is the reader-facing link. FDA official search-indexed announcement supports safety wording but direct access was not verified; the failed announcement fetch remains unchanged in sourceReceipts.'
          edition['reviewCorrections']=[{'pr':118,'commentId':4011316319,'change':'Removed failed FDA announcement hyperlink; citation 4 now links to the FDA approval listing, citation 5 explicitly identifies search-index-only access. Original HTTP 404 receipt retained.'}]
          manifest.write_text(json.dumps(edition,ensure_ascii=False,indent=2)+'\n')
          code=contract.read_text()
          marker="assert.equal(edition.reserve[0].status, 'reserve-in-top1-section8');"
          assert code.count(marker)==1
          code=code.replace(marker,marker+'\nassert.equal(edition.reserve[0].source, '+json.dumps(listing)+');\nassert(!read(\'../site/content/posts/2026-09-15-mspa-fpba-nanopore-news.mdx\').includes('+json.dumps(dead)+'), \'Do not republish the failed FDA announcement URL as a reader citation\');')
          contract.write_text(code)
          subprocess.run(['node','scripts/news-20260915-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['node','scripts/post-content-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['git','add','--',str(post),str(manifest),str(contract)],check=True)
          subprocess.run(['git','rm','.github/workflows/news-20260915-citation-fix.yml'],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','fix: replace failed FDA citation with official approval-list link and explicit access boundary (#118)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260915-biosensing-candidates'],check=True)
          print('CITATION FIX HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
