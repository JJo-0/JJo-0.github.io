name: Fix Vision MDX literal brace

on:
  push:
    branches: [agent/astro-native-content]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/astro-native-content
      - name: Normalize literal prose brace
        shell: python
        run: |
          from pathlib import Path

          path = Path('spaceship-ui/site/content/posts/vision.mdx')
          text = path.read_text(encoding='utf-8')
          old = '{Grid 형태의 데이터(이미지 등), 시계열 데이터(센서 등)}아닌'
          new = '(Grid 형태의 데이터(이미지 등), 시계열 데이터(센서 등))가 아닌'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected Vision prose brace pattern not found')
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- spaceship-ui/site/content/posts/vision.mdx; then
            echo "Vision prose already MDX-safe"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui/site/content/posts/vision.mdx
          git commit -m "fix: make Vision prose MDX-safe"
          git push origin HEAD:agent/astro-native-content
