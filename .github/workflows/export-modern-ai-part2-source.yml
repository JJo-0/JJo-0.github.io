name: Export Modern AI Part II source snapshot

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete-v2
    paths:
      - .github/workflows/export-modern-ai-part2-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete-v2
      - name: Package repository source
        shell: bash
        run: |
          tar --exclude=.git --exclude='spaceship-ui/node_modules' --exclude='spaceship-ui/dist' \
            -czf "$RUNNER_TEMP/modern-ai-part2-repository.tar.gz" .
          cp "$RUNNER_TEMP/modern-ai-part2-repository.tar.gz" ./modern-ai-part2-repository.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: modern-ai-part2-repository
          path: modern-ai-part2-repository.tar.gz
          retention-days: 1
