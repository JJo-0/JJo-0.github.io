name: Materialize reviewed additional paper text
on:
  push:
    branches: [ops/paper-figures-20260917-b]
    paths: [.github/workflows/paper-figures-b-text.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/ops/paper-figures-20260917-b'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4bda642e18348d76cf7e284635360f75337c6789
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode reviewed edits as data; verify every output; create immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,urllib.request
          from pathlib import Path
          api='https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def request(url,payload=None):
              req=urllib.request.Request(url,headers=headers,data=None if payload is None else json.dumps(payload).encode(),method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          chunks=[]
          for sha in ['109a7de0dc294401daf97f5cde3a3cd50cc8ebc0','266cdb34e2df978e3e4aaee9f5484ae038add097','fdf7a497378897c55f809e7db9ef3e1c10ebbe0c']:
              r=request(api+'/'+sha);assert r['sha']==sha and r['encoding']=='base64'
              b=base64.b64decode(r['content']);assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              chunks.append(b.decode('ascii'))
          packed=base64.b64decode(''.join(chunks),validate=True)
          assert len(packed)==17198 and hashlib.sha256(packed).hexdigest()=='dd2d3a0e01221c28006822374e1ea09196220cd6a648586a48fd64452ac8f03a'
          raw=gzip.decompress(packed);assert len(raw)==56548
          obj=json.loads(raw);assert obj['baseline']=='4bda642e18348d76cf7e284635360f75337c6789'
          allowed={
              '.github/workflows/modern-ai-continuation.yml':'acc6c2e0a600eb9f40f798ad8a27520f519c8839e14357b346bd9c00d19a3d07',
              'spaceship-ui/docs/operations/MODERN_AI_ADDITIONAL_ORIGINAL_FIGURES.md':'0ba4cc0248e40240bcf0d3289809f83c4ad13e4454e057d8d334d4c64cb73c74',
              'spaceship-ui/scripts/browser-modern-ai-additional-papers.mjs':'d8dc0c511ec8a2f74d709ce64378a7cdfc7b00ba404421cfb93f022c5093eaa4',
              'spaceship-ui/scripts/modern-ai-additional-papers-audit.mjs':'99abae6f0d76dd8de0b3d29c874de03bcd199b822c11687c8a708881c8bd8cd9',
              'spaceship-ui/site/assets/assets/posts/modern-ai-additional-papers/figures.json':'429771987f2791d8cdfc8e20e47996b7c3c81bab6876dba704fdc450b42ee17e',
              'spaceship-ui/site/content/posts/modern-artificial-intelligence-7.mdx':'2a9d81bf12c40bd988e9b22a3616423b23abad33ae98de35a82a66febe3bfaec',
              'spaceship-ui/site/content/posts/modern-artificial-intelligence-8.mdx':'d46f7b2012d4e58ff09b0746983b6013b1323adc45be58c6e77dbb871488bbc6',
              'spaceship-ui/src/components/post/AdditionalPaperFigure.astro':'136dba2ff4eec709306bab6d549535974331161cabcd46c011d271b025ac34e2',
          }
          assert len(obj['files'])==8 and {e['path'] for e in obj['files']}==set(allowed)
          prepared=[]
          for e in obj['files']:
              p=Path(e['path']);assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              if 'baseSha256' in e:
                  b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==e['baseSha256']
                  lines=b.decode('utf-8').splitlines(keepends=True)
                  end=len(lines)
                  for lo,hi,replacement in reversed(e['edits']):
                      assert isinstance(lo,int) and isinstance(hi,int) and 0<=lo<=hi<=end
                      lines[lo:hi]=[replacement];end=lo
                  text=''.join(lines)
              else:
                  assert not p.exists();text=e['content']
              b=text.encode('utf-8');assert hashlib.sha256(b).hexdigest()==e['sha256']==allowed[e['path']]
              prepared.append((e['path'],text,b))
          out=Path('text-evidence');out.mkdir()
          receipts=[]
          for name,text,b in prepared:
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              r=request(api,{'content':text,'encoding':'utf-8'});assert r['sha']==sha
              dest=out/'source'/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(b)
              receipts.append({'path':name,'sha256':hashlib.sha256(b).hexdigest(),'gitBlobSha':sha,'bytes':len(b)})
          (out/'text-blobs.json').write_text(json.dumps({'baseline':obj['baseline'],'scope':'Decoded source objects only. No reviewed source is executed, no commit/ref/PR changes performed by this worker.','files':receipts},indent=2)+'\n')
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: additional-paper-text-blobs
          path: text-evidence/
          retention-days: 7
          if-no-files-found: error
