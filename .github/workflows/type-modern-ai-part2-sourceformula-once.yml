name: Type Modern AI Part II formula event helper once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
    paths:
      - .github/workflows/type-modern-ai-part2-sourceformula-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0
      - name: Add explicit event-helper types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spaceship-ui/src/components/post/SourceFormula.astro')
          text = path.read_text(encoding='utf-8')
          old = "const trackFormulaEvent = (eventName, params) => {"
          new = "const trackFormulaEvent = (eventName: string, params: Record<string, string>) => {"
          if text.count(old) != 1:
              raise SystemExit(f'expected one untyped helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/type-modern-ai-part2-sourceformula-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: type Part II formula analytics helper'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
