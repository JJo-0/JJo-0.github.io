name: Generate legacy category map

on:
  push:
    branches: [agent/content-compatibility]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-compatibility
          fetch-depth: 0
      - name: Extract pre-migration categories
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          legacy_commit = '1a4dd4f5dd7c24a7418a8f8c6b391497052c2a42'
          paths = subprocess.check_output(
              ['git', '-c', 'core.quotePath=false', 'ls-tree', '-r', '--name-only', legacy_commit, '_posts'],
              text=True,
          ).splitlines()

          entries = []
          for git_path in paths:
              if not git_path.lower().endswith('.md'):
                  continue
              source = subprocess.check_output(
                  ['git', 'show', f'{legacy_commit}:{git_path}'],
                  text=True,
              )
              frontmatter = source.split('---', 2)[1]
              lines = frontmatter.splitlines()
              categories = []
              inside = False
              for line in lines:
                  if re.match(r'^categories:\s*$', line):
                      inside = True
                      continue
                  if inside:
                      item = re.match(r'^\s*-\s*(.+?)\s*$', line)
                      if item:
                          categories.append(item.group(1).strip().strip("'\""))
                          continue
                      if line.strip():
                          break
              if len(categories) != 2:
                  raise SystemExit(f'{git_path}: expected two categories, got {categories!r}')
              filename = pathlib.PurePosixPath(git_path).name
              category_path = '/'.join(part.lower() for part in categories)
              entries.append((filename, category_path))

          if len(entries) != 46:
              raise SystemExit(f'expected 46 legacy posts, got {len(entries)}')

          output = [
              '// Generated from the final Jekyll source tree before Astro migration.',
              f"// Source commit: {legacy_commit}",
              'export const LEGACY_CATEGORY_BY_FILENAME = new Map([',
          ]
          for filename, category_path in entries:
              output.append(f'  [{filename!r}, {category_path!r}],')
          output.extend([']);', ''])

          target = pathlib.Path('spaceship-ui/src/lib/legacy-categories.generated.mjs')
          target.write_text('\n'.join(output), encoding='utf-8')
      - name: Commit generated manifest
        shell: bash
        run: |
          if git diff --quiet -- spaceship-ui/src/lib/legacy-categories.generated.mjs; then
            echo "Legacy category manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui/src/lib/legacy-categories.generated.mjs
          git commit -m "chore: capture exact pre-migration category map"
          git push origin HEAD:agent/content-compatibility
