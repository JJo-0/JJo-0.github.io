name: Type FormulaGuide worked example once

on:
  push:
    branches:
      - agent/modern-ai-formula-walkthroughs
    paths:
      - .github/workflows/type-formula-guide-example-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-formula-walkthroughs
          fetch-depth: 0
      - name: Add explicit callback types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spaceship-ui/src/components/post/FormulaGuide.astro')
          text = path.read_text(encoding='utf-8')
          old = '{guide.example.steps.map((item, index) => ('
          new = '{guide.example.steps.map((item: { title: string; explanation?: string; tex?: string }, index: number) => ('
          if text.count(old) != 1:
              raise SystemExit(f'expected one callback target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/type-formula-guide-example-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: type FormulaGuide worked-example callbacks'
          git push origin HEAD:agent/modern-ai-formula-walkthroughs
