name: Astra and AML source reading
on:
  push:
    branches: [editorial/astra-aml-source-guide-20260910]
    paths: [.github/workflows/astra-aml-source-read.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/sep05-deep-explainers-20260910
          path: prior
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Read public sources and original figure files without changing the public site
        run: |
          mkdir -p review/prior
          cp prior/editorial-staging/sep05/*.mdx review/prior/
          cp prior/editorial-staging/sep05/*.astro review/prior/
          python - <<'PY'
          import requests,pathlib,json,concurrent.futures,urllib.parse
          from bs4 import BeautifulSoup
          out=pathlib.Path('review')
          urls={
            'astra-card':'https://deploymentsafety.openai.com/gpt-6-astra',
            'astra-injection-page':'https://deploymentsafety.openai.com/gpt-6-astra/prompt-injection',
            'astra-overview-ko':'https://openai.com/ko-KR/index/safety-overview-gpt-6-astra/',
            'threads':'https://www.threads.com/@choi.openai/post/Dc-hmRhj493',
            'aml-mgb':'https://news.massgeneralbrigham.org/en/less-intensive-drug-combination-more-effective-treating-aml',
            'aml-eurekalert':'https://www.eurekalert.org/news-releases/1142162',
            'aml-full':'https://www.nejm.org/doi/full/10.1056/NEJMoa2602804',
            'aml-registry':'https://clinicaltrials.gov/api/v2/studies/NCT04801797',
            'aml-mrd':'https://pmc.ncbi.nlm.nih.gov/articles/PMC8718623/',
            'aml-mechanism':'https://aacrjournals.org/cancerdiscovery/article/13/6/1408/727301/Combinatorial-BCL2-Family-Expression-in-Acute',
            'aml-photo-license':'https://commons.wikimedia.org/wiki/File:Myeloid_leukemia.jpg',
            'mrd-repository':'https://pure.amsterdamumc.nl/en/publications/2021-update-on-mrd-in-acute-myeloid-leukemia-a-consensus-document-2/'
          }
          figures={4:'image5.png',5:'image38.png',7:'image9.png',8:'image44.png',9:'image42.png',10:'image47.png',11:'image36.png',12:'image16.png',13:'image10.png',14:'image26.png',15:'image13.png',16:'image21.png',22:'scatterplots_main.png',28:'image49.png'}
          for n,file in figures.items(): urls[f'astra-figure-{n:02d}']='https://deploymentsafety.openai.com/data/eval-sets/gpt-6-astra/assets/images/'+file
          def get(item):
            key,url=item; result={'id':key,'url':url,'reuse_permission':'not_inferred_from_download'}
            try:
              response=requests.get(url,timeout=45,headers={'User-Agent':'JJo editorial source reading'})
              mime=response.headers.get('Content-Type',''); result.update(status=response.status_code,final_url=response.url,mime=mime,bytes=len(response.content))
              if not response.ok or len(response.content)>12000000:return result
              if response.content.startswith(b'%PDF'):ext='.pdf'
              elif mime.startswith('image/'):ext='.png' if 'png' in mime else '.jpg' if 'jpeg' in mime else '.webp'
              elif 'json' in mime:ext='.json'
              else:ext='.html'
              (out/(key+ext)).write_bytes(response.content);result['file']=key+ext
              if ext=='.html':
                soup=BeautifulSoup(response.content,'html.parser')
                result['title']=soup.title.get_text() if soup.title else ''
                result['images']=[{'src':im.get('src'),'alt':im.get('alt')} for im in soup.find_all('img')]
                result['links']=[{'text':a.get_text(' ',strip=True)[:150],'url':urllib.parse.urljoin(response.url,a['href'])} for a in soup.find_all('a',href=True) if any(t in a['href'] for t in ['pdf','creativecommons','upload.wikimedia','/files/','/articles/','/pmc/','image/'])]
                (out/(key+'.txt')).write_text(soup.get_text('\n',strip=True),encoding='utf8')
            except Exception as e:result['error']=str(e)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: records=list(pool.map(get,urls.items()))
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps([{k:v for k,v in x.items() if k not in ['images','links']} for x in records],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-aml-primary-reading
          path: review/
          retention-days: 7
