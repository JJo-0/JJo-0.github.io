name: Restore NEWS media and native fragment destinations
on:
  push:
    branches: [content/news-20260917-rubin-bio]
    paths: [.github/workflows/news17-restore-media-and-fragments.yml]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: news17-images-and-mlperf
          run-id: 35171501627
          github-token: ${{ github.token }}
          path: ../news17-evidence
      - name: Restore exact photos and key-based benchmark rows; repair only native URL context
        shell: python
        run: |
          from pathlib import Path
          import csv,json,hashlib,subprocess,shutil
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          git('config','user.name','JJo Editorial');git('config','user.email','76779256+JJo-0@users.noreply.github.com')
          source=Path('../news17-evidence');rows=list(csv.DictReader((source/'mlperf-summary.csv').read_text().splitlines()))
          selected=[r for r in rows if r['Organization']=='NVIDIA' and r['total_accelerators']=='72' and r['MlperfModel'] in ('VLM','deepseek-r1') and r['Platform'] in ('GB300-NVL72_GB300-288GB_aarch64x72_TRT','VR200-NVL72_GR200-288GB_aarch64x72_TRT')]
          assert len(selected)==12
          receipt={'source':'https://github.com/mlcommons/inference_results_v6.1/blob/main/summary.csv','checkedAt':'2026-09-17','sha256':hashlib.sha256((source/'mlperf-summary.csv').read_bytes()).hexdigest(),'rowCount':len(rows),'columns':list(rows[0]),'selectedRows':selected,'selection':'Organization NVIDIA; total_accelerators 72; exact GB300/VR200 platforms; VLM or deepseek-r1. CSV PrivateID is empty; numeric website submission IDs are not falsely claimed as present in CSV.'}
          root=Path('spaceship-ui/site/assets/assets/posts/news-20260917');root.mkdir(parents=True,exist_ok=True)
          photos=json.loads((source/'provenance.json').read_text());assert len(photos)==3
          for row in photos:
              p=source/(row['id']+'.webp');assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'];shutil.copyfile(p,root/p.name)
          shutil.copyfile(source/'provenance.json',root/'provenance.json')
          Path('spaceship-ui/site/news-mlperf-20260917.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          git('add',str(root),'spaceship-ui/site/news-mlperf-20260917.json')
          git('commit','-m','media: recover three verified photographs and exact 72-accelerator MLPerf rows (#126)')
          git('fetch','origin','content/news-20260917-rubin-bio');git('rebase','FETCH_HEAD');git('push','origin','HEAD:refs/heads/content/news-20260917-rubin-bio')
          for branch in ['fix/news-citations-older-20260916','fix/news-citations-recent-20260916','content/news-20260917-rubin-bio']:
              git('fetch','origin',branch);git('switch','--detach','FETCH_HEAD')
              path=Path('spaceship-ui/src/layouts/Layout.astro');text=path.read_text();old='<base href={SITE.base} />';assert text.count(old)==1
              text=text.replace(old,'<!-- A root base sends native #citations to the home page. Article bases must preserve their document path. -->\n    <base href={ogType === \'article\' ? Astro.url.pathname : SITE.base} />')
              path.write_text(text)
              gate=Path('spaceship-ui/scripts/news-citation-contract.py');t=gate.read_text();needle='    tree = Document(text).root\n';assert t.count(needle)==1
              t=t.replace(needle,needle+'    bases = [n.attrs.get("href", "") for n in tree.walk() if n.tag == "base"]\n    if bases:\n        assert len(bases) == 1 and bases[0].startswith("/posts/") and len(bases[0]) > 7, "article fragment base must not target site root"\n')
              gate.write_text(t)
              tests=Path('spaceship-ui/scripts/news-citation-contract.test.py');t=tests.read_text();needle='    def test_bare_marker_is_failure(self):';assert t.count(needle)==1
              t=t.replace(needle,'    def test_root_base_cannot_send_citations_to_home(self):\n        with self.assertRaisesRegex(AssertionError, "fragment base"):\n            audit.audit_html(\'<base href="/">\' + self.page, self.expected)\n        audit.audit_html(\'<base href="/posts/example/">\' + self.page, self.expected)\n\n'+needle);tests.write_text(t)
              browser=Path('spaceship-ui/scripts/browser-news-citation-audit.mjs');t=browser.read_text();t=t.replace("location.hash === '#news-ref-${number}'", "location.pathname.startsWith('/posts/') && location.hash === '#news-ref-${number}'")
              t=t.replace("  clearTimeout(hardStop);\n  cdp?.close();", "  cdp?.close();")
              t=t.replace("  removeProfile(chrome?.profile);\n}","  removeProfile(chrome?.profile);\n  clearTimeout(hardStop);\n  process.exit(process.exitCode || 0);\n}")
              browser.write_text(t)
              subprocess.run(['python3',str(tests)],check=True)
              git('add',str(path),str(gate),str(tests),str(browser));git('diff','--cached','--check')
              git('commit','-m','fix: keep native citation fragments on their article instead of root base (#123)')
              git('push','origin','HEAD:refs/heads/'+branch)
              print('FRAGMENT FIX',branch,git('rev-parse','HEAD'))
