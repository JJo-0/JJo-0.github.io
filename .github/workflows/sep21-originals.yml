name: Sep21 original figures
on:
  push:
    branches: [ops/sep21-source-review]
    paths: [.github/workflows/sep21-originals.yml]
permissions:
  contents: write
jobs:
  originals:
    if: github.ref == 'refs/heads/ops/sep21-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Preserve exact Nature figure bytes and immutable blob identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,concurrent.futures
          from pathlib import Path
          import requests
          from PIL import Image
          out=Path('originals');out.mkdir()
          sets=[
            ('msvd','s41467-026-76272-2','41467_2026_76272',[1,2,4,6,7]),
            ('fiber','s41467-026-77550-9','41467_2026_77550',[1,2,3,4,5]),
            ('erled','s41467-026-77851-z','41467_2026_77851',[1,2,3,4,5]),
          ]
          items=[]
          for key,doi,stem,nums in sets:
            for n in nums:
              url=f'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2F{doi}/MediaObjects/{stem}_Fig{n}_HTML.png'
              items.append((key,n,url))
          session=requests.Session();session.headers['User-Agent']='Mozilla/5.0 scholarly-source-review'
          def acquire(item):
            key,n,url=item
            r=session.get(url,timeout=(15,90));r.raise_for_status();data=r.content
            image=Image.open(io.BytesIO(data));image.load();assert image.format=='PNG' and image.width>500 and image.height>150
            name=f'{key}-fig-{n}.png';(out/name).write_bytes(data)
            record={'id':f'{key}-fig-{n}','file':name,'source':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'width':image.width,'height':image.height,'format':'PNG'}
            blob=requests.post('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},
              json={'encoding':'base64','content':base64.b64encode(data).decode()},timeout=90);blob.raise_for_status()
            record['blobSha']=blob.json()['sha']
            assert record['blobSha']==hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
            thumb=image.copy();thumb.thumbnail((1600,1800));thumb.convert('RGB').save(out/f'{key}-fig-{n}-review.jpg',quality=92)
            return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(acquire,items))
          assert len(records)==15
          (out/'manifest.json').write_text(json.dumps({'date':'2026-09-21','figures':records},indent=2))
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep21-original-figures
          path: originals/
          retention-days: 7
          if-no-files-found: error
