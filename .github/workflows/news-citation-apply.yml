name: Apply older NEWS citation repair
on:
  push:
    branches: [fix/news-citations-older-20260916]
    paths: [.github/workflows/news-citation-apply.yml]
permissions:
  contents: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/download-artifact@v4
        with:
          name: news-citation-baseline
          run-id: 35073042056
          github-token: ${{ github.token }}
          path: ../citation-baseline
      - uses: actions/download-artifact@v4
        with:
          name: news-source-link-recheck
          run-id: 35073762684
          github-token: ${{ github.token }}
          path: ../citation-recheck
      - name: Apply hash-pinned source edits and preserve external-link receipts
        run: |
          test "$GITHUB_REF" = refs/heads/fix/news-citations-older-20260916
          python3 scripts/repair_news_citations_20260916.py older
          python3 spaceship-ui/scripts/news-citation-contract.test.py
          node --check spaceship-ui/scripts/browser-news-citation-audit.mjs
          python3 - <<'PY'
          import collections,json,pathlib,urllib.parse
          baseline=json.loads(pathlib.Path('../citation-baseline/external-links.json').read_text())
          recheck=json.loads(pathlib.Path('../citation-recheck/recheck.json').read_text())
          def sanitize(row):
              row=dict(row)
              if 'finalUrl' in row:
                  u=urllib.parse.urlsplit(row['finalUrl'])
                  row['finalUrl']=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,'',u.fragment))
              if 'abuse-detection' in row.get('finalUrl','') or '/sorry/' in row.get('finalUrl',''):row['state']='restricted'
              if row.get('status')==202:row['state']='inconclusive'
              row.pop('evidenceFile',None)
              return row
          latest={row['url']:sanitize(row) for row in baseline}
          for row in recheck:latest[row['url']]=sanitize(row)
          doc=pathlib.Path('spaceship-ui/docs/operations');doc.mkdir(parents=True,exist_ok=True)
          receipt={'checkedDate':'2026-09-16','baselineCommit':'995304cdbf317e323f630e5517e3549e4c069def',
                   'baselineWorkflowRun':35073042056,'recheckWorkflowRun':35073762684,
                   'baselineUniqueExternalLinks':len(baseline),'extraCheckedUrls':len(latest)-len(baseline),
                   'method':'Initial bounded GET with Range; inconclusive/blocked destinations rechecked without Range. HTTP response is not independent source or scientific verification. FDA web reading identified its official title/body; GitHub GET still restricted.',
                   'baseline':[sanitize(row) for row in baseline],'recheck':[sanitize(row) for row in recheck]}
          (doc/'NEWS_CITATION_HTTP_20260916.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          summary='''# NEWS citation repair, 2026-09-16

          Production baseline: `995304cdbf317e323f630e5517e3549e4c069def`.
          Built `/news` roster: 37 articles; 16 articles had 356 unlinked numeric markers
          (including bibliography labels). The first batch repairs 7 older articles;
          the stacked second batch repairs 9 recent articles. User approval is required
          before either PR is merged. No Blogger payload or account is changed.

          Body numbers link to unique same-document source records; source records
          retain original descriptive links and point to HTTPS primary destinations.
          Group punctuation and scientific prose remain unchanged. The only prose edits
          are two explicit FDA source-access notes, deferred to batch 2. Source restoration
          and original SHA256 checks prevent hidden claim changes. Existing source seals
          are refreshed only for these link changes; image and Blogger hashes stay fixed.

          External audit: all 157 originally authored external article URLs were requested;
          23 no-Range rechecks included 4 additional FDA lookup destinations. Detailed
          receipts are in `NEWS_CITATION_HTTP_20260916.json`. `responded` means an HTTP
          response, not access to subscription full text or independent research validation.
          Empty Harvard Dataverse 202 responses remain inconclusive. OpenAI/NEJM/ASH,
          FDA abuse-detection and other 403 results remain restrictions, not deleted URLs.
          DOE and the existing Blogger cross-link responded on recheck. Nothing is
          replaced with an unrelated search result just to obtain a green HTTP status.

          FDA's exact named announcement was identified through official web reading,
          but GitHub GET still redirected to abuse detection and 404. Batch 2 supplies
          the correct official URL with this environment-dependent limitation disclosed.
          FORS's year-index citation is narrowed to the observed exact ICML awards article.
          Sulfide's reference number targets the actual Nature paper, not its topic index.

          Existing complete browser matrix and its 240-second hard limit remain unchanged.
          New source/HTML mutation tests and an additive citation browser suite cover
          touch/mouse, unique destinations, Back, native Enter with scripting disabled,
          fixed-header visibility, and light/dark link styling at 390px and 1440px.
          Test run/PR receipts will be added to issue #123 after actual execution; this
          document does not claim unrun tests or public deployment have succeeded.
          '''
          (doc/'NEWS_CITATION_REPAIR_20260916.md').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in summary.splitlines())+'\n')
          PY
      - name: Commit feature-branch patch only and remove this one-time workflow
        run: |
          git rm .github/workflows/news-citation-apply.yml
          git add .github/workflows/blog-ci.yml .github/workflows/blog-pages-deploy.yml spaceship-ui/site/content/posts spaceship-ui/site/news-citation-repair-20260916.json spaceship-ui/site/news-covers-20260912.json spaceship-ui/scripts/news-visual-contract.mjs spaceship-ui/src/styles/global.css spaceship-ui/docs/post-authoring.md spaceship-ui/docs/operations/NEWS_CITATION_HTTP_20260916.json spaceship-ui/docs/operations/NEWS_CITATION_REPAIR_20260916.md
          git config user.name 'JJo Citation Repair'
          git config user.email '76779256+JJo-0@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: link older NEWS citations to exact source records without changing prose (#123)'
          git push origin HEAD:refs/heads/fix/news-citations-older-20260916
          mkdir -p citation-packet/files
          git rev-parse HEAD > citation-packet/head.txt
          git diff 995304cdbf317e323f630e5517e3549e4c069def HEAD > citation-packet/changes.patch
          git diff --name-only 995304cdbf317e323f630e5517e3549e4c069def HEAD | while IFS= read -r path; do test ! -f "$path" || { mkdir -p "citation-packet/files/$(dirname "$path")"; cp "$path" "citation-packet/files/$path"; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: news-citations-older-source
          path: citation-packet/
          retention-days: 14
