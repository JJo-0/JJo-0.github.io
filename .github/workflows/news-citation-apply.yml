name: Apply older NEWS citation repair
on:
  push:
    branches: [fix/news-citations-older-20260916]
    paths: [.github/workflows/news-citation-apply.yml]
permissions:
  contents: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/download-artifact@v4
        with:
          name: news-citation-baseline
          run-id: 35073042056
          github-token: ${{ github.token }}
          path: ../citation-baseline
      - uses: actions/download-artifact@v4
        with:
          name: news-source-link-recheck
          run-id: 35073762684
          github-token: ${{ github.token }}
          path: ../citation-recheck
      - name: Apply hash-pinned source edits and preserve external-link receipts
        run: |
          test "$GITHUB_REF" = refs/heads/fix/news-citations-older-20260916
          python3 scripts/repair_news_citations_20260916.py older
          python3 spaceship-ui/scripts/news-citation-contract.test.py
          node --check spaceship-ui/scripts/browser-news-citation-audit.mjs
          python3 - <<'PY'
          import json,pathlib,urllib.parse
          baseline=json.loads(pathlib.Path('../citation-baseline/external-links.json').read_text())
          recheck=json.loads(pathlib.Path('../citation-recheck/recheck.json').read_text())
          def sanitize(row):
              row=dict(row)
              if 'finalUrl' in row:
                  u=urllib.parse.urlsplit(row['finalUrl'])
                  row['finalUrl']=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,'',u.fragment))
              if 'abuse-detection' in row.get('finalUrl','') or '/sorry/' in row.get('finalUrl',''):row['state']='restricted'
              if row.get('status')==202:row['state']='inconclusive'
              row.pop('evidenceFile',None)
              return row
          latest={row['url']:sanitize(row) for row in baseline}
          for row in recheck:latest[row['url']]=sanitize(row)
          doc=pathlib.Path('spaceship-ui/docs/operations');doc.mkdir(parents=True,exist_ok=True)
          receipt={'checkedDate':'2026-09-16','baselineCommit':'995304cdbf317e323f630e5517e3549e4c069def',
                   'baselineWorkflowRun':35073042056,'recheckWorkflowRun':35073762684,
                   'baselineUniqueExternalLinks':len(baseline),'extraCheckedUrls':len(latest)-len(baseline),
                   'method':'Initial bounded GET with Range; inconclusive/blocked destinations rechecked without Range. HTTP response is not independent source or scientific verification. FDA web reading identified its official title/body; GitHub GET still restricted.',
                   'baseline':[sanitize(row) for row in baseline],'recheck':[sanitize(row) for row in recheck]}
          (doc/'NEWS_CITATION_HTTP_20260916.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          summary='''# NEWS citation repair, 2026-09-16

          Production baseline: `995304cdbf317e323f630e5517e3549e4c069def`.
          Built NEWS roster: 37 articles; 16 articles had 356 unlinked numeric markers,
          including bibliography labels. Batch 1 repairs 7 older articles; batch 2
          repairs 9 recent articles. Both PRs require user approval before merging.
          No Blogger account or payload changes are included.

          Body numbers link to unique source records; source records link to HTTPS
          primary destinations. Group punctuation and scientific prose remain intact.
          Only two FDA access notes change in batch 2. Reversing links and those two
          notes must reproduce the original source SHA256. Image/Blogger seals stay fixed.

          All 157 originally authored external URLs were requested. Twenty-three
          no-Range rechecks included four additional FDA lookup destinations.
          See NEWS_CITATION_HTTP_20260916.json for dated results. An HTTP response
          does not imply subscription full-text access or scientific verification.
          Empty Dataverse 202 is inconclusive; abuse-detection and 403 are restrictions.
          DOE and Blogger responded on recheck. No unrelated substitute is introduced.
          FDA's exact official announcement was identified through web reading but
          GitHub GET still hit abuse detection followed by 404; both facts are disclosed.
          FORS now targets the exact ICML awards article rather than its year index.
          Sulfide reference 1 targets the actual paper rather than the topic index.

          The original complete browser suite and 240-second guard are unchanged.
          Additive static/mutation and native touch/mouse/keyboard/Back tests are
          provided. Actual test and PR receipts are tracked on issue #123. This
          source document does not claim tests or public deployment already succeeded.
          '''
          (doc/'NEWS_CITATION_REPAIR_20260916.md').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in summary.splitlines())+'\n')
          PY
      - name: Commit content patch only
        run: |
          # The runner token is not permitted to update existing workflows.
          # These two intended additive gates are applied separately by the
          # already-authorized GitHub connector, before the PR is opened.
          git restore .github/workflows/blog-ci.yml .github/workflows/blog-pages-deploy.yml
          git rm .github/workflows/news-citation-apply.yml
          git add spaceship-ui/site/content/posts spaceship-ui/site/news-citation-repair-20260916.json spaceship-ui/site/news-covers-20260912.json spaceship-ui/scripts/news-visual-contract.mjs spaceship-ui/src/styles/global.css spaceship-ui/docs/post-authoring.md spaceship-ui/docs/operations/NEWS_CITATION_HTTP_20260916.json spaceship-ui/docs/operations/NEWS_CITATION_REPAIR_20260916.md
          git config user.name 'JJo Citation Repair'
          git config user.email '76779256+JJo-0@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: link older NEWS citations to exact source records without changing prose (#123)'
          mkdir -p citation-packet/files
          git rev-parse HEAD > citation-packet/head.txt
          git diff 995304cdbf317e323f630e5517e3549e4c069def HEAD > citation-packet/changes.patch
          git diff --name-only 995304cdbf317e323f630e5517e3549e4c069def HEAD | while IFS= read -r path; do test ! -f "$path" || { mkdir -p "citation-packet/files/$(dirname "$path")"; cp "$path" "citation-packet/files/$path"; }; done
          git push origin HEAD:refs/heads/fix/news-citations-older-20260916
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-citations-older-source
          path: citation-packet/
          retention-days: 14
