name: September 25 integration candidate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sep25-evidence.yml, '.ops/sep25-integrate.py', '.ops/sep25-dates.py']
permissions:
  contents: read
concurrency:
  group: sep25-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: repo/spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ffd6a8188d9344a75996d48b8750a5fce857d57c
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Assemble only the declared edition
        working-directory: repo
        run: |
          python ../ops/.ops/sep25-integrate.py
          python ../ops/.ops/sep25-dates.py
          git add -N .
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Preserved lint, types and SEO
        run: |
          pnpm lint 2>&1 | tee ../../sep25-receipt/lint.log
          pnpm check 2>&1 | tee ../../sep25-receipt/types.log
          pnpm seo:check 2>&1 | tee ../../sep25-receipt/seo.log
      - name: Build and content contracts
        run: |
          pnpm build 2>&1 | tee ../../sep25-receipt/build.log
          pnpm content:check 2>&1 | tee ../../sep25-receipt/content.log
          python3 scripts/english-edition-audit.py 2>&1 | tee ../../sep25-receipt/english-static.log
          python3 scripts/sep25-contract.py 2>&1 | tee ../../sep25-receipt/sep25-static.log
      - name: Native English, original-figure and mobile regressions
        run: |
          node scripts/browser-english-edition.mjs 2>&1 | tee ../../sep25-receipt/english-browser.log
          node scripts/browser-sep25.mjs 2>&1 | tee ../../sep25-receipt/sep25-browser.log
          node scripts/browser-mobile-performance.mjs 2>&1 | tee ../../sep25-receipt/mobile-browser.log
      - name: Preserve checked registry blobs without committing or moving branches
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,urllib.request,os
          receipt=pathlib.Path('../sep25-receipt');j=json.loads((receipt/'assembly.json').read_text())
          assert j['sourceCommit']=='ffd6a8188d9344a75996d48b8750a5fce857d57c'
          assert len(j['files'])==19
          for row in j['files']:
              p=pathlib.Path(row['path']);assert '..' not in p.parts and not p.is_absolute()
              assert str(p).startswith('spaceship-ui/') or str(p) in ['.github/workflows/sep25-reading.yml','scripts/normalize_tags_current.py']
              assert not str(p).startswith(('spaceship-ui/site/content/posts/','spaceship-ui/site/content/english/'))
              b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==row['sha256']
              req=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=json.dumps({'content':b.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=40) as response:r=json.load(response)
              assert r['sha']==row['sha']
          (receipt/'verified-blobs.json').write_text(json.dumps(j,indent=2))
          print('Verified immutable registry blobs:',len(j['files']),'; no tree, commit, ref or branch was written')
          PY
      - name: Preserve exact candidate and diagnostics
        if: always()
        working-directory: repo
        run: |
          mkdir -p ../sep25-receipt
          python3 - <<'PY'
          import pathlib,json,zipfile
          receipt=pathlib.Path('../sep25-receipt');p=receipt/'assembly.json'
          if p.exists():
              j=json.loads(p.read_text())
              with zipfile.ZipFile(receipt/'assembled-source.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for row in j['files']:z.write(row['path'],row['path'])
          PY
          cp -R spaceship-ui/sep25-review ../sep25-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/english-review ../sep25-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/mobile-performance ../sep25-receipt/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep25-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: sep25-receipt/
          retention-days: 3
