name: September 25 primary evidence
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/sep25-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf
      - name: Fetch the publisher's actual accepted-manuscript PDFs
        run: |
          mkdir -p evidence
          python - <<'PY'
          import requests, pathlib, json, hashlib, fitz
          out=pathlib.Path('evidence'); log=[]
          sources={'soec':'https://www.nature.com/articles/s41467-026-78001-1_reference.pdf','sparrow':'https://www.nature.com/articles/s41467-026-78005-x_reference.pdf'}
          for name,url in sources.items():
              r=requests.get(url,timeout=90);r.raise_for_status();assert r.content.startswith(b'%PDF'),(name,r.headers.get('Content-Type'))
              p=out/(name+'.pdf');p.write_bytes(r.content);doc=fitz.open(p)
              log.append({'paper':name,'url':url,'sha256':hashlib.sha256(r.content).hexdigest(),'pages':len(doc)})
              (out/(name+'.txt')).write_text('\n\n'.join('=== PAGE '+str(i+1)+' ===\n'+page.get_text() for i,page in enumerate(doc)))
              for i,page in enumerate(doc):
                  if i<50:page.get_pixmap(matrix=fitz.Matrix(1,1)).save(out/(name+'-p'+str(i+1)+'.png'))
          (out/'retrieval.json').write_text(json.dumps(log,indent=2));print(json.dumps(log))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: september-25-accepted-papers
          path: evidence/
          retention-days: 3
