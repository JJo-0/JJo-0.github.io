name: Materialize Modern AI Part II

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete-v2
    paths:
      - .github/part2-payload/**
      - .github/workflows/materialize-modern-ai-part2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Part II branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete-v2
          fetch-depth: 0

      - name: Decode, verify, and extract source-complete payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/part2-payload/chunk-* > "$RUNNER_TEMP/modern-ai-part2.b64"
          base64 --decode "$RUNNER_TEMP/modern-ai-part2.b64" > "$RUNNER_TEMP/modern-ai-part2.tar.gz"

          echo '8fc24e439667964efee5011c6359e03f47995c24565cd1bc809f1956d108e9d0  '"$RUNNER_TEMP/modern-ai-part2.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/modern-ai-part2.tar.gz" -C .

          sha256sum --check <<'SHA256'
          bec0cf867a8ad3b526532770232699f1216aab10fbfbfe835499df8c9a1a2259  spaceship-ui/site/content/posts/modern-artificial-intelligence-2.mdx
          823b24641ce20d5afe1208b447c69971723cb437ffc574221b4e8afa98b64c23  spaceship-ui/src/components/post/ExplainedMath.astro
          54f68951b36133d42cfc3115140404e6396aae8285af03ecad24bcd836b85d0a  spaceship-ui/src/components/modern-ai/Part2LearningLab.svelte
          46dc9eceb70f676bd0b954f8646d8ca3ab8f8a432e01dc1d1a28024f3970f492  spaceship-ui/src/data/modern-ai-part2-formula-ledger.json
          1bfe62933a81484e8e6b8563fb82d81c2ee159812b9165cdb084fc6a22230460  spaceship-ui/src/data/modern-ai-part2-page-ledger.json
          dcd5d7cb61ae2213335688313dcc61e7d96f0aae345e4f57c81979f696190292  spaceship-ui/scripts/modern-ai-part2-audit.mjs
          a11cef49a8aafadc704159a8ca5df657464c654e0e075dd3189eb5cedd23b352  spaceship-ui/scripts/modern-ai-series-audit.mjs
          d0dec95787d9fde8737d7abbbf9ce4fab10fe1c1fcbbe256f06c25f4594f71d2  spaceship-ui/package.json
          SHA256

      - name: Remove one-time transport files
        shell: bash
        run: |
          rm -rf .github/part2-payload
          rm -f .github/workflows/materialize-modern-ai-part2.yml
          rm -f .github/workflows/export-modern-ai-part2-source.yml

      - name: Commit the native Part II sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'publish source-complete Modern AI Part II'
          git push origin HEAD:agent/modern-ai-part-2-source-complete-v2
