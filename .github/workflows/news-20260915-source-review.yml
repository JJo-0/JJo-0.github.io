name: September 15 NEWS source review
on:
  push:
    branches: [content/news-20260915-biosensing-candidates]
    paths: [.github/workflows/news-20260915-source-review.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect public sources as data only
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p "$RUNNER_TEMP/news-sep15-review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/news-sep15-review/repository.tar.gz"
          python - <<'PY'
          import os,json,hashlib,time
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          out=Path(os.environ['RUNNER_TEMP'])/'news-sep15-review'
          sources={
            'nanopore':'https://www.nature.com/articles/s41587-026-03308-9',
            'apoe':'https://www.nature.com/articles/s41588-026-02713-9',
            'mos2':'https://www.nature.com/articles/s41928-026-01706-0',
            'fda':'https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-first-therapy-target-muscle-loss-spinal-muscular-atrophy'
          }
          rows=[]
          session=requests.Session()
          session.headers['User-Agent']='JJo research blog editorial source verification (public materials only)'
          allowed={'www.nature.com','static-content.springer-cdn.com','media.springernature.com','www.fda.gov','www.accessdata.fda.gov'}
          def fetch(url,target):
              assert urlparse(url).scheme=='https' and urlparse(url).hostname in allowed,url
              try:
                  r=session.get(url,timeout=60);row={'url':url,'finalUrl':r.url,'status':r.status_code,'type':r.headers.get('Content-Type',''),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'file':target.name}
                  rows.append(row)
                  if r.ok and len(r.content)<60000000:target.write_bytes(r.content);return r
              except requests.RequestException as e:rows.append({'url':url,'error':type(e).__name__})
              return None
          for key,url in sources.items():
              r=fetch(url,out/f'{key}.html')
              if r is None:continue
              soup=BeautifulSoup(r.content,'html.parser')
              (out/f'{key}.txt').write_text(soup.get_text('\n',strip=True))
              links=[{'text':a.get_text(' ',strip=True),'href':urljoin(url,a.get('href',''))} for a in soup.select('a[href]')]
              images=[{'alt':i.get('alt',''),'src':urljoin(url,i.get('src','')),'srcset':i.get('srcset','')} for i in soup.select('img')]
              (out/f'{key}-links.json').write_text(json.dumps({'links':links,'images':images},ensure_ascii=False,indent=2))
              pdfs=list(dict.fromkeys(x['href'] for x in links if urlparse(x['href']).hostname in allowed and urlparse(x['href']).path.lower().endswith('.pdf')))[:6]
              for index,pdf in enumerate(pdfs):fetch(pdf,out/f'{key}-document-{index}.pdf')
              figs=list(dict.fromkeys(x['src'] for x in images if urlparse(x['src']).hostname=='media.springernature.com' and 'Fig' in x['src']))[:10]
              for index,img in enumerate(figs):fetch(img,out/f'{key}-figure-{index}.img')
              time.sleep(1)
          (out/'source-receipts.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps([{'file':r.get('file'),'status':r.get('status'),'bytes':r.get('bytes'),'error':r.get('error')} for r in rows],indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: news-sep15-primary-review
          path: ${{ runner.temp }}/news-sep15-review
          retention-days: 14
