name: September 19 selected originals
on:
  push:
    branches: [ops/candidates-20260919-sources]
    paths: [.github/workflows/candidates-sep19-figures.yml]
permissions:
  contents: write
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 Pillow
      - name: Fetch selected public figure pages and original PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,hashlib,base64,concurrent.futures,io
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path('originals');out.mkdir()
          jobs=[('neural','s41593-026-02433-7',n) for n in [1,2]]+[('walker','s41557-026-02240-4',n) for n in [1,4]]+[('whisker','s41467-026-77366-7',n) for n in [1,3,5]]
          def collect(job):
              key,doi,n=job; ident=f'{key}-fig-{n}'
              url=f'https://www.nature.com/articles/{doi}/figures/{n}'
              r=requests.get(url,timeout=45);r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              (out/f'{ident}.html').write_text(r.text)
              (out/f'{ident}.txt').write_text(soup.get_text('\n',strip=True))
              images=[urljoin(url,img['src']) for img in soup.select('img[src]') if f'Fig{n}_' in img['src']]
              links=[urljoin(url,a['href']) for a in soup.select('a[href]') if f'Fig{n}_' in a['href'] and 'springernature.com' in a['href']]
              candidates=links+images
              assert candidates, f'No real original URL in figure page {url}'
              candidates=sorted(dict.fromkeys(candidates),key=lambda v:'/full/' not in v)
              original=candidates[0]
              ir=requests.get(original,timeout=45);ir.raise_for_status();data=ir.content
              img=Image.open(io.BytesIO(data));img.load()
              assert img.format=='PNG' and img.width>=1000,(ident,img.size,img.format)
              file=ident+'.png';(out/file).write_bytes(data)
              gitsha=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              result=requests.post(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},json={'content':base64.b64encode(data).decode(),'encoding':'base64'},timeout=45)
              result.raise_for_status();assert result.json()['sha']==gitsha
              return {'id':ident,'doi':'10.1038/'+doi,'figure':n,'figurePage':url,'source':original,'file':file,'width':img.width,'height':img.height,'sha256':hashlib.sha256(data).hexdigest(),'blobSha':gitsha,'figurePageSha256':hashlib.sha256(r.content).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: rows=list(pool.map(collect,jobs))
          (out/'originals.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: september19-selected-originals
          path: originals/
          retention-days: 3
