name: Ezekiel live audit
on:
  push:
    branches: [ops/ezekiel-live-20261006]
    paths: [.github/workflows/ezekiel-live-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual deployed Ezekiel pages
        env:
          BASE: https://jjo-0.github.io
        run: |
          node --input-type=module <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function get(path) {
            let last;
            for (let attempt = 1; attempt <= 10; attempt++) {
              const res = await fetch(process.env.BASE + path, {
                cache: 'no-store',
                headers: {'cache-control':'no-cache'},
                redirect: 'follow',
              });
              const text = await res.text();
              last = {status: res.status, text};
              if (res.ok) return last;
              await sleep(2000);
            }
            throw new Error(`${path}: status ${last?.status}`);
          }
          const expected = [
            {
              n: 1,
              path: '/posts/ezekiel-2-1-3-11-1/',
              refs: 29,
              images: [
                ['01-babylon-lion-met-31-13-2.jpg','3811','1656'],
                ['02-nebuchadnezzar-cylinder-met-86-11-60-original.jpg','3895','2318'],
              ],
            },
            {n: 2, path: '/posts/ezekiel-2-1-3-11-2/', refs: 18, images: []},
            {
              n: 3,
              path: '/posts/ezekiel-2-1-3-11-3/',
              refs: 39,
              images: [['03-babylon-city-map-commons.png','800','694']],
            },
          ];
          const results = [];
          for (const item of expected) {
            const {status,text} = await get(item.path);
            const must = [
              `data-ezekiel-report="${item.n}"`,
              'data-ezekiel-research-body',
              `id="reference-ezekiel-${item.n}-1"`,
              `id="reference-ezekiel-${item.n}-${item.refs}"`,
              'https://blog.naver.com/jjo_09_/224428051487',
              '원문·출처 확인',
            ];
            for (const marker of must) {
              if (!text.includes(marker)) throw new Error(`${item.path}: missing ${marker}`);
            }
            if (text.includes('data-dashboard-pending')) throw new Error(`${item.path}: old pending placeholder remains`);
            if (text.length < 30000) throw new Error(`${item.path}: suspiciously short HTML ${text.length}`);
            const imageTags = [...text.matchAll(/<img\b[^>]*>/g)].map(match => match[0]);
            for (const [file,width,height] of item.images) {
              const tag = imageTags.find(value => value.includes(`/assets/posts/ezekiel-2-1-3-11/${file}`));
              if (!tag) throw new Error(`${item.path}: image missing ${file}`);
              if (!tag.includes(`width="${width}"`) || !tag.includes(`height="${height}"`)) {
                throw new Error(`${item.path}: geometry mismatch for ${file}: ${tag}`);
              }
              console.log('ezekiel-live image: ' + tag);
            }
            const refCount = (text.match(new RegExp(`id="reference-ezekiel-${item.n}-\\d+"`, 'g')) || []).length;
            if (refCount !== item.refs) throw new Error(`${item.path}: references ${refCount} != ${item.refs}`);
            results.push({path:item.path,status,bytes:text.length,references:refCount,images:item.images.length});
          }
          const shelf = await get('/bible/');
          if (!shelf.text.includes('블로그 본문에서 읽는 전체 연구 · 세 연구 관점')) throw new Error('/bible/: inline copy missing');
          if (!shelf.text.includes('Naver 원문과 대조하기')) throw new Error('/bible/: Ezekiel source-comparison link missing');
          const readTimes = [...shelf.text.matchAll(/(\d+) min read/g)].map(match => Number(match[1]));
          if (readTimes.filter(value => value >= 15).length < 3) throw new Error('/bible/: full report reading-time estimates missing');
          console.log('ezekiel-live: PASS ' + JSON.stringify(results));
          NODE
