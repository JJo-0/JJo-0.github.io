name: Legacy content finalization audit

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit legacy image ownership
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root = Path('.')
          legacy = root / 'site/assets/image'
          ignored = {
              Path('scripts/post-content-contract.mjs'),
          }
          text_exts = {
              '.md', '.mdx', '.astro', '.svelte', '.ts', '.js', '.mjs', '.json',
              '.css', '.yml', '.yaml', '.html', '.txt', '.toml'
          }

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          all_assets = [p for p in (root / 'site/assets').rglob('*') if p.is_file()]
          by_hash = {}
          for asset in all_assets:
              by_hash.setdefault(sha256(asset), []).append(asset)

          print('=== LEGACY IMAGE OWNERSHIP ===')
          for asset in sorted(p for p in legacy.rglob('*') if p.is_file()):
              rel_asset = asset.relative_to(legacy).as_posix()
              needle_url = f'/image/{rel_asset}'
              refs = []
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_exts:
                      continue
                  rel = path.relative_to(root)
                  if rel in ignored or str(rel).startswith('node_modules/') or str(rel).startswith('dist/'):
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if needle_url in text or rel_asset in text:
                      refs.append(rel.as_posix())

              digest = sha256(asset)
              duplicates = [
                  p.relative_to(root).as_posix()
                  for p in by_hash[digest]
                  if p != asset
              ]
              print(f'ASSET {rel_asset} bytes={asset.stat().st_size} sha256={digest}')
              print(f'  refs={refs if refs else "NONE"}')
              print(f'  exact_duplicates={duplicates if duplicates else "NONE"}')

          print('=== ALL LIVE /image REFERENCES IN CONTENT ===')
          for path in sorted((root / 'site/content').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.md', '.mdx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              hits = sorted({part.split()[0].rstrip(')\"\'<>.,;') for part in text.split() if '/image/' in part})
              if hits:
                  print(path.relative_to(root).as_posix(), hits)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Baseline build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .astro
          pnpm exec astro build
          node scripts/rendered-markdown-audit.mjs
          node scripts/post-content-contract.mjs
          node scripts/content-integrity.mjs
          node scripts/modern-ai-formula-audit.mjs
          cp -a dist /tmp/dist-baseline

      - name: A/B audit compatibility shims
        shell: bash
        run: |
          set -uo pipefail

          experiment() {
            local shim="$1"
            echo "=== SHIM EXPERIMENT: ${shim} ==="

            python - "$shim" <<'PY'
          from pathlib import Path
          import sys

          shim = sys.argv[1]
          path = Path('astro.config.mjs')
          text = path.read_text(encoding='utf-8')

          edits = {
              'restoreLegacyHtml': [
                  ("import restoreLegacyHtml from './src/lib/remark/restore-legacy-html.mjs';\n", ''),
                  ('remarkPlugins: [restoreLegacyHtml, remarkEmoji, remarkRepairLiteralStrong],',
                   'remarkPlugins: [remarkEmoji, remarkRepairLiteralStrong],'),
              ],
              'fixLegacyFragments': [
                  ("import fixLegacyFragments from './src/lib/rehype/fix-legacy-fragments.mjs';\n", ''),
                  ('      fixLegacyFragments,\n', ''),
              ],
              'remarkRepairLiteralStrong': [
                  ("import remarkRepairLiteralStrong from './src/lib/remark-repair-literal-strong.mjs';\n", ''),
                  ('remarkPlugins: [restoreLegacyHtml, remarkEmoji, remarkRepairLiteralStrong],',
                   'remarkPlugins: [restoreLegacyHtml, remarkEmoji],'),
              ],
          }

          for old, new in edits[shim]:
              if old not in text:
                  raise SystemExit(f'{shim}: expected config pattern missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

            rm -rf dist .astro
            set +e
            pnpm exec astro build >"/tmp/${shim}-build.log" 2>&1
            local build_status=$?
            set -e
            echo "build_status=${build_status}"
            if [[ $build_status -ne 0 ]]; then
              tail -n 80 "/tmp/${shim}-build.log"
            fi

            if [[ -d dist ]]; then
              python - "$shim" <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          label = sys.argv[1]
          base = Path('/tmp/dist-baseline/posts')
          test = Path('dist/posts')

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          base_files = {p.relative_to(base).as_posix(): p for p in base.rglob('index.html')}
          test_files = {p.relative_to(test).as_posix(): p for p in test.rglob('index.html')}
          changed = []
          for rel in sorted(set(base_files) | set(test_files)):
              if rel not in base_files or rel not in test_files or digest(base_files[rel]) != digest(test_files[rel]):
                  changed.append(rel)
          print(f'{label}: changed_post_html_count={len(changed)}')
          for rel in changed[:80]:
              print(f'  CHANGED {rel}')
          PY
            fi

            if [[ $build_status -eq 0 ]]; then
              for check in \
                "node scripts/rendered-markdown-audit.mjs" \
                "node scripts/post-content-contract.mjs" \
                "node scripts/content-integrity.mjs" \
                "node scripts/modern-ai-formula-audit.mjs"; do
                set +e
                bash -lc "$check" > /tmp/check.log 2>&1
                local status=$?
                set -e
                echo "check_status=${status} command=${check}"
                if [[ $status -ne 0 ]]; then
                  cat /tmp/check.log
                fi
              done
            fi

            git checkout -- astro.config.mjs
            rm -rf dist .astro
          }

          set -e
          experiment restoreLegacyHtml
          experiment fixLegacyFragments
          experiment remarkRepairLiteralStrong

          echo '=== FINAL INTERPRETATION RULE ==='
          echo 'A shim is removable only when build + all audits pass and changed_post_html_count=0.'
