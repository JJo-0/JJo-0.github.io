name: Temporary chapter 08 metadata correction
on:
  push:
    branches: ['content/self-improving-ai-08']
    paths: ['.github/workflows/self-improving-08-editorial.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/self-improving-ai-08
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            spaceship-ui/site/content/posts/self-improving-ai-08-entropy-estimation-and-gradients.mdx
            docs/self-improving-ai/progress.json
            docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json
      - name: Reduce card description while preserving article body bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('spaceship-ui/site/content/posts/self-improving-ai-08-entropy-estimation-and-gradients.mdx')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0c8d82522b5f3f753cded40913e10a4fdd41395c0d8cb2e3cd1661b87160c478'
          s=p.read_text();old=re.search(r'^description: ".*"$',s,re.M).group(0);new='description: "원본 36–40쪽: 엔트로피 추정, 빠진 경사와 수식 정정, 자동미분 검증."'
          assert len(old.encode())-len(new.encode())==166
          revised=s.replace(old,new,1);assert revised.split('---',2)[2]==s.split('---',2)[2]
          p.write_text(revised);digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert revised.count('<LearningFigure')==9 and len(re.findall(r'<Math\s',revised))==32
          p=Path('docs/self-improving-ai/progress.json');d=json.loads(p.read_text());d['prepared_chapter_08']['manuscript_sha256']=digest;p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json');d=json.loads(p.read_text());d['sha256']=digest;d['metadata_size_fix']='Shorten only the frontmatter description by 166 UTF-8 bytes. Article body, figures, mathematics and the existing Home HTML budget remain unchanged.';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('Final manuscript SHA256',digest)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui/site/content/posts/self-improving-ai-08-entropy-estimation-and-gradients.mdx docs/self-improving-ai/progress.json docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json
          git commit -m 'perf: keep chapter 08 card within the existing Home HTML budget'
          git push origin HEAD:content/self-improving-ai-08
