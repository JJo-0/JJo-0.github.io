name: Temporary chapter 08 heading correction
on:
  push:
    branches: ['content/self-improving-ai-08']
    paths: ['.github/workflows/self-improving-08-editorial.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/self-improving-ai-08
      - name: Remove an inaccurate line count from the code heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('spaceship-ui/site/content/posts/self-improving-ai-08-entropy-estimation-and-gradients.mdx')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3b6a0a5c37e24de03cb00d0a835833b6039520b556051dda7c718f0d12b3de09'
          s=p.read_text();old='### PyTorch에서 중요한 계산 네 줄';new='### PyTorch에서 중요한 계산';assert s.count(old)==1
          p.write_text(s.replace(old,new));digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert p.read_text().count('<LearningFigure')==9 and len(re.findall(r'<Math\s',p.read_text()))==32
          p=Path('docs/self-improving-ai/progress.json');d=json.loads(p.read_text());d['prepared_chapter_08']['manuscript_sha256']=digest;p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json');d=json.loads(p.read_text());d['sha256']=digest;p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('Final manuscript SHA256',digest)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui/site/content/posts/self-improving-ai-08-entropy-estimation-and-gradients.mdx docs/self-improving-ai/progress.json docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json
          git commit -m 'docs: correct chapter 08 code heading without changing code or math'
          git push origin HEAD:content/self-improving-ai-08
