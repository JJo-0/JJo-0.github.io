name: Verify published dated NEWS release
on:
  push:
    branches: [editorial/publish-sep05-08-20260910]
    paths:
      - .github/workflows/editorial-release-live.yml
      - editorial-staging/verify-live.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Wait for the approved Pages release marker
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://jjo-0.github.io/news/'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(url,timeout=20) as response:
                      html=response.read().decode('utf8')
                  if '2026-09-05-10-published' in html and 'data-news-date="2026-09-05"' in html:
                      print('Approved release is visible on public Pages');break
              except Exception as error:
                  print(type(error).__name__,str(error))
              print('Waiting for Pages propagation',attempt+1);time.sleep(10)
          else:
              raise RuntimeError('Approved release did not become visible; do not report deployment verified')
          PY
      - name: Inspect all approved articles at mobile and desktop sizes
        run: python editorial-staging/verify-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-news-live-audit
          path: live-audit/
          retention-days: 7
