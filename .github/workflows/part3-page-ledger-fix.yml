name: Apply exact multi-page figure audit fix

on:
  push:
    branches:
      - agent/modern-ai-part3-source-complete
    paths:
      - '.github/workflows/part3-page-ledger-fix.yml'

permissions:
  contents: write

concurrency:
  group: part3-page-ledger-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part3-source-complete
          fetch-depth: 0

      - name: Permit only declared multi-page figure mappings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spaceship-ui/scripts/modern-ai-part3-audit.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  for (const [label, values, expected] of [
    ['formula', mapped.formulas, formulaIds],
    ['content', mapped.content, contentIds],
    ['figure', mapped.figures, figureIds],
    ['annotation', mapped.annotations, annotationIds],
  ]) {
    const duplicates = duplicateValues(values);
    if (duplicates.length) issues.push(`page ledger duplicate ${label} IDs: ${duplicates.join(', ')}`);
    if (!sameSet(new Set(values), expected)) issues.push(`page ledger ${label} coverage mismatch`);
  }

  for (const formula of formulaLedger.formulas) {'''
          new = '''  for (const [label, values, expected] of [
    ['formula', mapped.formulas, formulaIds],
    ['content', mapped.content, contentIds],
    ['annotation', mapped.annotations, annotationIds],
  ]) {
    const duplicates = duplicateValues(values);
    if (duplicates.length) issues.push(`page ledger duplicate ${label} IDs: ${duplicates.join(', ')}`);
    if (!sameSet(new Set(values), expected)) issues.push(`page ledger ${label} coverage mismatch`);
  }

  if (!sameSet(new Set(mapped.figures), figureIds)) {
    issues.push('page ledger figure coverage mismatch');
  }
  for (const figure of contentLedger.figures) {
    const declaredPages = figure.pdfPages ?? [figure.pdfPage];
    const mappedPages = pages
      .filter((page) => (page.figureIds ?? []).includes(figure.figureId))
      .map((page) => page.pdfPage);
    if (JSON.stringify(mappedPages) !== JSON.stringify(declaredPages)) {
      issues.push(`${figure.figureId}: expected page mapping ${declaredPages.join(',')}, found ${mappedPages.join(',')}`);
    }
    for (const page of pages) {
      const countOnPage = (page.figureIds ?? []).filter((id) => id === figure.figureId).length;
      if (countOnPage > 1) issues.push(`${figure.figureId}: duplicated within page ${page.pdfPage}`);
    }
  }

  for (const formula of formulaLedger.formulas) {'''
          if text.count(old) != 1:
              raise SystemExit(f'exact audit block occurrence must be 1, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check spaceship-ui/scripts/modern-ai-part3-audit.mjs
          git diff --check

      - name: Commit audit fix and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/part3-page-ledger-fix.yml
          git add spaceship-ui/scripts/modern-ai-part3-audit.mjs
          git commit -m "fix: audit declared multi-page Part III figures"
          git push origin HEAD:agent/modern-ai-part3-source-complete
