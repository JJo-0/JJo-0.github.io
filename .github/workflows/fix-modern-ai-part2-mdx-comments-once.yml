name: Fix Modern AI Part II MDX trace comments once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-ai-part2-mdx-comments
  cancel-in-progress: false

jobs:
  fix:
    if: github.ref_name == 'agent/modern-ai-part-2-source-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0

      - name: Convert trace comments to valid MDX comments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('spaceship-ui/site/content/posts/modern-artificial-intelligence-2.mdx')
          text = path.read_text(encoding='utf-8')
          before = len(re.findall(r'<!--\s*source-(?:content|figure|annotation):[^\n]+?\s*-->', text))
          if before != 255:
              raise SystemExit(f'expected 255 HTML trace comments, found {before}')
          text = re.sub(
              r'<!--\s*(source-(?:content|figure|annotation):[^\n]+?)\s*-->',
              r'{/* \1 */}',
              text,
          )
          after = len(re.findall(r'\{/\*\s*source-(?:content|figure|annotation):[^\n]+?\s*\*/\}', text))
          if after != 255:
              raise SystemExit(f'expected 255 MDX trace comments after conversion, found {after}')
          if '<!-- source-' in text:
              raise SystemExit('HTML source trace comment remains')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-modern-ai-part2-mdx-comments-once.yml

      - name: Commit MDX syntax correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use MDX-safe Part II trace comments'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
