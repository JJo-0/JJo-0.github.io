name: October 2 primary evidence
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/oct02-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99a2e79f58d95f7a0ca31a13b767f84928bb1732
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pymupdf==1.26.7
      - name: Read public primary documents and exact blog source; no code execution from external repositories
        run: |
          mkdir -p evidence
          python - <<'PY'
          import requests,pathlib,json,hashlib,zipfile,subprocess,urllib.parse,fitz
          from bs4 import BeautifulSoup
          out=pathlib.Path('evidence');log=[];s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 (public scholarly source verification)'
          def get(url,p):
              try:
                  r=s.get(url,timeout=50);r.raise_for_status();p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(r.content)
                  log.append({'url':url,'finalUrl':r.url,'path':str(p.relative_to(out)),'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'type':r.headers.get('Content-Type')});return r
              except Exception as e:log.append({'url':url,'error':str(e)});return None
          articles={'lace':'https://www.nature.com/articles/s42256-026-01307-8','drf':'https://www.nature.com/articles/s41587-026-03307-w','glass':'https://arxiv.org/abs/2604.18336v3'}
          for key,url in articles.items():
              d=out/key;d.mkdir();r=get(url,d/'article.html');links=[]
              if r:
                  soup=BeautifulSoup(r.text,'html.parser');(d/'article.txt').write_text(soup.get_text('\n',strip=True))
                  for a in soup.select('a[href]'):
                      h=urllib.parse.urljoin(url,a['href']);label=a.get_text(' ',strip=True)
                      if any(x in h for x in ['.pdf','/figures/','creativecommons','github.com','license']):links.append({'label':label,'url':h})
                  (d/'figures.json').write_text(json.dumps([{'caption':f.get_text(' ',strip=True),'images':[urllib.parse.urljoin(url,i.get('src','')) for i in f.select('img')]} for f in soup.select('figure')],indent=2))
              (d/'links.json').write_text(json.dumps(links,indent=2))
              pdfs=['https://arxiv.org/pdf/2604.18336v3'] if key=='glass' else [url+'.pdf']+[x['url'] for x in links if '.pdf' in x['url'] and 'MOESM1' in x['url']]
              for idx,pdfurl in enumerate(dict.fromkeys(pdfs)):
                  r=get(pdfurl,d/f'document-{idx}.pdf')
                  if not r or not r.content.startswith(b'%PDF'):continue
                  doc=fitz.open(stream=r.content,filetype='pdf');(d/f'document-{idx}.txt').write_text('\n\n'.join(f'=== PAGE {n+1} ===\n'+p.get_text() for n,p in enumerate(doc)))
                  for n,p in enumerate(doc):
                      if n<15:p.get_pixmap(matrix=fitz.Matrix(1,1)).save(d/f'doc{idx}-p{n+1}.png')
          for key,repo in [('lace','PJ-NTU/LACE'),('glass','jarvisyjw/GlassRecon'),('glass-code','JMamie/GlassRecon')]:
              for name in ['README.md','LICENSE']:
                  get('https://raw.githubusercontent.com/'+repo+'/main/'+name,out/key/name)
          get('https://raw.githubusercontent.com/PJ-NTU/LACE/main/docs/ARCHITECTURE.md',out/'lace/ARCHITECTURE.md')
          get('https://pj-ntu.github.io/LACE/lace_supplementary_information.html',out/'lace/supplement.html')
          get('https://jarvisyjw.github.io/GlassRecon/',out/'glass/project.html')
          with zipfile.ZipFile(out/'current-site-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=pathlib.Path(name)
                  if p.suffix in {'.astro','.svelte','.ts','.js','.mjs','.json','.md','.mdx','.css','.yml','.yaml','.py','.svg'} and (name.startswith(('spaceship-ui/','.github/workflows/','scripts/')) or '/' not in name):z.write(p,name)
          (out/'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True));(out/'retrieval.json').write_text(json.dumps(log,indent=2));print(json.dumps(log))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october-2-source-evidence
          path: evidence/
          retention-days: 7
