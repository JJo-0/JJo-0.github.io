name: October 2 integration candidate
on:
  push:
    branches: [ops/oct02-evidence-20261005]
    paths: [.github/workflows/oct02-evidence.yml, .ops/oct02-integrate.py]
permissions:
  contents: read
concurrency:
  group: oct02-integration-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: repo/spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 378fa5621f9a4c92ddf281743c4de8db54dd2d65
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml matplotlib pillow numpy
      - name: Assemble declared content without changing source articles
        working-directory: repo
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('../ops/.ops/oct02-integrate.py').read_text()
          old="SOURCE='72c55bf3f615006e7e0644cad490599a9b1cb118'"
          assert s.count(old)==1
          s=s.replace(old,"SOURCE='378fa5621f9a4c92ddf281743c4de8db54dd2d65'")
          exec(compile(s,'oct02-integrate.py','exec'),{'__name__':'__main__'})
          PY
          git add -N .
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Existing source quality checks
        run: |
          pnpm taxonomy:check 2>&1 | tee ../../oct02-receipt/taxonomy.log
          pnpm lint 2>&1 | tee ../../oct02-receipt/lint.log
          pnpm check 2>&1 | tee ../../oct02-receipt/types.log
          pnpm seo:check 2>&1 | tee ../../oct02-receipt/seo.log
          pnpm blog:harness:check 2>&1 | tee ../../oct02-receipt/harness.log
      - name: Build and unchanged integrity contracts
        run: |
          pnpm build 2>&1 | tee ../../oct02-receipt/build.log
          pnpm content:check 2>&1 | tee ../../oct02-receipt/content.log
          python3 scripts/english-edition-audit.py 2>&1 | tee ../../oct02-receipt/english-static.log
          python3 scripts/oct02-contract.py 2>&1 | tee ../../oct02-receipt/oct02-static.log
      - name: Actual browser input and mobile regressions
        run: |
          node scripts/browser-english-edition.mjs 2>&1 | tee ../../oct02-receipt/english-browser.log
          node scripts/browser-oct02.mjs 2>&1 | tee ../../oct02-receipt/oct02-browser.log
          node scripts/browser-mobile-performance.mjs 2>&1 | tee ../../oct02-receipt/mobile-browser.log
      - name: Preserve only verified immutable blobs
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,base64,requests,os
          out=pathlib.Path('../oct02-receipt');j=json.loads((out/'assembly.json').read_text())
          assert j['sourceCommit']=='378fa5621f9a4c92ddf281743c4de8db54dd2d65'
          assert len(j['files'])==21
          for row in j['files']:
              p=pathlib.Path(row['path']);assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith('spaceship-ui/') or str(p) in ['scripts/normalize_tags_current.py','.github/workflows/oct02-reading.yml']
              assert not str(p).startswith(('spaceship-ui/site/content/posts/','spaceship-ui/site/content/english/'))
              b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==row['sha256']
              r=requests.post('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},json={'encoding':'base64','content':base64.b64encode(b).decode()},timeout=45);r.raise_for_status();assert r.json()['sha']==row['sha']
          (out/'verified-blobs.json').write_text(json.dumps(j,indent=2))
          print('Verified immutable blobs:',len(j['files']),'; no tree, commit, ref or deployment writes')
          PY
      - name: Preserve candidate sources and evidence
        if: always()
        working-directory: repo
        run: |
          mkdir -p ../oct02-receipt
          python - <<'PY'
          import pathlib,json,zipfile
          out=pathlib.Path('../oct02-receipt');p=out/'assembly.json'
          if p.exists():
              j=json.loads(p.read_text());names=[r['path'] for r in j['files']]
              names.extend(str(p) for p in pathlib.Path('spaceship-ui/site/content/posts').glob('2026-10-02-*.mdx'))
              names.extend('spaceship-ui/site/content/english/en-'+s+'.mdx' for s in ['lace-complementary-heuristics','perturbation-benchmark-calibration','glassrecon-depth-alignment'])
              with zipfile.ZipFile(out/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for name in sorted(set(names)):z.write(name,name)
          PY
          cp -R spaceship-ui/english-review ../oct02-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/mobile-performance ../oct02-receipt/ 2>/dev/null || true
          git rev-parse HEAD > ../oct02-receipt/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oct02-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: oct02-receipt/
          retention-days: 7
