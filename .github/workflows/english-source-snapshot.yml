name: English source snapshot
on:
  push:
    branches: [ops/english-source-20260923]
    paths: [.github/workflows/english-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d94748a983f1aaf84aa274eeda2e92f534ed39a
          persist-credentials: false
      - name: Read preserved English branch
        run: git fetch --depth=1 origin 8b1696e71e011d39ca9809d06ce31eeab1ea21fb
      - name: Source-only snapshot and immutable blob inventories
        run: |
          mkdir -p english-source
          python3 - <<'PY'
          import subprocess,pathlib,zipfile,json
          refs={'main':'2d94748a983f1aaf84aa274eeda2e92f534ed39a','english':'8b1696e71e011d39ca9809d06ce31eeab1ea21fb'}
          suffixes={'.astro','.ts','.js','.mjs','.cjs','.svelte','.css','.md','.mdx','.json','.yml','.yaml','.py','.svg'}
          for label,ref in refs.items():
              tree={}
              with zipfile.ZipFile(f'english-source/{label}.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for entry in subprocess.check_output(['git','ls-tree','-r',ref],text=True).splitlines():
                      meta,name=entry.split('\t',1); mode,kind,sha=meta.split(); tree[name]={'mode':mode,'type':kind,'sha':sha}
                      if kind=='blob' and (pathlib.Path(name).suffix in suffixes or pathlib.Path(name).name=='AGENTS.md'):
                          if name.startswith(('spaceship-ui/','scripts/','.github/workflows/')) or '/' not in name:
                              z.writestr(name,subprocess.check_output(['git','show',f'{ref}:{name}']))
                      if pathlib.Path(name).name=='AGENTS.md':
                          print(label,name); print(subprocess.check_output(['git','show',f'{ref}:{name}'],text=True))
              pathlib.Path(f'english-source/{label}-tree.json').write_text(json.dumps({'ref':ref,'files':tree}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: english-integration-source
          path: english-source/
          retention-days: 3
