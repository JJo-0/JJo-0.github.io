name: NEWS cover originals 20260912
on:
  push:
    branches: [content/news-sep05-08-covers-20260912]
    paths: [.github/workflows/news-cover-acquire-20260912.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --quiet requests beautifulsoup4 pillow pymupdf
      - name: Acquire exact public original files
        shell: python
        run: |
          import os,re,json,hashlib,concurrent.futures,io
          from pathlib import Path
          from urllib.parse import urljoin
          import requests,fitz
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path(os.environ['RUNNER_TEMP'])/'news-cover-originals';out.mkdir()
          headers={'User-Agent':'Mozilla/5.0'}
          pdfs={'clear-ec':'s41467-026-77467-3','hugcl':'s41467-026-77370-x','solar-blind':'s41467-026-77523-y','tilted-mnte':'s41467-026-77568-z','dlcatalysis':'s41467-026-77406-2','glud1':'s41467-026-77151-6','carep':'s41467-026-76570-9','chorus':'s41467-026-77415-1'}
          def get(url):
              r=requests.get(url,headers=headers,timeout=45);r.raise_for_status();return r
          def pdf_task(pair):
              key,doi=pair;folder=out/key;folder.mkdir();rec={'key':key,'url':f'https://www.nature.com/articles/{doi}_reference.pdf'}
              try:
                  r=get(rec['url']);assert r.content.startswith(b'%PDF-'),'Not PDF bytes'
                  (folder/'source.pdf').write_bytes(r.content);rec['sha256']=hashlib.sha256(r.content).hexdigest();d=fitz.open(stream=r.content,filetype='pdf');rec['pages']=len(d)
                  rec['hits']=[]
                  for n,p in enumerate(d):
                      txt=p.get_text()
                      if re.search(r'(?:Fig(?:ure)?\.?\s*1\b)',txt,re.I):
                          rec['hits'].append({'page':n+1,'images':len(p.get_images()),'drawings':len(p.get_drawings()),'snippets':[txt[max(0,m.start()-50):m.end()+220] for m in re.finditer(r'Fig(?:ure)?\.?\s*1\b',txt,re.I)][:4]})
                  (folder/'pdf-text.txt').write_text('\n\n'.join(f'PAGE {n+1}\n'+p.get_text() for n,p in enumerate(d)))
                  # Render candidate pages containing graphics, not every manuscript page.
                  candidates=[h for h in rec['hits'] if h['images'] or h['drawings']>10]
                  for h in candidates[-3:]:
                      p=d[h['page']-1];p.get_pixmap(matrix=fitz.Matrix(1.6,1.6)).save(folder/f'page-{h["page"]}.png')
              except Exception as e:rec['error']=str(e)
              (folder/'metadata.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2));return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(pdf_task,pdfs.items()))
          other={'aml':'https://commons.wikimedia.org/wiki/File:Myeloblasts_on_peripheral_bloodsmear.jpg','methane-background':'https://pmc.ncbi.nlm.nih.gov/articles/PMC9972487/','methane-science':'https://www.science.org/doi/10.1126/science.aed4911','methane-data':'https://zenodo.org/api/records/21283859','nci-rights':'https://www.cancer.gov/policies/copyright-reuse','imec-rights':'https://www.imec-int.com/en/terms-use-imec-pictures'}
          for key,url in other.items():
              folder=out/key;folder.mkdir();rec={'key':key,'url':url,'images':[]}
              try:
                  r=get(url);(folder/'page.html').write_bytes(r.content);soup=BeautifulSoup(r.content,'html.parser');(folder/'page.txt').write_text(soup.get_text(' ',strip=True))
                  urls=[]
                  if key=='aml':
                      a=soup.select_one('.fullImageLink a');urls=[urljoin(url,a['href'])] if a else []
                  elif key=='methane-background':
                      for fig in soup.select('figure, .fig'):
                          for im in fig.find_all('img')[:1]:
                              if im.get('src'):urls.append(urljoin(url,im['src']))
                  for u in urls[:4]:
                      rr=get(u);im=Image.open(io.BytesIO(rr.content));ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(im.format,'.img');name='image-'+str(len(rec['images']))+ext;(folder/name).write_bytes(rr.content);rec['images'].append({'url':u,'file':name,'width':im.width,'height':im.height,'sha256':hashlib.sha256(rr.content).hexdigest()})
              except Exception as e:rec['error']=str(e)
              (folder/'metadata.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2));results.append(rec)
          (out/'inventory.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: news-cover-originals-20260912
          path: ${{ runner.temp }}/news-cover-originals
          retention-days: 3
