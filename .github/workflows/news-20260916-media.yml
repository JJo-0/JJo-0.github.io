name: September 16 NEWS licensed figures
on:
  push:
    branches: [content/news-20260916-hydrogen-candidates]
    paths: [.github/workflows/news-20260916-media.yml]
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260916-hydrogen-candidates
      - name: Require explicit CC BY 4.0 and preserve complete figure panels
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 Pillow
          python - <<'PY'
          import requests,io,json,hashlib,os,subprocess
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path(os.environ['RUNNER_TEMP'])/'news-sep16-media';out.mkdir()
          root=Path('spaceship-ui/site/assets/assets/posts/news-20260916');root.mkdir(parents=True,exist_ok=True)
          sources=[('hydrogen','https://www.nature.com/articles/s41467-026-74854-8',[1,2],'related-research-background'),('medical','https://www.nature.com/articles/s41591-026-04609-x',[2,6],'reviewed-paper-original'),('oect','https://www.nature.com/articles/s41467-024-51883-9',[1,2],'related-research-background')]
          allowed={'www.nature.com','media.springernature.com'};receipts=[]
          def get(url):
              assert urlparse(url).scheme=='https' and urlparse(url).hostname in allowed
              r=requests.get(url,timeout=60);r.raise_for_status();assert len(r.content)<20000000;return r.content
          for key,url,nums,role in sources:
              raw=get(url);soup=BeautifulSoup(raw,'html.parser')
              rights=soup.find(id='rightslink')
              assert soup.select_one('a[href="http://creativecommons.org/licenses/by/4.0/"]') or soup.select_one('a[href="https://creativecommons.org/licenses/by/4.0/"]'), 'No explicit CC BY 4.0: '+url
              (out/f'{key}-source.html').write_bytes(raw);(out/f'{key}-source.txt').write_text(soup.get_text('\n',strip=True))
              for num in nums:
                  figure_url=url+f'/figures/{num}'
                  page=get(figure_url);figsoup=BeautifulSoup(page,'html.parser')
                  original=next((urljoin(figure_url,a['href']) for a in figsoup.select('a[href]') if 'media.springernature.com/full/' in a['href']),None)
                  if original is None:
                      tag=figsoup.select_one('figure img') or figsoup.select_one('img[src*="Fig"]');assert tag
                      original=urljoin(figure_url,tag['src'])
                  data=get(original);im=Image.open(io.BytesIO(data));im.load();assert im.width>=600
                  im=im.convert('RGB');im.thumbnail((2000,2000),Image.Resampling.LANCZOS)
                  target=root/f'{key}-fig{num}.webp';im.save(target,'WEBP',quality=92,method=6)
                  record={'id':f'sep16-{key}-{num}','role':role,'source':url,'figureUrl':figure_url,'originalImageUrl':original,'sourceHtmlSha256':hashlib.sha256(raw).hexdigest(),'originalImageSha256':hashlib.sha256(data).hexdigest(),'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'src':'/assets/posts/news-20260916/'+target.name,'width':im.width,'height':im.height,'license':'CC BY 4.0','rights':'https://creativecommons.org/licenses/by/4.0/','changes':'전체 패널 보존. 비율을 유지한 축소 및 WebP 형식 변환.','checkedDate':'2026-09-16'}
                  receipts.append(record);(out/target.name).write_bytes(target.read_bytes());(out/f'{key}-fig{num}.html').write_bytes(page)
          (root/'provenance.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2)+'\n');(out/'provenance.json').write_bytes((root/'provenance.json').read_bytes())
          subprocess.run(['git','add','--',str(root)],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','media: add six CC-BY figures with original/source hashes for September 16 (#120)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260916-hydrogen-candidates'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: news-sep16-licensed-media
          path: ${{ runner.temp }}/news-sep16-media
          retention-days: 14
