name: One-time constellation merge gate

on:
  push:
    branches: [agent/research-constellation-svg]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/research-constellation-svg
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Full validation
        working-directory: spaceship-ui
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check
      - name: Remove one-time gate and commit
        shell: bash
        run: |
          rm -f .github/workflows/constellation-automerge-once.yml
          rm -f .github/workflows/constellation-integrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time constellation workflows"
            git push origin HEAD:agent/research-constellation-svg
          fi
      - name: Squash merge and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/research-constellation-svg --state open --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open constellation PR found" >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "feat: add accessible SVG research constellation" \
            --body "Add the SAFE/mobile research constellation layer, derived from canonical public research data, with keyboard and reduced-motion fallbacks plus a fail-closed rendered contract."
