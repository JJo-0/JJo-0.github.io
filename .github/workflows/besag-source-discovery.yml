name: Besag primary source discovery
on:
  push:
    branches: [ops/paper-final-figures-20260917]
    paths: [.github/workflows/besag-source-discovery.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Resolve publisher and scholarly-hosted source
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,json,hashlib
          from pathlib import Path
          import fitz
          out=Path('besag-source');out.mkdir()
          urls=[
            'https://academic.oup.com/jrsssb/article/48/3/259/7027716',
            'https://www.stat.cmu.edu/~cshalizi/350/2008/readings/besag.pdf',
            'https://api.openalex.org/works/https://doi.org/10.1111/j.2517-6161.1986.tb01412.x',
            'https://rss.onlinelibrary.wiley.com/doi/pdf/10.1111/j.2517-6161.1986.tb01412.x'
          ]
          records=[];seen=set();pdfs=[]
          for url in urls:
              if url in seen:continue
              seen.add(url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/pdf,application/json'}),timeout=35) as response:
                      data=response.read();resolved=response.url;ctype=response.headers.get('content-type','')
                  record={'url':url,'resolved':resolved,'contentType':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  if data.startswith(b'%PDF-'):
                      doc=fitz.open(stream=data,filetype='pdf');text='\n'.join(p.get_text() for p in doc)
                      file=f'candidate-{len(pdfs)+1}'
                      (out/(file+'.pdf')).write_bytes(data);(out/(file+'.txt')).write_text(text)
                      record.update({'file':file+'.pdf','pages':len(doc),'opening':text[:1400]});pdfs.append(file)
                      for index in range(min(len(doc),23)):
                          doc[index].get_pixmap(matrix=fitz.Matrix(1.3,1.3),alpha=False).save(out/f'{file}-page-{index+1}.png')
                  else:
                      text=data.decode('utf-8',errors='replace');(out/f'page-{len(records)}.html').write_text(text)
                      if 'api.openalex.org' in url:
                          obj=json.loads(text)
                          record['locations']=obj.get('locations')
                          for loc in obj.get('locations',[]):
                              pdf=loc.get('pdf_url')
                              if pdf and pdf.startswith('https://'):urls.append(pdf)
                      links=[html.unescape(s) for s in re.findall(r'(?:content|href)=["\']([^"\']+)["\']',text) if 'pdf' in s.lower()]
                      record['pdfLinks']=links
                      for link in links:
                          target=urllib.parse.urljoin(resolved,link)
                          if target.startswith('https://') and ('article-pdf' in target or target.lower().endswith('.pdf')):urls.append(target)
                  records.append(record)
              except Exception as error:records.append({'url':url,'error':repr(error)})
              if len(seen)>12:break
          (out/'discovery.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: besag-primary-source-discovery
          path: besag-source/
          retention-days: 7
