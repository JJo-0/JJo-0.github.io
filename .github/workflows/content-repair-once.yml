name: One-time content repair

on:
  push:
    branches: [agent/repair-math-drafts-home-gif]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-math-drafts-home-gif
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Apply requested content repairs
        run: python scripts/one-time-content-repair.py

      - name: Install dependencies
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile

      - name: Validate full quality suite
        working-directory: spaceship-ui
        run: |
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check

      - name: Commit repaired content
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- spaceship-ui)" ]]; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui
          git commit -m "fix: repair homepage gif math and unfinished posts"
          git push origin HEAD:agent/repair-math-drafts-home-gif
