name: One-time content repair

on:
  push:
    branches: [agent/repair-math-drafts-home-gif]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-math-drafts-home-gif
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Apply requested content repairs
        shell: bash
        run: |
          if [[ -f spaceship-ui/site/content/posts/2025-05-08.mdx && ! -f spaceship-ui/site/content/posts/2025-05-08.md ]]; then
            echo "Repairs already materialized; validating current branch"
          else
            sed -i 's/벡터와 행렬의 \*\*크기(magnitude)\*\*를/벡터와 행렬의 <strong>크기(magnitude)<\/strong>를/' scripts/one-time-content-repair.py
            python - <<'PY'
          from pathlib import Path
          p = Path('scripts/one-time-content-repair.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if ".replace(/<style" in line]
          if len(matches) != 1:
              raise SystemExit(f'rendered audit style line count: {len(matches)}')
          lines.insert(matches[0] + 1, r"    .replace(/<annotation\b[\s\S]*?<\/annotation>/gi, ' ')")
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
            python scripts/one-time-content-repair.py
          fi

      - name: Install dependencies
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile

      - name: Validate full quality suite
        working-directory: spaceship-ui
        run: |
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check

      - name: Commit repaired content
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- spaceship-ui)" ]]; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui
          git commit -m "fix: repair homepage gif math and unfinished posts"
          git push origin HEAD:agent/repair-math-drafts-home-gif
