name: Sep21 stage publication v2
on:
  push:
    branches: [ops/sep21-source-review]
    paths: [.github/workflows/sep21-stage-v2.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/ops/sep21-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/news-20260921-msvd-hsi-erled
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact authored payload and source figures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path,PurePosixPath
          repo='JJo-0/JJo-0.github.io'; expected_base='4a04dc2742d370b7a012ce2b63e3d151faf58d42'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected_base
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def blob(sha):
            with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers=headers),timeout=90) as r:j=json.load(r)
            data=base64.b64decode(j['content']);assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==sha;return data
          chunks=['a3c30161c87af759b4d393b8151c51df26d7054f','e84b00b4449b850ebf33c6df938068da521d0f9e','0470473dbf32cdb99cee08c333f57728dee150e4','4564cc966170af46553b3a811cd7125dce5d431f','c42f5e61f1c0b3141c46e7f63febe06fa297e8d0','618a10847b38df8bf9f6ef10e630df0b71de635f','ef7556b99527999b9a9e2acb4d565f1af092c987','01185acde759f59d70493351b8c46e8d410cdb20']
          raw=lzma.decompress(base64.b64decode(b''.join(blob(s) for s in chunks),validate=True),memlimit=256000000)
          assert hashlib.sha256(raw).hexdigest()=='0ee7fc16cdc553af5c16a71d9659e6abe1285f7e5db8b0a86ca61dd2e67880a8'
          payload=json.loads(raw);assert payload['base']==expected_base
          def safe(name):
            p=PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts
            assert name.startswith('spaceship-ui/') or name.startswith('.github/');return Path(name)
          for name,content in payload['new'].items():
            p=safe(name);assert not p.exists(),name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          for row in payload['provenance']:
            p=safe('spaceship-ui/site/assets'+row['src']);assert not p.exists();data=blob(row['blobSha'])
            assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          media_path=Path('spaceship-ui/site/news-media.json');media=json.loads(media_path.read_text());adds=payload['mediaAdditions'];assert not set(media)&set(adds);media.update(adds);media_path.write_text(json.dumps(media,ensure_ascii=False,indent=2)+'\n')
          tax=Path('scripts/normalize_tags_current.py');source=tax.read_text();anchor='if __name__ == "__main__":';assert source.count(anchor)==1
          lines=['POST_TAXONOMY.update({']
          for e in payload['edition']['entries']:
            t=e['taxonomy'];name=e['slug']+'.mdx';assert name not in source
            lines.append(f"    {name!r}: Taxonomy({t['category']!r}, {t['subcategory']!r}, {t['type']!r}, {tuple(t['tags'])!r}),")
          lines.append('})\n\n');tax.write_text(source.replace(anchor,'\n'.join(lines)+anchor))
          p=Path('spaceship-ui/scripts/browser-news-media-audit.mjs');s=p.read_text();needle="  const sep20 = JSON.parse(fs.readFileSync(new URL('../site/news-edition-20260920.json', import.meta.url), 'utf8'));";assert s.count(needle)==1
          s=s.replace(needle,needle+"\n  const sep21 = JSON.parse(fs.readFileSync(new URL('../site/news-edition-20260921.json', import.meta.url), 'utf8'));");assert s.count('...sep20.entries]')==2;s=s.replace('...sep20.entries]','...sep20.entries, ...sep21.entries]');p.write_text(s)
          p=Path('spaceship-ui/src/pages/posts/[...slug]/index.astro');s=p.read_text();needle="import sep20 from '../../../../site/news-edition-20260920.json';";assert s.count(needle)==1;s=s.replace(needle,"import sep21 from '../../../../site/news-edition-20260921.json';\n"+needle)
          needle='adsEnabled={!sep20.entries.some((entry) => entry.slug === effectiveSlug)';assert s.count(needle)==1;s=s.replace(needle,'adsEnabled={!sep21.entries.some((entry) => entry.slug === effectiveSlug) && !sep20.entries.some((entry) => entry.slug === effectiveSlug)');p.write_text(s)
          p=Path('.github/workflows/blog-pages-deploy.yml');s=p.read_text()
          read20="      - name: Live September 20 article reading\n        timeout-minutes: 6\n        run: node scripts/browser-sep20.mjs\n"
          assert s.count(read20)==1
          s=s.replace(read20,read20+"\n      - name: Live September 21 article reading\n        timeout-minutes: 6\n        run: node scripts/browser-sep21.mjs\n")
          anchor='      - name: Publish Pages live-smoke status\n';assert s.count(anchor)==1
          dollar='$'
          block=("      - name: Preserve live September 21 reading evidence\n"
                 "        if: always()\n"
                 "        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n"
                 "        with:\n"
                 f"          name: sep21-live-{dollar}{{{{ github.run_id }}}}-{dollar}{{{{ github.run_attempt }}}}\n"
                 "          path: spaceship-ui/sep21-review/\n"
                 "          retention-days: 14\n"
                 "          if-no-files-found: error\n\n")
          s=s.replace(anchor,block+anchor);p.write_text(s)
          PY
      - name: Commit publication changes
        run: |
          git config user.name 'Park Jiho'
          git config user.email '76779256+JJo-0@users.noreply.github.com'
          git add .github/workflows/blog-pages-deploy.yml .github/workflows/sep21-reading.yml scripts/normalize_tags_current.py spaceship-ui/
          git -c core.hooksPath=/dev/null commit -m 'content: add September 21 MSVD and photonics explainers'
          git push origin HEAD:refs/heads/content/news-20260921-msvd-hsi-erled
