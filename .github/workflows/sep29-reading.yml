name: September 29 reading
on:
  pull_request:
    branches: [main]
    paths:
      - "spaceship-ui/**"
      - "scripts/normalize_tags_current.py"
      - ".github/workflows/sep29-reading.yml"
  push:
    branches: [main]
    paths:
      - "spaceship-ui/**"
      - "scripts/normalize_tags_current.py"
      - ".github/workflows/sep29-reading.yml"
permissions:
  contents: read
concurrency:
  group: sep29-reading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install dependencies and Korean fonts
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Source, equation and evidence-boundary contract
        run: node scripts/news-edition-20260929-contract.mjs
      - name: Build
        run: pnpm build
      - name: Rendered contract
        run: node scripts/news-edition-20260929-contract.mjs
      - name: Mobile and desktop reading matrix
        run: node scripts/browser-sep29.mjs
      - name: Record tested source
        if: always()
        run: mkdir -p sep29-review && git rev-parse HEAD > sep29-review/tested-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep29-reading-${{ github.run_id }}-${{ github.run_attempt }}
          path: spaceship-ui/sep29-review/
          retention-days: 7
