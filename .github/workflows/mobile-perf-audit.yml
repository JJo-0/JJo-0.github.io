name: Mobile performance audit
on:
  push:
    branches: [ops/mobile-perf-audit-20260923]
    paths: [.github/workflows/mobile-perf-audit.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8a90787ec439dc8caffccfff74324ff8285ec1e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align Korean fonts with the post-fix browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -n "$(fc-list :lang=ko family)"
      - name: Measure actual pre-deployment pages
        run: |
          mkdir -p perf-audit
          git rev-parse HEAD > perf-audit/source-head.txt
          npm install --prefix /tmp/jjo-lighthouse lighthouse@12.8.2
          for entry in 'home|https://jjo-0.github.io/' 'news|https://jjo-0.github.io/news/'; do
            name=${entry%%|*}; url=${entry#*|}
            /tmp/jjo-lighthouse/node_modules/.bin/lighthouse "$url" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="perf-audit/${name}.json" --quiet
          done
      - name: Print measured summary
        run: |
          python3 - <<'PY'
          import pathlib,json
          for p in pathlib.Path('perf-audit').glob('*.json'):
              j=json.loads(p.read_text()); a=j.get('audits',{})
              print('FONT_MATCHED_BASELINE',p.name,json.dumps({'url':j.get('finalDisplayedUrl'),'time':j.get('fetchTime'),'version':j.get('lighthouseVersion'),'error':j.get('runtimeError'),'score':j.get('categories',{}).get('performance',{}).get('score'),'metrics':{k:{x:a.get(k,{}).get(x) for x in ['numericValue','displayValue']} for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','total-byte-weight','mainthread-work-breakdown','bootup-time']}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-performance-font-matched-baseline
          path: perf-audit/
          retention-days: 7
