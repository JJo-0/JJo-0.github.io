name: Deployed mobile performance audit
on:
  push:
    branches: [ops/mobile-perf-audit-20260923]
    paths: [.github/workflows/mobile-perf-audit.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d94748a983f1aaf84aa274eeda2e92f534ed39a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Korean browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Actual deployed mobile interactions
        env:
          JJO_SMOKE_BASE_URL: https://jjo-0.github.io/
        run: node scripts/browser-mobile-performance.mjs
      - name: Actual public Lighthouse (independent performance measurement)
        if: always()
        run: |
          mkdir -p mobile-performance
          git rev-parse HEAD > mobile-performance/tested-sha.txt
          google-chrome --version > mobile-performance/browser-version.txt
          npm install --prefix /tmp/jjo-lighthouse lighthouse@12.8.2
          for page in home news; do
            url=https://jjo-0.github.io/; if [ "$page" = news ]; then url="${url}news/"; fi
            /tmp/jjo-lighthouse/node_modules/.bin/lighthouse "$url" --only-categories=performance --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="mobile-performance/live-${page}.json" --quiet
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-mobile-performance
          path: spaceship-ui/mobile-performance/
          retention-days: 7
