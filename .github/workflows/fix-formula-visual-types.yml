name: Fix formula visual types once

on:
  push:
    branches:
      - agent/modern-ai-angelo-style-visuals
    paths:
      - .github/workflows/fix-formula-visual-types.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-formula-visual-types.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-angelo-style-visuals
          fetch-depth: 0
      - name: Extract shared client runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('spaceship-ui/src/components/post/FormulaVisual.astro')
          runtime = Path('spaceship-ui/src/scripts/formula-visual-runtime.js')
          text = component.read_text()
          start = text.index('<script>')
          end = text.index('</script>', start) + len('</script>')
          script_body = text[start + len('<script>'):end - len('</script>')].strip()
          script_body = script_body.replace('      const sy = 70 + clamp(y, 0, 16) * 25;\n', '')
          runtime.parent.mkdir(parents=True, exist_ok=True)
          runtime.write_text(script_body + '\n')
          replacement = "<script>\n  import '@/scripts/formula-visual-runtime.js';\n</script>"
          component.write_text(text[:start] + replacement + text[end:])
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: spaceship-ui
        run: pnpm lint
      - name: Type check
        working-directory: spaceship-ui
        run: pnpm check
      - name: Build
        working-directory: spaceship-ui
        run: pnpm build
      - name: Content and visual contracts
        working-directory: spaceship-ui
        run: pnpm content:check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-formula-visual-types.yml
          git add spaceship-ui/src/components/post/FormulaVisual.astro \
                  spaceship-ui/src/scripts/formula-visual-runtime.js
          git commit -m 'refactor: share lazy formula visual runtime'
          git push origin HEAD:agent/modern-ai-angelo-style-visuals
