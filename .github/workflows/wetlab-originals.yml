name: Wet lab original images
on:
  push:
    branches: [ops/wetlab-source-20260919]
    paths: [.github/workflows/wetlab-originals.yml]
permissions:
  contents: write
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python3 -m pip install Pillow==11.3.0
      - name: Download originals and create blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,urllib.request
          from PIL import Image
          sources=[
            ('mhs-genentech-workflow.png','https://www-cdn.anthropic.com/images/4zrzovbb/website/0aa7623ba0e545ce39e0de725583c0445ce6b76d-1999x1250.png'),
            ('mhs-genentech-bubbles.jpg','https://www-cdn.anthropic.com/images/4zrzovbb/website/943af4b43644ab0d213ba362eabd609c98cd8887-1999x1125.jpg')
          ]
          out=pathlib.Path('wetlab-originals');out.mkdir();rows=[]
          for name,url in sources:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r:
              assert r.status==200;data=r.read(5_000_000);kind=r.headers.get('Content-Type')
            im=Image.open(io.BytesIO(data));im.load();assert im.width==1999 and im.height in [1250,1125]
            (out/name).write_bytes(data)
            sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            req=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
            assert sha==result['sha']
            rows.append({'filename':name,'sourceUrl':url,'width':im.width,'height':im.height,'bytes':len(data),'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'contentType':kind,'sourceByteIdentical':True})
          (out/'images.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wetlab-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: wetlab-originals/
          retention-days: 7
          if-no-files-found: error
