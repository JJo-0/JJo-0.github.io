name: Paper2Agent publication evidence
on:
  push:
    branches: [ops/paper2agent-evidence-20260918]
    paths: [.github/workflows/paper2agent-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39aa52e4da969149f335ebee158c5a2835be8c74
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4 Pillow==11.3.0
      - name: Fetch primary sources as data only
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,urllib.request,urllib.parse
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=Path('paper2agent-evidence');out.mkdir()
          urls={
            'nature':'https://www.nature.com/articles/s41586-026-11044-y',
            'nature-figure-1':'https://www.nature.com/articles/s41586-026-11044-y/figures/1',
            'nature-figure-4':'https://www.nature.com/articles/s41586-026-11044-y/figures/4',
            'preprint':'https://arxiv.org/html/2509.06917v2',
            'preprint-metadata':'https://arxiv.org/abs/2509.06917v2',
            'official-readme':'https://raw.githubusercontent.com/jmiao24/Paper2Agent/main/README.md',
            'official-license':'https://raw.githubusercontent.com/jmiao24/Paper2Agent/main/LICENSE',
          }
          receipts=[]
          def fetch(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 scholarly-article-review'}),timeout=45) as response:
              return response.read(),response.geturl(),response.status,response.headers.get('content-type','')
          for key,url in urls.items():
            row={'id':key,'requested':url}
            try:
              data,actual,status,ctype=fetch(url)
              row.update(actual=actual,status=status,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),contentType=ctype)
              (out/(key+'.html')).write_bytes(data)
              soup=BeautifulSoup(data,'html.parser')
              (out/(key+'.txt')).write_text(soup.get_text('\n',strip=True))
              if key=='nature':
                links=[{'text':a.get_text(' ',strip=True),'url':urllib.parse.urljoin(url,a['href'])} for a in soup.select('a[href]') if any(s in a['href'].lower() for s in ['creativecommons','moesm','figures/','rights'])]
                (out/'nature-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2))
              if key.startswith('nature-figure-'):
                image=soup.select_one('meta[property="og:image"]')
                if image:
                  image_url=urllib.parse.urljoin(url,image['content'])
                  binary,_,_,_=fetch(image_url)
                  (out/(key+'.image')).write_bytes(binary)
                  row['imageUrl']=image_url
              if key=='preprint':
                figs=[]
                for figure in soup.select('figure')[:4]:
                  image=figure.select_one('img[src]')
                  if not image:continue
                  image_url=urllib.parse.urljoin(url+'/',image['src'])
                  binary,_,_,_=fetch(image_url)
                  filename=figure.get('id','figure').replace('.','-')+'.image'
                  (out/filename).write_bytes(binary)
                  figs.append({'id':figure.get('id'),'caption':figure.get_text(' ',strip=True),'url':image_url,'file':filename,'sha256':hashlib.sha256(binary).hexdigest()})
                (out/'preprint-figures.json').write_text(json.dumps(figs,ensure_ascii=False,indent=2))
            except Exception as exc:row['error']=str(exc)
            receipts.append(row)
          (out/'receipts.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2))
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'repository.zip'),'HEAD'],check=True)
          print(json.dumps(receipts,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper2agent-publication-evidence
          path: paper2agent-evidence/
          retention-days: 7
          if-no-files-found: error
