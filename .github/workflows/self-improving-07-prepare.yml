name: Temporary Self-Improving 07 preparation
on:
  push:
    branches: ['content/self-improving-ai-07']
    paths: ['.github/workflows/self-improving-07-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/self-improving-ai-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render pinned sources and verify reviewed bytes
        run: |
          python -m pip install PyMuPDF==1.26.7
          python docs/self-improving-ai/tools/render_07.py
          python docs/self-improving-ai/reviews/verify_examples_07.py --output docs/self-improving-ai/reviews/numeric-checks-07.json
          python docs/self-improving-ai/tools/prepare_07.py
          node --check spaceship-ui/scripts/browser-self-improving-audit.mjs
          python scripts/normalize_tags_current.py --check
      - name: Commit only scoped content changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/self-improving-ai/source-assets/07/ docs/self-improving-ai/reviews/numeric-checks-07.json docs/self-improving-ai/reviews/2026-11-17-chapter-07-preparation.json docs/self-improving-ai/publishing/2026-11-17-chapter-07-request.json docs/self-improving-ai/drafts/07-RESUME.md docs/self-improving-ai/progress.json scripts/normalize_tags_current.py spaceship-ui/scripts/browser-self-improving-audit.mjs spaceship-ui/site/content/posts/self-improving-ai-06-self-evaluation-and-entropy.mdx spaceship-ui/site/assets/assets/posts/self-improving-ai-07-unsupervised-rlvr-and-test-time-training/
          git diff --cached --stat
          git commit -m 'content: integrate reviewed chapter 07 figures, transcript and continuation'
          git push origin HEAD:content/self-improving-ai-07
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: self-improving-07-rendered
          path: |
            spaceship-ui/site/assets/assets/posts/self-improving-ai-07-unsupervised-rlvr-and-test-time-training/
            docs/self-improving-ai/source-assets/07/
            docs/self-improving-ai/reviews/*07*
          retention-days: 7
