name: Sep22 final correction
on:
  push:
    branches: [ops/sep22-finalize]
    paths: [.github/workflows/sep22-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/news-20260922-mos2-treg-phage
          fetch-depth: 0
          persist-credentials: true
      - name: Correct Figure 8 replicate boundary on exact head
        run: |
          test "$(git rev-parse HEAD)" = "3aa4e22cde05c1538cac15b3ddc117278d1ad9c6"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('spaceship-ui/site/content/posts/2026-09-22-irf4-treg-stability-news.mdx')
          s=p.read_text()
          old='| Figure 8a의 억제 시험 | 다른 T세포의 증식을 제어하는가 | 배양 기능 시험, 2명의 기증자 |'
          new='| Figure 8a의 억제 시험 | 다른 T세포의 증식을 제어하는가 | 배양 기능 시험, n=3 기술 반복; 인간 기증자 수와 별개 |'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='spaceship-ui/site/news-edition-20260922.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          const row=e.entries.find(x=>x.key==='treg');
          const file='spaceship-ui/site/content/posts/'+row.slug+'.mdx';
          const s=fs.readFileSync(file,'utf8');
          const body=s.split('---').slice(2).join('---').split(/^## 9\. /m)[0]
            .replace(/^import .*?;\s*/gm,'').replace(/<Math\b[\s\S]*?\/>/g,'')
            .replace(/<CandidateEquation\b[^\n]+>/g,'').replace(/<[^>]*>/g,' ')
            .replace(/\[\d+\]/g,'').replace(/[*#|`>]+/g,'').replace(/\s+/g,' ').trim();
          row.sha256=crypto.createHash('sha256').update(s).digest('hex');
          row.bodyCharacters=body.length;
          fs.writeFileSync(p,JSON.stringify(e,null,2)+'\n');
          NODE
      - uses: pnpm/action-setup@v4
        with: {version: 10.19.0}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Dependencies and Korean fonts
        working-directory: spaceship-ui
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify exact corrected content
        working-directory: spaceship-ui
        run: |
          node scripts/news-edition-20260922-contract.mjs
          pnpm taxonomy:check
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm blog:harness:check
          pnpm build
          pnpm content:check
          node scripts/news-edition-20260922-contract.mjs
          node scripts/browser-sep22.mjs
      - name: Commit and push exact passing correction
        run: |
          git config user.name "Park Jiho"
          git config user.email "76779256+JJo-0@users.noreply.github.com"
          git add spaceship-ui/site/content/posts/2026-09-22-irf4-treg-stability-news.mdx spaceship-ui/site/news-edition-20260922.json
          git diff --cached --check
          git commit -m "fix: distinguish Treg technical replicates from donor count"
          git push origin HEAD:content/news-20260922-mos2-treg-phage
