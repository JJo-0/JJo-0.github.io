name: Besag university-source evidence
on:
  push:
    branches: [ops/paper-final-figures-20260917]
    paths: [.github/workflows/besag-duke-evidence.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Retrieve and render original paper
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          import fitz
          out=Path('besag-evidence');out.mkdir()
          urls=['https://www.stat.duke.edu/~scs/Courses/Stat376/Papers/GibbsFieldEst/BesagDirtyPicsJRSSB1986.pdf','http://www.stat.duke.edu/~scs/Courses/Stat376/Papers/GibbsFieldEst/BesagDirtyPicsJRSSB1986.pdf','https://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.399.7501&rep=rep1&type=pdf']
          records=[];ok=False
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as response:
                      data=response.read();resolved=response.url
                  assert data.startswith(b'%PDF-'),'Not PDF'
                  doc=fitz.open(stream=data,filetype='pdf');text='\n\n'.join('PAGE '+str(i+1)+'\n'+p.get_text() for i,p in enumerate(doc))
                  (out/'besag.pdf').write_bytes(data);(out/'besag-text.txt').write_text(text)
                  records.append({'url':url,'resolved':resolved,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'pages':len(doc),'opening':text[:1500]})
                  for index in range(min(len(doc),23)):
                      p=doc[index];p.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(out/f'besag-page-{index+1}.png')
                      (out/f'besag-page-{index+1}.json').write_text(json.dumps({'rect':list(p.rect),'blocks':p.get_text('blocks')},ensure_ascii=False))
                  ok=True;break
              except Exception as error:records.append({'url':url,'error':repr(error)})
          (out/'sources.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2));assert ok,'No original PDF acquired'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: besag-university-evidence
          path: besag-evidence/
          retention-days: 7
