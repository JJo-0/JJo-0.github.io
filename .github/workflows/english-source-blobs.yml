name: Verified English source blobs
on:
  push:
    branches: [ops/english-source-20260923]
    paths: [.github/workflows/english-source-blobs.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9512787222737b977fcc066f5e09b640ab0abf08
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: english-candidate-35840099159-1
          run-id: 35840099159
          github-token: ${{ github.token }}
          path: input
      - name: Verify source digests and create immutable blobs, not branches
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ZIP_SHA256: 4fedca467562a6afcb5f97501c163abf43992e40f6d850b7dfb51a1228df08ea
          SOURCE_MANIFEST_SHA256: eea0b9f6ef9424d0dcb8ae09034d93d270f92e4abdb94d7cd8f03fb54a5ed872
        run: python3 .ops/english-blobs.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-english-blobs
          path: output/
          retention-days: 3
