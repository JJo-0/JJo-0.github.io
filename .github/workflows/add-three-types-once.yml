name: Add Three.js types once

on:
  push:
    branches: [agent/three-experience-core]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/three-experience-core
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Three.js declaration package
        run: pnpm add --save-dev @types/three@latest --lockfile-only
      - name: Commit dependency files
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- spaceship-ui/package.json spaceship-ui/pnpm-lock.yaml; then
            echo "Dependency files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui/package.json spaceship-ui/pnpm-lock.yaml
          git commit -m "chore: add Three.js type declarations"
          git push origin HEAD:agent/three-experience-core
