name: October 2 and 3 integration candidate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/oct03-evidence.yml, '.ops/oct03-assemble.py', '.ops/oct03-finalize.py', '.ops/oct02-assemble.py', '.ops/oct02-checks.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: oct03-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
        working-directory: repo/spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 08d3e94f1066006bfa503db251dde68b41eaad99
          path: repo
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: october-3-source-evidence
          run-id: 37262628541
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: october-2-source-evidence
          run-id: 37269049027
          github-token: ${{ github.token }}
          path: input02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pymupdf==1.26.7
      - name: Assemble all reviewed source pairs and media
        working-directory: repo
        run: |
          git fetch --depth=1 origin 2c2841cf089dde5ae554788e91ffa31662545126
          python ../ops/.ops/oct03-assemble.py
          python ../ops/.ops/oct03-finalize.py
          python ../ops/.ops/oct02-assemble.py
          python ../ops/.ops/oct02-checks.py
          git add -N .
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Existing source quality gates
        run: |
          node scripts/graph-json.test.mjs
          pnpm lint 2>&1 | tee ../../oct03-receipt/lint.log
          pnpm check 2>&1 | tee ../../oct03-receipt/types.log
          pnpm seo:check 2>&1 | tee ../../oct03-receipt/seo.log
      - name: Build and preserved content integrity
        run: |
          pnpm build 2>&1 | tee ../../oct03-receipt/build.log
          pnpm content:check 2>&1 | tee ../../oct03-receipt/content.log
          python3 scripts/english-edition-audit.py 2>&1 | tee ../../oct03-receipt/english-static.log
          python3 scripts/oct02-contract.py 2>&1 | tee ../../oct03-receipt/oct02-static.log
          python3 scripts/oct03-contract.py 2>&1 | tee ../../oct03-receipt/oct03-static.log
      - name: Real reading and preserved mobile behavior
        run: |
          node scripts/browser-oct02.mjs 2>&1 | tee ../../oct03-receipt/oct02-browser.log
          node scripts/browser-oct03.mjs 2>&1 | tee ../../oct03-receipt/oct03-browser.log
          node scripts/browser-english-edition.mjs 2>&1 | tee ../../oct03-receipt/english-browser.log
          node scripts/browser-mobile-performance.mjs 2>&1 | tee ../../oct03-receipt/mobile-browser.log
      - name: Preserve exact candidate and diagnostics
        if: always()
        working-directory: repo
        run: |
          mkdir -p ../oct03-receipt
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile,subprocess
          out=pathlib.Path('../oct03-receipt');p=out/'manifest.json'
          if p.exists():
              m=json.loads(p.read_text());m['workerCommit']=subprocess.check_output(['git','-C','../ops','rev-parse','HEAD'],text=True).strip()
              with zipfile.ZipFile(out/'candidate-source.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for row in m['files']:
                      b=pathlib.Path(row['path']).read_bytes();assert hashlib.sha256(b).hexdigest()==row['sha256'];z.writestr(row['path'],b)
              p.write_text(json.dumps(m,ensure_ascii=False,indent=2))
          PY
          cp -R spaceship-ui/oct02-review ../oct03-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/oct03-review ../oct03-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/english-review ../oct03-receipt/ 2>/dev/null || true
          cp -R spaceship-ui/mobile-performance ../oct03-receipt/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oct03-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: oct03-receipt/
          retention-days: 7
  preserve-blobs:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: oct03-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: input
      - name: Verify and preserve immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,urllib.request,base64,os
          root=pathlib.Path('input');m=json.loads((root/'manifest.json').read_text());z=zipfile.ZipFile(root/'candidate-source.zip')
          assert m['base']=='99a2e79f58d95f7a0ca31a13b767f84928bb1732'
          assert m['sourceCommit']=='08d3e94f1066006bfa503db251dde68b41eaad99'
          assert m['oct02SourceCommit']=='2c2841cf089dde5ae554788e91ffa31662545126'
          assert 45<=len(m['files'])<=65
          assert sorted(z.namelist())==sorted(r['path'] for r in m['files'])
          for row in m['files']:
              path=pathlib.PurePosixPath(row['path']);assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith('spaceship-ui/') or str(path) in ['scripts/normalize_tags_current.py','.github/workflows/oct03-reading.yml','.github/workflows/oct02-reading.yml']
              assert path.suffix in {'.md','.mdx','.json','.mjs','.ts','.astro','.png','.py','.yml','.svg'}
              b=z.read(str(path));assert len(b)<6000000 and hashlib.sha256(b).hexdigest()==row['sha256']
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==row['sha']
              payload={'content':base64.b64encode(b).decode(),'encoding':'base64'} if path.suffix=='.png' else {'content':b.decode('utf-8'),'encoding':'utf-8'}
              req=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=40) as response:created=json.load(response)
              assert created['sha']==row['sha']
          pathlib.Path('output').mkdir();pathlib.Path('output/verified-blobs.json').write_text(json.dumps(m,indent=2))
          print('Verified',len(m['files']),'immutable blobs; no tree, commit, ref or branch written')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oct03-verified-blobs-${{ github.run_id }}
          path: output/
          retention-days: 7
