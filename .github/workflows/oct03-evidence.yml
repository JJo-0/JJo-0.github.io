name: October 3 source evidence
on:
  push:
    branches: [content/news-20261003-three-candidates]
    paths: [.github/workflows/oct03-evidence.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/oct03-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99a2e79f58d95f7a0ca31a13b767f84928bb1732
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pymupdf==1.26.7
      - name: Preserve source and publisher evidence (no publication writes)
        run: |
          python - <<'PY'
          import pathlib,subprocess,zipfile,json,hashlib,requests,urllib.parse,fitz
          from bs4 import BeautifulSoup
          out=pathlib.Path('oct03-evidence');out.mkdir()
          (out/'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          tree={}
          with zipfile.ZipFile(out/'site-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for line in subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True).splitlines():
                  meta,name=line.split('\t');mode,kind,sha=meta.split();p=pathlib.Path(name);tree[name]={'mode':mode,'type':kind,'sha':sha}
                  if kind=='blob' and (p.suffix in {'.md','.mdx','.json','.js','.mjs','.ts','.svelte','.astro','.css','.yml','.yaml','.py','.svg'} or p.name=='AGENTS.md') and not p.name.startswith('.env'):
                      z.write(p,name)
                  if p.name=='AGENTS.md':print(name+'\n'+p.read_text())
          (out/'tree.json').write_text(json.dumps(tree))
          session=requests.Session();session.headers['User-Agent']='Mozilla/5.0'
          log=[]
          def get(url,p):
              try:
                  r=session.get(url,timeout=70);r.raise_for_status();p.write_bytes(r.content)
                  log.append({'url':url,'path':str(p),'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'type':r.headers.get('Content-Type')});return r
              except Exception as e:log.append({'url':url,'error':str(e)});return None
          papers={'ltri':'s41467-026-78268-4','mccv':'s41588-026-02776-8','paml':'s41467-026-78283-5'}
          for key,article in papers.items():
              d=out/key;d.mkdir();base='https://www.nature.com/articles/'+article;r=get(base,d/'article.html')
              if not r:continue
              soup=BeautifulSoup(r.text,'html.parser');(d/'article.txt').write_text(soup.get_text('\n',strip=True))
              links=[{'text':a.get_text(' ',strip=True),'url':urllib.parse.urljoin(base,a['href'])} for a in soup.select('a[href]')]
              (d/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2))
              figs=[{'text':f.get_text(' ',strip=True),'images':[dict(i.attrs) for i in f.select('img')]} for f in soup.select('figure')]
              (d/'figure-links.json').write_text(json.dumps(figs,ensure_ascii=False,indent=2))
              pdfs=[]
              meta=soup.find('meta',attrs={'name':'citation_pdf_url'})
              if meta:pdfs.append({'text':'Article PDF','url':meta.get('content')})
              pdfs += [x for x in links if '.pdf' in x['url'] and (('_reference.pdf' in x['url']) or 'MOESM1' in x['url'] or 'Supplementary Information' in x['text'])]
              if not any('/articles/' in x['url'] for x in pdfs):pdfs.insert(0,{'text':'Article PDF','url':base+'.pdf'})
              seen=set();pdfmap=[]
              for x in pdfs:
                  if x['url'] in seen or len(seen)>=3:continue
                  i=len(seen);seen.add(x['url']);p=d/f'document-{i}.pdf';res=get(x['url'],p)
                  if not res or not res.content.startswith(b'%PDF'):continue
                  doc=fitz.open(p);pdfmap.append({'file':p.name,'label':x['text'],'url':x['url'],'pages':len(doc)})
                  (d/f'document-{i}.txt').write_text('\n\n'.join(f'=== PAGE {n+1} ===\n'+page.get_text() for n,page in enumerate(doc)))
              (d/'pdfs.json').write_text(json.dumps(pdfmap,indent=2))
          (out/'retrieval.json').write_text(json.dumps(log,ensure_ascii=False,indent=2));print(json.dumps(log))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october-3-source-evidence
          path: oct03-evidence/
          retention-days: 7
