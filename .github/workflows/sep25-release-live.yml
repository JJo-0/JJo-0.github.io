name: September 25 live release verification
on:
  push:
    branches: [ops/sep25-release-live-20260926]
    paths: [.github/workflows/sep25-release-live.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        shell: bash
        working-directory: spaceship-ui
    env:
      JJO_SMOKE_BASE_URL: https://jjo-0.github.io/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60381f98c1d317f5e20331d87d03f0676ae691bd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify actual public documents and original figure bytes
        run: |
          mkdir -p sep25-review
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const base='https://jjo-0.github.io/';
          const edition=JSON.parse(fs.readFileSync('site/news-edition-20260925.json','utf8'));
          const figures=JSON.parse(fs.readFileSync('site/assets/assets/posts/news-20260925/figures.json','utf8')).figures;
          const receipt={base,checkedAt:new Date().toISOString(),source:'60381f98c1d317f5e20331d87d03f0676ae691bd',pages:[],figures:[]};
          for(const entry of edition.entries)for(const lang of ['ko','en']) {
            const path=lang==='ko'?`/posts/${entry.slug}/`:`/en/posts/${entry.enSlug}/`;
            const response=await fetch(new URL(path,base),{signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,200,path);
            const html=await response.text();
            assert(html.includes(`lang="${lang}"`),path+' language');
            assert(html.includes(`data-news-figure="${entry.mediaIds[0]}"`),path+' published content');
            assert(html.includes(`https://jjo-0.github.io${path}`),path+' canonical');
            assert(!html.includes('google-adsense-account'),path+' no article ads');
            receipt.pages.push({path,status:response.status,lang,bytes:Buffer.byteLength(html),sha256:createHash('sha256').update(html).digest('hex')});
          }
          for(const figure of figures) {
            const response=await fetch(new URL(figure.src,base),{signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,200,figure.src);
            const bytes=Buffer.from(await response.arrayBuffer());
            const sha256=createHash('sha256').update(bytes).digest('hex');
            assert.equal(sha256,figure.sha256,figure.src+' exact reviewed original');
            receipt.figures.push({path:figure.src,status:response.status,bytes:bytes.length,sha256});
          }
          fs.writeFileSync('sep25-review/live-http.json',JSON.stringify(receipt,null,2));
          console.log('LIVE HTTP: six documents and six original image hashes verified');
          JS
      - name: Native bilingual edition order, original images and citation navigation
        run: node scripts/browser-sep25.mjs
      - name: English article language switching, search and 404 recovery
        run: node scripts/browser-english-edition.mjs
      - name: Existing mobile idle and thumbnail regression
        run: node scripts/browser-mobile-performance.mjs
      - name: Record checked source and time
        if: always()
        run: |
          mkdir -p sep25-review
          git rev-parse HEAD > sep25-review/tested-sha.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > sep25-review/checked-at.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep25-live-release-${{ github.run_id }}
          path: |
            spaceship-ui/sep25-review/
            spaceship-ui/english-review/
            spaceship-ui/mobile-performance/
          retention-days: 7
