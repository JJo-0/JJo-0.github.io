name: Materialize Modern AI Part 1

on:
  push:
    branches:
      - agent/modern-ai-course-series
    paths:
      - spaceship-ui/scripts/modern-ai-part1.md.bz2
      - .github/workflows/materialize-modern-ai.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-course-series
          fetch-depth: 0

      - name: Decode and audit merged post
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import bz2
          import hashlib
          import re

          source = Path('spaceship-ui/scripts/modern-ai-part1.md.bz2')
          target = Path('spaceship-ui/site/content/posts/mordern-artificial-intelligence.md')
          data = bz2.decompress(source.read_bytes())

          expected_sha256 = '6e6d4a8b6b9e2080496a77cbf96aa362d8888cac7ebb102ed5921973390e1d45'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'content hash mismatch: {actual_sha256}')

          text = data.decode('utf-8')
          formula_ids = re.findall(r'<!-- formula:\s*([^>\s]+)\s*-->', text)
          if len(formula_ids) != 238:
              raise SystemExit(f'expected 238 formula markers, found {len(formula_ids)}')
          if len(set(formula_ids)) != 238:
              raise SystemExit('formula identifiers are not unique')
          if text.count('$$') != 476:
              raise SystemExit(f'expected 476 display-math delimiters, found {text.count("$$")}')
          if any(ord(ch) < 32 and ch not in '\n\r\t' for ch in text):
              raise SystemExit('unexpected control character in post')

          markers = list(re.finditer(r'<!-- formula:\s*([^>\s]+)\s*-->', text))
          for index, marker in enumerate(markers):
              end = markers[index + 1].start() if index + 1 < len(markers) else len(text)
              block = text[marker.end():end]
              if not re.match(r'\s*\$\$', block) or block.count('$$') < 2:
                  raise SystemExit(f'unbalanced formula block: {marker.group(1)}')

          target.write_bytes(data)
          print(f'materialized {target}: {len(formula_ids)} formulas, sha256={actual_sha256}')
          PY

      - name: Commit materialized Markdown
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui/site/content/posts/mordern-artificial-intelligence.md
          git rm spaceship-ui/scripts/modern-ai-part1.md.bz2
          git commit -m 'publish merged Modern AI part 1 with complete formula ledger'
          git push origin HEAD:agent/modern-ai-course-series
