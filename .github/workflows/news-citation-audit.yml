name: NEWS citation baseline audit
on:
  push:
    branches: [audit/news-citations-20260916]
    paths: [.github/workflows/news-citation-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 995304cdbf317e323f630e5517e3549e4c069def
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Build pinned production sources
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Snapshot and probe every NEWS article link
        shell: python
        run: |
          import concurrent.futures,datetime,hashlib,json,pathlib,re,subprocess,urllib.request,urllib.error,urllib.parse
          from html.parser import HTMLParser
          out=pathlib.Path('citation-audit'); out.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','-o',str(out/'source.tar.gz'),'HEAD'],check=True)
          (out/'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=0; self.article=False; self.skip=0; self.anchors=[]; self.ids=[]; self.text=[]; self.bare=[]; self.cards=[]; self.link=0
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if 'data-news-card' in a:self.cards.append(a['data-news-card'])
                  if t=='article':self.article=True
                  if not self.article:return
                  if t in ('code','pre','script','style'):self.skip+=1
                  if 'id' in a:self.ids.append(a['id'])
                  if t=='a':self.link+=1; self.anchors.append(a)
              def handle_endtag(self,t):
                  if t=='article':self.article=False
                  if not self.article:return
                  if t in ('code','pre','script','style'):self.skip=max(0,self.skip-1)
                  if t=='a':self.link=max(0,self.link-1)
              def handle_data(self,s):
                  if self.article and not self.skip:
                      self.text.append(s)
                      if not self.link:self.bare.extend(re.findall(r'\[\d+(?:\s*[,–-]\s*\d+)*(?:,\s*[A-Za-z][^\]\n]*)?\]',s))
          listing=Page();listing.feed(pathlib.Path('spaceship-ui/dist/news/index.html').read_text())
          urls=set(); articles=[]
          for slug in dict.fromkeys(listing.cards):
              html=pathlib.Path('spaceship-ui/dist/posts',slug,'index.html').read_text(); p=Page();p.feed(html)
              (out/(slug+'.html')).write_text(html)
              refs=[a.get('href','') for a in p.anchors]
              urls.update(h for h in refs if h.startswith(('https://','http://')))
              articles.append({'slug':slug,'bareNumericMarkers':p.bare,'hrefs':refs,'ids':p.ids})
          (out/'inventory.json').write_text(json.dumps({'sha':(out/'head.txt').read_text().strip(),'articles':articles},ensure_ascii=False,indent=2))
          print('NEWS posts',len(articles),'bare numeric markers',sum(len(p['bareNumericMarkers']) for p in articles),'unique external links',len(urls))
          def probe(url):
              row={'url':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; JJo-NEWS-link-audit/1.0)','Range':'bytes=0-131071'})
                  with urllib.request.urlopen(request,timeout=18) as r:
                      data=r.read(131072); text=data.decode('utf-8','replace'); title=re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I)
                      row.update(status=r.status,finalUrl=r.url,contentType=r.headers.get('content-type',''),title=re.sub('<[^>]+>','',title[1]).strip() if title else None,sha256Prefix=hashlib.sha256(data).hexdigest())
                      row['state']='restricted' if re.search(r'<title[^>]*>[^<]*(?:Just a moment|Access Denied|Robot|Security Check)',text,re.I) else 'responded'
              except urllib.error.HTTPError as e:row.update(status=e.code,finalUrl=e.url,state='restricted' if e.code in (401,403,429) else 'http-error')
              except Exception as e:row.update(status=None,state='unavailable',errorType=type(e).__name__)
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: results=list(pool.map(probe,sorted(urls)))
          (out/'external-links.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('Link states', {s:sum(r['state']==s for r in results) for s in {r['state'] for r in results}})
          for r in results:
              if r['state']!='responded':print(r['state'],r['status'],r['url'])
      - uses: actions/upload-artifact@v4
        with:
          name: news-citation-baseline
          path: citation-audit/
          retention-days: 14
