name: Self-Improving lessons reading
on:
  pull_request:
    branches: [main]
    paths:
      - 'spaceship-ui/site/content/posts/self-improving-ai-*.mdx'
      - 'spaceship-ui/site/assets/assets/posts/self-improving-ai-*/**'
      - 'spaceship-ui/src/components/GroupedWritingList.astro'
      - 'spaceship-ui/src/components/SeriesNavigation.astro'
      - 'spaceship-ui/src/components/SelfImprovingSeriesMap.astro'
      - 'spaceship-ui/src/data/self-improving-series.json'
      - 'spaceship-ui/src/lib/self-improving-series.ts'
      - 'spaceship-ui/scripts/browser-self-improving-audit.mjs'
      - 'docs/self-improving-ai/source-assets/**/manifest.json'
      - 'docs/self-improving-ai/source-assets/**/supplementary-manifest.json'
      - 'docs/self-improving-ai/reviews/verify_examples_*.py'
      - '.github/workflows/self-improving-reading.yml'
  workflow_run:
    workflows: ['Deploy Blog to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional deployed site URL; blank tests the local production build'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: self-improving-reading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install dependencies and Korean fonts
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify chapter 06 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_06.py
      - name: Verify chapter 07 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_07.py
      - name: Verify chapter 08 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_08.py
      - name: Verify chapter 09 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_09.py
      - name: Verify chapter 10 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_10.py
      - name: Verify chapter 11 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_11.py
      - name: Verify chapter 12 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_12.py
      - name: Verify chapter 13 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_13.py
      - name: Verify chapter 14 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_14.py
      - name: Verify chapter 15 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_15.py
      - name: Verify chapter 16 numerical examples
        run: python3 ../docs/self-improving-ai/reviews/verify_examples_16.py
      - name: Production build
        if: github.event_name != 'workflow_run'
        run: pnpm build
      - name: Verify figures, math, navigation, disclosures and series heading
        env:
          JJO_SELF_IMPROVING_ARTIFACTS: self-improving-audit
          JJO_SMOKE_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://jjo-0.github.io' || github.event_name == 'workflow_dispatch' && inputs.base_url || '' }}
        run: node scripts/browser-self-improving-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: self-improving-reading-${{ github.run_id }}
          path: spaceship-ui/self-improving-audit/
          retention-days: 14
