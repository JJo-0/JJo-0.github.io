name: September 15 licensed background media
on:
  push:
    branches: [content/news-20260915-biosensing-candidates]
    paths: [.github/workflows/news-20260915-background-media.yml]
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260915-biosensing-candidates
      - name: Verify CC BY 4.0 and collect original figures
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 Pillow==12.3.0
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import os,json,hashlib,io,subprocess
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          root=Path('spaceship-ui/site/assets/assets/posts/news-20260915')
          root.mkdir(parents=True,exist_ok=True)
          out=Path(os.environ['RUNNER_TEMP'])/'news-sep15-background';out.mkdir()
          sources=[('nanopore-background','https://www.nature.com/articles/s41467-024-46303-x','Fan et al. (2024)'),('apoe-background','https://www.nature.com/articles/s41588-022-01024-z','Bellenguez et al. (2022)'),('mos2-background','https://www.nature.com/articles/s41598-020-68793-7','Bhattacharjee et al. (2020)')]
          session=requests.Session();rows=[]
          def fetch(url):
              assert urlparse(url).scheme=='https' and urlparse(url).hostname in {'www.nature.com','media.springernature.com'},url
              r=session.get(url,timeout=60);r.raise_for_status();assert len(r.content)<20000000;return r.content
          for key,url,credit in sources:
              data=fetch(url);soup=BeautifulSoup(data,'html.parser')
              text=soup.get_text('\n',strip=True)
              assert soup.select_one('a[href="http://creativecommons.org/licenses/by/4.0/"]') or soup.select_one('a[href="https://creativecommons.org/licenses/by/4.0/"]'),'CC BY 4.0 not found: '+url
              (out/f'{key}.html').write_bytes(data);(out/f'{key}.txt').write_text(text)
              figures=[f for f in soup.select('figure') if f.select_one('b[id^="Fig"]') and f.select_one('img')][:2]
              assert len(figures)==2
              for index,fig in enumerate(figures,1):
                  link=fig.select_one('a[href*="/figures/"]');assert link
                  figure_url=urljoin(url,link['href'])
                  fpage=BeautifulSoup(fetch(figure_url),'html.parser')
                  original=next((urljoin(figure_url,a['href']) for a in fpage.select('a[href]') if 'media.springernature.com/full/' in a['href']),None)
                  if original is None:
                      image=fpage.select_one('figure img') or fpage.select_one('img[src*="Fig"]');assert image
                      original=urljoin(figure_url,image['src'])
                  original_data=fetch(original)
                  im=Image.open(io.BytesIO(original_data));im.load();assert im.width>=600
                  im=im.convert('RGB');im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
                  target=root/f'{key}-fig{index}.webp'
                  im.save(target,'WEBP',quality=88,method=6)
                  caption=fig.get_text(' ',strip=True)
                  rows.append({'id':f'{key}-fig{index}','role':'related-primary-research-background-not-2026-result','credit':credit,'source':url,'figureUrl':figure_url,'originalImageUrl':original,'sourceHtmlSha256':hashlib.sha256(data).hexdigest(),'originalImageSha256':hashlib.sha256(original_data).hexdigest(),'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'src':'/assets/posts/news-20260915/'+target.name,'width':im.width,'height':im.height,'bytes':target.stat().st_size,'license':'CC BY 4.0','rights':'https://creativecommons.org/licenses/by/4.0/','changes':'Proportional resize and WebP conversion only; no panel, label or data removed.','originalCaption':caption})
                  (out/f'{key}-fig{index}-original.bin').write_bytes(original_data)
          (root/'provenance.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          (out/'provenance.json').write_bytes((root/'provenance.json').read_bytes())
          subprocess.run(['git','add','--',str(root)],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','media: add six licensed background figures for September 15 NEWS (#117)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260915-biosensing-candidates'],check=True)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: news-sep15-licensed-background
          path: ${{ runner.temp }}/news-sep15-background
          retention-days: 14
