name: Fix Modern AI Part II formula client script once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
    paths:
      - .github/workflows/fix-modern-ai-part2-sourceformula-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0

      - name: Replace the blanket TypeScript suppression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spaceship-ui/src/components/post/SourceFormula.astro')
          text = path.read_text(encoding='utf-8')

          old_header = """<script>\n  // @ts-nocheck\n  document.addEventListener('click', async (event) => {"""
          new_header = """<script>\n  const trackFormulaEvent = (eventName, params) => {\n    const gtag = Reflect.get(window, 'gtag');\n    if (typeof gtag === 'function') {\n      Reflect.apply(gtag, window, ['event', eventName, params]);\n    }\n  };\n\n  document.addEventListener('click', async (event) => {"""

          old_copy = """      if (typeof window.gtag === 'function') {\n        window.gtag('event', 'formula_copy', {\n          formula_id: button.closest('[data-formula-id]')?.getAttribute('data-formula-id') || '',\n        });\n      }"""
          new_copy = """      trackFormulaEvent('formula_copy', {\n        formula_id: button.closest('[data-formula-id]')?.getAttribute('data-formula-id') || '',\n      });"""

          old_toggle = """    if (card && typeof window.gtag === 'function') {\n      window.gtag('event', 'formula_explanation_open', {\n        formula_id: card.getAttribute('data-formula-id') || '',\n      });\n    }"""
          new_toggle = """    if (card) {\n      trackFormulaEvent('formula_explanation_open', {\n        formula_id: card.getAttribute('data-formula-id') || '',\n      });\n    }"""

          for old, new, label in [
              (old_header, new_header, 'script header'),
              (old_copy, new_copy, 'copy analytics block'),
              (old_toggle, new_toggle, 'toggle analytics block'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one {label}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          if '@ts-nocheck' in text:
              raise SystemExit('blanket TypeScript suppression remains')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove the one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-modern-ai-part2-sourceformula-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: type formula analytics without blanket suppression'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
