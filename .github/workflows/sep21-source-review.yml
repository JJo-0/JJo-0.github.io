name: Sep21 source review
on:
  push:
    branches: [ops/sep21-source-review]
    paths: [.github/workflows/sep21-source-review.yml]
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/ops/sep21-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5 Pillow==11.3.0
      - name: Capture exact primary article text and original figure bytes
        run: |
          python - <<'PY'
          import hashlib,json,requests,time
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          import io
          out=Path('sep21-evidence');out.mkdir()
          papers={
            'msvd':('https://www.nature.com/articles/s41467-026-76272-2',[2,4,7]),
            'fiber':('https://www.nature.com/articles/s41467-026-77550-9',[1,2,3,4,5]),
            'erled':('https://www.nature.com/articles/s41467-026-77851-z',[1,2,3,4,5]),
          }
          session=requests.Session();session.headers['User-Agent']='Mozilla/5.0 scholarly-source-review'
          for key,(url,wanted) in papers.items():
            root=out/key;root.mkdir()
            for attempt in range(3):
              r=session.get(url,timeout=(15,60))
              if r.ok and len(r.content)>10000: break
              time.sleep(2)
            r.raise_for_status();html=r.content
            (root/'article.html').write_bytes(html)
            soup=BeautifulSoup(html,'html.parser')
            main=soup.select_one('article') or soup.select_one('main') or soup
            (root/'article.txt').write_text(main.get_text('\n',strip=True))
            records=[]
            for fig in main.select('figure'):
              fid=fig.get('id','')
              import re
              m=re.search(r'Fig(\d+)',fid)
              if not m: continue
              n=int(m.group(1))
              caption=fig.get_text(' ',strip=True)
              imgs=fig.select('img')
              links=[urljoin(url,a.get('href','')) for a in fig.select('a[href]')]
              rec={'figure':n,'id':fid,'caption':caption,'links':links,'images':[]}
              for im in imgs:
                src=urljoin(url,im.get('src',''))
                rec['images'].append({'src':src,'alt':im.get('alt',''),'srcset':im.get('srcset','')})
              records.append(rec)
              if n in wanted and imgs:
                src=urljoin(url,imgs[0].get('src',''))
                if 'media.springernature.com' in src and '/lw' in src:
                  suffix=src.split('/springer-static/',1)[-1]
                  src='https://media.springernature.com/full/springer-static/'+suffix
                rr=session.get(src,timeout=(15,90));rr.raise_for_status();data=rr.content
                image=Image.open(io.BytesIO(data));image.load()
                ext='png' if image.format=='PNG' else 'jpg'
                name=f'fig-{n}.{ext}'
                (root/name).write_bytes(data)
                thumb=image.copy();thumb.thumbnail((1600,1800));thumb.convert('RGB').save(root/f'fig-{n}-review.jpg',quality=91)
                rec['saved']={'file':name,'url':src,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'format':image.format,'width':image.width,'height':image.height}
            (root/'figures.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
            (root/'receipt.json').write_text(json.dumps({'url':url,'sha256':hashlib.sha256(html).hexdigest(),'bytes':len(html),'wanted':wanted},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sep21-source-evidence
          path: sep21-evidence/
          retention-days: 5
          if-no-files-found: error
