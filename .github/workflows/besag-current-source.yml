name: Besag verified archive
on:
  push:
    branches: [ops/paper-final-figures-20260917]
    paths: [.github/workflows/besag-current-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - name: Read original Besag paper and selected printed pages
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          import fitz
          out=Path('besag');out.mkdir()
          url='https://www2.stat.duke.edu/~scs/Courses/Stat376/Papers/GibbsFieldEst/BesagDirtyPicsJRSSB1986.pdf'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as response:data=response.read();resolved=response.url
          assert data.startswith(b'%PDF-')
          doc=fitz.open(stream=data,filetype='pdf')
          (out/'besag.pdf').write_bytes(data)
          (out/'text.txt').write_text('\n\n'.join('PAGE '+str(i+1)+'\n'+p.get_text() for i,p in enumerate(doc)))
          (out/'source.json').write_text(json.dumps({'url':url,'resolved':resolved,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'pages':len(doc)},indent=2))
          for page in [2,5,8,9,10,11,12]:
              p=doc[page-1]
              p.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(out/f'page-{page}.png')
              (out/f'page-{page}.json').write_text(json.dumps({'rect':list(p.rect),'blocks':p.get_text('blocks')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: besag-verified-original
          path: besag/
          retention-days: 7
