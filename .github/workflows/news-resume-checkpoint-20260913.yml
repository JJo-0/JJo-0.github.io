name: NEWS resume checkpoint 20260913
on:
  push:
    branches: [content/news-depth-english-20260912]
    paths: [.github/workflows/news-resume-checkpoint-20260913.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover data only and record current main
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/news-resume-checkpoint"
          git fetch --no-tags origin main
          git archive --format=tar.gz origin/main > "$RUNNER_TEMP/news-resume-checkpoint/main.tar.gz"
          git diff --name-status 5c07acd69fe8d569ed5c7cea9895794ff8400973 origin/main > "$RUNNER_TEMP/news-resume-checkpoint/main-changes.txt"
          git diff 5c07acd69fe8d569ed5c7cea9895794ff8400973 origin/main > "$RUNNER_TEMP/news-resume-checkpoint/main-changes.diff"
          python - <<'PY'
          from pathlib import Path
          import os,base64,lzma,json,hashlib,subprocess
          out=Path(os.environ['RUNNER_TEMP'])/'news-resume-checkpoint'
          files=sorted(Path('.github/news-depth-transfer-20260913').glob('part-*.b64'))
          text=''.join(p.read_text().strip() for p in files)
          compressed=base64.b64decode(text,validate=True)
          decoder=lzma.LZMADecompressor()
          partial=decoder.decompress(compressed,max_length=3000000)
          (out/'partial.diff').write_bytes(partial)
          meta={'branchHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'mainHead':subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(),'parts':[{'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],'decompressedBytes':len(partial),'completeStream':decoder.eof,'partialSha256':hashlib.sha256(partial).hexdigest()}
          (out/'recovery.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: news-resume-checkpoint-20260913
          path: ${{ runner.temp }}/news-resume-checkpoint
          retention-days: 14
