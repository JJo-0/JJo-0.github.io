name: Patch legacy migration callback

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - name: Patch callback counter
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/legacy-content-migration.yml
          sed -i 's/^              replacements = 0$/              replacements = [0]/' "$f"
          sed -i '/^                  nonlocal replacements$/d' "$f"
          sed -i 's/^                      replacements += 1$/                      replacements[0] += 1/' "$f"
          sed -i 's/^              if replacements:$/              if replacements[0]:/' "$f"
      - name: Commit repair
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/legacy-content-migration.yml
          git commit -m 'fix: patch legacy migration callback counter'
          git push origin HEAD:agent/legacy-content-finalize
