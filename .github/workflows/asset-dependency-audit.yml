name: Asset dependency audit

on:
  push:
    branches: [agent/asset-dependency-quality]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Install and baseline build
        working-directory: spaceship-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm build
          pnpm content:check

      - name: Audit large assets and lossless PNG opportunity
        working-directory: spaceship-ui
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, io, re

          root = Path('.')
          assets = root / 'site/assets'
          posts = root / 'site/content/posts'

          sources = {}
          for p in list(posts.rglob('*.md')) + list(posts.rglob('*.mdx')):
              sources[p] = p.read_text(encoding='utf-8')

          print('=== LARGE ASSET INVENTORY >=100KiB ===')
          large=[]
          for p in sorted([x for x in assets.rglob('*') if x.is_file()], key=lambda x:x.stat().st_size, reverse=True):
              if p.stat().st_size < 100*1024:
                  break
              public='/' + p.relative_to(assets).as_posix()
              refs=[str(src) for src,text in sources.items() if public in text or p.name in text]
              large.append((p.stat().st_size, public, refs))
              print(f'{p.stat().st_size:>10} {public} refs={len(refs)} {refs[:4]}')

          target = posts / '2025-11-08.md'
          text = target.read_text(encoding='utf-8')
          refs=[]
          for match in re.finditer(r'/assets/posts/[^\s)"\'<>]+\.png', text, re.I):
              ref=match.group(0)
              if ref not in refs:
                  refs.append(ref)
          print(f'=== DRL_REFERENCED_PNGS count={len(refs)} ===')

          before_total=0
          after_total=0
          improved=0
          for ref in refs:
              src=assets / ref.lstrip('/')
              if not src.exists():
                  raise SystemExit(f'missing referenced PNG: {ref}')
              before=src.stat().st_size
              with Image.open(src) as im:
                  rgba=im.convert('RGBA')
                  pixel_hash=hashlib.sha256(rgba.tobytes()).hexdigest()
                  dims=im.size
                  mode=im.mode
                  out=io.BytesIO()
                  im.save(out, format='PNG', optimize=True, compress_level=9)
                  candidate=out.getvalue()
              with Image.open(io.BytesIO(candidate)) as after_im:
                  after_hash=hashlib.sha256(after_im.convert('RGBA').tobytes()).hexdigest()
                  if after_im.size != dims or after_hash != pixel_hash:
                      raise SystemExit(f'pixel mismatch after lossless trial: {ref}')
              after=len(candidate)
              before_total += before
              after_total += after
              if after < before:
                  improved += 1
              print(f'{ref} before={before} after={after} delta={after-before} mode={mode} dims={dims} pixels={pixel_hash[:12]}')

          delta=after_total-before_total
          pct=(100.0*(before_total-after_total)/before_total) if before_total else 0
          print(f'PNG_TRIAL before={before_total} after={after_total} saved={before_total-after_total} pct={pct:.2f} improved={improved}/{len(refs)}')
          print('PNG_PIXEL_IDENTITY=PASS')
          PY

      - name: Audit direct dependencies and test suspicious Rollup pin removal
        shell: bash
        run: |
          set -euo pipefail
          cd spaceship-ui
          python - <<'PY'
          from pathlib import Path
          import json, re

          pkg=json.loads(Path('package.json').read_text())
          scan=[]
          for root in ['src','site','scripts']:
              for p in Path(root).rglob('*'):
                  if p.is_file() and p.suffix in {'.astro','.svelte','.ts','.js','.mjs','.md','.mdx','.css'}:
                      try: scan.append((p,p.read_text(encoding='utf-8')))
                      except UnicodeDecodeError: pass
          for extra in ['astro.config.mjs','eslint.config.js','lefthook.yml']:
              p=Path(extra)
              if p.exists(): scan.append((p,p.read_text(encoding='utf-8')))

          print('=== DIRECT DEPENDENCY SOURCE REFERENCES ===')
          for section in ['dependencies','devDependencies']:
              for dep in sorted(pkg.get(section,{})):
                  refs=[]
                  for p,text in scan:
                      if dep in text:
                          refs.append(str(p))
                  scripts=[name for name,cmd in pkg.get('scripts',{}).items() if dep.split('/')[-1] in cmd or dep in cmd]
                  print(f'{section} {dep}: source_refs={len(refs)} {refs[:5]} scripts={scripts}')
          PY

          cd ..
          rm -rf /tmp/blog-rollup-test
          cp -a spaceship-ui /tmp/blog-rollup-test
          cd /tmp/blog-rollup-test
          rm -rf node_modules dist
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json')
          data=json.loads(p.read_text())
          removed=data.get('devDependencies',{}).pop('@rollup/rollup-darwin-arm64', None)
          if removed is None:
              raise SystemExit('direct @rollup/rollup-darwin-arm64 dependency not found')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          print('REMOVED_DIRECT_ROLLUP_PIN=', removed)
          PY
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm build
          pnpm content:check
          echo 'ROLLUP_DIRECT_PIN_REMOVAL_TRIAL=PASS'
