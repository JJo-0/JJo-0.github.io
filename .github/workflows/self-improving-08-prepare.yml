name: Temporary Self-Improving 08 preparation
on:
  push:
    branches: ['content/self-improving-ai-08']
    paths: ['.github/workflows/self-improving-08-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/self-improving-ai-08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render exact reviewed sources and integrate chapter 08
        run: |
          python -m pip install PyMuPDF==1.26.7
          python docs/self-improving-ai/tools/render_08.py
          python docs/self-improving-ai/reviews/verify_examples_08.py --output docs/self-improving-ai/reviews/numeric-checks-08.json
          python docs/self-improving-ai/tools/prepare_08.py
          node --check spaceship-ui/scripts/browser-self-improving-audit.mjs
          python scripts/normalize_tags_current.py --check
      - name: Commit only scoped content changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/self-improving-ai/source-assets/08/ docs/self-improving-ai/reviews/numeric-checks-08.json docs/self-improving-ai/reviews/2026-11-18-chapter-08-preparation.json docs/self-improving-ai/publishing/2026-11-18-chapter-08-request.json docs/self-improving-ai/drafts/08-RESUME.md docs/self-improving-ai/progress.json scripts/normalize_tags_current.py spaceship-ui/scripts/browser-self-improving-audit.mjs spaceship-ui/site/content/posts/self-improving-ai-07-unsupervised-rlvr-and-test-time-training.mdx spaceship-ui/site/assets/assets/posts/self-improving-ai-08-entropy-estimation-and-gradients/
          git diff --cached --stat
          git commit -m 'content: integrate chapter 08 reviewed figures, transcript and navigation'
          git push origin HEAD:content/self-improving-ai-08
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: self-improving-08-rendered
          path: |
            spaceship-ui/site/assets/assets/posts/self-improving-ai-08-entropy-estimation-and-gradients/
            docs/self-improving-ai/source-assets/08/
            docs/self-improving-ai/reviews/*08*
            /tmp/chapter08-integration.tar.gz
          retention-days: 7
