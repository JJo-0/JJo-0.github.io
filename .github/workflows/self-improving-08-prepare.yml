name: Temporary Self-Improving 08 preparation
on:
  push:
    branches: ['content/self-improving-ai-08']
    paths: ['.github/workflows/self-improving-08-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve original sources and current repository text
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          import hashlib,json,tarfile
          out=Path('/tmp/chapter08-sources');out.mkdir()
          sources={
            'rethinking':'https://arxiv.org/pdf/2605.08186v1',
            'berkeley':'https://rail.eecs.berkeley.edu/deeprlcourse/static/slides/lec-5.pdf',
            'stanford':'https://web.stanford.edu/class/ee376a/files/2017-18/lecture_3.pdf',
            'ntu':'https://speech.ee.ntu.edu.tw/~hylee/ml/ml2026-course-data/Self-Improving.pdf'
          }
          def fetch(item):
            key,url=item
            with urlopen(Request(url,headers={'User-Agent':'JJo-source-review/1.0'}),timeout=60) as r: data=r.read(80000001)
            assert data.startswith(b'%PDF') and len(data)<80000000
            (out/(key+'.pdf')).write_bytes(data)
            return key,{'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          records=dict(ThreadPoolExecutor(4).map(fetch,sources.items()))
          (out/'sources.json').write_text(json.dumps(records,indent=2))
          files=['CONTENT_POLICY.md','docs/self-improving-ai/progress.json','docs/self-improving-ai/tools/render_07.py','spaceship-ui/scripts/browser-self-improving-audit.mjs','.github/workflows/self-improving-reading.yml','spaceship-ui/site/content/posts/self-improving-ai-07-unsupervised-rlvr-and-test-time-training.mdx','scripts/normalize_tags_current.py','spaceship-ui/src/components/post/LearningFigure.astro','spaceship-ui/src/components/post/Math.astro','spaceship-ui/package.json']
          with tarfile.open(out/'repository-text.tar.gz','w:gz') as t:
            for p in files: t.add(p,arcname=p)
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-improving-08-sources
          path: /tmp/chapter08-sources/
          retention-days: 3
