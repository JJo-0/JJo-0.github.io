name: Sep22 beginner guide publish repair
on:
  push:
    branches: [ops/sep22-beginner-guide]
    paths: [.github/workflows/sep22-beginner-guide.yml]
permissions:
  contents: write
jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/sep22-beginner-visual-guides
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with: {version: 10.19.0}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Refresh exact Sep22 source identities
        working-directory: spaceship-ui
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const manifest='site/news-edition-20260922.json';
          const edition=JSON.parse(fs.readFileSync(manifest,'utf8'));
          const bodyText=source=>source.split('---').slice(2).join('---').split(/^## 9\. /m)[0]
            .replace(/^import .*?;\s*/gm,'').replace(/<Math\b[\s\S]*?\/>/g,'')
            .replace(/<CandidateEquation\b[^\n]+>/g,'').replace(/<[^>]*>/g,' ')
            .replace(/\[\d+\]/g,'').replace(/[*#|`>]+/g,'').replace(/\s+/g,' ').trim();
          for(const e of edition.entries){
            const p=`site/content/posts/${e.slug}.mdx`;
            const s=fs.readFileSync(p,'utf8');
            e.sha256=crypto.createHash('sha256').update(s).digest('hex');
            e.bodyCharacters=bodyText(s).length;
          }
          fs.writeFileSync(manifest,JSON.stringify(edition,null,2)+'\n');
          NODE
      - name: Dependencies and Korean fonts
        working-directory: spaceship-ui
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Full source and site checks
        working-directory: spaceship-ui
        env:
          JJO_SMOKE_REQUIRE_GPU: '0'
        run: |
          pnpm taxonomy:check
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm blog:harness:check
          node scripts/news-edition-20260922-contract.mjs
          pnpm build
          pnpm content:check
          node scripts/news-edition-20260922-contract.mjs
          node scripts/browser-sep22.mjs
      - name: Commit only the verified manifest refresh
        run: |
          git config user.name "Park Jiho"
          git config user.email "76779256+JJo-0@users.noreply.github.com"
          git add spaceship-ui/site/news-edition-20260922.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "content: register Sep22 beginner visual guides"
            git push origin HEAD:content/sep22-beginner-visual-guides
          fi
