name: One-time experience foundation merge gate

on:
  push:
    branches: [agent/experience-motion-foundation-phase123]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experience-motion-foundation-phase123
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: spaceship-ui
        run: pnpm lint
      - name: Type check
        working-directory: spaceship-ui
        run: pnpm check
      - name: SEO metadata check
        working-directory: spaceship-ui
        run: pnpm seo:check
      - name: Production build
        working-directory: spaceship-ui
        run: pnpm build
      - name: Content, runtime, math, and experience contracts
        working-directory: spaceship-ui
        run: pnpm content:check
      - name: Remove one-time merge gate
        shell: bash
        run: |
          rm -f .github/workflows/experience-automerge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time experience merge gate"
            git push origin HEAD:agent/experience-motion-foundation-phase123
          fi
      - name: Squash merge validated PR and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/experience-motion-foundation-phase123 --state open --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open PR found for experience branch" >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "feat: add progressive motion and editorial portfolio foundation" \
            --body "Add the first production slice of the JJo Experience Engine: editorial homepage/research layouts, scoped GSAP motion, reduced-motion support, root View Transitions, and a fail-closed experience contract."
