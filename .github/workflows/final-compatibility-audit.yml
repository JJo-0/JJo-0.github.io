name: Final compatibility audit

on:
  push:
    branches: [agent/final-compatibility-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile

      - name: Audit remaining compatibility surfaces
        working-directory: spaceship-ui
        shell: bash
        run: |
          set -euo pipefail

          echo '=== canonical code fence gate ==='
          if git grep -nE '^```(C|pseudocode|C\+\+|c\+\+)[[:space:]]*$' -- 'site/content/posts/*.md' 'site/content/posts/*.mdx'; then
            echo 'noncanonical Shiki fence id remains' >&2
            exit 1
          fi

          echo '=== no Shiki content compatibility aliases ==='
          if grep -n 'langAlias' astro.config.mjs; then
            echo 'Shiki langAlias compatibility block remains' >&2
            exit 1
          fi

          echo '=== removed global content shims stay removed ==='
          for token in restoreLegacyHtml fixLegacyFragments remarkRepairLiteralStrong; do
            if grep -n "$token" astro.config.mjs; then
              echo "obsolete content shim remains in config: $token" >&2
              exit 1
            fi
          done

          echo '=== retired /image source stays retired ==='
          test ! -d site/assets/image
          if git grep -n '/image/' -- 'site/content/**' 'src/**'; then
            echo 'retired /image source reference remains' >&2
            exit 1
          fi

          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check

      - name: Compare main and proposed post semantics outside code highlighting
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git worktree add --detach /tmp/blog-main origin/main

          cd /tmp/blog-main/spaceship-ui
          pnpm install --frozen-lockfile
          if ! pnpm exec astro build >/tmp/main-build.log 2>&1; then
            cat /tmp/main-build.log
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/spaceship-ui"
          python - <<'PY'
          from pathlib import Path
          import re

          main_root = Path('/tmp/blog-main/spaceship-ui/dist/posts')
          proposed_root = Path('dist/posts')
          expected_changed = {
              '2023-07-11-2023-07-11/index.html',
              '2023-07-12-2023-07-11-2/index.html',
          }
          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S | re.I)
          pre_re = re.compile(r'<pre\b[^>]*>.*?</pre>', re.S | re.I)

          def post_files(root):
              out = {}
              for p in root.glob('*/index.html'):
                  text = p.read_text(encoding='utf-8')
                  if article_re.search(text):
                      out[p.relative_to(root).as_posix()] = p
              return out

          def article_without_pre(path):
              text = path.read_text(encoding='utf-8')
              article = article_re.search(text)
              if not article:
                  raise RuntimeError(f'no article in {path}')
              return pre_re.sub('<pre data-audit="code-block" />', article.group(0))

          before = post_files(main_root)
          after = post_files(proposed_root)
          if set(before) != set(after):
              raise SystemExit('published post route set changed')

          full_diffs = []
          outside_pre_diffs = []
          for rel in sorted(before):
              if before[rel].read_bytes() != after[rel].read_bytes():
                  full_diffs.append(rel)
              if article_without_pre(before[rel]) != article_without_pre(after[rel]):
                  outside_pre_diffs.append(rel)

          print('FULL_HTML_CHANGED_ROUTES=', full_diffs)
          print('ARTICLE_OUTSIDE_PRE_CHANGED_ROUTES=', outside_pre_diffs)
          if set(full_diffs) != expected_changed:
              raise SystemExit(f'unexpected full HTML changes: {full_diffs}')
          if outside_pre_diffs:
              raise SystemExit(f'content outside code highlighting changed: {outside_pre_diffs}')

          for rel in expected_changed:
              html = after[rel].read_text(encoding='utf-8')
              article = article_re.search(html).group(0)
              langs = re.findall(r'<pre\b[^>]*data-language="([^"]+)"', article)
              print(rel, 'code_languages=', langs)
              if 'cpp' not in langs:
                  raise SystemExit(f'{rel}: canonical cpp highlighting missing')
              if any(lang in {'C', 'c++', 'C++'} for lang in langs):
                  raise SystemExit(f'{rel}: noncanonical C++ language remains: {langs}')

          print('FINAL_COMPATIBILITY_AUDIT=PASS')
          PY
