name: Apply verified legacy finalization

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply source materialization
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d site/assets/image && ! -f src/lib/remark-repair-literal-strong.mjs && ! -f src/lib/remark/restore-legacy-html.mjs && ! -f src/lib/rehype/fix-legacy-fragments.mjs ]]; then
            echo 'Legacy finalization already applied.'
            exit 0
          fi

          node scripts/_legacy-finalize-migration-v5.mjs

          rm -rf dist .astro
          pnpm exec astro build
          node scripts/rendered-markdown-audit.mjs
          node scripts/post-content-contract.mjs
          node scripts/content-integrity.mjs
          node scripts/modern-ai-formula-audit.mjs

          test ! -d site/assets/image
          test ! -f src/lib/remark-repair-literal-strong.mjs
          test ! -f src/lib/remark/restore-legacy-html.mjs
          test ! -f src/lib/rehype/fix-legacy-fragments.mjs
          ! grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist '/image/' site/content src | grep .
          ! grep -RIl '/image/' dist | grep .
          ! grep -nE 'restoreLegacyHtml|fixLegacyFragments|remarkRepairLiteralStrong' astro.config.mjs

      - name: Commit only production source changes
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A \
            spaceship-ui/astro.config.mjs \
            spaceship-ui/site \
            spaceship-ui/src

          echo '=== staged production changes ==='
          git diff --cached --stat
          git status --short

          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi

          git commit -m 'refactor: materialize legacy content sources'
          git push origin HEAD:agent/legacy-content-finalize
