name: I18n resume probe
on:
  push:
    branches: [content/news-depth-english-20260912]
    paths: [.github/workflows/i18n-resume-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect pinned merge without changing any remote ref
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 995304cdbf317e323f630e5517e3549e4c069def || true
          python3 - <<'PY'
          import pathlib, subprocess, re
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          print('CONFLICTS', conflicts)
          for name in conflicts:
              text=pathlib.Path(name).read_text()
              for match in re.finditer(r'(?ms)^<<<<<<< .*?^>>>>>>> .*?$',text):
                  print('CONFLICT',name,'\n',match.group(0))
          print('ARTICLE INVENTORY: file | chars | lang | title')
          for p in sorted(pathlib.Path('spaceship-ui/site/content/posts').rglob('*')):
              if p.suffix not in ('.md','.mdx'): continue
              t=p.read_text(); header=t.split('---',2)[1] if t.startswith('---') else ''
              def field(k):
                  m=re.search(r'^'+k+r':\s*(.*)',header,re.M); return m.group(1) if m else ''
              print(p.name, len(t),field('lang'),field('title'),sep=' | ')
          PY
      - name: Export source snapshot for local text and translation checks
        run: |
          mkdir -p /tmp/i18n-source
          git archive HEAD | tar -x -C /tmp/i18n-source
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-source-snapshot
          path: /tmp/i18n-source
          include-hidden-files: true
          retention-days: 7
