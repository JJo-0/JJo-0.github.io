name: September 16 publication proofreading
on:
  push:
    branches: [content/news-20260916-hydrogen-candidates]
    paths: [.github/workflows/news-20260916-proofread.yml]
permissions:
  contents: write
jobs:
  proofread:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260916-hydrogen-candidates
      - name: Preserve prose while correcting citation and markup
        shell: python
        run: |
          from pathlib import Path
          import hashlib,re,json,subprocess
          manifest=Path('spaceship-ui/site/news-edition-20260916.json')
          edition=json.loads(manifest.read_text());paths=[]
          for entry in edition['entries']:
              p=Path('spaceship-ui/site/content/posts')/(entry['slug']+'.mdx')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==entry['postSha256']
              text=p.read_text()
              if entry['key']=='oect':
                  assert text.count('[1] Dong et al.,')==1
                  text=text.replace('[1] Dong et al.,','[1] Deng et al.,')
                  old='[2] 같은 논문의 Supplementary Information, 34쪽.'
                  new='[2] 같은 논문의 [Supplementary Information, 34쪽](https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41928-026-01708-y/MediaObjects/41928_2026_1708_MOESM1_ESM.pdf).'
                  assert text.count(old)==1;text=text.replace(old,new)
              text=re.sub(r'\*\*([^\n]+?)\*\*',r'<strong>\1</strong>',text)
              p.write_text(text);entry['postSha256']=hashlib.sha256(p.read_bytes()).hexdigest();paths.append(str(p))
          edition['proofreading']=['OECT first author corrected to Deng as stated by the publisher. Supplementary PDF linked directly.','Korean emphasis uses semantic strong tags; scientific prose and counted length are unchanged.']
          manifest.write_text(json.dumps(edition,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['node','scripts/news-20260916-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['node','scripts/post-content-contract.mjs'],cwd='spaceship-ui',check=True)
          subprocess.run(['git','add','--',str(manifest),*paths],check=True)
          subprocess.run(['git','rm','.github/workflows/news-20260916-proofread.yml'],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','fix: correct Deng citation and preserve explicit Korean emphasis for September 16 (#120)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260916-hydrogen-candidates'],check=True)
          print('PROOFREAD HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
