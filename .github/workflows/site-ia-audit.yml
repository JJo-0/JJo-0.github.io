name: Site IA quality audit

on:
  push:
    branches: [agent/site-ia-quality-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Install
        working-directory: spaceship-ui
        run: pnpm install --frozen-lockfile

      - name: Quality and build
        working-directory: spaceship-ui
        run: |
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check

      - name: Audit source, assets and generated IA
        working-directory: spaceship-ui
        shell: bash
        run: |
          set -euo pipefail

          echo '=== EXACT DEPENDENCY / ASSET GREP ==='
          echo '-- Chart runtime references outside Layout declaration --'
          grep -RniE 'new[[:space:]]+Chart|Chart\(|chart\.js|chart\.umd' src site --exclude='Layout.astro' || true
          echo '-- retired PDF/GIF references --'
          if grep -RniE 'DRL-Robot_251110\.pdf|mouse-surprised\.gif' src site; then
            echo 'retired large asset reference remains' >&2
            exit 1
          fi
          echo '-- Inter runtime/source references --'
          grep -RniE 'Inter Variable|inter-latin|fontsource-variable/inter' src site package.json astro.config.mjs || true

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          dist = Path('dist')
          assets = Path('site/assets')

          print('\n=== SOURCE / OUTPUT SIZE ===')
          print('site_assets_bytes=', sum(p.stat().st_size for p in assets.rglob('*') if p.is_file()))
          print('dist_bytes=', sum(p.stat().st_size for p in dist.rglob('*') if p.is_file()))
          for rel in ['index.html', 'research/index.html', 'posts/index.html', 'about/index.html']:
              p = dist / rel
              print(f'PAGE {rel} bytes={p.stat().st_size if p.exists() else -1}')

          print('\n=== CLIENT ISLANDS ===')
          text_ext = {'.astro', '.mdx'}
          islands=[]
          for p in Path('src').rglob('*'):
              if p.is_file() and p.suffix in text_ext:
                  s=p.read_text(encoding='utf-8')
                  for m in re.finditer(r'client:(load|idle|visible|media|only)', s):
                      islands.append((str(p), m.group(0)))
          print('count=', len(islands))
          for item in islands: print(*item)
          header_count=sum(1 for path,_ in islands if path.endswith('Header.astro'))
          if header_count != 2:
              raise SystemExit(f'expected exactly 2 header islands, found {header_count}')

          print('\n=== PUBLIC SECTION / IA SAFETY ===')
          cfg=Path('site/config.ts').read_text(encoding='utf-8')
          if 'projects: false' not in cfg or 'appearances: false' not in cfg:
              raise SystemExit('private section gate changed')
          research=Path('src/pages/research.astro').read_text(encoding='utf-8')
          if "getCollection('projects')" in research or "getCollection(\"projects\")" in research:
              raise SystemExit('research page must not read the private projects collection')
          home=Path('src/pages/index.astro').read_text(encoding='utf-8')
          header=Path('src/components/Header.astro').read_text(encoding='utf-8')
          for token in ['Research', 'Current', 'Latest Writing']:
              if token not in home:
                  raise SystemExit(f'home IA signal missing: {token}')
          for token in ['Research', 'Writing', 'About']:
              if token not in header:
                  raise SystemExit(f'header IA signal missing: {token}')
          print('private_gates=PASS research_collection_isolation=PASS navigation=PASS')

          print('\nSITE_IA_SOURCE_AUDIT=PASS')
          PY

      - name: Compare public post semantics and size against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git worktree add --detach /tmp/blog-main origin/main
          cd /tmp/blog-main/spaceship-ui
          pnpm install --frozen-lockfile >/tmp/main-install.log 2>&1
          pnpm exec astro build >/tmp/main-build.log 2>&1

          cd "$GITHUB_WORKSPACE/spaceship-ui"
          python - <<'PY'
          from pathlib import Path
          import re

          before_root=Path('/tmp/blog-main/spaceship-ui/dist')
          after_root=Path('dist')
          article_re=re.compile(r'<article\b[^>]*>.*?</article>', re.S|re.I)

          def post_articles(root):
              result={}
              for p in (root/'posts').glob('*/index.html'):
                  html=p.read_text(encoding='utf-8')
                  match=article_re.search(html)
                  if match:
                      result[p.relative_to(root).as_posix()]=match.group(0)
              return result

          before=post_articles(before_root)
          after=post_articles(after_root)
          if set(before) != set(after):
              raise SystemExit(f'post route set changed: before={len(before)} after={len(after)}')
          changed=[rel for rel in sorted(before) if before[rel] != after[rel]]
          print('POST_ARTICLE_CHANGED_ROUTES=', changed)
          if changed:
              raise SystemExit('existing post article semantics changed during IA redesign')

          def size(root, rel):
              p=root/rel
              return p.stat().st_size if p.exists() else -1
          def total(root):
              return sum(p.stat().st_size for p in root.rglob('*') if p.is_file())

          rows=[
              ('dist', total(before_root), total(after_root)),
              ('home', size(before_root,'index.html'), size(after_root,'index.html')),
              ('writing', size(before_root,'posts/index.html'), size(after_root,'posts/index.html')),
              ('research', size(before_root,'research/index.html'), size(after_root,'research/index.html')),
          ]
          for name,b,a in rows:
              delta = a-b if b >= 0 else None
              print(f'SIZE {name}: main={b} proposed={a} delta={delta}')

          main_writing=size(before_root,'posts/index.html')
          new_writing=size(after_root,'posts/index.html')
          if main_writing > 0 and new_writing >= main_writing:
              raise SystemExit('writing archive did not get lighter')

          print(f'POST_ARTICLE_SEMANTICS=PASS routes={len(after)}')
          print('SITE_IA_FINAL_AUDIT=PASS')
          PY
