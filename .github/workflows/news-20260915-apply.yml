name: Apply September 15 NEWS publication sources
on:
  push:
    branches: [content/news-20260915-biosensing-candidates]
    paths: [.github/workflows/news-20260915-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/news-20260915-biosensing-candidates
          fetch-depth: 0
      - name: Restore reviewed files and validate before committing
        shell: python
        run: |
          from pathlib import Path
          import base64,lzma,hashlib,re,subprocess,json,os
          folder=Path('.github/news-sep15-transfer')
          encoded=''.join((folder/f'part-{i:02d}.b64').read_text().strip() for i in range(3))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='9c4ef00718a617d5f5863b3ed76a7d7367bc0578d4d4b1c62689cdfa5357b587','Transport mismatch'
          decoder=lzma.LZMADecompressor()
          raw=decoder.decompress(compressed,max_length=200000)
          assert decoder.eof and len(raw)==124688 and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest()=='78675896a9972b79052a7c7fc451f9d1554669f4d07160f0a413de1405d4ff80'
          text=raw.decode('utf-8')
          expected={
            'THIRD_PARTY_NOTICES.md',
            'scripts/normalize_tags_current.py',
            'spaceship-ui/site/news-media.json',
            'spaceship-ui/site/news-edition-20260915.json',
            'spaceship-ui/scripts/news-20260915-contract.mjs',
            'spaceship-ui/scripts/news-visual-contract.mjs',
            'spaceship-ui/scripts/browser-news-media-audit.mjs',
            'spaceship-ui/docs/operations/NEWS_20260915_RESUME.md',
            'spaceship-ui/ops/blog-harness/blogger/2026-09-15/nanopore.html',
            'spaceship-ui/ops/blog-harness/blogger/2026-09-15/apoe.html',
            'spaceship-ui/ops/blog-harness/blogger/2026-09-15/mos2.html',
            'spaceship-ui/ops/blog-harness/blogger/2026-09-15/README.md',
            'spaceship-ui/site/content/posts/2026-09-15-mspa-fpba-nanopore-news.mdx',
            'spaceship-ui/site/content/posts/2026-09-15-apoe-stratified-alzheimer-news.mdx',
            'spaceship-ui/site/content/posts/2026-09-15-mos2-snn-in-logic-news.mdx'
          }
          paths=re.findall(r'^\+\+\+ b/(.+)$',text,re.M)
          assert len(paths)==15 and set(paths)==expected
          patch=Path(os.environ['RUNNER_TEMP'])/'news-sep15.patch';patch.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for script in ['news-20260915-contract.mjs','taxonomy-contract.mjs','post-content-contract.mjs','seo-check.mjs']:
              subprocess.run(['node','scripts/'+script],cwd='spaceship-ui',check=True)
          subprocess.run(['python3','scripts/normalize_tags_current.py','--check'],check=True)
          for item in ['nanopore','apoe','mos2']:
              subprocess.run(['python3','scripts/blogger_harness.py','validate',f'spaceship-ui/ops/blog-harness/blogger/2026-09-15/{item}.html'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed|untracked==expected,(changed,untracked)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          temporary=[str(folder/f'part-{i:02d}.b64') for i in range(3)]+[
            '.github/workflows/news-20260915-source-review.yml',
            '.github/workflows/news-20260915-background-media.yml',
            '.github/workflows/news-20260915-apply.yml'
          ]
          subprocess.run(['git','rm','--',*temporary],check=True)
          subprocess.run(['git','-c','user.name=JJo Editorial','-c','user.email=76779256+JJo-0@users.noreply.github.com','commit','-m','content: add September 15 Top 1 and two candidate explainers with credited figures (#117)'],check=True)
          subprocess.run(['git','push','origin','HEAD:content/news-20260915-biosensing-candidates'],check=True)
          print('PUBLICATION SOURCE HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('Source checkpoint complete. Full PR CI and Pages deployment still required.')
