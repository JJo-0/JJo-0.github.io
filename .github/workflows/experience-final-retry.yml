name: Final experience foundation validation retry

on:
  push:
    branches: [agent/experience-motion-foundation-phase123]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experience-motion-foundation-phase123
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Harden cleanup callbacks
        shell: python
        run: |
          from pathlib import Path
          path = Path('spaceship-ui/src/components/experience/MotionRuntime.svelte')
          source = path.read_text(encoding='utf-8')
          source = source.replace('let cleanup = () => {};', 'let cleanup: (() => void) | undefined;')
          source = source.replace('let pointerCleanup = () => {};', 'let pointerCleanup: (() => void) | undefined;')
          source = source.replace('      cleanup();\n', '      cleanup?.();\n')
          source = source.replace('        pointerCleanup();\n', '        pointerCleanup?.();\n')
          path.write_text(source, encoding='utf-8')
      - name: Validate full production surface
        working-directory: spaceship-ui
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/components/experience/MotionRuntime.svelte
          pnpm lint
          pnpm check
          pnpm seo:check
          pnpm build
          pnpm content:check
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/experience-deps-once.yml
          rm -f .github/workflows/experience-verify-once.yml
          rm -f .github/workflows/experience-cleanup-once.yml
          rm -f .github/workflows/experience-automerge-once.yml
          rm -f .github/workflows/experience-final-retry.yml
          rm -f .github/experience-verify-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize motion runtime lifecycle"
            git push origin HEAD:agent/experience-motion-foundation-phase123
          fi
      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/experience-motion-foundation-phase123 --state open --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No open experience PR remains; validation branch may already be merged."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "feat: add progressive motion and editorial portfolio foundation" \
            --body "Add editorial homepage/research layouts, scoped GSAP motion, reduced-motion support, root View Transitions, and a fail-closed experience contract."
