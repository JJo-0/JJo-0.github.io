name: October 1 source review
on:
  push:
    branches: [ops/oct01-source-review-20261005]
    paths: [.github/workflows/oct01-source-review.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40f06678b65c1761d2075043a53fde78325f8f36
          persist-credentials: false
      - name: Preserve three translations and existing images, without modifying them
        run: |
          mkdir -p review
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json,hashlib,urllib.request
          files=[Path('spaceship-ui/site/content/english')/('en-'+slug+'.mdx') for slug in ['synthidbio-protein-watermark','wafer-scale-p-type-bcn','ataraxos-hidden-information-games']]
          files+=list(Path('spaceship-ui/site/assets/assets/posts/news-20261001').glob('*'))
          rows=[]
          with zipfile.ZipFile('review/translations-and-media.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  assert p.suffix in {'.mdx','.png','.jpg','.svg'}
                  b=p.read_bytes();z.write(p,str(p));rows.append({'path':str(p),'sha256':hashlib.sha256(b).hexdigest()})
          Path('review/files.json').write_text(json.dumps(rows,indent=2))
          Path('review/head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          url='https://www.t.u-tokyo.ac.jp/press/pr2026-10-01-001'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:b=r.read()
              Path('review/tokyo.html').write_bytes(b);print('Tokyo source retrieved',len(b))
          except Exception as e:Path('review/tokyo-status.txt').write_text(str(e))
          print(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oct01-translations-and-media
          path: review/
          retention-days: 3
