name: Citation candidate live verification
on:
  push:
    branches: [ops/citation-live-20261008]
    paths: [.github/workflows/citation-live-20261008.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 743d9340e428118619e177c63ef4d87f9eb4a4fd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Korean browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Exact expression negative controls
        run: node scripts/citation-pointer-lifecycle.test.mjs
      - name: Real Back and late-layout fixture
        run: node scripts/browser-citation-lifecycle.test.mjs
      - name: Complete existing native citation matrix on the public site
        env:
          JJO_SMOKE_BASE_URL: https://jjo-0.github.io/
        run: node scripts/browser-news-citation-audit.mjs 2>&1 | tee citation-audit/live-citation.log
      - name: Preserve tested candidate
        if: always()
        run: |
          mkdir -p citation-audit
          git rev-parse HEAD > citation-audit/tested-head.txt
          node --version > citation-audit/node-version.txt
          google-chrome --version > citation-audit/browser-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citation-live-20261008-${{ github.run_id }}-${{ github.run_attempt }}
          path: spaceship-ui/citation-audit/
          retention-days: 14
