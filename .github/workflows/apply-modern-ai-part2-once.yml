name: Apply Modern AI Part II source-complete payload once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-ai-part2-source-complete
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'agent/modern-ai-part-2-source-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/part2-payload
          test "$(find .github/part2-payload -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 9
          cat .github/part2-payload/chunk-* > /tmp/part2-payload.b64
          base64 --decode /tmp/part2-payload.b64 > /tmp/part2-payload.tar.gz
          echo '210fff31025e6f601167fe25d538412dbf9f6f6764d62fb9b93133f9b658f83d  /tmp/part2-payload.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/part2-payload.tar.gz > /tmp/part2-payload.paths
          if grep -Eq '(^|/)\.\.(/|$)|^/' /tmp/part2-payload.paths; then
            echo 'Unsafe archive path detected.' >&2
            cat /tmp/part2-payload.paths >&2
            exit 1
          fi

      - name: Apply repository files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/part2-payload.tar.gz -C "$GITHUB_WORKSPACE"
          required=(
            spaceship-ui/package.json
            spaceship-ui/scripts/modern-ai-series-audit.mjs
            spaceship-ui/scripts/modern-ai-part2-audit.mjs
            spaceship-ui/site/content/posts/modern-artificial-intelligence-2.mdx
            spaceship-ui/src/components/post/SourceFormula.astro
            spaceship-ui/src/lib/modern-ai-part2.ts
            spaceship-ui/src/data/modern-ai-part2/formula-ledger.json
            spaceship-ui/src/data/modern-ai-part2/content-ledger.json
            spaceship-ui/src/data/modern-ai-part2/page-ledger.json
            spaceship-ui/src/data/modern-ai-part2/README.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing payload output: $path" >&2; exit 1; }
          done
          node --check spaceship-ui/scripts/modern-ai-series-audit.mjs
          node --check spaceship-ui/scripts/modern-ai-part2-audit.mjs
          rm -rf .github/part2-payload
          rm -f .github/workflows/apply-modern-ai-part2-once.yml

      - name: Commit source-complete Part II
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Payload already applied; no commit required.'
            exit 0
          fi
          echo 'Staged paths:'
          git diff --cached --name-status
          git commit -m 'feat: publish source-complete Modern AI Part II'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
