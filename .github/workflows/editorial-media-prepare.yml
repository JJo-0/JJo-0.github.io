name: Editorial media preparation
on:
  push:
    branches: [editorial/publish-sep05-08-20260910]
    paths: [.github/workflows/editorial-media-prepare.yml]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow PyMuPDF
      - name: Retrieve the attributed source figures for editorial review
        run: |
          mkdir -p media
          cat >/tmp/media.py <<'PY'
          import requests,json,pathlib,hashlib,io,concurrent.futures,fitz
          from PIL import Image
          root=pathlib.Path('media'); results=[]
          sources={
            'navier-official.webp':'https://images.ctfassets.net/kftzwdyauwt9/75EbpsuBOy5LbUgCppWXD1/88da8c19dcf76d6f4f8fd7485dcb6346/navier-stokes-light-master.png?w=1920&q=90&fm=webp',
            'weather-architecture.webp':'https://arxiv.org/html/2609.03582v1/Figures/fig1_alt2.png',
            'weather-stations.webp':'https://arxiv.org/html/2609.03582v1/Figures/fig2_station_eval_standalone.png',
            'weather-failures.webp':'https://arxiv.org/html/2609.03582v1/Figures/fig5_combined.png',
            'feeder-weekly.webp':'https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41597-026-08152-9/MediaObjects/41597_2026_8152_Fig4_HTML.png',
            'feeder-seasonal.webp':'https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41597-026-08152-9/MediaObjects/41597_2026_8152_Fig5_HTML.png',
            'aging-clock-trial.webp':'https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41587-026-03286-y/MediaObjects/41587_2026_3286_Fig1_HTML.png',
            'aging-clock-results.webp':'https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41587-026-03286-y/MediaObjects/41587_2026_3286_Fig3_HTML.png',
            'research-new-ways.webp':'https://cdn.webrazzi.com/uploads/2026/09/researchers-are-using-coding-agents-in-new-ways-487.png',
            'research-all-categories.webp':'https://cdn.webrazzi.com/uploads/2026/09/all-categories-of-research-activity-have-increased-since-the-start-of-the-year-807.png'
          }
          def get(kv):
            name,url=kv; row={'name':name,'source':url}
            try:
              res=requests.get(url,timeout=50);row['http']=res.status_code;res.raise_for_status()
              img=Image.open(io.BytesIO(res.content));img.load()
              row['original_size']=list(img.size)
              if max(img.size)>2200:img.thumbnail((2200,2200))
              img.convert('RGB').save(root/name,'WEBP',quality=94,method=6)
              row.update(width=img.width,height=img.height,sha256=hashlib.sha256((root/name).read_bytes()).hexdigest(),status='ACQUIRED')
            except Exception as e:row.update(status='FAILED',error=str(e))
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(get,sources.items()))
          pdfurl='https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf'
          try:
            res=requests.get(pdfurl,timeout=70);res.raise_for_status();assert res.content.startswith(b'%PDF')
            doc=fitz.open(stream=res.content,filetype='pdf'); matches=[]
            for i,page in enumerate(doc):
              txt=page.get_text()
              if 'central part of the inner core' in txt.lower():
                page.get_pixmap(matrix=fitz.Matrix(1.8,1.8)).save(root/f'navier-figure-page-{i+1}.png')
                (root/f'navier-figure-page-{i+1}.txt').write_text(txt)
                matches.append({'page':i+1,'blocks':page.get_text('blocks')})
            (root/'navier-figure-locations.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2))
            results.append({'name':'navier-pdf','source':pdfurl,'pages':len(doc),'figure_pages':[m['page'] for m in matches],'sha256':hashlib.sha256(res.content).hexdigest(),'status':'ACQUIRED'})
            if matches:
              page=doc[matches[0]['page']-1]
              blocks=page.get_text('blocks')
              caps=[b for b in blocks if 'central part of the inner core' in b[4].lower()]
              b=caps[0]
              # Keep the diagram above its caption and the complete caption. Review before publishing.
              clip=fitz.Rect(36,30,page.rect.width-36,min(page.rect.height-20,b[3]+8))
              pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=clip)
              img=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB');img.save(root/'navier-figure-1.webp','WEBP',quality=96,method=6)
          except Exception as e:results.append({'name':'navier-pdf','source':pdfurl,'status':'FAILED','error':str(e)})
          (root/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2));print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          python /tmp/media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-source-media
          path: media/
          retention-days: 3
