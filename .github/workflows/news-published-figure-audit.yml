name: NEWS published-figure audit
on:
  push:
    branches: [editorial/news-sep5-8-source-audit-20260910]
    paths: [.github/workflows/news-published-figure-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Retrieve published figures and primary article text for review
        run: |
          mkdir -p review
          cat > /tmp/review.py <<'PY'
          import requests, pathlib, json, concurrent.futures
          from bs4 import BeautifulSoup
          OUT=pathlib.Path('review')
          sources={
            'chart-new-ways':'https://cdn.webrazzi.com/uploads/2026/09/researchers-are-using-coding-agents-in-new-ways-487.png',
            'chart-all-categories':'https://cdn.webrazzi.com/uploads/2026/09/all-categories-of-research-activity-have-increased-since-the-start-of-the-year-807.png',
            'chart-hns':'https://img2.helpnetsecurity.com/posts2026/OpenAI-research_automation.webp',
            'weather':'https://arxiv.org/html/2609.03582v1',
            'aml':'https://www.nejm.org/doi/abs/10.1056/NEJMoa2602804',
            'perovskite':'https://www.nature.com/articles/s41563-026-02722-3',
            'methane':'https://news.stanford.edu/stories/2026/09/sustainable-hydrogen-production-heating-method',
            'hugcl':'https://www.nature.com/articles/s41467-026-77370-x',
            'mnte':'https://www.nature.com/articles/s41467-026-77568-z',
            'corona':'https://www.nature.com/articles/s41467-026-77523-y',
            'clear-ec':'https://www.nature.com/articles/s41467-026-77467-3',
            'feederbw':'https://www.nature.com/articles/s41597-026-08152-9',
            'glud1':'https://www.nature.com/articles/s41467-026-77151-6',
            'dlcatalysis':'https://www.nature.com/articles/s41467-026-77406-2',
            'carep':'https://www.nature.com/articles/s41467-026-76570-9',
            'deepwonder3d':'https://www.nature.com/articles/s41592-026-03215-6',
            'rentosertib':'https://www.nature.com/articles/s41587-026-03286-y',
            'chorus':'https://www.nature.com/articles/s41467-026-77415-1',
            'nbtin':'https://www.imec-int.com/en/press/imec-advances-scalable-superconducting-technology-world-first-nbtin-circuits-and-30nm'
          }
          def get(item):
            key,url=item
            report={'id':key,'requested_url':url,'public_reuse':'NOT_AUTHORIZED_BY_DOWNLOAD'}
            try:
              r=requests.get(url,timeout=45,headers={'User-Agent':'JJo editorial source review; requests'})
              report.update(http_status=r.status_code,final_url=r.url,mime=r.headers.get('Content-Type'),size=len(r.content))
              if r.ok and len(r.content)<5000000:
                if r.headers.get('Content-Type','').startswith('image/'):
                  ext='.webp' if 'webp' in r.headers.get('Content-Type','') else '.png'
                  (OUT/(key+ext)).write_bytes(r.content)
                  report['file']=key+ext
                else:
                  soup=BeautifulSoup(r.text,'html.parser')
                  report['title']=soup.title.get_text() if soup.title else ''
                  (OUT/(key+'.html')).write_text(r.text,encoding='utf8')
                  for tag in soup(['script','style','nav','footer']):tag.decompose()
                  (OUT/(key+'.txt')).write_text(soup.get_text('\n',strip=True),encoding='utf8')
                  report['figures']=[{'caption':f.get_text(' ',strip=True)[:1500],'images':[{'src':im.get('src'), 'srcset':im.get('srcset'),'alt':im.get('alt')} for im in f.find_all('img')]} for f in soup.find_all('figure')]
                  report['license_links']=[a.get('href') for a in soup.find_all('a',href=True) if 'creativecommons.org/licenses/' in a['href']]
              else:report['error']='HTTP_OR_SIZE_LIMIT'
            except Exception as exc:report['error']=str(exc)
            print(json.dumps(report,ensure_ascii=False))
            return report
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: results=list(pool.map(get,sources.items()))
          (OUT/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf8')
          PY
          python /tmp/review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-text-and-published-figure-review
          path: review/
          retention-days: 7
