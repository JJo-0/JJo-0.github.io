name: Render additional original figures
on:
  push:
    branches: [ops/paper-figures-20260917-b]
    paths: [.github/workflows/paper-figures-b-render.yml]
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/ops/paper-figures-20260917-b'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0
      - name: Render exact-version excerpts; store blobs only, never update branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image
          out=Path('additional-originals');out.mkdir()
          papers=[
          ('cfg','2207.12598v1','ccbdf2da65903ed579d35240165aba2d0e9ad6f015ade81af6e30823eb0a7f24',[(4,7,[168,532,445,692])]),
          ('ldm','2112.10752v2','46ede043a8dc07ca1f0f445620523fe1ad8b2436bd83856a3835612a47e9f79e',[(3,4,[307,70,550,188])]),
          ('score-sde','2011.13456v2','b244b740e60628d01bc3d4b98d721c2343be1fb9b67ad22593c8555e66f4d4a6',[(1,2,[106,82,367,195]),(2,4,[106,78,504,216])]),
          ('barlow-twins','2103.03230v3','3c39d728c72cc8a19a49b2a76b37efdabc4bd42bfb63eec1f9427962a20624eb',[(1,1,[304,194,543,323])]),
          ('byol','2006.07733v3','873e7b74d58e1e17806cf7a3cf6b80ead914559f36ed19313c749672eed0aa94',[(2,4,[78,28,534,180])]),
          ('moco','1911.05722v3','ad31ea26ed2d9ba3e2f767a2dcb0961a5b70ff505b1c3fb18d07201140e4e1fe',[(1,1,[353,219,504,341]),(2,3,[120,69,472,195])]),
          ('deepcluster','1807.05520v2','aef656b39a1175897bbeeddda89da5184c57a3faad11e34c2a6d0a15f3ebbb87',[(1,2,[50,31,366,135])]),
          ('swav','2006.09882v5','4249b19a6c31946e27b4244d050b69d7283b87dde1d134c051cd596a8bd4e5dc',[(1,4,[113,68,498,178])])]
          receipts=[]
          for key,version,expected,figures in papers:
              url='https://arxiv.org/pdf/'+version
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 scholarly-figure-review'}),timeout=90) as r:data=r.read()
              assert hashlib.sha256(data).hexdigest()==expected,'Source PDF bytes changed'
              doc=fitz.open(stream=data,filetype='pdf')
              for number,page,rect in figures:
                  clip=fitz.Rect(rect)
                  assert doc[page-1].rect.contains(clip)
                  file=f'{key}-fig-{number}.png'
                  doc[page-1].get_pixmap(matrix=fitz.Matrix(6,6),clip=clip,alpha=False).save(out/file)
                  b=(out/file).read_bytes()
                  blobsha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  request=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=json.dumps({'content':base64.b64encode(b).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
                  assert result['sha']==blobsha
                  image=Image.open(out/file)
                  receipts.append({'id':f'{key}-fig-{number}','version':version,'pdfSource':url,'pdfSha256':expected,'pdfPage':page,'cropPoints':rect,'scale':6,'file':file,'width':image.width,'height':image.height,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'gitBlobSha':blobsha})
          (out/'receipts.json').write_text(json.dumps({'checkedOn':'2026-09-17','renderer':'PyMuPDF 1.26.7','scope':'Image blobs only. No commit or branch was changed by this job. Visual review of the resulting crops is separate.','figures':receipts},indent=2)+'\n')
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: additional-original-figure-pngs
          path: additional-originals/
          retention-days: 14
          if-no-files-found: error
