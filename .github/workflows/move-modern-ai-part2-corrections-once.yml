name: Move Modern AI Part II corrections into the reader layer once

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete
    paths:
      - .github/workflows/move-modern-ai-part2-corrections-once.yml

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete
          fetch-depth: 0
      - name: Move completed and corrected formulas beside their source expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spaceship-ui/site/content/posts/modern-artificial-intelligence-2.mdx')
          text = path.read_text(encoding='utf-8')

          pairs = [
              (
                  "<SourceFormula formula={part2Formula('MAI-P2-066')} display={true} />",
                  """<SourceFormula formula={part2Formula('MAI-P2-066')} display={true} />

원자료의 빈칸을 베이즈 규칙으로 완성하면 다음과 같다.

<SourceFormula formula={part2Formula('MAI-P2-067')} display={true} />""",
              ),
              (
                  "<SourceFormula formula={part2Formula('MAI-P2-075')} display={true} />",
                  """<SourceFormula formula={part2Formula('MAI-P2-075')} display={true} />

전체확률법칙으로 빈칸을 완성하면 다음 위험식이 된다.

<SourceFormula formula={part2Formula('MAI-P2-076')} display={true} />""",
              ),
              (
                  "<SourceFormula formula={part2Formula('MAI-P2-087')} display={true} />",
                  """<SourceFormula formula={part2Formula('MAI-P2-087')} display={true} />

표준 1차원 가우시안 밀도와 다변량 식 (9)에 맞춘 교정식은 다음과 같다.

<SourceFormula formula={part2Formula('MAI-P2-088')} display={true} />""",
              ),
              (
                  "<SourceFormula formula={part2Formula('MAI-P2-102')} display={true} />",
                  """<SourceFormula formula={part2Formula('MAI-P2-102')} display={true} />

클래스별 사전확률이 같다고 가정하지 않는 일반적인 MAP 판별식에서는 다음처럼 사전확률이 남는다.

<SourceFormula formula={part2Formula('MAI-P2-103')} display={true} />""",
              ),
          ]

          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one source formula insertion point for {old}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          for formula_id in ['MAI-P2-067', 'MAI-P2-076', 'MAI-P2-088', 'MAI-P2-103']:
              call = f"<SourceFormula formula={{part2Formula('{formula_id}')}} display={{true}} />"
              if text.count(call) != 2:
                  raise SystemExit(f'expected source and audit occurrences for {formula_id}, found {text.count(call)}')
              index = text.rfind(call)
              text = text[:index] + text[index + len(call):]
              if text.count(f"part2Formula('{formula_id}')") != 1:
                  raise SystemExit(f'{formula_id} was not reduced to one source occurrence')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/move-modern-ai-part2-corrections-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: show all Part II completed and corrected formulas to readers'
          git push origin HEAD:agent/modern-ai-part-2-source-complete
