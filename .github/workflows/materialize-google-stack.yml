name: Materialize Google stack changes

on:
  push:
    branches:
      - agent/google-search-analytics-adsense
    paths:
      - .github/workflows/materialize-google-stack.yml
      - spaceship-ui/scripts/.google-stack-changes.part-*

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/google-search-analytics-adsense
          fetch-depth: 0

      - name: Reassemble and verify source overlay
        shell: bash
        run: |
          cat spaceship-ui/scripts/.google-stack-changes.part-* > "$RUNNER_TEMP/google-stack-changes.b64"
          base64 --decode "$RUNNER_TEMP/google-stack-changes.b64" > "$RUNNER_TEMP/google-stack-changes.tar.gz"
          echo 'f5b3652949899e24c81943f27dbf05350229a223bf7c275b7e938fac21adbaa0  '"$RUNNER_TEMP/google-stack-changes.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/google-stack-changes.tar.gz" -C .
          git restore --source=HEAD -- .github/workflows

      - name: Run dependency-free reporting self-test
        working-directory: spaceship-ui
        run: node scripts/google-site-insights.mjs --self-test

      - name: Commit application and documentation changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui
          git commit -m 'feat: prepare Search Console GA4 and selective AdSense operations'
          git push origin HEAD:agent/google-search-analytics-adsense
