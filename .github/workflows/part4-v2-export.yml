name: Export Part IV v2 workspace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    if: github.head_ref == 'agent/modern-ai-part4-source-complete-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: |
          tar --exclude=.git --exclude='spaceship-ui/node_modules' -czf part4-v2-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: part4-v2-workspace
          path: part4-v2-workspace.tar.gz
          if-no-files-found: error
