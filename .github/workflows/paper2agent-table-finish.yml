name: Prepare readable comparison and live checks
on:
  push:
    branches: [ops/news-publication-finish-20260918]
    paths: [.github/workflows/paper2agent-table-finish.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9485aaa4ee93e81118e2882739381346bbb87665
          persist-credentials: false
      - name: Prepare narrowly scoped table styles and additive live verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          base='9485aaa4ee93e81118e2882739381346bbb87665'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          changes={}
          path='spaceship-ui/src/components/post/Paper2AgentComparison.astro'
          assert not Path(path).exists()
          changes[path]='''<div class="p2a-comparison-table" role="region" aria-label="AlphaGenome 에이전트 비교표, 좁은 화면에서는 좌우로 이동" tabindex="0">
            <slot />
          </div>
          <p class="p2a-table-hint">표를 좌우로 움직이면 세 방식의 결과를 모두 볼 수 있습니다.</p>

          <style>
            .p2a-comparison-table { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; margin: 1.5rem 0; }
            .p2a-comparison-table:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
            .p2a-comparison-table :global(table) { display: table; width: 100%; min-width: 36rem; max-width: none; margin: 0 !important; font-variant-numeric: tabular-nums; }
            .p2a-comparison-table :global(th), .p2a-comparison-table :global(td) { min-width: 0; max-width: none; padding: .7rem .65rem !important; white-space: nowrap; }
            .p2a-comparison-table :global(tr > :first-child) { min-width: 8rem; max-width: none; }
            .p2a-comparison-table :global(tr > :nth-child(2)) { min-width: 3rem; width: 4rem; }
            .p2a-table-hint { display: none; font-size: .8rem; color: var(--color-muted-foreground); margin-top: -.75rem; }
            @media (max-width: 768px) { .p2a-table-hint { display: block; } }
          </style>
          '''
          path='spaceship-ui/site/content/posts/2026-09-18-paper2agent-news.mdx'
          old=Path(path).read_text(); assert hashlib.sha256(old.encode()).hexdigest()=='33b1ce026b36da82a79345ae2dbfede8e7aef7c12f37d41f111b6468487cdb65'
          needle='import Paper2AgentNumbers from "@/components/post/Paper2AgentNumbers.astro";'
          assert old.count(needle)==1
          text=old.replace(needle,needle+'\nimport Paper2AgentComparison from "@/components/post/Paper2AgentComparison.astro";',1)
          needle='<section data-p2a-comparison aria-label="AlphaGenome 에이전트 비교 결과">\n\n'; assert text.count(needle)==1
          text=text.replace(needle,needle+'<Paper2AgentComparison>\n\n',1)
          needle='| 개방형 연구 질문 | 30 | 82.7±2.4% | 56.7±2.3% | 72.2±2.2% |\n\n</section>'
          assert text.count(needle)==1
          text=text.replace(needle,needle.replace('\n\n</section>','\n\n</Paper2AgentComparison>\n\n</section>'),1)
          changes[path]=text
          def prose(s):
              s=re.sub(r'^---\n[\s\S]*?\n---\s*','',s).split('## 9.')[0]
              s=re.sub(r'^import .*;\s*$','',s,flags=re.M); s=re.sub(r'<Math\b[\s\S]*?/>','',s)
              s=re.sub(r'<[^>]+>','',s); s=re.sub(r'\[([^\]]+)\]\([^)]*\)',r'\1',s)
              s=re.sub(r'\[\d+(?:,\d+)*\]','',s);s=re.sub(r'[*#|`>]+','',s)
              return re.sub(r'\s+',' ',s).strip()
          assert prose(text)==prose(old),'Authored explanation and all table values unchanged'
          path='spaceship-ui/site/news-edition-20260918.json'
          manifest=json.loads(Path(path).read_text()); assert len(prose(text))==manifest['bodyCharacters']
          manifest['postSha256']=hashlib.sha256(text.encode()).hexdigest()
          changes[path]=json.dumps(manifest,ensure_ascii=False,indent=2)+'\n'
          path='spaceship-ui/scripts/browser-paper2agent.mjs'; text=Path(path).read_text()
          needle="    await shot(`comparison-${width}-${dark?'dark':'light'}`);"
          assert text.count(needle)==1,repr(needle)
          insertion="    const tableLayout=await js(`(()=>{const region=document.querySelector('.p2a-comparison-table');const table=region?.querySelector('table');return {exists:!!table,viewport:region?.clientWidth,content:region?.scrollWidth,columns:table?.querySelectorAll('thead th').length,focusable:region?.tabIndex===0};})()`);\n"
          insertion+="    assert(tableLayout.exists&&tableLayout.columns===5&&tableLayout.focusable);\n"
          insertion+="    if(width===1440)assert(tableLayout.content<=tableLayout.viewport+2,'All five comparison columns fit the desktop article width');\n"
          text=text.replace(needle,insertion+needle,1)
          changes[path]=text
          path='spaceship-ui/scripts/news-20260918-contract.mjs';text=Path(path).read_text()
          needle="  assert(s.includes('<Paper2AgentNumbers />'));";assert text.count(needle)==1
          text=text.replace(needle,needle+"\n  assert(s.includes('<Paper2AgentComparison>'), 'Comparison table uses its scoped reading styles');",1)
          changes[path]=text
          path='.github/workflows/blog-pages-deploy.yml';text=Path(path).read_text()
          needle='      - name: Publish Pages live-smoke status';assert text.count(needle)==1
          text=text.replace(needle,'      - name: Live Paper2Agent comparison and reading\n        timeout-minutes: 4\n        run: node scripts/browser-paper2agent.mjs\n\n'+needle,1)
          text+='\n      - name: Preserve live Paper2Agent feedback evidence\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: paper2agent-feedback-live-${{ github.run_id }}\n          path: spaceship-ui/paper2agent-review/\n          retention-days: 14\n'
          changes[path]=text
          out=Path('table-finish');out.mkdir();records=[];assert len(changes)==6
          for name,text in changes.items():
              data=text.encode();dest=out/'files'/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              req=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(); assert sha==result['sha']
              records.append({'path':name,'sha':sha,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          (out/'blobs.json').write_text(json.dumps({'base':base,'files':records},indent=2)+'\n')
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper2agent-table-finish
          path: table-finish/
          retention-days: 7
          if-no-files-found: error
