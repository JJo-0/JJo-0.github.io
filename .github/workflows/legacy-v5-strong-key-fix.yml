name: Patch exact tooltip-spanning strong key

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - name: Patch exact source payload
        shell: python
        run: |
          from pathlib import Path
          path = Path('spaceship-ui/scripts/_legacy-finalize-migration-v5.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  'GWT의 기능적 상동체',\n"
          new = "  'GWT의 기능적 상동체(functional analogue)',\n"
          if old not in text:
              if new in text:
                  print('Exact key already patched.')
              else:
                  raise SystemExit('Expected GWT strong key not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit script patch
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain spaceship-ui/scripts/_legacy-finalize-migration-v5.mjs)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spaceship-ui/scripts/_legacy-finalize-migration-v5.mjs
          git commit -m 'fix: match tooltip-spanning strong source exactly'
          git push origin HEAD:agent/legacy-content-finalize
