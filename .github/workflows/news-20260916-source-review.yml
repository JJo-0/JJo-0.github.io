name: September 16 NEWS source review
on:
  push:
    branches: [content/news-20260916-hydrogen-candidates]
    paths: [.github/workflows/news-20260916-source-review.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot source and fetch public research without executing it
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 pymupdf
          mkdir -p "$RUNNER_TEMP/news-sep16"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/news-sep16/repository.tar.gz"
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from concurrent.futures import ThreadPoolExecutor
          import requests,json,hashlib,os
          from bs4 import BeautifulSoup
          import pymupdf
          out=Path(os.environ['RUNNER_TEMP'])/'news-sep16'
          sources={'hydrogen':'https://www.nature.com/articles/s41560-026-02130-6','medical':'https://www.nature.com/articles/s41591-026-04609-x','oect':'https://www.nature.com/articles/s41928-026-01708-y','micron':'https://investors.micron.com/news/press-release/2026/Micron-Advances-Memory-Innovation-With-the-Worlds-First-Ultra-Dense-Module-for-Next-Generation-Servers/default.aspx'}
          allowed={'www.nature.com','media.springernature.com','static-content.springer-cdn.com','investors.micron.com','s24.q4cdn.com'}
          def collect(item):
              key,url=item;rows=[];folder=out/key;folder.mkdir()
              def fetch(url,name):
                  assert urlparse(url).scheme=='https' and urlparse(url).hostname in allowed
                  try:
                      r=requests.get(url,timeout=60,headers={'User-Agent':'JJo Research Blog / public source verification'})
                      rec={'url':url,'finalUrl':r.url,'status':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'file':key+'/'+name,'checkedDate':'2026-09-16'};rows.append(rec)
                      if r.ok and len(r.content)<45000000:
                          (folder/name).write_bytes(r.content)
                          if r.content.startswith(b'%PDF-'):
                              with pymupdf.open(stream=r.content,filetype='pdf') as doc:
                                  (folder/(name+'.txt')).write_text('\n'.join(f'=== PAGE {i+1} ===\n'+p.get_text() for i,p in enumerate(doc)))
                          return r
                  except requests.RequestException as e:rows.append({'url':url,'error':type(e).__name__})
              r=fetch(url,'source.html')
              if r is None:return rows
              soup=BeautifulSoup(r.content,'html.parser')
              (folder/'source.txt').write_text(soup.get_text('\n',strip=True))
              links=[{'text':a.get_text(' ',strip=True),'href':urljoin(url,a['href'])} for a in soup.select('a[href]')]
              figures=[{'caption':f.get_text(' ',strip=True),'images':[{'src':urljoin(url,i.get('src','')),'alt':i.get('alt','')} for i in f.select('img')]} for f in soup.select('figure')]
              (folder/'links.json').write_text(json.dumps({'links':links,'figures':figures},ensure_ascii=False,indent=2))
              pdfs=list(dict.fromkeys(x['href'] for x in links if urlparse(x['href']).hostname in allowed and urlparse(x['href']).path.lower().endswith('.pdf')))[:5]
              for i,pdf in enumerate(pdfs):fetch(pdf,f'document-{i}.pdf')
              for i,f in enumerate(figures[:8]):
                  for image in f['images'][:1]:
                      if urlparse(image['src']).hostname in allowed:fetch(image['src'],f'figure-{i}.img')
              return rows
          with ThreadPoolExecutor(max_workers=3) as pool:rows=[r for group in pool.map(collect,sources.items()) for r in group]
          (out/'source-receipts.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{'file':r.get('file'),'status':r.get('status'),'bytes':r.get('bytes'),'error':r.get('error')} for r in rows],indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: news-sep16-primary-review
          path: ${{ runner.temp }}/news-sep16
          retention-days: 14
