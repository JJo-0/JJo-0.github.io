name: Three.js experience preview artifact once

on:
  push:
    branches: [agent/three-experience-core]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm content:check
      - uses: actions/upload-artifact@v4
        with:
          name: three-experience-dist
          path: spaceship-ui/dist
          if-no-files-found: error
          retention-days: 1
