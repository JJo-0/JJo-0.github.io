name: One-shot generic formula guide cleanup

on:
  push:
    branches:
      - fix/remove-generic-formula-walkthroughs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-generic-formula-walkthroughs
          fetch-depth: 0

      - name: Apply exact cleanup patch
        shell: bash
        run: |
          python scripts/remove_generic_formula_walkthroughs.py
          node --check spaceship-ui/src/lib/modern-ai-formula-guide.mjs
          node --check spaceship-ui/scripts/formula-guide-context-contract.mjs
          node --check spaceship-ui/scripts/modern-ai-part1-reader-audit.mjs
          node --check spaceship-ui/scripts/modern-ai-part2-audit.mjs
          node --check spaceship-ui/scripts/modern-ai-part3-audit.mjs
          git diff --check

      - name: Commit clean source tree and remove bootstrap machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/blog-ci.yml
          git rm .github/workflows/generic-guide-bootstrap.yml scripts/remove_generic_formula_walkthroughs.py
          git add \
            .github/workflows/blog-ci.yml \
            spaceship-ui/package.json \
            spaceship-ui/scripts/formula-guide-context-contract.mjs \
            spaceship-ui/scripts/modern-ai-part1-reader-audit.mjs \
            spaceship-ui/scripts/modern-ai-part2-audit.mjs \
            spaceship-ui/scripts/modern-ai-part3-audit.mjs \
            spaceship-ui/src/components/post/FormulaGuide.astro \
            spaceship-ui/src/lib/modern-ai-formula-guide.mjs \
            spaceship-ui/src/data/modern-ai-part2/README.md \
            spaceship-ui/src/data/modern-ai-part3/README.md
          git commit -m "fix: remove generic formula calculation walkthroughs"
          git push origin HEAD:fix/remove-generic-formula-walkthroughs
