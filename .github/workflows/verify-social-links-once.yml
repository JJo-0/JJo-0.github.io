name: Verify social links cleanup

on:
  push:
    branches: [agent/social-links-cleanup]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm content:check
      - name: Verify rendered social targets
        shell: bash
        run: |
          grep -q 'https://www.instagram.com/jo___09/' dist/posts/ai-consciousness-deep-research-1/index.html
          grep -q 'https://blog.naver.com/jjo_09_' dist/posts/ai-consciousness-deep-research-1/index.html
          grep -q 'https://github.com/JJo-0' dist/posts/ai-consciousness-deep-research-1/index.html
          ! grep -q 'x.com/intent\|t.me/share\|facebook.com/sharer' dist/posts/ai-consciousness-deep-research-1/index.html
          grep -q 'https://iconlab.skku.edu/cnrlab/index.do' dist/about/index.html
          grep -q 'https://www.kitech.re.kr/' dist/about/index.html
          grep -q 'https://ice.skku.edu/ice/grad_ece_intro.do' dist/about/index.html
          grep -q 'http://aml.tukorea.ac.kr/' dist/about/index.html
