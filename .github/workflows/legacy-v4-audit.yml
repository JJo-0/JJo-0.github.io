name: Final legacy normalization audit

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Baseline versus final normalized render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .astro /tmp/dist-baseline
          pnpm exec astro build >/tmp/base.log 2>&1
          cp -a dist /tmp/dist-baseline

          python scripts/_legacy-finalize-migration-v4.py
          rm -rf dist .astro
          pnpm exec astro build >/tmp/new.log 2>&1

          node scripts/rendered-markdown-audit.mjs
          node scripts/content-integrity.mjs
          node scripts/modern-ai-formula-audit.mjs

          test ! -d site/assets/image
          ! grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist '/image/' site/content src | grep .
          ! grep -RIl '/image/' dist | grep .

          python <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib
          import re
          import textwrap

          base = Path('/tmp/dist-baseline/posts')
          new = Path('dist/posts')
          expected_changed = {
              '2024-06-04-2024-06-04-2/index.html',
              '2025-02-07-human-pose-estimate/index.html',
              '2025-05-20-2025-05-20/index.html',
              '2025-05-23-deep-search-gemini/index.html',
              '2025-05-23-deep-search-travel-prompt/index.html',
              '2025-06-27-2025-06-27/index.html',
              '2025-07-23-2025-07-23-2/index.html',
              '2025-07-25-2025-07-25/index.html',
              'ai-consciousness-deep-research-1/index.html',
              'ai-consciousness-deep-research-2/index.html',
          }

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          before = {p.relative_to(base).as_posix(): p for p in base.rglob('index.html')}
          after = {p.relative_to(new).as_posix(): p for p in new.rglob('index.html')}
          changed = {
              rel for rel in set(before) | set(after)
              if rel not in before or rel not in after or digest(before[rel]) != digest(after[rel])
          }
          print('raw_changed=', sorted(changed))
          unexpected = changed - expected_changed
          if unexpected:
              raise SystemExit(f'unexpected raw post changes: {sorted(unexpected)}')

          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S | re.I)
          def article(text):
              m = article_re.search(text)
              return m.group(0) if m else text

          class Canonical(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.events = []
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  self.events.append(('s', tag, tuple(sorted((k, v or '') for k, v in attrs))))
                  self.stack.append(tag)
              def handle_startendtag(self, tag, attrs):
                  self.events.append(('v', tag, tuple(sorted((k, v or '') for k, v in attrs))))
              def handle_endtag(self, tag):
                  self.events.append(('e', tag))
                  if self.stack:
                      self.stack.pop()
              def handle_data(self, data):
                  parent = self.stack[-1] if self.stack else ''
                  if parent in {'script', 'style'}:
                      value = '\n'.join(line.rstrip() for line in textwrap.dedent(data).strip().splitlines())
                  else:
                      value = re.sub(r'\s+', ' ', data).strip()
                  if value:
                      self.events.append(('d', parent, value))
              def handle_comment(self, data):
                  pass

          def canonical(path):
              p = Canonical()
              p.feed(article(path.read_text(encoding='utf-8')))
              return p.events

          semantic_routes = {
              '2025-05-20-2025-05-20/index.html',
              '2025-05-23-deep-search-gemini/index.html',
              '2025-05-23-deep-search-travel-prompt/index.html',
              '2025-06-27-2025-06-27/index.html',
              '2025-07-23-2025-07-23-2/index.html',
              '2025-07-25-2025-07-25/index.html',
          }
          for rel in sorted(semantic_routes):
              b = canonical(before[rel])
              a = canonical(after[rel])
              print(f'semantic_equal {rel}={b == a} events_before={len(b)} events_after={len(a)}')
              if b != a:
                  for i in range(min(len(b), len(a))):
                      if b[i] != a[i]:
                          print('first_diff_event=', i, 'before=', repr(b[i])[:1000], 'after=', repr(a[i])[:1000])
                          break
                  raise SystemExit(f'raw HTML semantic mismatch: {rel}')

          # Inspect the two Korean adjacency repairs separately. The intended result is
          # two strong spans separated by a normal-text 조사 `과`.
          adjacency_expectations = {
              'ai-consciousness-deep-research-1/index.html': ('기능적 행동(Functional behavior)', '과', '주관적 경험(Phenomenal experience)'),
              'ai-consciousness-deep-research-2/index.html': ('기억의 지속성(memory persistence)', '과', '계산 주체의 지속성(causal continuity)'),
          }
          for rel, (left, particle, right) in adjacency_expectations.items():
              html = article(after[rel].read_text(encoding='utf-8'))
              expected = f'<strong>{left}</strong>{particle} <strong>{right}</strong>'
              ok = expected in html
              print(f'adjacent_strong_intended {rel}={ok}')
              if not ok:
                  raise SystemExit(f'intended adjacent strong DOM missing: {rel}')

              b = canonical(before[rel])
              a = canonical(after[rel])
              if b != a:
                  print(f'adjacent baseline differs in {rel}; showing first semantic event difference for audit')
                  for i in range(min(len(b), len(a))):
                      if b[i] != a[i]:
                          print('first_diff_event=', i, 'before=', repr(b[i])[:1000], 'after=', repr(a[i])[:1000])
                          break

          swallowed = []
          pattern = re.compile(r'<pre\b[^>]*data-language="plaintext"[^>]*>.*?&#x3C;(?:div|section|table|script|style)\b', re.S | re.I)
          for path in new.rglob('index.html'):
              if pattern.search(path.read_text(encoding='utf-8')):
                  swallowed.append(path.relative_to(new).as_posix())
          print('swallowed_html_routes=', swallowed)
          if swallowed:
              raise SystemExit(f'HTML remains swallowed as plaintext code: {swallowed}')
          PY
