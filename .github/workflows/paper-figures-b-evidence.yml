name: Additional paper figure evidence
on:
  push:
    branches: [ops/paper-figures-20260917-b]
    paths: [.github/workflows/paper-figures-b-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/paper-figures-20260917-b'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7 Pillow==11.3.0
      - name: Acquire primary PDF versions and inspect selected caption pages
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,re,subprocess,time,urllib.request,zipfile
          from pathlib import Path
          import fitz
          out=Path('additional-evidence');out.mkdir()
          papers=[('cfg','2207.12598v1',[4]),('ldm','2112.10752v2',[3]),('score-sde','2011.13456v2',[1,2]),('moco','1911.05722v3',[1,2]),('byol','2006.07733v3',[2]),('barlow-twins','2103.03230v3',[1]),('deepcluster','1807.05520v2',[1]),('swav','2006.09882v5',[1])]
          def acquire(row):
              key,version,numbers=row
              url='https://arxiv.org/pdf/'+version
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 paper-figure-source-review'}),timeout=90) as response:
                  data=response.read();final=response.url
              assert data.startswith(b'%PDF-'),url
              doc=fitz.open(stream=data,filetype='pdf')
              matches=[]
              for index,page in enumerate(doc):
                  text=page.get_text()
                  if index<10 and any(re.search(r'(?im)^\s*(?:Figure|Fig\.?)\s*'+str(n)+r'\s*[:.]',text) for n in numbers):
                      page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(out/f'{key}-page-{index+1}.png')
                      (out/f'{key}-page-{index+1}.json').write_text(json.dumps({'page':index+1,'rect':list(page.rect),'blocks':page.get_text('blocks')},ensure_ascii=False,indent=2))
                      matches.append(index+1)
              (out/f'{key}-text.txt').write_text('\n'.join(p.get_text() for p in doc))
              return {'key':key,'version':version,'url':url,'finalUrl':final,'pdfSha256':hashlib.sha256(data).hexdigest(),'pages':len(doc),'requestedFigures':numbers,'matchedPages':matches}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              receipts=list(pool.map(acquire,papers))
          (out/'sources.json').write_text(json.dumps(receipts,indent=2)+'\n')
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  p=Path(name)
                  if p.is_file() and not name.startswith('.github/workflows/paper-figures-b-'):
                      z.write(p,name)
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: additional-paper-figure-evidence
          path: additional-evidence/
          retention-days: 7
          if-no-files-found: error
