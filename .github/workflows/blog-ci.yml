name: Blog CI

on:
  push:
    branches: [main]
    paths:
      - 'spaceship-ui/**'
      - 'scripts/normalize_tags.py'
      - '.github/workflows/blog-ci.yml'
      - '.github/workflows/blog-pages-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spaceship-ui/**'
      - 'scripts/normalize_tags.py'
      - '.github/workflows/blog-ci.yml'
      - '.github/workflows/blog-pages-deploy.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional deployed site URL for the full browser smoke matrix'
        required: false
        default: ''
        type: string

concurrency:
  group: blog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Taxonomy contract
        run: pnpm taxonomy:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: SEO metadata check
        run: pnpm seo:check

      - name: Build
        run: pnpm build

      - name: Content integrity check
        run: pnpm content:check

      - name: Live Robotics anchor diagnostic
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/pages-live-anchor-diagnostic'
        timeout-minutes: 2
        env:
          JJO_SMOKE_BASE_URL: 'https://jjo-0.github.io/'
          JJO_SMOKE_REQUIRE_GPU: '0'
        run: pnpm exec node scripts/live-anchor-diagnostic.mjs

      - name: Browser smoke matrix
        timeout-minutes: 10
        # Semantically identical to `pnpm browser:smoke`, but the exit guard is
        # scoped to this Node process instead of leaking through NODE_OPTIONS.
        # `workflow_dispatch.inputs.base_url` is deliberately normalized into an
        # ordinary environment variable instead of being interpolated inside
        # any shell script body.
        env:
          JJO_SMOKE_REQUIRE_GPU: '0'
          JJO_SMOKE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || '' }}
        run: pnpm exec node --import ./scripts/browser-smoke-exit-guard.mjs scripts/browser-smoke.mjs
