name: Blog CI

on:
  push:
    branches: [main]
    paths:
      - 'spaceship-ui/**'
      - '.github/workflows/blog-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spaceship-ui/**'
      - '.github/workflows/blog-ci.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spaceship-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: SEO metadata check
        run: pnpm seo:check

      - name: Build
        run: pnpm build

      - name: Content integrity check
        shell: bash
        run: |
          set +e
          pnpm content:check 2>&1 | tee part2-content-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Part II debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-ai-part2-debug
          path: |
            spaceship-ui/part2-content-check.log
            spaceship-ui/dist/posts/2026-08-18-modern-artificial-intelligence-2/index.html
            spaceship-ui/site/content/posts/modern-artificial-intelligence-2.mdx
            spaceship-ui/src/data/modern-ai-part2
          retention-days: 1
