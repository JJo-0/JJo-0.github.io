name: Blog CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'spaceship-ui/**'
      - 'scripts/normalize_tags.py'
      - '.github/workflows/blog-ci.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize verified Part V payload once
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/modern-ai-part5-source-acquisition main
          git checkout -B agent/modern-ai-part5-source-acquisition origin/agent/modern-ai-part5-source-acquisition

          mkdir -p /tmp/p5chunks
          expected=(
            f56605001e5309811a8675d041ed3927064a5cc347ec7ae3106b8278ad1c7706
            b8b55e19108a38d63a8d60e7808d55e416276eb2de2a866c7adbf2222ebacc62
            158dbe03bea2b1f6ce9af84c4be3e7df2733f33845819777823115000a2bbb5f
            cff52c7a0dbb18bdabd40ecdef84c46366f1d0854851c2266459d4755b7a0ef8
            089487443bf323ec3de690b052616e1893ff18d9cf6cabc1cd66678bc6d71aa2
            08d438189089fae8082371b2869fd96c4e817ab9b0d36168f7fadab8c72898c4
            469dce8e7ea23914156507f549b6d249be8ca5c37e9a3af7153a0bcea92e8ccb
          )

          for idx in 00 01 02 03 05; do
            head -c 8000 ".part5-materialize/chunk-${idx}" > "/tmp/p5chunks/${idx}"
            got="$(sha256sum "/tmp/p5chunks/${idx}" | awk '{print $1}')"
            n=$((10#$idx))
            test "$got" = "${expected[$n]}" || { echo "chunk $idx SHA mismatch: $got"; exit 1; }
          done

          python3 - <<'PY'
          from pathlib import Path
          source = Path('.part5-materialize/chunk-04').read_text()
          if len(source) != 8001 or source[5887] != 'i':
              raise SystemExit(f'chunk 04 unexpected shape: len={len(source)}, char={source[5887:5888]!r}')
          Path('/tmp/p5chunks/04').write_text(source[:5887] + source[5888:])
          PY
          test "$(sha256sum /tmp/p5chunks/04 | awk '{print $1}')" = "${expected[4]}"

          head -c 2600 .part5-materialize/chunk-06 > /tmp/p5chunks/06
          test "$(sha256sum /tmp/p5chunks/06 | awk '{print $1}')" = "${expected[6]}"
          cat /tmp/p5chunks/{00,01,02,03,04,05,06} > /tmp/part5-payload.b64
          test "$(wc -c < /tmp/part5-payload.b64)" -eq 50600
          test "$(sha256sum /tmp/part5-payload.b64 | awk '{print $1}')" = "cb20c6193faeeb28716615a169c31ba6eb700bd6b4ef58381163a8fed7112140"
          base64 --decode /tmp/part5-payload.b64 > /tmp/part5-payload.tgz
          test "$(sha256sum /tmp/part5-payload.tgz | awk '{print $1}')" = "039cc1eba44f82567907ed2697315b7b03c2099f360b05eb3f1911ed5547d15d"

          rm -rf _part5_payload
          mkdir _part5_payload
          tar -xzf /tmp/part5-payload.tgz -C _part5_payload

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          payload = root / '_part5_payload' / 'files'
          for src in payload.rglob('*'):
              if src.is_dir():
                  continue
              rel = src.relative_to(payload)
              dst = root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          for rel in [
              'spaceship-ui/src/data/modern-ai-part5/source-acquisition.json',
              'spaceship-ui/scripts/modern-ai-part5-acquisition-audit.mjs',
          ]:
              p = root / rel
              if p.exists():
                  p.unlink()

          def replace_exact(path, old, new, label):
              p = root / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'spaceship-ui/package.json',
              '    "modern-ai:part5-acquisition-check": "node scripts/modern-ai-part5-acquisition-audit.mjs",\n'
              '    "modern-ai:part5-acquisition-ready": "node scripts/modern-ai-part5-acquisition-audit.mjs --require-complete",\n',
              '    "modern-ai:part5-check": "node scripts/modern-ai-part5-audit.mjs && node scripts/modern-ai-part5-provenance-audit.mjs",\n',
              'package Part V scripts',
          )
          replace_exact(
              'spaceship-ui/package.json',
              ' && pnpm modern-ai:part5-acquisition-check && pnpm formula-guide:check',
              ' && pnpm modern-ai:part5-check && pnpm formula-guide:check',
              'package content check',
          )

          tax_path = root / 'scripts/normalize_tags_current.py'
          tax = tax_path.read_text(encoding='utf-8')
          if '"modern-artificial-intelligence-5.mdx"' not in tax:
              marker = '''        "modern-artificial-intelligence-4.mdx": Taxonomy(
            "ai-machine-learning",
            "optimization",
            "study-note",
            (
                "gradient-descent",
                "convex-optimization",
                "accelerated-optimization",
                "preconditioning",
                "logistic-regression",
            ),
            "ml-foundations-evaluation",
            True,
            6,
        ),
'''
              addition = marker + '''        "modern-artificial-intelligence-5.mdx": Taxonomy(
            "ai-machine-learning",
            "image-classification",
            "study-note",
            (
                "image-classification",
                "convolutional-neural-network",
                "imagenet",
                "vision-transformer",
                "foundation-model",
            ),
            "ml-foundations-evaluation",
            True,
            7,
        ),
'''
              if tax.count(marker) != 1:
                  raise SystemExit('taxonomy: Part IV anchor not unique')
              tax_path.write_text(tax.replace(marker, addition, 1), encoding='utf-8')

          reg_path = root / 'spaceship-ui/src/lib/formula-lessons/registry.mjs'
          reg = reg_path.read_text(encoding='utf-8')
          if 'modern-ai-part5/formula-ledger.json' not in reg:
              import_anchor = "import part4FormulaLedger from '../../data/modern-ai-part4/formula-ledger.json';\n"
              if reg.count(import_anchor) != 1:
                  raise SystemExit('registry: Part IV import anchor not unique')
              reg = reg.replace(import_anchor, import_anchor + "import part5FormulaLedger from '../../data/modern-ai-part5/formula-ledger.json';\n", 1)

              display_anchor = '''  ...part4ReviewCorrections.corrections.filter((formula) => formula.display === 'display').map((formula) => ({
    formulaId: formula.formulaId,
    part: 4,
    sourceStatus: formula.status,
    pdfPage: formula.pdfPage,
    articleSection: formula.articleSection,
  })),
];
'''
              display_new = '''  ...part4ReviewCorrections.corrections.filter((formula) => formula.display === 'display').map((formula) => ({
    formulaId: formula.formulaId,
    part: 4,
    sourceStatus: formula.status,
    pdfPage: formula.pdfPage,
    articleSection: formula.articleSection,
  })),
  ...part5FormulaLedger.formulas.filter((formula) => formula.display === 'display').map((formula) => ({
    formulaId: formula.formulaId,
    part: 5,
    sourceStatus: formula.status,
    pdfPage: formula.pdfPage,
    articleSection: formula.articleSection,
  })),
];
'''
              if reg.count(display_anchor) != 1:
                  raise SystemExit('registry: display anchor not unique')
              reg = reg.replace(display_anchor, display_new, 1)

              count_anchor = '''  part4:DISPLAY_FORMULAS.filter((formula)=>formula.part===4).length,
  approved:ALL_APPROVED_FORMULA_IDS.length,
'''
              count_new = '''  part4:DISPLAY_FORMULAS.filter((formula)=>formula.part===4).length,
  part5:DISPLAY_FORMULAS.filter((formula)=>formula.part===5).length,
  approved:ALL_APPROVED_FORMULA_IDS.length,
'''
              if reg.count(count_anchor) != 1:
                  raise SystemExit(f'registry: count anchor expected 1, got {reg.count(count_anchor)}')
              reg = reg.replace(count_anchor, count_new, 1)
              reg_path.write_text(reg, encoding='utf-8')
          PY

          rm -rf .part5-materialize _part5_payload
          rm -f .github/workflows/part5-materialize-once.yml

          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/README.md | awk '{print $1}')" = "51a812c9887548480a37bba0075bfbc41a1012cda0f586579e3b4b73c52a0dfb"
          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/content-ledger.json | awk '{print $1}')" = "9c8f21ac04b9ec8b5b158b42be821e28564274212bde2ee119b6c6d32e6a50aa"
          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/content-provenance.json | awk '{print $1}')" = "7ad3aa5b11a30a7a6fd6c618efb3c2464f68067d8991106ee51f182b6822f893"
          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/formula-ledger.json | awk '{print $1}')" = "a2a061091e5275d86bbf16f89cbed3873d4e1944916a5f4602052241b6d216b6"
          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/page-ledger.json | awk '{print $1}')" = "ff782e3f4c534b88e9c626ac5d6667fdf2e3f8a1f7e19f20e644732f7975d0a1"
          test "$(sha256sum spaceship-ui/src/data/modern-ai-part5/source-audit.json | awk '{print $1}')" = "930f0c906f91bf94ebaef9109ffb1461d9bdf1152efc3614b1c868d922fe02f8"
          test "$(sha256sum spaceship-ui/src/lib/modern-ai-part5.ts | awk '{print $1}')" = "83acf55939a7c946c2bba8d878a7a3e0518b76f16ea2981f5a1ee4a72c8c22fc"
          test "$(sha256sum spaceship-ui/scripts/modern-ai-part5-audit.mjs | awk '{print $1}')" = "bfd4fdae09dd7fbbad9b5e4700892093d24deadc7b2f97c2b336252a6e1bee27"
          test "$(sha256sum spaceship-ui/scripts/modern-ai-part5-provenance-audit.mjs | awk '{print $1}')" = "c720170f7c4733c5c8cdf7e2d75a8abc2251f500e394b2d5f32c3f6825f3bcaf"
          test "$(sha256sum spaceship-ui/site/content/posts/modern-artificial-intelligence-5.mdx | awk '{print $1}')" = "965e29d7e57a258b06d08fe432c14bc743a0587f8fe96d5c26747b71a66f12e2"

          git show origin/main:.github/workflows/blog-ci.yml > .github/workflows/blog-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: reconstruct Modern AI Part V from source PDF"
          git push origin HEAD:agent/modern-ai-part5-source-acquisition
