name: September 19 candidate source evidence
on:
  push:
    branches: [ops/candidates-20260919-sources]
    paths: [.github/workflows/candidates-sep19-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 PyMuPDF Pillow
      - name: Collect articles, original figures and public repository text
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,subprocess,zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests,fitz
          from bs4 import BeautifulSoup
          out=Path('candidate-sources');out.mkdir()
          papers={'neural':'s41593-026-02433-7','walker':'s41557-026-02240-4','whisker':'s41467-026-77366-7'}
          receipts=[]
          def get(url):
              return requests.get(url,headers={'User-Agent':'Mozilla/5.0 scholarly review'},timeout=50)
          def collect(item):
              key,doi=item; folder=out/key;folder.mkdir()
              base='https://www.nature.com/articles/'+doi
              records=[]
              for suffix in ['', '.pdf']:
                  url=base+suffix
                  try:
                      r=get(url); data=r.content
                      row={'url':url,'status':r.status_code,'contentType':r.headers.get('content-type'),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
                      records.append(row)
                      if suffix:
                          row['validPdf']=data.startswith(b'%PDF-')
                          if not row['validPdf']:continue
                          (folder/'paper.pdf').write_bytes(data)
                          doc=fitz.open(stream=data,filetype='pdf')
                          (folder/'paper.txt').write_text('\n'.join(f'PAGE {i+1}\n'+p.get_text() for i,p in enumerate(doc)))
                          row['pages']=len(doc)
                          continue
                      soup=BeautifulSoup(r.text,'html.parser')
                      article=soup.find('article')
                      row['hasArticle']=article is not None
                      (folder/'page.html').write_text(r.text)
                      (folder/'page.txt').write_text(soup.get_text('\n',strip=True))
                      figures=[]
                      for fig in soup.find_all('figure'):
                          cap=fig.find('figcaption');img=fig.find('img')
                          if not img or not cap:continue
                          src=img.get('src')
                          if not src:continue
                          href=next((a.get('href') for a in fig.find_all('a',href=True) if 'springernature' in a['href']),None)
                          figures.append({'id':fig.get('id'),'caption':cap.get_text(' ',strip=True),'src':urljoin(base,href or src)})
                      (folder/'figures.json').write_text(json.dumps(figures,indent=2))
                      for j,f in enumerate(figures):
                          try:
                              ir=get(f['src']);f['status']=ir.status_code
                              if ir.ok and ir.headers.get('content-type','').startswith('image/'):
                                  name=f'figure-{j+1}'+('.png' if 'png' in ir.headers['content-type'] else '.jpg')
                                  (folder/name).write_bytes(ir.content)
                                  f.update(file=name,sha256=hashlib.sha256(ir.content).hexdigest())
                          except Exception as e:f['error']=str(e)
                      (folder/'figures.json').write_text(json.dumps(figures,indent=2))
                  except Exception as e:records.append({'url':url,'error':str(e)})
              return {'paper':key,'requests':records}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              receipts=list(pool.map(collect,papers.items()))
          (out/'receipts.json').write_text(json.dumps(receipts,indent=2))
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  p=Path(name)
                  if p.is_file() and p.suffix in {'.mdx','.md','.mjs','.js','.ts','.astro','.svelte','.json','.yml','.yaml','.css','.py'}:z.write(p,name)
          print(json.dumps(receipts,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: september19-candidate-primary-sources
          path: candidate-sources/
          retention-days: 3
          if-no-files-found: error
