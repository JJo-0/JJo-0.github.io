name: Paper2Agent original figures
on:
  push:
    branches: [ops/paper2agent-evidence-20260918]
    paths: [.github/workflows/paper2agent-images.yml]
permissions:
  contents: write
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download two exact preprint figures and create unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,urllib.request
          from pathlib import Path
          from PIL import Image
          out=Path('paper2agent-originals');out.mkdir()
          sources=[('paper2agent-overview',1,'Fig1_workflow.png'),('paper2agent-scanpy',4,'Fig4_scanpy.png')]
          records=[]
          for mid,number,remote in sources:
              url='https://arxiv.org/html/2509.06917v2/'+remote
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 scholarly-source-review'})
              with urllib.request.urlopen(req,timeout=45) as response:raw=response.read()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n')
              image=Image.open(io.BytesIO(raw));image.load()
              assert image.width>500 and image.height>300
              # Keep original dimensions, pixels and panels. Lossless encoding only.
              path=out/(mid+'.webp');image.convert('RGB').save(path,'WEBP',lossless=True,method=6)
              data=path.read_bytes()
              assert Image.open(path).convert('RGB').tobytes()==image.convert('RGB').tobytes()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/JJo-0/JJo-0.github.io/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:blob=json.load(response)
              records.append({'id':mid,'figure':number,'file':path.name,'imageSource':url,'source':'https://arxiv.org/html/2509.06917v2#'+('S1.F1' if number==1 else 'S2.F4'),'version':'2509.06917v2','sourceDate':'2025-10-16','license':'CC BY 4.0','rights':'https://creativecommons.org/licenses/by/4.0/','credit':'Jiacheng Miao, Joe R. Davis, Yaohui Zhang, Jonathan K. Pritchard, James Zou','width':image.width,'height':image.height,'sourceSha256':hashlib.sha256(raw).hexdigest(),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'blob':blob['sha'],'changes':'원본 크기와 모든 패널 유지, RGB 픽셀 동등성을 확인한 무손실 WebP 변환. 한국어 설명 별도 작성.'})
          (out/'originals.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper2agent-original-figures
          path: paper2agent-originals/
          retention-days: 14
          if-no-files-found: error
