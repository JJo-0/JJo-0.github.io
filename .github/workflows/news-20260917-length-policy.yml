name: NEWS minimum-length policy
on:
  push:
    branches: [content/news-20260917-rubin-bio]
    paths: [.github/workflows/news-20260917-length-policy.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply narrowly to three known feature branches, never main
        shell: python
        run: |
          from pathlib import Path
          import subprocess,re,os,json
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          git('config','user.name','JJo Editorial');git('config','user.email','76779256+JJo-0@users.noreply.github.com')
          branches=[('fix/news-citations-older-20260916','d5efb6e03fd7e65a606620688e45018393d926cc'),('fix/news-citations-recent-20260916','6c6f78f4a16aaffb82ec0a15ef9fda2574dd7ab3'),('content/news-20260917-rubin-bio',os.environ['GITHUB_SHA'])]
          module="""import assert from 'node:assert/strict';
          // User policy updated 2026-09-17: visible editorial prose >= 7,000;
          // no upper ceiling. Each article keeps its existing prose extractor.
          export function assertNewsProseLength(length, label = 'NEWS') {
            assert(Number.isSafeInteger(length) && length >= 7000,
              `${label}: at least 7,000 prose characters required; got ${length}`);
          }
          """
          tests="""import assert from 'node:assert/strict';
          import { assertNewsProseLength } from './news-prose-policy.mjs';
          for (const length of [7000, 10000, 10001, 50000]) assert.doesNotThrow(() => assertNewsProseLength(length));
          for (const length of [6999, 0, -1, NaN, Infinity, true, '7000', 7000.5]) assert.throws(() => assertNewsProseLength(length));
          console.log('news-prose-policy: PASS 7000 minimum, >10000 allowed, invalid counts rejected');
          """
          files=['news-20260915-contract.mjs','news-20260916-contract.mjs','news-justgrpo-visual-contract.mjs','news-sep11-release-contract.mjs','news-sulfur-visual-contract.mjs']
          receipts=[]
          for branch,expected in branches:
            git('fetch','--no-tags','origin',branch)
            assert git('rev-parse','FETCH_HEAD')==expected,'Concurrent change on '+branch
            git('switch','--detach',expected)
            root=Path('spaceship-ui/scripts');changed=[]
            for filename in files:
              path=root/filename;text=path.read_text()
              pattern=r'assert\((prose\.length|length)\s*>=\s*(?:7000|8000)\s*&&\s*(?:prose\.length|length)\s*<=\s*10000(?:,[^\n]*?)?\);'
              text,n=re.subn(pattern,lambda m:f'assertNewsProseLength({m[1]}, '+json.dumps(filename)+');',text)
              assert n==1,(branch,filename,n)
              text="import { assertNewsProseLength } from './news-prose-policy.mjs';\n"+text
              text=text.replace('7,000–10,000','7,000+').replace('8,000–10,000','7,000+')
              path.write_text(text);changed.append(str(path))
            for filename,text in [('news-prose-policy.mjs',module),('news-prose-policy.test.mjs',tests)]:
              path=root/filename;assert not path.exists();path.write_text(text);changed.append(str(path))
            path=root/'news-visual-contract.mjs';text=path.read_text();assert 'news-prose-policy.test.mjs' not in text
            path.write_text("import './news-prose-policy.test.mjs';\n"+text);changed.append(str(path))
            subprocess.run(['node','spaceship-ui/scripts/news-prose-policy.test.mjs'],check=True)
            subprocess.run(['node','spaceship-ui/scripts/news-sulfur-visual-contract.mjs'],check=True)
            git('add','--',*changed)
            if branch.startswith('content/'):
              git('rm','.github/workflows/news-20260917-length-policy.yml')
            git('diff','--cached','--check')
            git('commit','-m','fix: honor NEWS prose minimum of 7000 with no upper limit (#126)')
            git('push','origin','HEAD:refs/heads/'+branch)
            receipts.append({'branch':branch,'before':expected,'after':git('rev-parse','HEAD'),'files':changed})
          print(json.dumps(receipts,indent=2))
