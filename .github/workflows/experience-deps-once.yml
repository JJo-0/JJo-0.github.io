name: One-time experience dependency integration

on:
  push:
    branches: [agent/experience-motion-foundation-phase123]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experience-motion-foundation-phase123
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spaceship-ui/pnpm-lock.yaml
      - name: Add GSAP and experience contract
        working-directory: spaceship-ui
        shell: bash
        run: |
          pnpm add gsap@^3.13.0 --save-prod
          node <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts['experience:check'] = 'node scripts/experience-contract.mjs';
          if (!packageJson.scripts['content:check'].includes('pnpm experience:check')) {
            packageJson.scripts['content:check'] = `${packageJson.scripts['content:check']} && pnpm experience:check`;
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const cssPath = 'src/styles/global.css';
          const css = fs.readFileSync(cssPath, 'utf8');
          const importLine = "@import './experience.css';";
          if (!css.includes(importLine)) {
            fs.writeFileSync(cssPath, `${importLine}\n${css}`);
          }
          NODE
          pnpm exec prettier --write package.json src/styles/global.css
      - name: Commit generated dependency and contract wiring
        shell: bash
        run: |
          if git diff --quiet -- spaceship-ui/package.json spaceship-ui/pnpm-lock.yaml spaceship-ui/src/styles/global.css; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spaceship-ui/package.json spaceship-ui/pnpm-lock.yaml spaceship-ui/src/styles/global.css
          git commit -m "chore: wire GSAP experience runtime and contract"
          git push origin HEAD:agent/experience-motion-foundation-phase123
