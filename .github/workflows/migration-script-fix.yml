name: Repair legacy migration callback

on:
  push:
    branches: [agent/legacy-content-finalize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-content-finalize
      - name: Repair callback counter
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/legacy-content-migration.yml')
          text = path.read_text(encoding='utf-8')
          old = """              replacements = 0

              def repl(match):
                  nonlocal replacements
                  inner = match.group(1)
                  after = text[match.end():match.end()+1]
                  if inner in known_inner or (after and hangul.fullmatch(after)):
                      replacements += 1
                      return f'<strong>{inner}</strong>'
                  return match.group(0)

              new_text = strong_re.sub(repl, text)
              if replacements:
                  print(f'normalized literal strong {name}: {replacements}')
                  path.write_text(new_text, encoding='utf-8')
"""
          new = """              replacements = [0]

              def repl(match):
                  inner = match.group(1)
                  after = text[match.end():match.end()+1]
                  if inner in known_inner or (after and hangul.fullmatch(after)):
                      replacements[0] += 1
                      return f'<strong>{inner}</strong>'
                  return match.group(0)

              new_text = strong_re.sub(repl, text)
              if replacements[0]:
                  print(f'normalized literal strong {name}: {replacements[0]}')
                  path.write_text(new_text, encoding='utf-8')
"""
          if old not in text:
              print('Migration callback already repaired; no change.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/legacy-content-migration.yml
          git commit -m 'fix: repair legacy migration callback scope'
          git push origin HEAD:agent/legacy-content-finalize
