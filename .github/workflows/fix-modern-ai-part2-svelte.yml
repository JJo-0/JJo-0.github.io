name: Fix Modern AI Part II Svelte lint

on:
  push:
    branches:
      - agent/modern-ai-part-2-source-complete-v2
    paths:
      - .github/workflows/fix-modern-ai-part2-svelte.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-ai-part-2-source-complete-v2
          fetch-depth: 0

      - name: Apply targeted lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('spaceship-ui/src/components/modern-ai/Part2LearningLab.svelte')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "  function bayesBoundary() {\n    const p1 = Math.max(0.01, prior / 100);\n    const p2 = Math.max(0.01, 1 - p1);":
              "  function bayesBoundary(priorValue: number, sigmaOne: number, sigmaTwo: number) {\n    const p1 = Math.max(0.01, priorValue / 100);\n    const p2 = Math.max(0.01, 1 - p1);",
              "      const gap = Math.abs(p1 * gaussian(x, -1.25, sigma1) - p2 * gaussian(x, 1.15, sigma2));":
              "      const gap = Math.abs(p1 * gaussian(x, -1.25, sigmaOne) - p2 * gaussian(x, 1.15, sigmaTwo));",
              "  $: boundary = bayesBoundary();":
              "  $: boundary = bayesBoundary(prior, sigma1, sigma2);",
              "  $: midpointX = 28 + ((-0.05 + 4) / 8) * 310;":
              "  const midpointX = 28 + ((-0.05 + 4) / 8) * 310;",
              "        {#each points as point}":
              "        {#each points as point (point[0])}",
              "        {#each foldItems as item}":
              "        {#each foldItems as item (item)}",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-modern-ai-part2-svelte.yml

      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix Modern AI Part II Svelte reactivity and keyed loops'
          git push origin HEAD:agent/modern-ai-part-2-source-complete-v2
