name: Prepare Self-Improving lesson media
on:
  push:
    branches: ['content/self-improving-ai-04']
    paths:
      - 'docs/self-improving-ai/tools/render_04_05.py'
      - 'docs/self-improving-ai/tools/compile_04_05.py'
      - '.github/workflows/self-improving-media-preparation.yml'
permissions:
  contents: write
concurrency:
  group: self-improving-media-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'JJo-0/JJo-0.github.io' && github.actor == 'JJo-0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned rendering dependencies
        run: python -m pip install 'PyMuPDF==1.26.6' 'Pillow==11.3.0'
      - name: Render and compile the scoped lessons
        run: |
          python docs/self-improving-ai/tools/render_04_05.py
          python docs/self-improving-ai/tools/compile_04_05.py
      - name: Commit only the two lessons and their supporting records
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/content/self-improving-ai-04'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/self-improving-ai/source-assets/04/manifest.json docs/self-improving-ai/source-assets/05/manifest.json docs/self-improving-ai/progress.json docs/self-improving-ai/publishing/2026-11-16-chapters-04-05-request.json docs/self-improving-ai/reviews/2026-11-16-chapters-04-05-preparation.json scripts/normalize_tags_current.py spaceship-ui/site/content/posts/self-improving-ai-03-self-correction-to-rl.mdx
          for slug in self-improving-ai-04-sparse-rewards-and-shaping self-improving-ai-05-reward-design-to-ai-feedback; do
            git add -- "spaceship-ui/site/assets/assets/posts/$slug" "spaceship-ui/site/content/posts/$slug.mdx"
          done
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only
          git commit -m 'content: prepare Self-Improving 04 and 05 for production checks'
          git push origin HEAD:refs/heads/content/self-improving-ai-04
