name: Acquire original VI VIII figures
on:
  push:
    branches: [content/modern-ai-vi-fcn-unet-20260917]
    paths: [.github/workflows/modern-ai-originals-acquire.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.4 Pillow==11.3.0
      - name: Retrieve exact sources; render planned excerpts for inspection
        run: |
          python - <<'PY'
          import hashlib,io,json,time,urllib.request,zipfile,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          import fitz
          from PIL import Image
          out=Path('original-figure-review');out.mkdir()
          rows=[
            ('pspnet-fig-3','1612.01105v2','https://arxiv.org/html/1612.01105v2/pspnet-eps-converted-to.png',None,None),
            ('deeplabv3-fig-5','1706.05587v3','https://arxiv.org/html/1706.05587v3/model_aspp.png',None,None),
            ('deeplabv3plus-fig-2','1802.02611v3','https://arxiv.org/html/1802.02611v3/model_illustration.png',None,None),
            ('vae-fig-1','1312.6114v11','https://arxiv.org/pdf/1312.6114v11',2,[.41,.092,.59,.221]),
            ('ddpm-fig-2','2006.11239v2','https://arxiv.org/pdf/2006.11239v2',2,[.242,.083,.752,.151]),
            ('simclr-fig-2','2002.05709v3','https://arxiv.org/pdf/2002.05709v3',2,[.535,.077,.87,.27]),
            ('clip-fig-1','2103.00020v1','https://arxiv.org/html/2103.00020v1/main-diagrams.png',None,None),
          ]
          receipts=[]
          for key,version,url,page_number,crop in rows:
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 scholarly-figure-review'}),timeout=60) as response:
                          assert response.status==200
                          raw=response.read(50*1024*1024+1);resolved=response.geturl()
                      assert len(raw)<=50*1024*1024
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(3)
              record={'id':key,'version':version,'source_url':url,'resolved_source':resolved,'source_sha256':hashlib.sha256(raw).hexdigest(),'acquired_at':datetime.now(timezone.utc).isoformat()}
              if page_number:
                  assert raw.startswith(b'%PDF-')
                  doc=fitz.open(stream=raw,filetype='pdf');page=doc[page_number-1]
                  (out/(key+'-source.pdf')).write_bytes(raw)
                  page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(out/(key+'-page.png'))
                  (out/(key+'-page.json')).write_text(json.dumps({'rect':list(page.rect),'blocks':page.get_text('blocks')},ensure_ascii=False))
                  w,h=page.rect.width,page.rect.height
                  x0,y0,x1,y1=crop;rect=fitz.Rect(x0*w,y0*h,x1*w,y1*h)
                  page.get_pixmap(matrix=fitz.Matrix(3,3),clip=rect,alpha=False).save(out/(key+'.png'))
                  record.update(page=page_number,crop_normalized=crop,crop_points=list(rect))
              else:
                  assert raw.startswith(b'\x89PNG\r\n\x1a\n')
                  with Image.open(io.BytesIO(raw)) as im: im.verify()
                  (out/(key+'.png')).write_bytes(raw)
              with Image.open(out/(key+'.png')) as im:
                  assert im.width>=120 and im.height>=70
                  record.update(width=im.width,height=im.height)
              record['sha256']=hashlib.sha256((out/(key+'.png')).read_bytes()).hexdigest()
              receipts.append(record);print(json.dumps(record))
          (out/'receipts.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2))
          (out/'tested-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'repository-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  p=Path(name)
                  if p.is_file() and '.git' not in p.parts: z.write(p,name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-vi-viii-figures-review
          path: original-figure-review/
          retention-days: 3
          if-no-files-found: error
