name: Sep22 integrated publication review
on:
  push:
    branches: [ops/sep22-source-review]
    paths: [.github/workflows/sep22-stage.yml]
permissions:
  contents: write
jobs:
  staging:
    if: github.ref == 'refs/heads/ops/sep22-source-review'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
