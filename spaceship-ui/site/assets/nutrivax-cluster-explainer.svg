<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">NutriVax가 비교한 서비스와 조사 대상</title>
  <desc id="desc">20개 지역을 무작위 배정해 두 서비스 전략을 비교했다. 영양보충은 접종 수락을 조건으로 하지 않았고 결과는 가구 조사에서 접종카드로 확인했다.</desc>
  <rect width="920" height="340" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#17212b" text-anchor="middle">
    <text x="460" y="36" font-size="23" font-weight="650">배정 단위는 지역, 관찰 단위는 아동</text>
    <text x="460" y="74" font-size="18">20개 지역을 무작위로 두 군에 배정</text>
    <path d="M460 86V105M230 105H690M230 105V123M690 105V123" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="55" y="125" width="350" height="80" rx="6" fill="#f1f5f9" stroke="#a0aec0"/>
    <rect x="515" y="125" width="350" height="80" rx="6" fill="#eef6f3" stroke="#7faaa0"/>
    <text x="230" y="155" font-size="20" font-weight="600">대조군 · 10개 지역</text>
    <text x="230" y="183" font-size="18">정기 예방접종 서비스</text>
    <text x="690" y="155" font-size="20" font-weight="600">NutriVax · 10개 지역</text>
    <text x="690" y="183" font-size="18">정기 예방접종 + 영양보충 제공</text>
    <text x="690" y="230" font-size="16">접종을 거절해도 영양보충 수령 가능</text>
    <path d="M230 205V251H690V240M460 251V264" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="460" y="287" font-size="18">시작·종료 시점의 별도 가구 조사에서 12–23개월 아동의 접종카드 확인</text>
    <text x="460" y="324" font-size="12" fill="#667085">독립 제작한 방법 설명도 · 연구 사진이나 원문 도판의 복제가 아님</text>
  </g>
</svg>
