<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="460" height="480" role="img" aria-labelledby="title desc">
<title id="title">NutriVax가 비교한 서비스와 조사 대상</title><desc id="desc">지역 단위로 두 전략을 무작위 배정하고 두 차례 별도의 가구 조사에서 아동의 접종카드를 확인했다.</desc>
<rect width="460" height="480" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#17212b" text-anchor="middle">
<path d="M230 77V91H18V249H30M18 142H30M422 142H440V316M422 249H440" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="30" y="104" width="392" height="76" rx="7" fill="#f1f5f9" stroke="#819485"/>
<rect x="30" y="200" width="392" height="98" rx="7" fill="#eef6f3" stroke="#819485"/>
<rect x="30" y="335" width="392" height="83" rx="7" fill="#f1f5f9" stroke="#819485"/>
<path d="M440 316H230v19" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="230" y="37" font-size="19" font-weight="650">배정 단위는 지역, 관찰 단위는 아동</text>
<text x="230" y="70" font-size="17" font-weight="400">20개 지역을 무작위 배정</text>
<text x="230" y="133" font-size="18" font-weight="600">대조군 · 10개 지역</text>
<text x="230" y="163" font-size="16" font-weight="400">정기 예방접종 서비스</text>
<text x="230" y="229" font-size="18" font-weight="600">NutriVax · 10개 지역</text>
<text x="230" y="256" font-size="16" font-weight="400">정기 예방접종 + 영양보충 제공</text>
<text x="230" y="279" font-size="14" font-weight="400">접종을 거절해도 영양보충 수령 가능</text>
<text x="230" y="365" font-size="17" font-weight="600">시작·종료 시점의 별도 가구 조사</text>
<text x="230" y="394" font-size="16" font-weight="400">생후 12–23개월 아동의 접종카드 확인</text>
<text x="230" y="454" font-size="12" font-weight="400">독립 제작한 방법 설명도</text>
