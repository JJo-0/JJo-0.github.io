<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">NutriVax service groups and survey population</title>
  <desc id="desc">Twenty communities were randomized to two service strategies. Eligible children could receive nutrition even if a caregiver declined vaccination. Household surveys checked vaccination cards.</desc>
  <rect width="920" height="340" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#17212b" text-anchor="middle">
    <text x="460" y="36" font-size="23" font-weight="650">Communities assigned, children observed</text>
    <text x="460" y="74" font-size="18">20 communities randomized to two groups</text>
    <path d="M460 86V105M230 105H690M230 105V123M690 105V123" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="55" y="125" width="350" height="80" rx="6" fill="#f1f5f9" stroke="#a0aec0"/>
    <rect x="515" y="125" width="350" height="80" rx="6" fill="#eef6f3" stroke="#7faaa0"/>
    <text x="230" y="155" font-size="20" font-weight="600">Control · 10 communities</text>
    <text x="230" y="183" font-size="18">Routine immunization</text>
    <text x="690" y="155" font-size="20" font-weight="600">NutriVax · 10 communities</text>
    <text x="690" y="183" font-size="18">Immunization + nutrition supplement</text>
    <text x="690" y="230" font-size="16">Supplement available even if vaccination declined</text>
    <path d="M230 205V251H690V240M460 251V264" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="460" y="287" font-size="18">Separate baseline and endline surveys checked the cards of children aged 12–23 months</text>
    <text x="460" y="324" font-size="12" fill="#667085">Original methods diagram · Independent illustration</text>
  </g>
</svg>
