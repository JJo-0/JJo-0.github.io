<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Camera calibration coordinate systems</title>
  <desc id="desc">World coordinates are transformed into camera coordinates and projected onto an image plane with pixel coordinates.</desc>
  <rect width="960" height="520" rx="28" fill="#0a0a0c"/>
  <g font-family="Inter, Arial, sans-serif" fill="#f5f5f5">
    <text x="54" y="62" font-size="28" font-weight="700">Camera calibration coordinate systems</text>
    <text x="54" y="96" font-size="16" fill="#a1a1aa">World → Camera → Image / Pixel</text>
  </g>
  <g stroke="#71717a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M170 366V190M170 366H344M170 366L92 430"/>
    <path d="M455 366V214M455 366H614M455 366L390 423"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#d4d4d8">
    <text x="154" y="180">Yw</text><text x="349" y="372">Xw</text><text x="62" y="452">Zw</text>
    <text x="440" y="202">Yc</text><text x="620" y="372">Xc</text><text x="363" y="447">Zc</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="700" fill="#f5f5f5">
    <text x="98" y="484" font-size="20">World coordinates</text>
    <text x="404" y="484" font-size="20">Camera coordinates</text>
  </g>
  <g transform="translate(690 162)">
    <rect x="0" y="0" width="214" height="214" rx="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
    <path d="M36 178V38M36 178H178" stroke="#71717a" stroke-width="2"/>
    <circle cx="128" cy="82" r="8" fill="#22d3ee"/>
    <path d="M36 178L128 82" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="118" y="68" font-family="ui-monospace, monospace" font-size="15" fill="#67e8f9">(u,v)</text>
    <text x="18" y="24" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="18" fill="#f5f5f5">Image plane</text>
  </g>
  <g stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M346 292H414"/><path d="M405 282L418 292L405 302"/>
    <path d="M616 292H674"/><path d="M665 282L678 292L665 302"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#67e8f9">
    <text x="354" y="276">R, t</text><text x="620" y="276">K, projection</text>
  </g>
</svg>
