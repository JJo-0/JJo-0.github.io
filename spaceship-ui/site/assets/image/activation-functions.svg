<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid and tanh activation functions</title>
  <desc id="desc">Comparison of the sigmoid function, which ranges from zero to one, and tanh, which ranges from minus one to one.</desc>
  <rect width="960" height="420" rx="28" fill="#0a0a0c"/>
  <text x="48" y="54" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Activation functions</text>
  <text x="48" y="84" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="16">Sigmoid vs. tanh</text>
  <g transform="translate(46 116)">
    <rect width="410" height="250" rx="18" fill="#18181b"/>
    <path d="M32 210H382M205 28V222" stroke="#52525b" stroke-width="1.5"/>
    <path d="M32 196 C80 194 120 183 151 154 C180 127 191 101 205 86 C223 66 248 54 280 50 C318 45 350 44 382 43" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="28" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Sigmoid σ(x)</text>
    <text x="332" y="61" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">→ 1</text>
    <text x="332" y="203" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">→ 0</text>
  </g>
  <g transform="translate(504 116)">
    <rect width="410" height="250" rx="18" fill="#18181b"/>
    <path d="M32 125H382M205 28V222" stroke="#52525b" stroke-width="1.5"/>
    <path d="M32 205 C75 204 113 196 145 174 C175 153 190 135 205 125 C220 115 235 97 265 76 C297 54 339 46 382 45" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="28" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">tanh(x)</text>
    <text x="332" y="62" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">→ 1</text>
    <text x="325" y="210" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">→ −1</text>
  </g>
</svg>
