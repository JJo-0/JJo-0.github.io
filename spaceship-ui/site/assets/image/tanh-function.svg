  <title id="title">Hyperbolic tangent activation function</title><desc id="desc">An S-shaped tanh curve mapping real inputs to values between minus one and one.</desc>
  <rect width="720" height="360" rx="24" fill="#0a0a0c"/><g stroke="#52525b" stroke-width="1.5"><path d="M50 180H670"/><path d="M360 45V315"/></g>
  <path d="M50 300 C170 296 245 270 305 218 C335 192 350 180 360 180 C370 180 385 168 415 142 C475 90 550 64 670 60" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <g fill="#a1a1aa" font-family="ui-monospace,monospace" font-size="14"><text x="374" y="65">1</text><text x="374" y="305">−1</text><text x="650" y="203">x</text></g>
  <text x="48" y="34" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">tanh(x)</text>
</svg>
