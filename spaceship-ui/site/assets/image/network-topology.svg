<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Industrial network topology examples</title>
  <desc id="desc">Simplified ring, star, and daisy chain network topologies.</desc>
  <rect width="960" height="480" rx="28" fill="#0a0a0c"/>
  <g font-family="Inter,Arial,sans-serif" fill="#f5f5f5"><text x="48" y="58" font-size="28" font-weight="700">Network topology examples</text><text x="48" y="88" font-size="16" fill="#a1a1aa">Ring · Star · Daisy chain</text></g>
  <g transform="translate(55 135)" stroke="#22d3ee" stroke-width="3" fill="none">
    <circle cx="130" cy="120" r="78"/><g fill="#18181b" stroke="#e4e4e7"><circle cx="130" cy="42" r="15"/><circle cx="208" cy="120" r="15"/><circle cx="130" cy="198" r="15"/><circle cx="52" cy="120" r="15"/></g>
    <text x="104" y="252" fill="#f5f5f5" stroke="none" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Ring</text>
  </g>
  <g transform="translate(350 135)" stroke="#22d3ee" stroke-width="3" fill="none">
    <path d="M130 120L130 42M130 120L208 120M130 120L130 198M130 120L52 120"/><g fill="#18181b" stroke="#e4e4e7"><circle cx="130" cy="120" r="19"/><circle cx="130" cy="42" r="15"/><circle cx="208" cy="120" r="15"/><circle cx="130" cy="198" r="15"/><circle cx="52" cy="120" r="15"/></g>
    <text x="110" y="252" fill="#f5f5f5" stroke="none" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Star</text>
  </g>
  <g transform="translate(645 135)" stroke="#22d3ee" stroke-width="3" fill="none">
    <path d="M35 120H235"/><g fill="#18181b" stroke="#e4e4e7"><circle cx="35" cy="120" r="15"/><circle cx="102" cy="120" r="15"/><circle cx="169" cy="120" r="15"/><circle cx="235" cy="120" r="15"/></g>
    <path d="M235 120l-13-9m13 9l-13 9"/>
    <text x="82" y="252" fill="#f5f5f5" stroke="none" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Daisy chain</text>
  </g>
</svg>
