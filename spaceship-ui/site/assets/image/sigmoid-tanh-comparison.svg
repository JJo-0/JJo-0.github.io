<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid and tanh comparison</title><desc id="desc">A comparison of sigmoid and hyperbolic tangent activation curves, highlighting their output ranges and zero-centering difference.</desc>
  <rect width="720" height="360" rx="24" fill="#0a0a0c"/><g stroke="#52525b" stroke-width="1.5"><path d="M50 180H670"/><path d="M360 45V315"/></g>
  <path d="M50 270 C165 266 245 245 305 205 C335 185 350 172 360 168 C370 164 385 151 415 131 C475 91 555 70 670 66" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 300 C170 296 245 270 305 218 C335 192 350 180 360 180 C370 180 385 168 415 142 C475 90 550 64 670 60" fill="none" stroke="#f5f5f5" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" font-size="15"><text x="510" y="105" fill="#67e8f9">sigmoid: 0…1</text><text x="510" y="145" fill="#f5f5f5">tanh: −1…1</text></g>
  <text x="48" y="34" fill="#f5f5f5" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Sigmoid vs tanh</text>
</svg>
