<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Navier–Stokes 방정식의 항과 정칙성 질문</title><desc id="d">시간 변화, 대류, 압력, 점성이 속도장의 변화와 정칙성 질문으로 이어지는 설명 도식</desc>
  <rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d211c">방정식은 흐름을 쓰지만, 모든 해의 매끄러움까지 보장하진 않는다</text>
  <rect x="70" y="135" width="1060" height="100" rx="24" fill="#1f4e78"/><text x="600" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" fill="white">∂u/∂t + (u·∇)u = −∇p + νΔu   ·   ∇·u = 0</text>
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle"><rect x="70" y="285" width="220" height="120" rx="18" fill="#d9eaf7"/><text x="180" y="335" fill="#1d211c">시간 변화</text><text x="180" y="370" fill="#315e51">∂u/∂t</text><rect x="340" y="285" width="220" height="120" rx="18" fill="#d9eaf7"/><text x="450" y="335">흐름의 자기 이동</text><text x="450" y="370" fill="#315e51">(u·∇)u</text><rect x="610" y="285" width="220" height="120" rx="18" fill="#d9eaf7"/><text x="720" y="335">압력의 밀기</text><text x="720" y="370" fill="#315e51">−∇p</text><rect x="880" y="285" width="250" height="120" rx="18" fill="#d9eaf7"/><text x="1005" y="335">점성의 완화</text><text x="1005" y="370" fill="#315e51">νΔu</text></g>
  <path d="M180 430 C260 520 360 525 500 530 M450 430 C490 500 530 510 570 530 M720 430 C700 490 680 510 650 530 M1005 430 C900 510 820 520 720 535" stroke="#315e51" stroke-width="5" fill="none"/>
  <rect x="330" y="520" width="540" height="95" rx="22" fill="#315e51"/><text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="white">3차원에서 유한 에너지 해가 항상 매끄러운가?</text><text x="600" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f3efe4">아니면 유한 시간에 특이점이 생길 수 있는가?</text>
</svg>
