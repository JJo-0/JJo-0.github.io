<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">쓰기 에너지의 범위</title><desc id="d">전압 전류 시간 적분과 소자 에너지, 주변 회로 에너지의 구분</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">에너지는 ‘얼마나 세게’와 ‘얼마나 오래’를 함께 본다</text><rect x="70" y="145" width="500" height="145" rx="25" fill="#1f4e78"/><text x="320" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="white">E = ∫ V(t) I(t) dt</text><text x="320" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#d9eaf7">전압 × 전류를 시간에 따라 합산</text><g font-family="Arial, sans-serif"><rect x="630" y="145" width="500" height="145" rx="25" fill="#d9eaf7"/><text x="665" y="195" font-size="25" font-weight="700" fill="#1d211c">짧은 펄스가 줄이는 부분</text><text x="665" y="238" font-size="22" fill="#315e51">소자에 직접 들어간 쓰기 에너지</text><text x="665" y="270" font-size="19" fill="#1d211c">단, 비교 조건과 전압·전류를 같이 확인</text><rect x="70" y="365" width="1060" height="190" rx="28" fill="#fff" stroke="#315e51" stroke-width="3"/><text x="105" y="420" font-size="27" font-weight="700" fill="#1d211c">제품에서 더해야 하는 것</text><text x="105" y="468" font-size="23" fill="#315e51">펄스 발생기 + 주소 선택 + 배선 손실 + 읽기 회로 + 오류 교정</text><text x="105" y="515" font-size="22" fill="#1d211c">따라서 “소자 쓰기 에너지 감소”를 “데이터센터 전력 감소”로 바로 바꾸지 않는다</text></g></svg>
