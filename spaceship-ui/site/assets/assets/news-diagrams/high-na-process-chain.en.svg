<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">From the High-NA pattern to electrical testing</title><desc id="d">Mask, exposure, resist response, development, etch transfer, and electrical testing.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">A micrograph shows an intermediate stage</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#d9eaf7"><rect x="50" y="205" width="150" height="120" rx="20"/><rect x="240" y="205" width="150" height="120" rx="20"/><rect x="430" y="205" width="150" height="120" rx="20"/><rect x="620" y="205" width="150" height="120" rx="20"/><rect x="810" y="205" width="150" height="120" rx="20"/><rect x="1000" y="205" width="150" height="120" rx="20"/></g><g font-size="23" fill="#1d211c"><text x="125" y="275">Mask</text><text x="315" y="275">Expose (EUV)</text><text x="505" y="255">Resist</text><text x="505" y="288">response</text><text x="695" y="275">Develop</text><text x="885" y="275">Etch transfer</text><text x="1075" y="255">Electrical test</text><text x="1075" y="288">and yield</text></g></g><g stroke="#315e51" stroke-width="5" marker-end="url(#a)"><path d="M200 265H230"/><path d="M390 265H420"/><path d="M580 265H610"/><path d="M770 265H800"/><path d="M960 265H990"/></g><rect x="240" y="435" width="720" height="115" rx="24" fill="#315e51"/><text x="600" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="white">The published image shows the developed resist pattern</text><text x="600" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#f3efe4">Assessing production also requires post-etch defect data and electrical yield.</text></svg>
