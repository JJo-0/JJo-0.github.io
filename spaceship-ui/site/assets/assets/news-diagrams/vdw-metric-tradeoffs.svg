<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">선택 소자 성능의 동시 조건</title><desc id="d">비선형성, 전압, 응답속도, 내구성, 균일성의 균형과 배열 검증</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">좋은 숫자 하나가 좋은 대형 배열을 보장하지 않는다</text><circle cx="600" cy="355" r="115" fill="#315e51"/><text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">대규모 배열</text><text x="600" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#f3efe4">읽기 정확도·전력</text><g font-family="Arial, sans-serif" font-size="23" text-anchor="middle"><g fill="#d9eaf7"><rect x="80" y="170" width="260" height="105" rx="22"/><rect x="430" y="125" width="340" height="105" rx="22"/><rect x="860" y="170" width="260" height="105" rx="22"/><rect x="120" y="465" width="300" height="105" rx="22"/><rect x="780" y="465" width="300" height="105" rx="22"/></g><text x="210" y="215">비선형성</text><text x="210" y="250" fill="#315e51">OFF와 ON 구분</text><text x="600" y="170">동작 전압</text><text x="600" y="205" fill="#315e51">회로 호환성</text><text x="990" y="215">응답 속도</text><text x="990" y="250" fill="#315e51">소자 전환 시간</text><text x="270" y="510">내구성</text><text x="270" y="545" fill="#315e51">반복 동작</text><text x="930" y="510">균일성·수율</text><text x="930" y="545" fill="#315e51">많이 만들 때의 편차</text></g><g stroke="#1f4e78" stroke-width="4"><path d="M340 245L505 300"/><path d="M600 230V240"/><path d="M860 245L695 300"/><path d="M420 500L520 430"/><path d="M780 500L680 430"/></g></svg>
