<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">수학 주장 검증 단계</title><desc id="d">연구 발표부터 형식 검증과 독립 검토, 공식 인정까지의 단계</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">“증명을 공개했다”와 “문제가 공식 해결됐다” 사이</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#d9eaf7"><rect x="65" y="180" width="220" height="150" rx="22"/><rect x="345" y="180" width="220" height="150" rx="22"/><rect x="625" y="180" width="220" height="150" rx="22"/><rect x="905" y="180" width="230" height="150" rx="22"/></g><g font-size="25" fill="#1d211c"><text x="175" y="235">① 주장·원고</text><text x="175" y="275">공개</text><text x="455" y="235">② 형식화·코드</text><text x="455" y="275">검사 가능</text><text x="735" y="235">③ 독립 연구자</text><text x="735" y="275">재검토</text><text x="1020" y="235">④ 학계·기관</text><text x="1020" y="275">공식 판단</text></g></g><g stroke="#315e51" stroke-width="6" marker-end="url(#a)"><path d="M285 255H335"/><path d="M565 255H615"/><path d="M845 255H895"/></g><rect x="150" y="425" width="900" height="145" rx="24" fill="#315e51"/><text x="600" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">각 단계는 서로 다른 증거다</text><text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#f3efe4">코드가 실행된다고 전제·논리·원문 조건까지 자동으로 맞는 것은 아니다</text><text x="600" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#d9eaf7">독립 검토와 공식 인정이 끝나기 전에는 “해결 후보”로 표현한다</text></svg>
