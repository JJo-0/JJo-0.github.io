<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">외력이 있는 비압축성 Navier–Stokes 방정식의 항과 정칙성 질문</title><desc id="d">시간 변화, 대류, 압력, 점성, 외력을 운동량 방정식에 표시하고 비압축 조건을 별도 식으로 구분한 설명 도식</desc>
  <rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d211c">방정식은 흐름을 쓰지만, 모든 해의 매끄러움까지 보장하진 않는다</text>
  <rect x="70" y="125" width="1060" height="125" rx="24" fill="#1f4e78"/><text x="600" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" fill="white">∂u/∂t + (u·∇)u = −∇p + νΔu + f</text><text x="600" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#d9eaf7">비압축 조건: ∇·u = 0</text>
  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle"><rect x="70" y="285" width="190" height="120" rx="18" fill="#d9eaf7"/><text x="165" y="335" fill="#1d211c">시간 변화</text><text x="165" y="370" fill="#315e51">∂u/∂t</text><rect x="285" y="285" width="190" height="120" rx="18" fill="#d9eaf7"/><text x="380" y="335">흐름의 자기 이동</text><text x="380" y="370" fill="#315e51">(u·∇)u</text><rect x="500" y="285" width="190" height="120" rx="18" fill="#d9eaf7"/><text x="595" y="335">압력의 밀기</text><text x="595" y="370" fill="#315e51">−∇p</text><rect x="715" y="285" width="190" height="120" rx="18" fill="#d9eaf7"/><text x="810" y="335">점성의 완화</text><text x="810" y="370" fill="#315e51">νΔu</text><rect x="930" y="285" width="200" height="120" rx="18" fill="#d9eaf7"/><text x="1030" y="335">매끄러운 외력</text><text x="1030" y="370" fill="#315e51">f</text></g>
  <path d="M165 430 C250 510 340 520 480 530 M380 430 C440 500 500 515 550 530 M595 430 L600 520 M810 430 C760 500 700 515 650 530 M1030 430 C930 510 820 520 720 535" stroke="#315e51" stroke-width="5" fill="none"/>
  <rect x="330" y="520" width="540" height="95" rx="22" fill="#315e51"/><text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="white">3차원에서 유한 에너지 해가 항상 매끄러운가?</text><text x="600" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f3efe4">아니면 유한 시간에 특이점이 생길 수 있는가?</text>
</svg>
