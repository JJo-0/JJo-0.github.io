<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">High-NA resolution and processing conditions</title><desc id="d">The Rayleigh resolution relationship links wavelength, aperture, and process factor to patterning. Material behavior and defects affect yield.</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">Higher NA resolves finer features. The resist must record them.</text><rect x="80" y="150" width="470" height="170" rx="28" fill="#1f4e78"/><text x="315" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="white">R = k₁ · λ / NA</text><text x="315" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#d9eaf7">NA 0.33 → 0.55 · same EUV wavelength</text><g font-family="Arial, sans-serif"><rect x="630" y="150" width="490" height="170" rx="28" fill="#d9eaf7"/><text x="670" y="205" font-size="27" font-weight="700" fill="#1d211c">What else limits a smaller R?</text><text x="670" y="252" font-size="23" fill="#315e51">Resist blur · photon statistics</text><text x="670" y="290" font-size="23" fill="#315e51">Etch transfer · defects · yield</text><rect x="120" y="415" width="960" height="140" rx="26" fill="#fff" stroke="#315e51" stroke-width="3"/><text x="600" y="468" text-anchor="middle" font-size="27" font-weight="700" fill="#1d211c">A pitch of 22 nm is the repeat spacing of a pattern</text><text x="600" y="512" text-anchor="middle" font-size="22" fill="#315e51">Gate length, node name, and finished-chip yield measure different things.</text></g></svg>
