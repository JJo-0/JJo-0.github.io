<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">From a nanoplasma pulse to magnetic switching</title><desc id="d">An on-chip pulse source drives a magnetic structure, followed by confirmation of its state.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="65" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">The 6.4 ps measurement is the width of the write pulse</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="70" y="190" width="245" height="190" rx="25" fill="#1f4e78"/><text x="192" y="250" font-size="26" fill="white">On-chip pulser</text><polyline points="105,325 135,325 145,245 160,345 176,280 188,325 275,325" fill="none" stroke="#f3efe4" stroke-width="7"/><text x="192" y="360" font-size="20" fill="#d9eaf7">Short electrical signal</text><rect x="475" y="190" width="245" height="190" rx="25" fill="#d9eaf7"/><text x="597" y="245" font-size="28" fill="#1d211c">Co / Pt / Co</text><text x="597" y="292" font-size="22" fill="#315e51">SOT magnetic stack</text><text x="597" y="337" font-size="42" fill="#1f4e78">↑  →  ↓</text><rect x="880" y="190" width="245" height="190" rx="25" fill="#315e51"/><text x="1002" y="250" font-size="27" fill="white">Read the state</text><text x="1002" y="287" font-size="23" fill="#f3efe4">Resistance or</text><text x="1002" y="311" font-size="23" fill="#f3efe4">magnetization</text><text x="1002" y="342" font-size="19" fill="#d9eaf7">Test the array separately</text></g><g stroke="#315e51" stroke-width="7" marker-end="url(#a)"><path d="M330 285H450"/><path d="M735 285H855"/></g><rect x="180" y="465" width="840" height="115" rx="24" fill="#fff" stroke="#1f4e78" stroke-width="3"/><text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d211c">Total latency includes selection, propagation, switching, and reading</text><text x="600" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#315e51">The device pulse width alone gives no end-to-end memory speed.</text></svg>
