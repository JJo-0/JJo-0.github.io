<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">High-NA DRAM 도입 계획과 검증 단계</title><desc id="d">공동 발표, 생태계 준비, 파일럿 검증, 양산 결과를 구분하는 시간축</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">2028년 도입 계획은 현재 양산 완료가 아니다</text><path d="M120 330H1080" stroke="#315e51" stroke-width="8" marker-end="url(#a)"/><g font-family="Arial, sans-serif" text-anchor="middle"><circle cx="190" cy="330" r="28" fill="#1f4e78"/><circle cx="470" cy="330" r="28" fill="#1f4e78"/><circle cx="750" cy="330" r="28" fill="#1f4e78"/><circle cx="1010" cy="330" r="28" fill="#315e51"/><g font-size="24" font-weight="700" fill="#1d211c"><text x="190" y="250">2026 공동 발표</text><text x="470" y="250">마스크·검사·물류</text><text x="750" y="250">제품·공정층별</text><text x="1010" y="250">2028 목표</text></g><g font-size="21" fill="#315e51"><text x="190" y="410">협력과 방향</text><text x="470" y="410">생태계 준비</text><text x="750" y="410">파일럿 검증</text><text x="1010" y="410">대량생산 도입 계획</text></g></g><rect x="180" y="500" width="840" height="105" rx="22" fill="#fff" stroke="#1f4e78" stroke-width="3"/><text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d211c">다음 증거: 적용 제품·공정층·수율·원가·고객 출하</text><text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#315e51">일정이 아니라 실제 제조 지표가 확인될 때 산업 결과로 승격한다</text></svg>
