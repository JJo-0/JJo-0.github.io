<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Five-layer van der Waals selector</title><desc id="d">Graphene, molybdenum disulfide, and a central barrier form a stack whose tunneling current depends strongly on voltage.</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="76" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">Five layers control access to a memory cell</text><g font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><rect x="250" y="135" width="700" height="70" rx="18" fill="#1f4e78"/><text x="600" y="180" fill="white">Graphene · electrode</text><rect x="285" y="220" width="630" height="70" rx="18" fill="#d9eaf7"/><text x="600" y="265" fill="#1d211c">MoS₂ · interface and barrier tuning</text><rect x="320" y="305" width="560" height="85" rx="18" fill="#315e51"/><text x="600" y="357" fill="white">hBN or GaS · central barrier</text><rect x="285" y="405" width="630" height="70" rx="18" fill="#d9eaf7"/><text x="600" y="450" fill="#1d211c">MoS₂ · interface and barrier tuning</text><rect x="250" y="490" width="700" height="70" rx="18" fill="#1f4e78"/><text x="600" y="535" fill="white">Graphene · electrode</text></g><path d="M1060 510V190" stroke="#315e51" stroke-width="8"/><path d="M1038 215L1060 180L1082 215" fill="#315e51"/><text x="1090" y="355" font-family="Arial, sans-serif" font-size="22" fill="#315e51" text-anchor="middle" transform="rotate(-90 1090 355)">Voltage controls tunneling</text><text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1d211c">Suppress unwanted paths and pass sufficient current through the selected cell.</text></svg>
