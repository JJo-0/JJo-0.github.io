<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Concurrent requirements for a memory selector</title><desc id="d">Array tests must consider nonlinearity, voltage, response speed, endurance, and uniformity together.</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">A large memory array depends on several selector properties</text><circle cx="600" cy="355" r="115" fill="#315e51"/><text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">Large array</text><text x="600" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#f3efe4">Read accuracy · power</text><g font-family="Arial, sans-serif" font-size="23" text-anchor="middle"><g fill="#d9eaf7"><rect x="80" y="170" width="260" height="105" rx="22"/><rect x="430" y="125" width="340" height="105" rx="22"/><rect x="860" y="170" width="260" height="105" rx="22"/><rect x="120" y="465" width="300" height="105" rx="22"/><rect x="780" y="465" width="300" height="105" rx="22"/></g><text x="210" y="215">Nonlinearity</text><text x="210" y="250" fill="#315e51">OFF–ON contrast</text><text x="600" y="170">Voltage</text><text x="600" y="205" fill="#315e51">Circuit compatibility</text><text x="990" y="215">Response speed</text><text x="990" y="250" fill="#315e51">Switching time</text><text x="270" y="510">Endurance</text><text x="270" y="545" fill="#315e51">Repeated operation</text><text x="930" y="510">Uniformity and yield</text><text x="930" y="545" fill="#315e51">Variation across devices</text></g><g stroke="#1f4e78" stroke-width="4"><path d="M340 245L505 300"/><path d="M600 230V240"/><path d="M860 245L695 300"/><path d="M420 500L520 430"/><path d="M780 500L680 430"/></g></svg>
