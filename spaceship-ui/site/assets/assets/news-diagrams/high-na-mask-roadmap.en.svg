<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Roadmap for High-NA DRAM production</title><desc id="d">The timeline distinguishes a joint announcement, ecosystem preparation, pilot tests, and volume production.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">A 2028 production target still has milestones to clear</text><path d="M120 330H1080" stroke="#315e51" stroke-width="8" marker-end="url(#a)"/><g font-family="Arial, sans-serif" text-anchor="middle"><circle cx="190" cy="330" r="28" fill="#1f4e78"/><circle cx="470" cy="330" r="28" fill="#1f4e78"/><circle cx="750" cy="330" r="28" fill="#1f4e78"/><circle cx="1010" cy="330" r="28" fill="#315e51"/><g font-size="24" font-weight="700" fill="#1d211c"><text x="190" y="250">2026 announcement</text><text x="470" y="250">Masks, inspection, logistics</text><text x="750" y="250">Products and layers</text><text x="1010" y="250">2028 target</text></g><g font-size="21" fill="#315e51"><text x="190" y="410">Joint development</text><text x="470" y="410">Ecosystem readiness</text><text x="750" y="410">Pilot validation</text><text x="1010" y="410">Volume production</text></g></g><rect x="180" y="500" width="840" height="105" rx="22" fill="#fff" stroke="#1f4e78" stroke-width="3"/><text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d211c">Watch for named products and layers, yield, cost, and shipments</text><text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#315e51">Manufacturing measurements will show whether the planned transition delivers.</text></svg>
