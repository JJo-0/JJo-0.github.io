<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Checking a mathematical claim</title><desc id="d">From a research announcement through formal checks, independent review and recognition</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">From a published proof claim to official recognition</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#d9eaf7"><rect x="65" y="180" width="220" height="150" rx="22"/><rect x="345" y="180" width="220" height="150" rx="22"/><rect x="625" y="180" width="220" height="150" rx="22"/><rect x="905" y="180" width="230" height="150" rx="22"/></g><g font-size="25" fill="#1d211c"><text x="175" y="235">① Manuscript</text><text x="175" y="275">released</text><text x="455" y="235">② Formal code</text><text x="455" y="275">available to check</text><text x="735" y="235">③ Independent</text><text x="735" y="275">review</text><text x="1020" y="235">④ Official</text><text x="1020" y="275">assessment</text></g></g><g stroke="#315e51" stroke-width="6" marker-end="url(#a)"><path d="M285 255H335"/><path d="M565 255H615"/><path d="M845 255H895"/></g><rect x="150" y="425" width="900" height="145" rx="24" fill="#315e51"/><text x="600" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">Each step supplies different evidence</text><text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#f3efe4">Code checks still require scrutiny of assumptions, definitions and the problem statement.</text><text x="600" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#d9eaf7">Pending independent review and recognition, the claim is a proposed solution.</text></svg>
