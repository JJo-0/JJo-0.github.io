<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">5층 반데르발스 선택 소자</title><desc id="d">그래핀, 이황화몰리브덴, 장벽을 쌓아 전압에 따라 전류가 크게 달라지는 구조</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="76" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">다섯 층은 저장 셀이 아니라 ‘전류 문지기’를 만든다</text><g font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><rect x="250" y="135" width="700" height="70" rx="18" fill="#1f4e78"/><text x="600" y="180" fill="white">Graphene · 전극</text><rect x="285" y="220" width="630" height="70" rx="18" fill="#d9eaf7"/><text x="600" y="265" fill="#1d211c">MoS₂ · 계면/장벽 조절</text><rect x="320" y="305" width="560" height="85" rx="18" fill="#315e51"/><text x="600" y="357" fill="white">hBN 또는 GaS · 중심 장벽</text><rect x="285" y="405" width="630" height="70" rx="18" fill="#d9eaf7"/><text x="600" y="450" fill="#1d211c">MoS₂ · 계면/장벽 조절</text><rect x="250" y="490" width="700" height="70" rx="18" fill="#1f4e78"/><text x="600" y="535" fill="white">Graphene · 전극</text></g><path d="M1060 510V190" stroke="#315e51" stroke-width="8"/><path d="M1038 215L1060 180L1082 215" fill="#315e51"/><text x="1090" y="355" font-family="Arial, sans-serif" font-size="22" fill="#315e51" transform="rotate(-90 1090 355)">전압에 따른 터널링 전류 변화</text><text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1d211c">선택되지 않을 때는 막고 · 선택됐을 때는 충분히 통과시킨다</text></svg>
