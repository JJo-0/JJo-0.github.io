<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">High-NA 해상도와 공정 조건</title><desc id="d">레일리 해상도 식에서 파장, 수치개구수, 공정계수가 패턴과 수율로 이어지는 관계</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">NA를 높이면 더 작은 패턴에 유리하지만, 재료 문제가 사라지진 않는다</text><rect x="80" y="150" width="470" height="170" rx="28" fill="#1f4e78"/><text x="315" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="white">R = k₁ · λ / NA</text><text x="315" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#d9eaf7">NA 0.33 → 0.55 · 같은 EUV 파장 계열</text><g font-family="Arial, sans-serif"><rect x="630" y="150" width="490" height="170" rx="28" fill="#d9eaf7"/><text x="670" y="205" font-size="27" font-weight="700" fill="#1d211c">R만 작아지면 끝일까?</text><text x="670" y="252" font-size="23" fill="#315e51">감광재료 blur · photon stochastic</text><text x="670" y="290" font-size="23" fill="#315e51">식각 전사 · 결함 · 수율</text><rect x="120" y="415" width="960" height="140" rx="26" fill="#fff" stroke="#315e51" stroke-width="3"/><text x="600" y="468" text-anchor="middle" font-size="27" font-weight="700" fill="#1d211c">22 nm pitch는 반복 패턴의 간격</text><text x="600" y="512" text-anchor="middle" font-size="22" fill="#315e51">트랜지스터 길이·공정 이름·완성 칩 수율과 같은 숫자가 아니다</text></g></svg>
