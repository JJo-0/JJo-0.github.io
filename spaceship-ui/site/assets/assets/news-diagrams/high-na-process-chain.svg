<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">High-NA 패턴에서 전기 검증까지</title><desc id="d">마스크, 노광, 감광재료, 현상, 식각, 전기 검증의 연속 공정</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315e51"/></marker></defs><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="82" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">좋은 현미경 사진은 공정의 중간 증거다</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#d9eaf7"><rect x="50" y="205" width="150" height="120" rx="20"/><rect x="240" y="205" width="150" height="120" rx="20"/><rect x="430" y="205" width="150" height="120" rx="20"/><rect x="620" y="205" width="150" height="120" rx="20"/><rect x="810" y="205" width="150" height="120" rx="20"/><rect x="1000" y="205" width="150" height="120" rx="20"/></g><g font-size="23" fill="#1d211c"><text x="125" y="275">마스크</text><text x="315" y="275">EUV 노광</text><text x="505" y="255">감광재료</text><text x="505" y="288">반응</text><text x="695" y="275">현상</text><text x="885" y="275">식각 전사</text><text x="1075" y="255">전기 특성</text><text x="1075" y="288">·수율</text></g></g><g stroke="#315e51" stroke-width="5" marker-end="url(#a)"><path d="M200 265H230"/><path d="M390 265H420"/><path d="M580 265H610"/><path d="M770 265H800"/><path d="M960 265H990"/></g><rect x="240" y="435" width="720" height="115" rx="24" fill="#315e51"/><text x="600" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="white">발표 사진이 보여 준 위치: 감광재료·현상 패턴</text><text x="600" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#f3efe4">양산 판단에는 식각 뒤 결함과 전기 수율까지 필요</text></svg>
