<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">6인치와 12인치 포토마스크 개념 비교</title><desc id="d">마스크 면적 확장이 스티칭과 생산성 문제에 연결되는 개념도</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">커지는 것은 웨이퍼가 아니라 회로 원본판인 ‘마스크’다</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="130" y="185" width="300" height="300" rx="18" fill="#d9eaf7" stroke="#1f4e78" stroke-width="6"/><path d="M230 185V485M330 185V485M130 285H430M130 385H430" stroke="#1f4e78" stroke-width="3" stroke-dasharray="12 10"/><text x="280" y="535" font-size="27" font-weight="700" fill="#1d211c">기존 6인치급 마스크</text><rect x="650" y="135" width="420" height="420" rx="18" fill="#315e51"/><path d="M790 135V555M930 135V555M650 275H1070M650 415H1070" stroke="#f3efe4" stroke-width="3" stroke-dasharray="12 10"/><text x="860" y="605" font-size="27" font-weight="700" fill="#1d211c">검토 중인 12인치급 생태계</text><text x="540" y="310" font-size="52" fill="#315e51">→</text><text x="540" y="360" font-size="20" fill="#315e51">스티칭·처리면적</text><text x="540" y="392" font-size="20" fill="#315e51">제약 완화 기대</text></g><text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#1d211c">개념 비교이며 실제 처리량 증가율이나 비용 절감률을 뜻하지 않는다</text></svg>
