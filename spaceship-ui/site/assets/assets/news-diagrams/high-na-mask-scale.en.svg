<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Conceptual comparison of 6-inch and 12-inch photomasks</title><desc id="d">A larger mask area is intended to ease stitching constraints and support throughput.</desc><rect width="1200" height="675" fill="#f3efe4"/><text x="70" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d211c">A larger photomask carries the original circuit pattern</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="130" y="185" width="300" height="300" rx="18" fill="#d9eaf7" stroke="#1f4e78" stroke-width="6"/><path d="M230 185V485M330 185V485M130 285H430M130 385H430" stroke="#1f4e78" stroke-width="3" stroke-dasharray="12 10"/><text x="280" y="535" font-size="27" font-weight="700" fill="#1d211c">Current 6-inch mask</text><rect x="650" y="135" width="420" height="420" rx="18" fill="#315e51"/><path d="M790 135V555M930 135V555M650 275H1070M650 415H1070" stroke="#f3efe4" stroke-width="3" stroke-dasharray="12 10"/><text x="860" y="605" font-size="27" font-weight="700" fill="#1d211c">Proposed 12-inch mask format</text><text x="540" y="310" font-size="52" fill="#315e51">→</text><text x="540" y="360" font-size="20" fill="#315e51">Fewer stitching</text><text x="540" y="392" font-size="20" fill="#315e51">and field limits</text></g><text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#1d211c">This comparison illustrates dimensions. It does not quantify changes in throughput or cost.</text></svg>
