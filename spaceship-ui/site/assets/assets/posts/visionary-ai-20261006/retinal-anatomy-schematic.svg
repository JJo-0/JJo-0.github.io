<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">망막의 주요 구조를 설명하는 개념도</title>
  <desc id="desc">밝은 시신경유두에서 단순화한 혈관 가지가 뻗고, 황반은 그보다 안쪽 망막에 표시되어 있다. 실제 안저 사진이나 연구 결과가 아니다.</desc>
  <rect width="1000" height="760" fill="#faf8f5"/>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#263449">망막에서 볼 수 있는 주요 구조</text>
  <circle cx="500" cy="390" r="270" fill="#fff1e4" stroke="#9e907e" stroke-width="3"/>
  <circle cx="500" cy="390" r="254" fill="none" stroke="#ead9c7" stroke-width="2"/>
