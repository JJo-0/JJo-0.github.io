    <path d="M513 500 C487 480 462 470 434 469 C399 468 370 452 345 426" stroke-width="5"/>
    <path d="M383 538 C357 515 338 490 330 462" stroke-width="4"/>
    <path d="M618 424 C590 410 563 403 536 404 C510 405 486 398 464 385" stroke-width="4"/>
