<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BCN 단층과 p형 트랜지스터 교육 도식</title>
  <desc id="desc">붕소와 질소의 벌집 격자 일부 자리에 탄소가 들어간 개념도와, 아래쪽 게이트로 채널 전류를 조절하는 트랜지스터의 간략한 단면도. 실제 논문의 원자 사진이나 소자 치수가 아니다.</desc>
  <rect width="960" height="540" rx="22" fill="#f7f9fc"/>
  <text x="45" y="58" fill="#18324b" font-family="sans-serif" font-size="29" font-weight="700">BCN: 원자 한 층을 전류 통로로 쓰는 개념</text>
  <text x="45" y="96" fill="#456078" font-family="sans-serif" font-size="19">교육용 단순화 · 실제 원자배열·소자 단면·치수 아님</text>
  <g stroke="#8aa0ad" stroke-width="5" stroke-linecap="round">
    <path d="M95 180L170 140L245 180L320 140L395 180L470 140M95 180L95 260L170 300L245 260L320 300L395 260L470 300M170 140L170 220L245 260M245 180L245 260M320 140L320 220L395 260M395 180L395 260M95 260L170 220L245 180L320 220L395 180L470 220L470 300" fill="none"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="700">
    <g fill="#2d6ca7"><circle cx="95" cy="180" r="23"/><circle cx="245" cy="180" r="23"/><circle cx="395" cy="180" r="23"/><circle cx="170" cy="300" r="23"/><circle cx="320" cy="300" r="23"/><circle cx="470" cy="300" r="23"/></g>
    <g fill="#147a6e"><circle cx="170" cy="140" r="23"/><circle cx="320" cy="140" r="23"/><circle cx="95" cy="260" r="23"/><circle cx="245" cy="260" r="23"/><circle cx="395" cy="260" r="23"/><circle cx="470" cy="140" r="23"/></g>
    <g fill="#c45635"><circle cx="170" cy="220" r="23"/><circle cx="320" cy="220" r="23"/><circle cx="470" cy="220" r="23"/></g>
    <g fill="white"><text x="95" y="180">B</text><text x="245" y="180">B</text><text x="395" y="180">B</text><text x="170" y="300">B</text><text x="320" y="300">B</text><text x="470" y="300">B</text><text x="170" y="140">N</text><text x="320" y="140">N</text><text x="95" y="260">N</text><text x="245" y="260">N</text><text x="395" y="260">N</text><text x="470" y="140">N</text><text x="170" y="220">C</text><text x="320" y="220">C</text><text x="470" y="220">C</text></g>
  </g>
  <text x="550" y="180" fill="#18324b" font-family="sans-serif" font-size="23" font-weight="700">B = 붕소 · N = 질소 · C = 탄소</text>
  <text x="550" y="224" fill="#456078" font-family="sans-serif" font-size="21">탄소가 BN 격자의 일부 자리에 들어간다.</text>
  <text x="550" y="261" fill="#456078" font-family="sans-serif" font-size="21">p형: 정공 이동을 이용하는 채널</text>
  <rect x="75" y="365" width="150" height="65" rx="8" fill="#4f6b8c"/>
  <rect x="735" y="365" width="150" height="65" rx="8" fill="#4f6b8c"/>
  <rect x="225" y="393" width="510" height="10" rx="5" fill="#c45635"/>
  <rect x="225" y="428" width="510" height="29" rx="5" fill="#c6dbe9"/>
  <rect x="320" y="465" width="320" height="39" rx="5" fill="#2d6ca7"/>
  <g font-family="sans-serif" fill="white" text-anchor="middle" font-size="21" font-weight="700"><text x="150" y="405">Source</text><text x="810" y="405">Drain</text><text x="480" y="492">Gate</text></g>
  <text x="474" y="382" fill="#9b4229" text-anchor="middle" font-family="sans-serif" font-size="19">원자 한 층 BCN 채널</text>
  <text x="480" y="450" fill="#315872" text-anchor="middle" font-family="sans-serif" font-size="17">절연층</text>
</svg>
