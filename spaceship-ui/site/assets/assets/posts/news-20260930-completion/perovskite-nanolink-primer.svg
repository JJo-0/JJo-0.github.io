<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">페로브스카이트 태양전지 계면의 평면 연결과 수직 나노링크 비교 교육용 그림</title>
  <desc id="desc">왼쪽에는 페로브스카이트와 전하 수송층 사이의 얇은 평면 계면, 오른쪽에는 두 층 안쪽까지 닿는 세 개의 수직 연결을 보여준다. 실험 현미경 사진이나 논문 도판이 아니다.</desc>
  <rect width="1040" height="540" rx="28" fill="#f7f7f2"/>
  <text x="52" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">What does “trans-interface” mean?</text>
  <text x="52" y="103" font-family="Arial,sans-serif" font-size="17" fill="#526272">Conceptual cross-section · not a microscope image</text>
  <rect x="43" y="138" width="455" height="329" rx="18" fill="#ffffff" stroke="#c6d5dc" stroke-width="2"/>
  <rect x="542" y="138" width="455" height="329" rx="18" fill="#ffffff" stroke="#c6d5dc" stroke-width="2"/>
  <text x="68" y="181" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">Planar interface</text>
  <text x="567" y="181" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">Vertical nanolinks</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700">
    <rect x="68" y="224" width="405" height="88" rx="11" fill="#dba76a"/>
    <text x="169" y="274" fill="#392d23">Perovskite absorber</text>
