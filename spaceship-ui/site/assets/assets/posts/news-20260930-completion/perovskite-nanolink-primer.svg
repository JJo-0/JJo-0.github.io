    <rect x="68" y="338" width="405" height="88" rx="11" fill="#7396b8"/>
    <text x="154" y="388" fill="#ffffff">Charge-transport layer</text>
    <rect x="567" y="224" width="405" height="88" rx="11" fill="#dba76a"/>
    <text x="668" y="274" fill="#392d23">Perovskite absorber</text>
    <rect x="567" y="338" width="405" height="88" rx="11" fill="#7396b8"/>
    <text x="653" y="388" fill="#ffffff">Charge-transport layer</text>
