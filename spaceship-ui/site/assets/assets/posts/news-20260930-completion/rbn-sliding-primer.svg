  <text x="721" y="378" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">MoS₂ channel</text>
  <text x="617" y="428" font-family="Arial,sans-serif" font-size="16" fill="#526272">Different polarization → different current</text>
