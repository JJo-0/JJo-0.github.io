<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">rBN의 층 미끄러짐과 메모리 상태를 설명하는 교육용 도해</title>
  <desc id="desc">왼쪽에는 ABC로 어긋나 쌓인 세 층, 가운데에는 옆으로 미는 화살표, 오른쪽에는 두 상태를 읽는 트랜지스터의 게이트와 채널을 그렸다. 실제 논문 그림이나 원자 좌표가 아니다.</desc>
  <rect width="1040" height="540" rx="28" fill="#f7f7f2"/>
  <text x="52" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">How a sliding layer can store a bit</text>
  <text x="52" y="103" font-family="Arial,sans-serif" font-size="17" fill="#526272">Conceptual guide · not the paper’s atomic structure</text>
  <rect x="43" y="137" width="437" height="328" rx="18" fill="#ffffff" stroke="#c6d5dc" stroke-width="2"/>
  <rect x="559" y="137" width="437" height="328" rx="18" fill="#ffffff" stroke="#c6d5dc" stroke-width="2"/>
  <text x="70" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">ABC-stacked rBN</text>
  <text x="70" y="217" font-family="Arial,sans-serif" font-size="16" fill="#526272">Adjacent B–N layers have offsets</text>
  <g fill="#4b9ba8" stroke="#247480" stroke-width="2">
    <rect x="86" y="266" width="310" height="35" rx="16"/>
    <rect x="106" y="324" width="310" height="35" rx="16"/>
    <rect x="126" y="382" width="310" height="35" rx="16"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">
    <text x="105" y="291">A</text><text x="125" y="349">B</text><text x="145" y="407">C</text>
  </g>
  <path d="M483 307h67" stroke="#c35742" stroke-width="8" stroke-linecap="round"/>
  <path d="M537 290l21 17-21 17" fill="none" stroke="#c35742" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="486" y="272" font-family="Arial,sans-serif" font-size="16" fill="#9a3b2d">slide</text>
  <text x="585" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">FeFET memory readout</text>
  <rect x="602" y="250" width="352" height="39" rx="9" fill="#dc9b51"/>
  <text x="738" y="275" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#372d23">Gate</text>
