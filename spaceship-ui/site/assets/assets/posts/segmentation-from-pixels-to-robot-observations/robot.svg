<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="A mask is an observation, not an action"><rect width="960" height="360" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:21px}.small{font-size:16px}.head{font-size:26px;font-weight:bold}</style><text x="32" y="43" class="head">A mask is an observation, not an action</text><rect x="20" y="115" width="195" height="100" rx="12" fill="#dbeafe"/><text x="35" y="157">RGB image</text><text x="35" y="190" class="small">+ optional depth</text><rect x="260" y="115" width="195" height="100" rx="12" fill="#dcfce7"/><text x="275" y="157">Mask</text><text x="275" y="190" class="small">target region</text><rect x="500" y="115" width="195" height="100" rx="12" fill="#fef3c7"/><text x="515" y="157">Policy / planner</text><text x="515" y="190" class="small">goal + robot state</text><rect x="740" y="115" width="195" height="100" rx="12" fill="#fce7f3"/><text x="755" y="157">Action</text><text x="755" y="190" class="small">motion command</text><text x="223" y="175">→</text><text x="463" y="175">→</text><text x="703" y="175">→</text><text x="35" y="290" class="small">Segmentation alone does not provide depth, collision safety, or a grasp pose.</text></svg>