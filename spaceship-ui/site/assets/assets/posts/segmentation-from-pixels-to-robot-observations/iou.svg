<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="IoU example with twelve labeled pixels"><rect width="960" height="360" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#0f172a;font-size:21px}.small{font-size:16px}</style><text x="32" y="43" font-size="26" font-weight="bold">Toy example: intersection over union</text><rect x="55" y="80" width="70" height="55" fill="#93c5fd"/><text x="80" y="115">0</text><rect x="130" y="80" width="70" height="55" fill="#93c5fd"/><text x="155" y="115">1</text><rect x="205" y="80" width="70" height="55" fill="#93c5fd"/><text x="230" y="115">2</text><rect x="55" y="140" width="70" height="55" fill="#a78bfa"/><text x="80" y="175">3</text><rect x="130" y="140" width="70" height="55" fill="#a78bfa"/><text x="155" y="175">4</text><rect x="205" y="140" width="70" height="55" fill="#a78bfa"/><text x="230" y="175">5</text><rect x="55" y="200" width="70" height="55" fill="#a78bfa"/><text x="80" y="235">6</text><rect x="130" y="200" width="70" height="55" fill="#a78bfa"/><text x="155" y="235">7</text><rect x="205" y="200" width="70" height="55" fill="#a78bfa"/><text x="230" y="235">8</text><rect x="55" y="260" width="70" height="55" fill="#fb7185"/><text x="80" y="295">9</text><rect x="130" y="260" width="70" height="55" fill="#fb7185"/><text x="155" y="295">10</text><rect x="205" y="260" width="70" height="55" fill="#fb7185"/><text x="230" y="295">11</text><text x="320" y="110" class="small">Prediction only</text><text x="320" y="200" class="small">Both masks (6)</text><text x="320" y="290" class="small">Ground truth only</text><text x="570" y="130">Intersection = 6 pixels</text><text x="570" y="175">Union = 12 pixels</text><text x="570" y="230">IoU = 6 / 12 = 0.50</text><text x="570" y="290" class="small">Original toy data, not a benchmark.</text></svg>