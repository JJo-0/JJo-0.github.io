<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">전기화학 DAC 논문의 에너지 시스템 경계</title>
  <desc id="desc">대기, 송풍기, 포집과 정제 방출 셀, 압축과 저장을 연결하고 논문의 0.83 MWh per tonne 값이 가운데 셀 경계만 포함함을 보여주는 설명 도식</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f4e78"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;fill:#17324d}.h{font-size:42px;font-weight:800}.s{font-size:25px;font-weight:700}.b{font-size:22px}.n{font-size:19px;fill:#536578}.box{fill:#fff;stroke:#8aa3b8;stroke-width:3}.core{fill:#e9f4ee;stroke:#2f7654;stroke-width:4}.outside{fill:#f7f8fa;stroke:#9aa8b5;stroke-width:3;stroke-dasharray:12 10}.flow{stroke:#1f4e78;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fbfcfd"/>
  <text x="70" y="78" class="h">0.83 MWh/tCO₂가 포함하는 범위부터 보자</text>
  <text x="70" y="116" class="n">설명용 도식 · 논문 Figure가 아니며 크기와 거리는 실제 설비 비율이 아니다</text>
  <rect x="55" y="185" width="265" height="310" rx="28" class="outside"/>
  <text x="188" y="235" text-anchor="middle" class="s">논문 수치 밖</text>
  <rect x="90" y="285" width="195" height="115" rx="22" class="box"/>
  <text x="188" y="330" text-anchor="middle" class="s">대기 + 송풍기</text>
  <text x="188" y="365" text-anchor="middle" class="b">약 400 ppm CO₂</text>
  <rect x="385" y="155" width="630" height="410" rx="36" class="core"/>
  <text x="700" y="215" text-anchor="middle" class="s">논문이 보고한 CR 경계</text>
  <text x="700" y="252" text-anchor="middle" class="b">capture + purified release</text>
  <rect x="445" y="300" width="210" height="150" rx="22" class="box"/>
  <text x="550" y="348" text-anchor="middle" class="s">포집</text>
  <text x="550" y="385" text-anchor="middle" class="b">높은 pH</text>
  <text x="550" y="420" text-anchor="middle" class="b">CO₂ → HCO₃⁻</text>
  <rect x="745" y="300" width="210" height="150" rx="22" class="box"/>
  <text x="850" y="348" text-anchor="middle" class="s">정제 방출</text>
  <text x="850" y="385" text-anchor="middle" class="b">낮은 pH</text>
  <text x="850" y="420" text-anchor="middle" class="b">HCO₃⁻ → CO₂</text>
  <path d="M655 375 H740" class="flow"/>
  <rect x="1080" y="185" width="265" height="310" rx="28" class="outside"/>
  <text x="1212" y="235" text-anchor="middle" class="s">논문 수치 밖</text>
  <rect x="1115" y="285" width="195" height="115" rx="22" class="box"/>
  <text x="1212" y="330" text-anchor="middle" class="s">압축·운송·저장</text>
  <text x="1212" y="365" text-anchor="middle" class="b">별도 에너지 필요</text>
  <path d="M285 342 H435" class="flow"/>
  <path d="M965 342 H1105" class="flow"/>
  <rect x="380" y="610" width="640" height="92" rx="22" fill="#17324d"/>
  <text x="700" y="650" text-anchor="middle" style="font:800 28px Pretendard,'Noto Sans KR',Arial,sans-serif;fill:white">0.83 MWh/tCO₂ = 스택의 포집 + 정제 방출 전기</text>
  <text x="700" y="683" text-anchor="middle" style="font:500 20px Pretendard,'Noto Sans KR',Arial,sans-serif;fill:#dbe8f2">전체 플랜트(all-in) 에너지로 읽으면 안 된다</text>
</svg>
