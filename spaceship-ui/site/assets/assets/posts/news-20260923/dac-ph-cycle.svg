<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">대칭형 니켈 수산화물 셀의 pH 순환</title>
  <desc id="desc">높은 pH에서 이산화탄소를 중탄산염과 탄산염으로 잡고 낮은 pH에서 기체 이산화탄소로 놓아주는 양쪽 챔버와 니켈 수산화물 산화환원 반응을 보여주는 설명 도식</desc>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#245f86"/></marker>
    <style>text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;fill:#17324d}.h{font-size:40px;font-weight:800}.s{font-size:27px;font-weight:800}.b{font-size:22px}.n{font-size:19px;fill:#536578}.arrow{fill:none;stroke:#245f86;stroke-width:5;marker-end:url(#a)}.cell{stroke-width:4}.eq{font-size:24px;font-weight:700}</style>
  </defs>
  <rect width="1400" height="850" fill="#fbfcfd"/>
  <text x="70" y="75" class="h">같은 두 전극이 번갈아 포집과 방출을 맡는다</text>
  <text x="70" y="113" class="n">설명용 도식 · 실제 장치의 배관·막 두께·전극 형상을 재현한 그림이 아니다</text>
  <rect x="90" y="190" width="500" height="390" rx="36" fill="#e7f3fb" stroke="#3278a4" class="cell"/>
  <text x="340" y="245" text-anchor="middle" class="s">A: 포집 쪽 · 높은 pH</text>
  <text x="340" y="294" text-anchor="middle" class="b">희박한 공기 속 CO₂가 물에 들어온다</text>
  <text x="340" y="350" text-anchor="middle" class="eq">CO₂ + OH⁻ ⇌ HCO₃⁻</text>
  <text x="340" y="397" text-anchor="middle" class="eq">HCO₃⁻ + OH⁻ ⇌ CO₃²⁻ + H₂O</text>
  <rect x="170" y="454" width="340" height="78" rx="18" fill="#fff" stroke="#8aa3b8" stroke-width="2"/>
  <text x="340" y="503" text-anchor="middle" class="b">CO₂가 이온 형태로 용액에 머문다</text>
  <rect x="810" y="190" width="500" height="390" rx="36" fill="#fff1e6" stroke="#bd6a32" class="cell"/>
  <text x="1060" y="245" text-anchor="middle" class="s">B: 방출 쪽 · 낮은 pH</text>
  <text x="1060" y="294" text-anchor="middle" class="b">평형이 다시 기체 CO₂ 쪽으로 이동한다</text>
  <text x="1060" y="350" text-anchor="middle" class="eq">HCO₃⁻ + H⁺ ⇌ CO₂ + H₂O</text>
  <rect x="890" y="454" width="340" height="78" rx="18" fill="#fff" stroke="#8aa3b8" stroke-width="2"/>
  <text x="1060" y="503" text-anchor="middle" class="b">정제된 CO₂ 흐름으로 내보낸다</text>
  <rect x="625" y="222" width="150" height="325" rx="26" fill="#eef1f4" stroke="#596d7d" stroke-width="4"/>
  <text x="700" y="345" text-anchor="middle" class="s">OH⁻ 교환막</text>
  <text x="700" y="388" text-anchor="middle" class="b">이온은 통과</text>
  <text x="700" y="425" text-anchor="middle" class="b">기체는 분리</text>
  <path d="M1185 620 C1060 760 340 760 215 620" class="arrow"/>
  <text x="700" y="758" text-anchor="middle" class="s">다음 반주기에는 A와 B의 역할을 교환</text>
  <rect x="248" y="640" width="410" height="60" rx="16" fill="#fff" stroke="#3278a4" stroke-width="2"/>
  <text x="453" y="679" text-anchor="middle" class="eq">NiOOH + H₂O + e⁻ → Ni(OH)₂ + OH⁻</text>
  <rect x="742" y="640" width="410" height="60" rx="16" fill="#fff" stroke="#bd6a32" stroke-width="2"/>
  <text x="947" y="679" text-anchor="middle" class="eq">Ni(OH)₂ + OH⁻ → NiOOH + H₂O + e⁻</text>
</svg>
