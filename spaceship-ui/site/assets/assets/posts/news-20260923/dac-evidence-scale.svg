<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">니켈 수산화물 DAC의 두 실험 규모 비교</title>
  <desc id="desc">25 제곱센티미터 단일 셀의 오천 시간 내구성 결과와 아홉 곱하기 삼백 제곱센티미터 스택의 사십팔 시간 확장 결과를 분리해 비교하는 설명 도식</desc>
  <style>text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;fill:#17324d}.h{font-size:40px;font-weight:800}.k{font-size:31px;font-weight:800}.v{font-size:27px;font-weight:800}.b{font-size:22px}.n{font-size:19px;fill:#536578}.card{fill:#fff;stroke-width:4}.tag{font-size:20px;font-weight:800;fill:#fff}</style>
  <rect width="1400" height="800" fill="#fbfcfd"/>
  <text x="70" y="76" class="h">“오래 버팀”과 “크게 만듦”은 서로 다른 실험이다</text>
  <text x="70" y="114" class="n">설명용 도식 · 면적 상자의 크기는 실제 비율이 아니다</text>
  <rect x="75" y="175" width="565" height="485" rx="34" class="card" stroke="#3278a4"/>
  <rect x="110" y="210" width="165" height="48" rx="24" fill="#3278a4"/>
  <text x="192" y="242" text-anchor="middle" class="tag">내구성 증거</text>
  <text x="130" y="330" class="k">25 cm² 단일 셀</text>
  <text x="130" y="393" class="v">5,000시간</text>
  <text x="130" y="445" class="b">CR 에너지 약 0.46 MWh/tCO₂</text>
  <text x="130" y="505" class="b">묻는 질문: 작은 셀이 장기간 순환하는가?</text>
  <text x="130" y="565" class="b">답하지 못한 질문: 큰 스택도 같은 기간 버티는가?</text>
  <rect x="760" y="175" width="565" height="485" rx="34" class="card" stroke="#bd6a32"/>
  <rect x="795" y="210" width="165" height="48" rx="24" fill="#bd6a32"/>
  <text x="877" y="242" text-anchor="middle" class="tag">확장성 증거</text>
  <text x="815" y="330" class="k">9 × 300 cm² 스택</text>
  <text x="815" y="393" class="v">48시간</text>
  <text x="815" y="445" class="b">CR 에너지 0.83 MWh/tCO₂</text>
  <text x="815" y="493" class="b">flux 75 kgCO₂·m⁻²·yr⁻¹</text>
  <text x="815" y="553" class="b">묻는 질문: 셀을 묶어 공기를 처리할 수 있는가?</text>
  <text x="815" y="613" class="b">답하지 못한 질문: 다년 운전 비용과 교체주기는?</text>
  <rect x="235" y="703" width="930" height="62" rx="18" fill="#17324d"/>
  <text x="700" y="744" text-anchor="middle" style="font:700 25px Pretendard,'Noto Sans KR',Arial,sans-serif;fill:white">두 결과를 합치면 가능성은 커지지만, “대형 스택 5,000시간”이 되지는 않는다</text>
</svg>
