<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">One vector access spans four cache lines</title><desc id="d">2,048 bits is 256 bytes, the width of four 64-byte cache lines. This compares data widths. Neither memory transactions nor speedup was measured.</desc><rect width="960" height="440" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#1d2939"><text x="48" y="60" font-size="30" font-weight="700">How wide is one vector access?</text><text x="48" y="112" font-size="23">In the paper, VL=16 gives 2,048 bits = 256 B</text><rect x="48" y="145" width="864" height="74" rx="8" fill="#d9eaf7" stroke="#1f4e78" stroke-width="2"/><text x="480" y="191" text-anchor="middle" font-size="26">Vector data width: 256 B</text><rect x="51" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="156" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="267" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="372" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="483" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="588" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="699" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="804" y="303" text-anchor="middle" font-size="24">64 B</text><text x="48" y="371" font-size="23">Width of four cache lines</text><text x="48" y="413" font-size="17" fill="#59636e">A comparison of units. Transaction counts and performance were not measured.</text></g></svg>