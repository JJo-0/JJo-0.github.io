<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">벡터 한 번의 폭과 캐시라인 네 개</title><desc id="d">2048비트는 256바이트이며 64바이트 캐시라인 네 개 분량이다. 이는 데이터 폭의 단위 비교이며 실제 메모리 거래 횟수나 속도 향상을 뜻하지 않는다.</desc><rect width="960" height="440" fill="#fff"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#1d2939"><text x="48" y="60" font-size="30" font-weight="700">한 번의 벡터 접근은 얼마나 넓을까?</text><text x="48" y="112" font-size="23">논문 표기 VL=16: 2048 bit = 256 B</text><rect x="48" y="145" width="864" height="74" rx="8" fill="#d9eaf7" stroke="#1f4e78" stroke-width="2"/><text x="480" y="191" text-anchor="middle" font-size="26">벡터 데이터 폭 256 B</text><rect x="51" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="156" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="267" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="372" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="483" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="588" y="303" text-anchor="middle" font-size="24">64 B</text><rect x="699" y="257" width="210" height="74" rx="6" fill="#f3efe4" stroke="#59636e"/><text x="804" y="303" text-anchor="middle" font-size="24">64 B</text><text x="48" y="371" font-size="23">캐시라인 4개 분량의 폭</text><text x="48" y="413" font-size="17" fill="#59636e">단위 비교용 설명 그림 · 실제 거래 횟수나 성능 측정값이 아님</text></g></svg>