<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Left-to-right and arbitrary-order token generation</title>
  <desc id="desc">One path fills slots consecutively. A confidence-based path can postpone uncertain logical connectives. This is an original teaching diagram.</desc>
  <rect width="1200" height="700" fill="#f8f5ee"/>
  <text x="72" y="76" fill="#202722" font-family="system-ui, sans-serif" font-size="35" font-weight="750">Token order can change where a solution branches</text>
  <text x="72" y="116" fill="#59655d" font-family="system-ui, sans-serif" font-size="20">Illustrative paths. This diagram contains no experimental measurements.</text>
  <rect x="68" y="166" width="505" height="458" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <rect x="627" y="166" width="505" height="458" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="106" y="221" fill="#1e4f45" font-family="system-ui, sans-serif" font-size="29" font-weight="750">AR: proceed left to right</text>
  <text x="665" y="221" fill="#8a4a27" font-family="system-ui, sans-serif" font-size="29" font-weight="750">AO: fill confident slots first</text>
  <text x="106" y="264" fill="#526057" font-family="system-ui, sans-serif" font-size="19">Earlier words guide the next choice.</text>
  <text x="665" y="264" fill="#526057" font-family="system-ui, sans-serif" font-size="19">Easy slots can leave a connective until last.</text>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="650" text-anchor="middle">
    <rect x="108" y="320" width="116" height="72" rx="14" fill="#dceee7"/><text x="166" y="366" fill="#173b33">Problem</text>
    <path d="M232 356h40" stroke="#477c6d" stroke-width="5"/><path d="M264 344l18 12-18 12" fill="none" stroke="#477c6d" stroke-width="5"/>
    <rect x="292" y="320" width="116" height="72" rx="14" fill="#f8ddb8"/><text x="350" y="366" fill="#703b21">Thus</text>
    <path d="M416 356h40" stroke="#477c6d" stroke-width="5"/><path d="M448 344l18 12-18 12" fill="none" stroke="#477c6d" stroke-width="5"/>
    <rect x="476" y="320" width="62" height="72" rx="14" fill="#dceee7"/><text x="507" y="366" fill="#173b33">Answer</text>
    <rect x="668" y="320" width="116" height="72" rx="14" fill="#dceee7"/><text x="726" y="366" fill="#173b33">Problem</text>
    <rect x="960" y="320" width="62" height="72" rx="14" fill="#dceee7"/><text x="991" y="366" fill="#173b33">Answer</text>
    <rect x="810" y="320" width="120" height="72" rx="14" fill="#fff8ec" stroke="#c98a54" stroke-width="3" stroke-dasharray="8 7"/><text x="870" y="366" fill="#703b21">Thus?</text>
  </g>
  <path d="M166 418v62h341v-62" fill="none" stroke="#477c6d" stroke-width="4"/>
  <text x="337" y="530" fill="#234f43" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="650">Choose the branch in context</text>
  <path d="M726 418v61h265v-61" fill="none" stroke="#c06a38" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="859" y="530" fill="#854522" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="650">The connective may be left until later</text>
  <text x="106" y="585" fill="#46534b" font-family="system-ui, sans-serif" font-size="18">The finding concerns the math and coding tasks studied.</text>
  <text x="665" y="585" fill="#46534b" font-family="system-ui, sans-serif" font-size="18">Other tasks can favor different generation orders.</text>
</svg>
