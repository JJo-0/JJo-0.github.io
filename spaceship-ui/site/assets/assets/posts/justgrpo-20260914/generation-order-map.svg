<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">왼쪽부터 채우는 생성과 빈칸을 임의 순서로 채우는 생성을 비교하는 교육용 도식</title>
  <desc id="desc">문장을 한 토큰씩 왼쪽에서 오른쪽으로 완성하는 경로와, 확신이 높은 곳부터 빈칸을 채우며 논리 연결어를 뒤로 미루는 경로를 대비한다. 논문의 원 Figure를 복제한 것이 아닌 자체 제작 설명 그림이다.</desc>
  <rect width="1200" height="700" fill="#f8f5ee"/>
  <text x="72" y="76" fill="#202722" font-family="system-ui, sans-serif" font-size="35" font-weight="750">문장을 만드는 순서가 ‘생각의 갈림길’을 바꿀 수 있다</text>
  <text x="72" y="116" fill="#59655d" font-family="system-ui, sans-serif" font-size="20">교육용 개념도 · 실험 측정값·논문 원 Figure가 아님</text>
  <rect x="68" y="166" width="505" height="458" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <rect x="627" y="166" width="505" height="458" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="106" y="221" fill="#1e4f45" font-family="system-ui, sans-serif" font-size="29" font-weight="750">AR: 왼쪽부터 한 칸씩</text>
  <text x="665" y="221" fill="#8a4a27" font-family="system-ui, sans-serif" font-size="29" font-weight="750">AO: 확신 높은 칸부터</text>
  <text x="106" y="264" fill="#526057" font-family="system-ui, sans-serif" font-size="19">앞 단어가 다음 선택의 문맥을 만든다.</text>
  <text x="665" y="264" fill="#526057" font-family="system-ui, sans-serif" font-size="19">쉬운 단어를 먼저 채우면 연결어가 남는다.</text>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="650" text-anchor="middle">
    <rect x="108" y="320" width="116" height="72" rx="14" fill="#dceee7"/><text x="166" y="366" fill="#173b33">문제</text>
    <path d="M232 356h40" stroke="#477c6d" stroke-width="5"/><path d="M264 344l18 12-18 12" fill="none" stroke="#477c6d" stroke-width="5"/>
    <rect x="292" y="320" width="116" height="72" rx="14" fill="#f8ddb8"/><text x="350" y="366" fill="#703b21">따라서</text>
    <path d="M416 356h40" stroke="#477c6d" stroke-width="5"/><path d="M448 344l18 12-18 12" fill="none" stroke="#477c6d" stroke-width="5"/>
    <rect x="476" y="320" width="62" height="72" rx="14" fill="#dceee7"/><text x="507" y="366" fill="#173b33">답</text>
    <rect x="668" y="320" width="116" height="72" rx="14" fill="#dceee7"/><text x="726" y="366" fill="#173b33">문제</text>
    <rect x="960" y="320" width="62" height="72" rx="14" fill="#dceee7"/><text x="991" y="366" fill="#173b33">답</text>
    <rect x="810" y="320" width="120" height="72" rx="14" fill="#fff8ec" stroke="#c98a54" stroke-width="3" stroke-dasharray="8 7"/><text x="870" y="366" fill="#703b21">따라서?</text>
  </g>
  <path d="M166 418v62h341v-62" fill="none" stroke="#477c6d" stroke-width="4"/>
  <text x="337" y="530" fill="#234f43" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="650">갈림길을 문맥 안에서 선택</text>
  <path d="M726 418v61h265v-61" fill="none" stroke="#c06a38" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="859" y="530" fill="#854522" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="650">논리 연결어가 나중에 남을 수 있음</text>
  <text x="106" y="585" fill="#46534b" font-family="system-ui, sans-serif" font-size="18">이 글의 핵심: AR이 언제나 더 낫다는 뜻은 아니다.</text>
  <text x="665" y="585" fill="#46534b" font-family="system-ui, sans-serif" font-size="18">이번 연구의 수학·코드 과제에서 관찰된 가설이다.</text>
</svg>
