<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JustGRPO의 학습과 추론을 분리해서 보여 주는 교육용 흐름도</title>
  <desc id="desc">학습에서는 같은 질문으로 여러 왼쪽-오른쪽 답안을 만들고 검증 보상으로 설정을 업데이트하며, 배포 추론에서는 확산 모델의 병렬 복원 선택지를 유지하는 구조를 나타낸다. 실제 시스템 처리량이나 보상 값을 의미하지 않는다.</desc>
  <rect width="1200" height="720" fill="#f8f5ee"/>
  <text x="70" y="76" fill="#202722" font-family="system-ui, sans-serif" font-size="35" font-weight="750">바꾼 것은 모델의 ‘몸체’보다 학습 때 답을 만드는 순서다</text>
  <text x="70" y="116" fill="#59655d" font-family="system-ui, sans-serif" font-size="20">교육용 흐름도 · 실제 시간·비용·성능 비율을 나타내지 않음</text>
  <rect x="65" y="166" width="1070" height="282" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="105" y="220" fill="#1e4f45" font-family="system-ui, sans-serif" font-size="29" font-weight="750">학습(training): 왼쪽부터 만든 답안을 보상으로 비교</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="100" y="270" width="170" height="94" rx="16" fill="#e7eee8"/><text x="185" y="309" fill="#21342b" font-size="22" font-weight="700">질문 x</text><text x="185" y="338" fill="#536259" font-size="17">수학·코드 문제</text>
    <rect x="355" y="270" width="208" height="94" rx="16" fill="#dceee7"/><text x="459" y="309" fill="#173b33" font-size="22" font-weight="700">답안 K개</text><text x="459" y="338" fill="#426559" font-size="17">AR 순서로 생성</text>
    <rect x="648" y="270" width="208" height="94" rx="16" fill="#f8ddb8"/><text x="752" y="309" fill="#703b21" font-size="22" font-weight="700">검증 보상</text><text x="752" y="338" fill="#795f42" font-size="17">정답·테스트 통과</text>
    <rect x="941" y="270" width="150" height="94" rx="16" fill="#eadff2"/><text x="1016" y="309" fill="#4f3766" font-size="22" font-weight="700">업데이트</text><text x="1016" y="338" fill="#665679" font-size="17">더 좋은 확률</text>
  </g>
  <g fill="none" stroke="#5b7f71" stroke-width="5"><path d="M278 317h62"/><path d="M571 317h62"/><path d="M864 317h62"/></g>
  <g fill="#5b7f71"><path d="M328 305l18 12-18 12"/><path d="M621 305l18 12-18 12"/><path d="M914 305l18 12-18 12"/></g>
  <path d="M1016 380v38H459v-38" fill="none" stroke="#7d6392" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="737" y="414" fill="#5d4672" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">다음 학습 묶음에서 더 높은 보상을 받은 선택을 더 자주 하도록 조정</text>
  <rect x="65" y="497" width="1070" height="155" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="105" y="549" fill="#8a4a27" font-family="system-ui, sans-serif" font-size="29" font-weight="750">추론(inference): 확산 모델의 병렬 복원 선택지는 남긴다</text>
  <text x="105" y="584" fill="#46534b" font-family="system-ui, sans-serif" font-size="21">JustGRPO는 학습 때만 AR 순서를 쓴다. 사용자가 답을 받을 때는 여러 빈칸을 함께 복원하는</text>
  <text x="105" y="616" fill="#46534b" font-family="system-ui, sans-serif" font-size="21">dLLM의 병렬 생성 방식을 계속 선택할 수 있다.</text>
  <text x="105" y="644" fill="#7c4c30" font-family="system-ui, sans-serif" font-size="18">따라서 ‘확산 LLM을 AR LLM으로 바꿨다’가 아니라 ‘RL 학습 경로를 단순하게 정했다’가 더 정확하다.</text>
</svg>
