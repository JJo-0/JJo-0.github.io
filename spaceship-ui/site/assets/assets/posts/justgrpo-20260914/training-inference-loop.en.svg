<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Training and inference in JustGRPO</title>
  <desc id="desc">Training generates several answers to each prompt from left to right and updates the model with verified rewards. Parallel restoration remains available at inference. The diagram gives no measured throughput or rewards.</desc>
  <rect width="1200" height="720" fill="#f8f5ee"/>
  <text x="70" y="76" fill="#202722" font-family="system-ui, sans-serif" font-size="35" font-weight="750">JustGRPO changes the order of training answers</text>
  <text x="70" y="116" fill="#59655d" font-family="system-ui, sans-serif" font-size="20">Illustrative flow. Box sizes and arrows do not encode time, cost, or performance.</text>
  <rect x="65" y="166" width="1070" height="282" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="105" y="220" fill="#1e4f45" font-family="system-ui, sans-serif" font-size="29" font-weight="750">Training: compare left-to-right answers by reward</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="100" y="270" width="170" height="94" rx="16" fill="#e7eee8"/><text x="185" y="309" fill="#21342b" font-size="22" font-weight="700">Prompt x</text><text x="185" y="338" fill="#536259" font-size="17">Math or code</text>
    <rect x="355" y="270" width="208" height="94" rx="16" fill="#dceee7"/><text x="459" y="309" fill="#173b33" font-size="22" font-weight="700">K answers</text><text x="459" y="338" fill="#426559" font-size="17">AR order</text>
    <rect x="648" y="270" width="208" height="94" rx="16" fill="#f8ddb8"/><text x="752" y="309" fill="#703b21" font-size="22" font-weight="700">Reward</text><text x="752" y="338" fill="#795f42" font-size="17">Answer or tests</text>
    <rect x="941" y="270" width="150" height="94" rx="16" fill="#eadff2"/><text x="1016" y="309" fill="#4f3766" font-size="22" font-weight="700">Update</text><text x="1016" y="338" fill="#665679" font-size="17">Probabilities</text>
  </g>
  <g fill="none" stroke="#5b7f71" stroke-width="5"><path d="M278 317h62"/><path d="M571 317h62"/><path d="M864 317h62"/></g>
  <g fill="#5b7f71"><path d="M328 305l18 12-18 12"/><path d="M621 305l18 12-18 12"/><path d="M914 305l18 12-18 12"/></g>
  <path d="M1016 380v38H459v-38" fill="none" stroke="#7d6392" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="737" y="400" fill="#5d4672" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">Favor choices with higher relative rewards.</text>
  <rect x="65" y="497" width="1070" height="155" rx="26" fill="#ffffff" stroke="#cfd6cb" stroke-width="2"/>
  <text x="105" y="549" fill="#8a4a27" font-family="system-ui, sans-serif" font-size="29" font-weight="750">Inference: parallel restoration remains available</text>
  <text x="105" y="584" fill="#46534b" font-family="system-ui, sans-serif" font-size="21">Left-to-right order is imposed during training. At inference, the dLLM can fill</text>
  <text x="105" y="616" fill="#46534b" font-family="system-ui, sans-serif" font-size="21">multiple masks in parallel when generating an answer for the user.</text>
  <text x="105" y="644" fill="#7c4c30" font-family="system-ui, sans-serif" font-size="18">The intervention fixes the reward-training path while retaining the diffusion language model.</text>
</svg>
