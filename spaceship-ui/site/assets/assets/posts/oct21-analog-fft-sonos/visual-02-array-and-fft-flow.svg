<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc"><title id="title">직접 DFT와 분할 FFT의 계산 경계</title><desc id="desc">두 계산 흐름에서 배열 연산, ADC 읽기, 디지털 단계가 어디에 놓이는지 비교한다.</desc><rect width="600" height="650" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172033"><text x="28" y="42" font-size="28" font-weight="700">계산을 나누면 데이터 이동도 바뀐다</text><text x="28" y="78" font-size="24">개념도 · 회로·전력 수치 비례도 아님</text><rect x="24" y="108" width="260" height="500" rx="14" fill="#f1f5f9" stroke="#9aa8b8" stroke-width="2"/><rect x="316" y="108" width="260" height="500" rx="14" fill="#f1f5f9" stroke="#9aa8b8" stroke-width="2"/><text x="50" y="150" font-size="27" font-weight="700">직접 DFT</text><text x="342" y="150" font-size="27" font-weight="700">분할 FFT</text><g font-size="24"><rect x="48" y="174" width="212" height="72" rx="10" fill="#dce8f2"/><text x="68" y="220">큰 N×N 행렬</text><path d="M154 252v32" stroke="#526174" stroke-width="4"/><path d="m144 275 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="48" y="292" width="212" height="84" rx="10" fill="#dce8f2"/><text x="67" y="326">부분 배열 MVM</text><text x="67" y="356">여러 조각 계산</text><path d="M154 382v30" stroke="#526174" stroke-width="4"/><path d="m144 403 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="48" y="420" width="212" height="70" rx="10" fill="#f5dfc8"/><text x="74" y="464">ADC로 읽기</text><path d="M154 496v26" stroke="#526174" stroke-width="4"/><path d="m144 513 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="48" y="530" width="212" height="58" rx="10" fill="#e7ddf4"/><text x="63" y="568">디지털 합산</text><rect x="340" y="174" width="212" height="72" rx="10" fill="#dce8f2"/><text x="376" y="220">작은 DFT₁</text><path d="M446 252v32" stroke="#526174" stroke-width="4"/><path d="m436 275 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="340" y="292" width="212" height="70" rx="10" fill="#f5dfc8"/><text x="364" y="336">ADC · 재배열</text><path d="M446 368v28" stroke="#526174" stroke-width="4"/><path d="m436 387 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="340" y="404" width="212" height="70" rx="10" fill="#e7ddf4"/><text x="355" y="448">디지털 twiddle</text><path d="M446 480v28" stroke="#526174" stroke-width="4"/><path d="m436 499 10 12 10-12" fill="none" stroke="#526174" stroke-width="4"/><rect x="340" y="516" width="212" height="72" rx="10" fill="#dce8f2"/><text x="376" y="562">작은 DFT₂</text></g></g></svg>