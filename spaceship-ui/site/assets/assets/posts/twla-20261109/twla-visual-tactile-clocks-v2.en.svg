<svg width="540" height="850" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 850" role="img" aria-labelledby="title desc"><title id="title">Visual planning and tactile updates</title><desc id="desc">The base action chunk is cached from one visual update to the next. Several tactile updates use current touch to revise it in between. Timing is schematic.</desc><rect width="540" height="850" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:22px}.line{stroke:#3c6174;stroke-width:4}.vis{fill:#e4f1f3;stroke:#237b86;stroke-width:3}.tac{fill:#fff0d9;stroke:#c78127;stroke-width:3}.out{fill:#eef0fb;stroke:#6265a7;stroke-width:3}</style><text x="36" y="52" class="title">Visual and tactile updates</text><line x1="70" y1="124" x2="470" y2="124" class="line"/><circle cx="95" cy="124" r="12" fill="#237b86"/><circle cx="445" cy="124" r="12" fill="#237b86"/><circle cx="205" cy="124" r="10" fill="#c78127"/><circle cx="290" cy="124" r="10" fill="#c78127"/><circle cx="370" cy="124" r="10" fill="#c78127"/><text x="66" y="101" class="body">Vision t</text><text x="350" y="101" class="body">Next visual update</text><text x="137" y="166" class="body">Tactile updates τ</text><rect x="36" y="220" width="468" height="128" rx="18" class="vis"/><text x="62" y="263" class="head">Visual branch</text><text x="62" y="302" class="body">Cache base chunk A_base</text><text x="62" y="332" class="body">Retain global context</text><path d="M270 350 V382" class="line"/><path d="M259 371 L270 386 L281 371" fill="none" class="line"/><rect x="36" y="396" width="468" height="128" rx="18" class="tac"/><text x="62" y="439" class="head">Tactile editor</text><text x="62" y="478" class="body">Recent touch + elapsed time Δt</text><text x="62" y="508" class="body">Compute the current residual</text><path d="M270 526 V558" class="line"/><path d="M259 547 L270 562 L281 547" fill="none" class="line"/><rect x="36" y="572" width="468" height="128" rx="18" class="out"/><text x="62" y="615" class="head">Corrected action chunk</text><text x="62" y="654" class="body">Edit valid, pending positions only</text><text x="62" y="684" class="body">Use the same A_base</text><text x="36" y="754" class="body">Time intervals are schematic.</text><text x="36" y="790" class="body">For explanation. No rates or results plotted.</text></svg>