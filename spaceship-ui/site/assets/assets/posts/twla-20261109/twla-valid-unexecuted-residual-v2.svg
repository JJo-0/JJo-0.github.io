<svg width="540" height="850" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 850" role="img" aria-labelledby="title desc"><title id="title">잔차는 유효한 미실행 위치에 적용</title><desc id="desc">동작 묶음은 실행 완료, 유효한 미실행, 무효 padding으로 나뉜다. 같은 캐시 기본 묶음의 현재 잔차는 황색 유효 미실행 구간에만 적용되고, 회색과 빨간 구간은 바뀌지 않는다.</desc><rect width="540" height="850" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:22px}.small{font-size:22px}.done{fill:#dce3e7;stroke:#71808a;stroke-width:3}.valid{fill:#fff0d9;stroke:#c78127;stroke-width:3}.mask{fill:#f4e5e5;stroke:#a44d4d;stroke-width:3}.base{fill:#e8edf0;stroke:#617482;stroke-width:3}.teal{stroke:#237b86;stroke-width:4}</style><text x="36" y="52" class="title">현재 잔차가 바꾸는 위치</text><text x="36" y="104" class="head">동작 묶음의 유효 범위</text><rect x="36" y="128" width="138" height="118" rx="12" class="done"/><rect x="174" y="128" width="240" height="118" class="valid"/><rect x="414" y="128" width="90" height="118" rx="12" class="mask"/><text x="47" y="162" class="small">실행 완료</text><text x="184" y="162" class="small">유효·미실행</text><text x="420" y="162" class="small">무효</text><text x="57" y="208" class="small">a1…ak</text><text x="210" y="208" class="small">a(k+1)…aH</text><text x="424" y="208" class="small">패딩</text><text x="36" y="300" class="head">같은 캐시 기본 묶음</text><rect x="36" y="320" width="468" height="82" rx="12" class="base"/><text x="58" y="370" class="body">A_base</text><text x="36" y="454" class="head">현재 잔차</text><text x="36" y="494" class="body">Delta A_(t,tau)</text><path d="M294 498 V554" class="teal"/><path d="M283 542 L294 558 L305 542" fill="none" class="teal"/><text x="36" y="596" class="head">보정 결과</text><rect x="36" y="616" width="138" height="118" rx="12" class="done"/><rect x="174" y="616" width="240" height="118" class="valid"/><rect x="414" y="616" width="90" height="118" rx="12" class="mask"/><text x="47" y="657" class="small">변경 없음</text><text x="184" y="657" class="small">현재 잔차 적용</text><text x="420" y="657" class="small">변경 없음</text><text x="36" y="790" class="body">개념도: 논문 실험 결과가 아님</text></svg>