<svg width="540" height="850" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 850" role="img" aria-labelledby="title desc"><title id="title">시각 계획과 촉각 보정의 갱신</title><desc id="desc">시각 갱신 t에서 저장한 기본 동작 묶음을 다음 시각 갱신까지 유지하며, 그 사이 여러 촉각 갱신 tau에서 현재 촉각 정보로 보정한다. 실제 주기나 성능을 나타내지 않는 개념도다.</desc><rect width="540" height="850" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:22px}.line{stroke:#3c6174;stroke-width:4}.vis{fill:#e4f1f3;stroke:#237b86;stroke-width:3}.tac{fill:#fff0d9;stroke:#c78127;stroke-width:3}.out{fill:#eef0fb;stroke:#6265a7;stroke-width:3}</style><text x="36" y="52" class="title">두 갱신 사이의 역할</text><line x1="70" y1="124" x2="470" y2="124" class="line"/><circle cx="95" cy="124" r="12" fill="#237b86"/><circle cx="445" cy="124" r="12" fill="#237b86"/><circle cx="205" cy="124" r="10" fill="#c78127"/><circle cx="290" cy="124" r="10" fill="#c78127"/><circle cx="370" cy="124" r="10" fill="#c78127"/><text x="66" y="101" class="body">시각 t</text><text x="350" y="101" class="body">다음 시각</text><text x="137" y="166" class="body">촉각 tau 갱신</text><rect x="36" y="220" width="468" height="128" rx="18" class="vis"/><text x="62" y="263" class="head">시각 branch</text><text x="62" y="302" class="body">기본 묶음 A_base 저장</text><text x="62" y="332" class="body">전역 맥락 유지</text><path d="M270 350 V382" class="line"/><path d="M259 371 L270 386 L281 371" fill="none" class="line"/><rect x="36" y="396" width="468" height="128" rx="18" class="tac"/><text x="62" y="439" class="head">촉각 editor</text><text x="62" y="478" class="body">최근 촉각 + 경과 시간 Delta t</text><text x="62" y="508" class="body">현재 잔차를 계산</text><path d="M270 526 V558" class="line"/><path d="M259 547 L270 562 L281 547" fill="none" class="line"/><rect x="36" y="572" width="468" height="128" rx="18" class="out"/><text x="62" y="615" class="head">보정된 동작 묶음</text><text x="62" y="654" class="body">미실행·유효 위치만 바뀜</text><text x="62" y="684" class="body">기준은 같은 A_base</text><text x="36" y="754" class="body">시점 간격은 개념 표시이며 실제 시간 비율이 아님</text><text x="36" y="790" class="body">측정 빈도·성능 그래프가 아닌 설명도식</text></svg>