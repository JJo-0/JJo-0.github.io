<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc">
  <title id="title">LC-1의 조직별 최대 knockout 수치와 서로 다른 투여 경로</title>
  <desc id="desc">간은 정맥, 뇌는 척수강, 폐는 기관 내 투여에 대응한다. 공개 초록의 최대 79%, 48%, 27%는 같은 경로의 전신 전달률도 사람 완치율도 아니다. 독립 제작한 요약이며 논문 그래프 복제가 아니다.</desc>
  <rect width="1080" height="630" rx="24" fill="#f5f8fa"/>
  <g font-family="system-ui,sans-serif" fill="#173848">
    <text x="55" y="65" font-size="32" font-weight="700">세 숫자, 세 투여 경로: 한 번 주사한 결과가 아니다</text>
    <g fill="#e1eef1"><rect x="55" y="120" width="280" height="270" rx="18"/><rect x="400" y="120" width="280" height="270" rx="18"/><rect x="745" y="120" width="280" height="270" rx="18"/></g>
    <text x="195" y="170" text-anchor="middle" font-size="27">간 / 정맥 투여</text>
    <text x="540" y="170" text-anchor="middle" font-size="27">뇌 / 척수강 투여</text>
    <text x="885" y="170" text-anchor="middle" font-size="27">폐 / 기관 내 투여</text>
    <text x="195" y="255" text-anchor="middle" font-size="48" font-weight="700">최대 79%</text>
    <text x="540" y="255" text-anchor="middle" font-size="48" font-weight="700">최대 48%</text>
    <text x="885" y="255" text-anchor="middle" font-size="48" font-weight="700">최대 27%</text>
    <text x="540" y="345" text-anchor="middle" font-size="24">공개 초록의 마우스 Cas9 knockout 결과</text>
    <text x="55" y="450" font-size="25">형광 보고 신호, DNA 염기 교정, 질병 치료 효과는 구분한다</text>
    <text x="55" y="510" font-size="23">최댓값만으로 동물별 분산·통계·모든 조직의 분모를 알 수 없다</text>
    <text x="55" y="570" font-size="23">JJo 자체 제작 · 초록 요약 · 원문 도판·실제 조직 사진 아님</text>
  </g>
</svg>
