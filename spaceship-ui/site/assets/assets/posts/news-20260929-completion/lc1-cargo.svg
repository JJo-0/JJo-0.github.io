<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">짧은 RNA와 큰 RNA를 구분한 운반체 선별 개념</title>
  <desc id="desc">짧은 Fluc RNA 약 1.7 kb와 큰 ABE NanoLuc RNA 약 5.7 kb를 서로 다른 길이의 선으로 표시한다. 384는 지질 후보 수다. 선 길이는 입자 크기가 아니며 논문 도판을 재현하지 않았다.</desc>
  <rect width="1080" height="620" rx="24" fill="#f5f8fa"/>
  <g font-family="system-ui,sans-serif" fill="#173848">
    <text x="55" y="65" font-size="32" font-weight="700">작은 설계도에서 좋은 포장 ≠ 큰 설계도에서도 좋은 포장</text>
    <rect x="45" y="105" width="480" height="270" rx="18" fill="#e1eef1"/>
    <rect x="555" y="105" width="480" height="270" rx="18" fill="#e9ecd9"/>
    <text x="75" y="155" font-size="27">작은 cargo: Fluc ~1.7 kb</text>
    <path d="M85 230q20-35 40 0t40 0t40 0" fill="none" stroke="#177c8d" stroke-width="8"/>
    <text x="75" y="320" font-size="23">발광 단백질 설계도</text>
    <text x="585" y="155" font-size="27">큰 cargo: ABE–NanoLuc ~5.7 kb</text>
    <path d="M595 230q20-35 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#65792f" stroke-width="8"/>
    <text x="585" y="320" font-size="23">염기 편집기 + 발광 보고 기능</text>
    <text x="55" y="435" font-size="28" font-weight="700">지질 후보 12 × 4 × 2 × 4 = 384개 → 기능 비교</text>
    <text x="55" y="495" font-size="24">RNA 길이 비 ~3.35배: 입자 지름·편집률의 배수가 아니다</text>
    <text x="55" y="555" font-size="23">JJo 자체 제작 · 길이 비교 개념 · 실제 입자·측정 그래프 아님</text>
  </g>
</svg>
