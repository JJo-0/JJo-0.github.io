<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Substrate independence is the central disagreement in AI consciousness</title>
<desc id="desc">A comparison of computational functionalism and biological naturalism around the substrate-independence question.</desc>
<rect width="1400" height="760" rx="30" fill="#0f172a"/>
<text x="80" y="92" fill="white" font-size="42" font-weight="900" font-family="Inter, Pretendard, sans-serif">The central divide: Substrate independence</text>
<text x="80" y="135" fill="#94a3b8" font-size="17" font-family="Inter, Pretendard, sans-serif">Does the right function suffice in silicon, or is being alive necessary?</text>
<g transform="translate(80 205)" font-family="Inter, Pretendard, sans-serif">
  <rect width="560" height="385" rx="30" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/><text x="38" y="58" fill="#a5b4fc" font-size="15" font-weight="800">POSITION A</text><text x="38" y="108" fill="white" font-size="31" font-weight="900">Computational functionalism</text><text x="38" y="147" fill="#c7d2fe" font-size="15">Computational Functionalism</text><line x1="38" y1="176" x2="522" y2="176" stroke="#4338ca"/><text x="38" y="220" fill="#e2e8f0" font-size="15">• Causal information-processing roles matter more than material</text><text x="38" y="260" fill="#e2e8f0" font-size="15">• GWT/RPT/HOT functions may be implemented in machines</text><text x="38" y="300" fill="#e2e8f0" font-size="15">• Silicon could in principle support moral patients</text><text x="38" y="346" fill="#818cf8" font-size="14" font-weight="800">Examples: Butlin · Long · Graziano · AI welfare</text>
  <rect x="680" width="560" height="385" rx="30" fill="#172554" stroke="#38bdf8" stroke-width="3"/><text x="718" y="58" fill="#7dd3fc" font-size="15" font-weight="800">POSITION B</text><text x="718" y="108" fill="white" font-size="31" font-weight="900">Biological naturalism</text><text x="718" y="147" fill="#bae6fd" font-size="15">Biological Naturalism</text><line x1="718" y1="176" x2="1202" y2="176" stroke="#0369a1"/><text x="718" y="220" fill="#e2e8f0" font-size="15">• Consciousness is a life process, not computation alone</text><text x="718" y="260" fill="#e2e8f0" font-size="15">• Homeostasis, metabolism, and embodied self-maintenance matter</text><text x="718" y="300" fill="#e2e8f0" font-size="15">• Simulating function does not guarantee experienced feeling</text><text x="718" y="346" fill="#38bdf8" font-size="14" font-weight="800">Examples: Seth · Searle · embodied/enactive views</text>
</g>
<g transform="translate(80 635)" font-family="Inter, Pretendard, sans-serif"><text x="0" y="0" fill="#fbbf24" font-size="15" font-weight="800">Assessment:</text><text x="135" y="0" fill="#e2e8f0" font-size="15">Current evidence does not settle the metaphysics. Make assumptions explicit.</text></g>
</svg>