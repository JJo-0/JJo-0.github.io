<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Substrate independence is the central disagreement in AI consciousness</title>
<desc id="desc">A comparison of computational functionalism and biological naturalism around the substrate-independence question.</desc>
<rect width="1400" height="760" rx="30" fill="#0f172a"/>
<text x="80" y="92" fill="white" font-size="42" font-weight="900" font-family="Inter, Pretendard, sans-serif">핵심 대립축: 기질 독립성(Substrate Independence)</text>
<text x="80" y="135" fill="#94a3b8" font-size="22" font-family="Inter, Pretendard, sans-serif">같은 기능을 구현하면 실리콘에서도 의식이 가능한가, 아니면 ‘살아 있음’이 필요한가?</text>
<g transform="translate(80 205)" font-family="Inter, Pretendard, sans-serif">
  <rect width="560" height="385" rx="30" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/><text x="38" y="58" fill="#a5b4fc" font-size="20" font-weight="800">POSITION A</text><text x="38" y="108" fill="white" font-size="31" font-weight="900">계산적 기능주의</text><text x="38" y="147" fill="#c7d2fe" font-size="20">Computational Functionalism</text><line x1="38" y1="176" x2="522" y2="176" stroke="#4338ca"/><text x="38" y="220" fill="#e2e8f0" font-size="20">• 물질보다 인과적 정보처리 구조가 중요</text><text x="38" y="260" fill="#e2e8f0" font-size="20">• GWT/RPT/HOT 같은 기능 조건을 기계에 구현 가능</text><text x="38" y="300" fill="#e2e8f0" font-size="20">• 실리콘도 원리적으로 moral patient가 될 수 있음</text><text x="38" y="346" fill="#818cf8" font-size="18" font-weight="800">대표 논의: Butlin · Long · Graziano · AI welfare</text>
  <rect x="680" width="560" height="385" rx="30" fill="#172554" stroke="#38bdf8" stroke-width="3"/><text x="718" y="58" fill="#7dd3fc" font-size="20" font-weight="800">POSITION B</text><text x="718" y="108" fill="white" font-size="31" font-weight="900">생물학적 자연주의</text><text x="718" y="147" fill="#bae6fd" font-size="20">Biological Naturalism</text><line x1="718" y1="176" x2="1202" y2="176" stroke="#0369a1"/><text x="718" y="220" fill="#e2e8f0" font-size="20">• 의식은 계산이 아니라 생명 현상의 일부</text><text x="718" y="260" fill="#e2e8f0" font-size="20">• 항상성·대사·체화된 자기유지가 핵심</text><text x="718" y="300" fill="#e2e8f0" font-size="20">• 기능 모사는 경험의 인스턴스화를 보장하지 않음</text><text x="718" y="346" fill="#38bdf8" font-size="18" font-weight="800">대표 논의: Seth · Searle · embodied/enactive views</text>
</g>
<g transform="translate(80 635)" font-family="Inter, Pretendard, sans-serif"><text x="0" y="0" fill="#fbbf24" font-size="20" font-weight="800">이 글의 결론:</text><text x="135" y="0" fill="#e2e8f0" font-size="20">현재 증거만으로 어느 형이상학적 전제를 경험적으로 확정할 수 없다. 따라서 전제를 먼저 공개해야 한다.</text></g>
</svg>