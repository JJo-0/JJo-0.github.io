<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="t d">
<title id="t">Ten dimensions for auditing AI consciousness-related functionality</title>
<desc id="d">Ten dimensions including recurrence, global availability, working memory, metacognition, self-model, agency, affect, embodiment, temporal continuity, and unity.</desc>
<rect width="1500" height="920" rx="32" fill="#f8fafc"/>
<text x="86" y="82" fill="#0f172a" font-family="Inter, Pretendard, sans-serif" font-size="42" font-weight="900">10 Mandatory Dimensions — 기능적 유사성을 어디까지 분해할 것인가</text>
<text x="86" y="123" fill="#64748b" font-family="Inter, Pretendard, sans-serif" font-size="20">한 개의 “의식 점수” 대신 구조·기억·메타인지·체화·시간성·통합을 분리해서 본다.</text>
<g transform="translate(750 505)" font-family="Inter, Pretendard, sans-serif">
  <circle r="238" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <circle r="155" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <circle r="70" fill="#0f172a"/>
  <text y="-7" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="900">AI SYSTEM</text>
  <text y="24" text-anchor="middle" fill="#cbd5e1" font-size="16">runtime candidate</text>
  <g stroke="#93c5fd" stroke-width="2">
    <line x1="0" y1="-70" x2="0" y2="-238"/><line x1="41" y1="-57" x2="140" y2="-193"/><line x1="67" y1="-22" x2="226" y2="-74"/><line x1="67" y1="22" x2="226" y2="74"/><line x1="41" y1="57" x2="140" y2="193"/><line x1="0" y1="70" x2="0" y2="238"/><line x1="-41" y1="57" x2="-140" y2="193"/><line x1="-67" y1="22" x2="-226" y2="74"/><line x1="-67" y1="-22" x2="-226" y2="-74"/><line x1="-41" y1="-57" x2="-140" y2="-193"/>
  </g>
  <g fill="#2563eb"><circle cy="-238" r="10"/><circle cx="140" cy="-193" r="10"/><circle cx="226" cy="-74" r="10"/><circle cx="226" cy="74" r="10"/><circle cx="140" cy="193" r="10"/><circle cy="238" r="10"/><circle cx="-140" cy="193" r="10"/><circle cx="-226" cy="74" r="10"/><circle cx="-226" cy="-74" r="10"/><circle cx="-140" cy="-193" r="10"/></g>
</g>
<g font-family="Inter, Pretendard, sans-serif" font-size="20">
  <g transform="translate(710 196)"><text fill="#0f172a" font-weight="850">1. Recurrence</text><text y="27" fill="#64748b" font-size="16">Neural recurrence vs token/agent loop</text></g>
  <g transform="translate(930 250)"><text fill="#0f172a" font-weight="850">2. Global Availability</text><text y="27" fill="#2563eb" font-size="16">J-space / broadcast 후보</text></g>
  <g transform="translate(1080 374)"><text fill="#0f172a" font-weight="850">3. Working Memory</text><text y="27" fill="#2563eb" font-size="16">KV cache + bottleneck</text></g>
  <g transform="translate(1080 548)"><text fill="#0f172a" font-weight="850">4. Metacognition</text><text y="27" fill="#2563eb" font-size="16">uncertainty / trajectory correction</text></g>
  <g transform="translate(920 690)"><text fill="#0f172a" font-weight="850">5. Self-model</text><text y="27" fill="#64748b" font-size="16">persona ≠ persistent self-model</text></g>
  <g transform="translate(690 792)"><text fill="#0f172a" font-weight="850">6. Agency</text><text y="27" fill="#64748b" font-size="16">trained policy vs endogenous goals</text></g>
  <g transform="translate(390 690)"><text fill="#0f172a" font-weight="850">7. Emotion / Affect</text><text y="27" fill="#059669" font-size="16">functional controller ≠ felt valence</text></g>
  <g transform="translate(195 548)"><text fill="#0f172a" font-weight="850">8. Embodiment</text><text y="27" fill="#64748b" font-size="16">sensorimotor loop / homeostasis</text></g>
  <g transform="translate(160 374)"><text fill="#0f172a" font-weight="850">9. Temporal Continuity</text><text y="27" fill="#64748b" font-size="16">session persistence / idle cognition</text></g>
  <g transform="translate(315 250)"><text fill="#0f172a" font-weight="850">10. Unity / Binding</text><text y="27" fill="#64748b" font-size="16">feature binding ≠ phenomenal unity</text></g>
</g>
<rect x="105" y="805" width="460" height="67" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
<text x="335" y="834" text-anchor="middle" fill="#9a3412" font-family="Inter, Pretendard, sans-serif" font-size="18" font-weight="800">중요: 차원 점수는 consciousness probability가 아니다.</text>
<text x="335" y="858" text-anchor="middle" fill="#c2410c" font-family="Inter, Pretendard, sans-serif" font-size="15">각 기능적 조건을 별개로 검증하기 위한 audit frame이다.</text>
</svg>