<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="t d">
<title id="t">AI consciousness evidence ladder</title><desc id="d">Six levels of evidence from human intuition to theoretical convergence, with the distinction between functional access and phenomenal experience.</desc>
<defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#64748b"/><stop offset=".42" stop-color="#2563eb"/><stop offset=".72" stop-color="#059669"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
<rect width="1500" height="820" rx="32" fill="#f8fafc"/>
<text x="92" y="86" fill="#0f172a" font-family="Inter, Pretendard, sans-serif" font-size="42" font-weight="900">Evidence Ladder — 무엇이 ‘의식의 증거’인가?</text>
<text x="92" y="127" fill="#64748b" font-family="Inter, Pretendard, sans-serif" font-size="20">행동적 출력에서 인과 개입까지 올라가도 phenomenal experience는 별도의 문제로 남는다.</text>
<line x1="255" y1="665" x2="255" y2="200" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
<g font-family="Inter, Pretendard, sans-serif">
  <g><circle cx="255" cy="650" r="21" fill="#64748b"/><text x="310" y="640" font-size="25" font-weight="850" fill="#0f172a">L0 · 인간의 직관 / “살아있는 느낌”</text><text x="310" y="672" font-size="19" fill="#64748b">대화 말투·감정 표현만으로는 과학적 증거가 되지 않는다.</text></g>
  <g><circle cx="255" cy="565" r="21" fill="#64748b"/><text x="310" y="555" font-size="25" font-weight="850" fill="#0f172a">L1 · 행동적 출력 / Self-report, ToM</text><text x="310" y="587" font-size="19" fill="#64748b">관찰 가능하지만 훈련·role-play·post-training의 영향을 강하게 받는다.</text></g>
  <g><circle cx="255" cy="480" r="21" fill="#2563eb"/><text x="310" y="470" font-size="25" font-weight="850" fill="#0f172a">L2 · 기능적 능력 / 불확실성·계획·오류보정</text><text x="310" y="502" font-size="19" fill="#1d4ed8">고도화된 접근 의식(Access)과 기능적 메타인지의 후보 증거.</text></g>
  <g><circle cx="255" cy="395" r="21" fill="#2563eb"/><text x="310" y="385" font-size="25" font-weight="850" fill="#0f172a">L3 · 내부 상관 / Workspace·belief representation</text><text x="310" y="417" font-size="19" fill="#1d4ed8">행동만이 아니라 모델 내부 representation을 직접 측정한다.</text></g>
  <g><circle cx="255" cy="310" r="21" fill="#059669"/><text x="310" y="300" font-size="25" font-weight="850" fill="#0f172a">L4 · 인과 개입 / Ablation·Steering·SAE</text><text x="310" y="332" font-size="19" fill="#047857">내부 feature를 조절해 정책·자기보고를 바꿀 수 있는지 검증한다.</text></g>
  <g><circle cx="255" cy="225" r="21" fill="#f59e0b"/><text x="310" y="215" font-size="25" font-weight="850" fill="#0f172a">L5 · 이론적 수렴 / GWT·IIT·HOT·RPT의 합의</text><text x="310" y="247" font-size="19" fill="#b45309">현재는 theory-dependent. 서로 다른 이론이 같은 시스템을 다르게 판정한다.</text></g>
</g>
<rect x="1000" y="255" width="390" height="330" rx="26" fill="#fff1f2" stroke="#fecdd3"/>
<text x="1195" y="322" text-anchor="middle" fill="#be123c" font-family="Inter, Pretendard, sans-serif" font-size="24" font-weight="900">Phenomenal gap</text>
<text x="1195" y="370" text-anchor="middle" fill="#881337" font-family="Inter, Pretendard, sans-serif" font-size="20">Qualia · Felt valence</text>
<text x="1195" y="408" text-anchor="middle" fill="#881337" font-family="Inter, Pretendard, sans-serif" font-size="20">Subjective experience</text>
<line x1="1050" y1="445" x2="1340" y2="445" stroke="#fda4af" stroke-width="2"/>
<text x="1195" y="492" text-anchor="middle" fill="#9f1239" font-family="Inter, Pretendard, sans-serif" font-size="18">L2~L4의 기능적·인과적 증거가</text>
<text x="1195" y="522" text-anchor="middle" fill="#9f1239" font-family="Inter, Pretendard, sans-serif" font-size="18">강해져도 자동으로 증명되지 않는다.</text>
</svg>