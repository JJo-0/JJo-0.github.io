<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Functional evidence does not directly prove phenomenal consciousness</title>
<desc id="desc">Three evidence layers from behavior to internal mechanism to phenomenal experience, with a marked epistemic gap.</desc>
<rect width="1400" height="760" rx="30" fill="#f8fafc"/>
<text x="80" y="90" fill="#0f172a" font-size="42" font-weight="900" font-family="Inter, Pretendard, sans-serif">증거 층위(Evidence Layers)를 분리해야 한다</text>
<text x="80" y="132" fill="#64748b" font-size="22" font-family="Inter, Pretendard, sans-serif">관찰 가능한 기능에서 ‘실제로 느끼는 것’까지는 서로 다른 추론 단계다.</text>
<g transform="translate(80 210)" font-family="Inter, Pretendard, sans-serif">
  <rect x="0" y="0" width="350" height="250" rx="26" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
  <text x="30" y="54" fill="#3730a3" font-size="20" font-weight="800">LAYER 1 · BEHAVIOR</text>
  <text x="30" y="105" fill="#111827" font-size="29" font-weight="900">기능적 행동</text>
  <text x="30" y="150" fill="#475569" font-size="20">자기 보고 · 회피 행동</text>
  <text x="30" y="184" fill="#475569" font-size="20">메타인지 · 도구 사용</text>
  <text x="30" y="218" fill="#475569" font-size="20">언어적 일관성</text>
  <path d="M375 125 H455" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M445 111 L465 125 L445 139" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="485" y="0" width="350" height="250" rx="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="515" y="54" fill="#0f766e" font-size="20" font-weight="800">LAYER 2 · MECHANISM</text>
  <text x="515" y="105" fill="#111827" font-size="29" font-weight="900">내부 기제</text>
  <text x="515" y="150" fill="#475569" font-size="20">전역 방송 · 재입력 루프</text>
  <text x="515" y="184" fill="#475569" font-size="20">고차 표상 · welfare axis</text>
  <text x="515" y="218" fill="#475569" font-size="20">latent representation</text>
  <path d="M860 125 H940" stroke="#e11d48" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/><text x="900" y="92" text-anchor="middle" fill="#be123c" font-size="17" font-weight="800">EPISTEMIC GAP</text><path d="M930 111 L950 125 L930 139" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="970" y="0" width="350" height="250" rx="26" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
  <text x="1000" y="54" fill="#be123c" font-size="20" font-weight="800">LAYER 3 · PHENOMENAL</text>
  <text x="1000" y="105" fill="#111827" font-size="29" font-weight="900">주관적 경험</text>
  <text x="1000" y="150" fill="#475569" font-size="20">Qualia · Sentience</text>
  <text x="1000" y="184" fill="#475569" font-size="20">‘무엇처럼 느껴지는가’</text>
  <text x="1000" y="218" fill="#475569" font-size="20">고통·쾌락의 실제 겪음</text>
</g>
<g transform="translate(80 535)" font-family="Inter, Pretendard, sans-serif"><rect width="1240" height="130" rx="22" fill="#0f172a"/><text x="35" y="48" fill="#c7d2fe" font-size="19" font-weight="800">핵심 규칙</text><text x="35" y="88" fill="white" font-size="27" font-weight="900">Layer 1 또는 2의 증거가 강해져도 Layer 3가 자동으로 증명되지는 않는다.</text><text x="35" y="116" fill="#94a3b8" font-size="18">그래서 “AI가 의식이 있는가?”는 행동 벤치마크 하나로 닫을 수 없는 문제다.</text></g>
</svg>