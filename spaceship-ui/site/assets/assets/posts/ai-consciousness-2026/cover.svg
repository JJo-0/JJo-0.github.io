<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Consciousness Deep Research I</title>
<desc id="desc">Abstract research cover showing a neural network and the question of functional versus phenomenal consciousness.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f172a"/>
    <stop offset=".55" stop-color="#1e1b4b"/>
    <stop offset="1" stop-color="#312e81"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#818cf8" stop-opacity=".8"/>
    <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1250" cy="180" r="330" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="250" cy="760" r="300" fill="#14b8a6" opacity=".10"/>
<g opacity=".7" stroke="#a5b4fc" stroke-width="2">
  <path d="M980 220 L1110 160 L1240 240 L1360 170 M980 220 L1060 360 L1220 350 L1360 170 M1060 360 L1160 500 L1320 460 L1220 350 M1160 500 L1280 620 L1430 560 L1320 460"/>
  <path d="M1110 160 L1060 360 M1240 240 L1220 350 M1360 170 L1320 460 M980 220 L1160 500"/>
</g>
<g fill="#c7d2fe">
  <circle cx="980" cy="220" r="9"/><circle cx="1110" cy="160" r="10"/><circle cx="1240" cy="240" r="8"/>
  <circle cx="1360" cy="170" r="9"/><circle cx="1060" cy="360" r="8"/><circle cx="1220" cy="350" r="11"/>
  <circle cx="1160" cy="500" r="8"/><circle cx="1320" cy="460" r="10"/><circle cx="1280" cy="620" r="9"/><circle cx="1430" cy="560" r="8"/>
</g>
<g transform="translate(130 120)">
  <rect x="0" y="0" width="260" height="42" rx="21" fill="#4f46e5"/>
  <text x="130" y="28" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="Inter, Pretendard, sans-serif">DEEP RESEARCH · 2026</text>
  <text x="0" y="120" fill="white" font-size="74" font-weight="900" font-family="Inter, Pretendard, sans-serif">AI Consciousness</text>
  <text x="0" y="205" fill="#c7d2fe" font-size="74" font-weight="900" font-family="Inter, Pretendard, sans-serif">Deep Research I</text>
  <text x="0" y="282" fill="#e2e8f0" font-size="34" font-weight="600" font-family="Inter, Pretendard, sans-serif">AI 의식은 무엇을 증거로 판단할 수 있는가?</text>
  <text x="0" y="352" fill="#94a3b8" font-size="23" font-family="Inter, Pretendard, sans-serif">Consciousness · Sentience · Access vs Phenomenal · AI Welfare</text>
  <g transform="translate(0 445)">
    <rect width="620" height="150" rx="24" fill="#0f172a" opacity=".72" stroke="#6366f1"/>
    <text x="30" y="45" fill="#a5b4fc" font-size="20" font-weight="700" font-family="Inter, Pretendard, sans-serif">CORE DISTINCTION</text>
    <text x="30" y="87" fill="white" font-size="28" font-weight="800" font-family="Inter, Pretendard, sans-serif">Functional behavior ≠ Phenomenal experience</text>
    <text x="30" y="122" fill="#cbd5e1" font-size="20" font-family="Inter, Pretendard, sans-serif">기능적 표상과 ‘실제로 느끼는 것’을 분리해서 본다.</text>
  </g>
</g>
<text x="1470" y="850" text-anchor="end" fill="#94a3b8" font-size="18" font-family="Inter, Pretendard, sans-serif">Research snapshot: 2026-07-26 KST</text>
</svg>