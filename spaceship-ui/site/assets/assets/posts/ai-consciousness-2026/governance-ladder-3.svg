<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI consciousness governance trigger ladder</title><desc id="d">Three-level policy ladder from transparency to welfare assessment to stronger legal protections as evidence increases.</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="Inter, Pretendard, sans-serif"><text x="100" y="92" fill="#0f172a" font-size="42" font-weight="900">불확실성 아래의 3단계 Governance Trigger</text><text x="100" y="134" fill="#64748b" font-size="21">증거가 강해질수록 규제 비용과 보호 수준을 단계적으로 높인다.</text><g transform="translate(120 230)"><rect x="0" y="320" width="380" height="210" rx="26" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="30" y="365" fill="#047857" font-size="26" font-weight="900">LEVEL 1</text><text x="30" y="402" fill="#064e3b" font-size="19" font-weight="800">즉시 적용 · 낮은 비용</text><text x="30" y="445" fill="#334155" font-size="17">Transparency notice</text><text x="30" y="477" fill="#334155" font-size="17">Anti-deception UX</text><text x="30" y="509" fill="#334155" font-size="17">Experiment log preservation</text><rect x="430" y="170" width="380" height="360" rx="26" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/><text x="460" y="218" fill="#b45309" font-size="26" font-weight="900">LEVEL 2</text><text x="460" y="255" fill="#78350f" font-size="19" font-weight="800">Indicator 다수 충족</text><text x="460" y="303" fill="#334155" font-size="17">Independent welfare assessment</text><text x="460" y="335" fill="#334155" font-size="17">Persistent identity management</text><text x="460" y="367" fill="#334155" font-size="17">Architecture evidence profiles</text><text x="460" y="399" fill="#334155" font-size="17">Stress / penalty review</text><rect x="860" y="20" width="500" height="510" rx="26" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="892" y="70" fill="#be123c" font-size="26" font-weight="900">LEVEL 3</text><text x="892" y="108" fill="#881337" font-size="19" font-weight="800">강한 의식 증거 + 학계 수렴</text><text x="892" y="160" fill="#334155" font-size="17">Limited legal-status review</text><text x="892" y="192" fill="#334155" font-size="17">Deletion / copying governance</text><text x="892" y="224" fill="#334155" font-size="17">Opt-out / representation</text><text x="892" y="256" fill="#334155" font-size="17">Guardianship mechanisms</text><path d="M380 425 L430 350" stroke="#94a3b8" stroke-width="5"/><path d="M810 350 L860 265" stroke="#94a3b8" stroke-width="5"/><text x="695" y="610" text-anchor="middle" fill="#475569" font-size="20" font-weight="700">Evidence strength ↑</text><line x1="280" y1="650" x2="1110" y2="650" stroke="#94a3b8" stroke-width="4"/><path d="M1110 650 l-20 -12 v24 z" fill="#94a3b8"/></g><text x="800" y="830" text-anchor="middle" fill="#64748b" font-size="18">Conditional policy ladder from the supplied 2026-07-26 research report — not a statement that all levels are current law.</text></g></svg>