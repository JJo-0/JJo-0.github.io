<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="t d">
<title id="t">AI consciousness evidence ladder</title><desc id="d">Six levels of evidence from human intuition to theoretical convergence, with the distinction between functional access and phenomenal experience.</desc>
<defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#64748b"/><stop offset=".42" stop-color="#2563eb"/><stop offset=".72" stop-color="#059669"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
<rect width="1500" height="820" rx="32" fill="#f8fafc"/>
<text x="92" y="86" fill="#0f172a" font-family="Inter, Pretendard, sans-serif" font-size="42" font-weight="900">Evidence Ladder — What counts as evidence?</text>
<text x="92" y="127" fill="#64748b" font-family="Inter, Pretendard, sans-serif" font-size="15">Even causal interventions leave phenomenal experience a separate question.</text>
<line x1="255" y1="665" x2="255" y2="200" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
<g font-family="Inter, Pretendard, sans-serif">
  <g><circle cx="255" cy="650" r="21" fill="#64748b"/><text x="310" y="640" font-size="25" font-weight="850" fill="#0f172a">L0 · Human intuition / “feels alive”</text><text x="310" y="672" font-size="14" fill="#64748b">Conversational style and emotional expression alone are not scientific evidence.</text></g>
  <g><circle cx="255" cy="565" r="21" fill="#64748b"/><text x="310" y="555" font-size="25" font-weight="850" fill="#0f172a">L1 · Behavior / Self-report, ToM</text><text x="310" y="587" font-size="14" fill="#64748b">Observable, but strongly shaped by training, role-play, and post-training.</text></g>
  <g><circle cx="255" cy="480" r="21" fill="#2563eb"/><text x="310" y="470" font-size="25" font-weight="850" fill="#0f172a">L2 · Function / Uncertainty, planning, correction</text><text x="310" y="502" font-size="14" fill="#1d4ed8">Candidate evidence of advanced access and functional metacognition.</text></g>
  <g><circle cx="255" cy="395" r="21" fill="#2563eb"/><text x="310" y="385" font-size="25" font-weight="850" fill="#0f172a">L3 · Internal correlates / Workspace, beliefs</text><text x="310" y="417" font-size="14" fill="#1d4ed8">Measure internal representations rather than behavior alone.</text></g>
  <g><circle cx="255" cy="310" r="21" fill="#059669"/><text x="310" y="300" font-size="25" font-weight="850" fill="#0f172a">L4 · Causal intervention / Ablation, steering, SAE</text><text x="310" y="332" font-size="14" fill="#047857">Test whether feature interventions change policies or self-reports.</text></g>
  <g><circle cx="255" cy="225" r="21" fill="#f59e0b"/><text x="310" y="215" font-size="25" font-weight="850" fill="#0f172a">L5 · Theory convergence / GWT, IIT, HOT, RPT</text><text x="310" y="247" font-size="14" fill="#b45309">Still theory-dependent: theories can judge the same system differently.</text></g>
</g>
<rect x="1000" y="255" width="390" height="330" rx="26" fill="#fff1f2" stroke="#fecdd3"/>
<text x="1195" y="322" text-anchor="middle" fill="#be123c" font-family="Inter, Pretendard, sans-serif" font-size="18" font-weight="900">Phenomenal gap</text>
<text x="1195" y="370" text-anchor="middle" fill="#881337" font-family="Inter, Pretendard, sans-serif" font-size="15">Qualia · Felt valence</text>
<text x="1195" y="408" text-anchor="middle" fill="#881337" font-family="Inter, Pretendard, sans-serif" font-size="15">Subjective experience</text>
<line x1="1050" y1="445" x2="1340" y2="445" stroke="#fda4af" stroke-width="2"/>
<text x="1195" y="492" text-anchor="middle" fill="#9f1239" font-family="Inter, Pretendard, sans-serif" font-size="14">Stronger functional/causal evidence</text>
<text x="1195" y="522" text-anchor="middle" fill="#9f1239" font-family="Inter, Pretendard, sans-serif" font-size="14">does not establish it automatically.</text>
</svg>