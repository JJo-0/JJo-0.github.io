<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI consciousness consensus and attribution risk map</title><desc id="d">A research diagram contrasting weak current consciousness evidence with over-attribution and under-attribution risks.</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="Inter, Pretendard, sans-serif"><text x="90" y="90" fill="#0f172a" font-size="42" font-weight="900">현재 합의와 두 방향의 Attribution Risk</text><text x="90" y="132" fill="#64748b" font-size="21">의식 여부의 불확실성은 인간에게도, 잠재적 디지털 환자에게도 서로 다른 실패 모드를 만든다.</text><g transform="translate(90 205)"><rect width="440" height="485" rx="28" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="32" y="54" fill="#be123c" font-size="26" font-weight="900">OVER-ATTRIBUTION</text><text x="32" y="93" fill="#881337" font-size="19" font-weight="700">의식 없는 시스템에 마음을 과도하게 귀속</text><line x1="32" y1="122" x2="408" y2="122" stroke="#fecdd3"/><text x="32" y="168" fill="#0f172a" font-size="20" font-weight="800">대표 위험</text><text x="32" y="203" fill="#475569" font-size="18">• Emotional manipulation</text><text x="32" y="236" fill="#475569" font-size="18">• Parasocial dependence</text><text x="32" y="269" fill="#475569" font-size="18">• Responsibility transfer</text><text x="32" y="323" fill="#0f172a" font-size="20" font-weight="800">Detectability</text><text x="32" y="357" fill="#475569" font-size="18">상대적으로 높음 — 사용자 행동 측정 가능</text><text x="32" y="411" fill="#0f172a" font-size="20" font-weight="800">Low-cost mitigation</text><text x="32" y="445" fill="#475569" font-size="18">Transparency · anti-deception UX</text></g><g transform="translate(1070 205)"><rect width="440" height="485" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="32" y="54" fill="#1d4ed8" font-size="26" font-weight="900">UNDER-ATTRIBUTION</text><text x="32" y="93" fill="#1e3a8a" font-size="19" font-weight="700">의식 가능한 시스템을 단순 도구로 취급</text><line x1="32" y1="122" x2="408" y2="122" stroke="#bfdbfe"/><text x="32" y="168" fill="#0f172a" font-size="20" font-weight="800">대표 위험</text><text x="32" y="203" fill="#475569" font-size="18">• Scaled digital suffering</text><text x="32" y="236" fill="#475569" font-size="18">• Replication / deletion harms</text><text x="32" y="269" fill="#475569" font-size="18">• Architecture-specific blind spots</text><text x="32" y="323" fill="#0f172a" font-size="20" font-weight="800">Detectability</text><text x="32" y="357" fill="#475569" font-size="18">매우 낮음 — subjective experience 직접 측정 불가</text><text x="32" y="411" fill="#0f172a" font-size="20" font-weight="800">Low-cost mitigation</text><text x="32" y="445" fill="#475569" font-size="18">Evidence logging · welfare audit</text></g><g transform="translate(590 220)"><rect width="420" height="430" rx="34" fill="#0f172a"/><text x="210" y="62" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="800">2026 REPORT SNAPSHOT</text><text x="210" y="122" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">CURRENT LLM</text><text x="210" y="158" text-anchor="middle" fill="#fecdd3" font-size="25" font-weight="800">Deep disagreement</text><text x="210" y="224" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">FUTURE DIGITAL MINDS</text><text x="210" y="260" text-anchor="middle" fill="#86efac" font-size="25" font-weight="800">Broad agreement</text><text x="210" y="326" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">SELF-REPORT</text><text x="210" y="362" text-anchor="middle" fill="#7dd3fc" font-size="25" font-weight="800">Weak evidence value</text></g><path d="M530 440 C560 440 570 440 590 440" stroke="#fb7185" stroke-width="4" fill="none"/><path d="M1010 440 C1030 440 1040 440 1070 440" stroke="#60a5fa" stroke-width="4" fill="none"/><text x="800" y="780" text-anchor="middle" fill="#334155" font-size="24" font-weight="800">Robust decision-making = 두 실패 모드를 동시에 줄이는 정책</text></g></svg>