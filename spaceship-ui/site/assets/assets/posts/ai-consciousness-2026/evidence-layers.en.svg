<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Functional evidence does not directly prove phenomenal consciousness</title>
<desc id="desc">Three evidence layers from behavior to internal mechanism to phenomenal experience, with a marked epistemic gap.</desc>
<rect width="1400" height="760" rx="30" fill="#f8fafc"/>
<text x="80" y="90" fill="#0f172a" font-size="42" font-weight="900" font-family="Inter, Pretendard, sans-serif">Separate the evidence layers</text>
<text x="80" y="132" fill="#64748b" font-size="17" font-family="Inter, Pretendard, sans-serif">Observable functions and actual feeling require different inferences.</text>
<g transform="translate(80 210)" font-family="Inter, Pretendard, sans-serif">
  <rect x="0" y="0" width="350" height="250" rx="26" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
  <text x="30" y="54" fill="#3730a3" font-size="15" font-weight="800">LAYER 1 · BEHAVIOR</text>
  <text x="30" y="105" fill="#111827" font-size="29" font-weight="900">Functional behavior</text>
  <text x="30" y="150" fill="#475569" font-size="15">Self-reports · avoidance</text>
  <text x="30" y="184" fill="#475569" font-size="15">Metacognition · tool use</text>
  <text x="30" y="218" fill="#475569" font-size="15">Linguistic consistency</text>
  <path d="M375 125 H455" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M445 111 L465 125 L445 139" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="485" y="0" width="350" height="250" rx="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="515" y="54" fill="#0f766e" font-size="15" font-weight="800">LAYER 2 · MECHANISM</text>
  <text x="515" y="105" fill="#111827" font-size="29" font-weight="900">Internal mechanisms</text>
  <text x="515" y="150" fill="#475569" font-size="15">Broadcasting · recurrence</text>
  <text x="515" y="184" fill="#475569" font-size="15">Higher-order states · welfare axes</text>
  <text x="515" y="218" fill="#475569" font-size="15">latent representation</text>
  <path d="M860 125 H940" stroke="#e11d48" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/><text x="900" y="92" text-anchor="middle" fill="#be123c" font-size="13" font-weight="800">EPISTEMIC GAP</text><path d="M930 111 L950 125 L930 139" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="970" y="0" width="350" height="250" rx="26" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
  <text x="1000" y="54" fill="#be123c" font-size="15" font-weight="800">LAYER 3 · PHENOMENAL</text>
  <text x="1000" y="105" fill="#111827" font-size="29" font-weight="900">Subjective experience</text>
  <text x="1000" y="150" fill="#475569" font-size="15">Qualia · Sentience</text>
  <text x="1000" y="184" fill="#475569" font-size="15">“What it feels like”</text>
  <text x="1000" y="218" fill="#475569" font-size="15">Actually feeling pain or pleasure</text>
</g>
<g transform="translate(80 535)" font-family="Inter, Pretendard, sans-serif"><rect width="1240" height="130" rx="22" fill="#0f172a"/><text x="35" y="48" fill="#c7d2fe" font-size="14" font-weight="800">Core rule</text><text x="35" y="88" fill="white" font-size="27" font-weight="900">Stronger evidence in Layer 1 or 2 does not automatically establish Layer 3.</text><text x="35" y="116" fill="#94a3b8" font-size="14">No single behavioral benchmark settles whether AI is conscious.</text></g>
</svg>