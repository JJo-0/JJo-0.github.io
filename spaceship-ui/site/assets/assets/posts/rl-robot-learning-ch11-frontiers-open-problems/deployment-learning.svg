<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img">
<title>경험이 다음 정책에 들어가는 과정</title>
<rect width="560" height="760" rx="20" fill="#f6f8fa"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#182938">
<text x="280" y="53" font-size="25" font-weight="700">경험이 다음 정책에 들어가는 과정</text>
<rect x="32" y="90" width="496" height="112" rx="16" fill="#ffffff" stroke="#91aab7" stroke-width="2"/>
<text x="280" y="132" font-size="28" font-weight="700">로봇 실행</text>
<text x="280" y="172" font-size="23">성공 · 실패 · 사람의 개입</text>
<path d="M280 208v24m-8-7 8 8 8-8" fill="none" stroke="#346f8d" stroke-width="3"/>
<rect x="32" y="245" width="496" height="112" rx="16" fill="#ffffff" stroke="#91aab7" stroke-width="2"/>
<text x="280" y="287" font-size="28" font-weight="700">경험 기록</text>
<text x="280" y="327" font-size="23">관측 · 행동 · 결과를 연결</text>
<path d="M280 363v24m-8-7 8 8 8-8" fill="none" stroke="#346f8d" stroke-width="3"/>
<rect x="32" y="400" width="496" height="112" rx="16" fill="#ffffff" stroke="#91aab7" stroke-width="2"/>
<text x="280" y="442" font-size="28" font-weight="700">학습과 이전 능력 확인</text>
<text x="280" y="482" font-size="23">새 작업과 기존 작업을 함께 평가</text>
<path d="M280 518v24m-8-7 8 8 8-8" fill="none" stroke="#346f8d" stroke-width="3"/>
<rect x="32" y="555" width="496" height="112" rx="16" fill="#ffffff" stroke="#91aab7" stroke-width="2"/>
<text x="280" y="597" font-size="28" font-weight="700">개선된 정책으로 재시험</text>
<text x="280" y="637" font-size="23">같은 조건과 바뀐 조건에서 비교</text>
<text x="280" y="735" font-size="20" fill="#536471">JJo · 강의 개념을 바탕으로 직접 구성</text></g></svg>