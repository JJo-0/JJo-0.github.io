<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">논문의 비에너지 계산과 상용 팩 비에너지의 분모 차이</title><desc id="desc">논문의 337.04 와트시 매 킬로그램은 양극 활물질과 도전재 바인더, 음극 복합 재료, 고분자 전해질 무게로 계산한 추정값이며 집전체와 포장과 팩 부품은 포함하지 않는다는 것을 보여 준다.</desc>
<rect width="1200" height="675" fill="#f6f8fc"/>
<text x="62" y="75" font-family="sans-serif" font-size="37" font-weight="700" fill="#14263e">337 Wh/kg의 ‘kg’에는 무엇이 들어가나?</text>
<text x="62" y="119" font-family="sans-serif" font-size="22" fill="#506176">설명용 회계 도식 · 실제 팩 에너지 밀도 측정 그래프가 아닙니다</text>
<rect x="80" y="185" width="480" height="360" rx="25" fill="#e0f1e5" stroke="#3e865d" stroke-width="3"/>
<text x="120" y="243" font-family="sans-serif" font-size="29" font-weight="700" fill="#1d5136">논문 계산에 포함</text>
<g font-family="sans-serif" font-size="24" fill="#17482f"><text x="120" y="305">✓ 양극 재료·바인더·도전재</text><text x="120" y="354">✓ 음극 복합 재료</text><text x="120" y="403">✓ 고분자 전해질</text></g>
<rect x="640" y="185" width="480" height="360" rx="25" fill="#fff1e4" stroke="#ba8355" stroke-width="3"/>
<text x="680" y="243" font-family="sans-serif" font-size="29" font-weight="700" fill="#744519">이 계산에서 제외</text>
<g font-family="sans-serif" font-size="26" fill="#694626"><text x="680" y="305">– 금속 집전체</text><text x="680" y="354">– 탭·파우치·포장</text><text x="680" y="403">– 제어 회로·팩 부품</text></g>
<text x="80" y="611" font-family="sans-serif" font-size="23" font-weight="700" fill="#14263e">분모가 커지면 Wh/kg은 낮아집니다. 이 수치를 상용 배터리 팩 사양으로 읽지 마세요.</text>
</svg>
