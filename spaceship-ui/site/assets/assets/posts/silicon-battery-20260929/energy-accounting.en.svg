<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Specific-energy denominators for materials and packs</title><desc id="desc">The 337.04 Wh/kg estimate includes cathode material, conductive additive, binder, anode composite and polymer electrolyte. Collectors and packaging are excluded.</desc>
<rect width="1200" height="675" fill="#f6f8fc"/>
<text x="62" y="75" font-family="sans-serif" font-size="37" font-weight="700" fill="#14263e">Which mass is in 337 Wh/kg?</text>
<text x="62" y="119" font-family="sans-serif" font-size="22" fill="#506176">Accounting diagram · no pack energy measurement</text>
<rect x="80" y="185" width="480" height="360" rx="25" fill="#e0f1e5" stroke="#3e865d" stroke-width="3"/>
<text x="120" y="243" font-family="sans-serif" font-size="29" font-weight="700" fill="#1d5136">Included</text>
<g font-family="sans-serif" font-size="24" fill="#17482f"><text x="120" y="305">✓ Cathode blend and binder</text><text x="120" y="354">✓ Anode composite</text><text x="120" y="403">✓ Polymer electrolyte</text></g>
<rect x="640" y="185" width="480" height="360" rx="25" fill="#fff1e4" stroke="#ba8355" stroke-width="3"/>
<text x="680" y="243" font-family="sans-serif" font-size="29" font-weight="700" fill="#744519">Excluded</text>
<g font-family="sans-serif" font-size="26" fill="#694626"><text x="680" y="305">– Metal current collectors</text><text x="680" y="354">– Tabs, pouch, packaging</text><text x="680" y="403">– Electronics and pack parts</text></g>
<text x="80" y="611" font-family="sans-serif" font-size="23" font-weight="700" fill="#14263e">Adding mass lowers Wh/kg at fixed energy. This is a materials-based estimate.</text>
</svg>
