<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Silicon cell layers and test boundaries</title><desc id="desc">The diagram identifies the cathode, polymer electrolyte and composite anode and distinguishes laboratory cell demonstrations from untested pack performance.</desc>
<rect width="1200" height="675" fill="#f5f8fc"/>
<text x="65" y="75" font-family="sans-serif" font-size="38" font-weight="700" fill="#14243a">What did the team build?</text>
<text x="65" y="122" font-family="sans-serif" font-size="23" fill="#40556d">Schematic · layers are not to scale</text>
<g font-family="sans-serif" text-anchor="middle" font-weight="700" fill="#10233b">
<rect x="110" y="185" width="270" height="220" rx="18" fill="#b8d8ff" stroke="#456fb0" stroke-width="3"/><text x="245" y="260" font-size="31">Cathode</text><text x="245" y="310" font-size="22">LFP or NCM811</text>
<rect x="465" y="185" width="270" height="220" rx="18" fill="#d9e5bf" stroke="#66823d" stroke-width="3"/><text x="600" y="260" font-size="25">Polymer electrolyte</text><text x="600" y="310" font-size="22">SPE · 30–50 µm</text>
<rect x="820" y="185" width="270" height="220" rx="18" fill="#ffd6aa" stroke="#b36a34" stroke-width="3"/><text x="955" y="255" font-size="26">Composite anode</text><text x="955" y="303" font-size="22">Si · Zn · amorphous C</text>
</g>
<path d="M380 295h80M735 295h80" stroke="#42617d" stroke-width="8" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#42617d"/></marker></defs>
<rect x="110" y="465" width="980" height="128" rx="20" fill="#fff" stroke="#b6c6d7" stroke-width="2"/>
<text x="145" y="516" font-family="sans-serif" font-size="26" font-weight="700" fill="#14243a">Tests in the paper</text>
<text x="145" y="558" font-family="sans-serif" font-size="22" fill="#30465e">Materials, coin cells and single-layer pouch cells. Large cells and packs need testing.</text>
</svg>
