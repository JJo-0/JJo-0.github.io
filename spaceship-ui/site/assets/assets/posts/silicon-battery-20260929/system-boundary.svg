<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">실리콘 전고체 전지의 층과 실험 범위</title><desc id="desc">양극, 고분자 전해질, 실리콘 아연 탄소 음극을 단순화하고 측정된 코인셀과 파우치셀, 아직 확인하지 못한 팩 성능을 구분한다.</desc>
<rect width="1200" height="675" fill="#f5f8fc"/>
<text x="65" y="75" font-family="sans-serif" font-size="38" font-weight="700" fill="#14243a">무엇을 만든 전지인가?</text>
<text x="65" y="122" font-family="sans-serif" font-size="23" fill="#40556d">설명용 도식 · 실제 단면 사진이나 두께 비율이 아닙니다</text>
<g font-family="sans-serif" text-anchor="middle" font-weight="700" fill="#10233b">
<rect x="110" y="185" width="270" height="220" rx="18" fill="#b8d8ff" stroke="#456fb0" stroke-width="3"/><text x="245" y="260" font-size="31">양극</text><text x="245" y="310" font-size="22">LFP 또는 NCM811</text>
<rect x="465" y="185" width="270" height="220" rx="18" fill="#d9e5bf" stroke="#66823d" stroke-width="3"/><text x="600" y="260" font-size="29">고분자 전해질</text><text x="600" y="310" font-size="22">SPE · 약 30–50 µm</text>
<rect x="820" y="185" width="270" height="220" rx="18" fill="#ffd6aa" stroke="#b36a34" stroke-width="3"/><text x="955" y="255" font-size="29">복합 음극</text><text x="955" y="303" font-size="22">Si + Zn + 비정질 C</text>
</g>
<path d="M380 295h80M735 295h80" stroke="#42617d" stroke-width="8" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#42617d"/></marker></defs>
<rect x="110" y="465" width="980" height="128" rx="20" fill="#fff" stroke="#b6c6d7" stroke-width="2"/>
<text x="145" y="516" font-family="sans-serif" font-size="26" font-weight="700" fill="#14243a">논문이 측정한 것</text>
<text x="145" y="558" font-family="sans-serif" font-size="22" fill="#30465e">재료 · 코인셀 · 단층 파우치셀 → 상용 대형 셀·배터리 팩 성능은 아직 별도 검증 필요</text>
</svg>
