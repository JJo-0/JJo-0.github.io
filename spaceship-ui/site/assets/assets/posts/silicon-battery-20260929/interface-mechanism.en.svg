<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Two silicon anode interfaces</title><desc id="desc">A tightly bound carbon coating can take up expansion stress. Gaps and a compliant interface in the silicon–zinc–carbon design can distribute strain.</desc>
<rect width="1200" height="675" fill="#f6f8fc"/>
<text x="62" y="72" font-family="sans-serif" font-size="37" font-weight="700" fill="#15283e">What happens when silicon expands?</text>
<text x="62" y="115" font-family="sans-serif" font-size="22" fill="#506176">Conceptual drawing · not a micrograph or FEM result</text>
<rect x="65" y="165" width="510" height="370" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="625" y="165" width="510" height="370" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#15283e"><text x="320" y="215" font-size="27" font-weight="700">Strongly bonded shell</text><text x="880" y="215" font-size="27" font-weight="700">Si–Zn–C interface</text></g>
<circle cx="320" cy="360" r="95" fill="#86b8ed" stroke="#3b74ae" stroke-width="4"/>
<circle cx="320" cy="360" r="112" fill="none" stroke="#d77659" stroke-width="20" stroke-dasharray="84 8 83 8 80 8 82 8 82 8"/>
<circle cx="880" cy="360" r="91" fill="#86b8ed" stroke="#3b74ae" stroke-width="4"/>
<circle cx="880" cy="360" r="112" fill="none" stroke="#e2aa63" stroke-width="17"/>
<circle cx="880" cy="360" r="129" fill="none" stroke="#518f75" stroke-width="14"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#3d4d61"><text x="320" y="572">Stress can load the coating</text><text x="880" y="572">Zn, gaps and carbon share strain</text></g>
<text x="70" y="637" font-family="sans-serif" font-size="19" fill="#5a6776">Si particles ≈ 2.5 µm · carbon coating ≈ 5 nm. Schematic not to scale.</text>
</svg>
