<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">기존 실리콘 음극과 새 복합 계면의 개념 비교</title><desc id="desc">실리콘 팽창이 강한 결합의 탄소 코팅에 응력을 전달하는 경우와, 논문의 실리콘 아연 비정질 탄소 계면에서 완충 공간과 유연한 계면이 응력을 분산시키려는 설계 개념을 비교한다.</desc>
<rect width="1200" height="675" fill="#f6f8fc"/>
<text x="62" y="72" font-family="sans-serif" font-size="37" font-weight="700" fill="#15283e">실리콘이 커질 때, 무엇이 달라졌나?</text>
<text x="62" y="115" font-family="sans-serif" font-size="22" fill="#506176">설명용 개념도 · 원 논문의 현미경 사진이나 FEM 결과가 아닙니다</text>
<rect x="65" y="165" width="510" height="370" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="625" y="165" width="510" height="370" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#15283e"><text x="320" y="215" font-size="27" font-weight="700">강하게 붙은 계면</text><text x="880" y="215" font-size="27" font-weight="700">Si–Zn–C 복합 계면</text></g>
<circle cx="320" cy="360" r="95" fill="#86b8ed" stroke="#3b74ae" stroke-width="4"/>
<circle cx="320" cy="360" r="112" fill="none" stroke="#d77659" stroke-width="20" stroke-dasharray="84 8 83 8 80 8 82 8 82 8"/>
<circle cx="880" cy="360" r="91" fill="#86b8ed" stroke="#3b74ae" stroke-width="4"/>
<circle cx="880" cy="360" r="112" fill="none" stroke="#e2aa63" stroke-width="17"/>
<circle cx="880" cy="360" r="129" fill="none" stroke="#518f75" stroke-width="14"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#3d4d61"><text x="320" y="572">팽창 응력이 코팅에 집중될 수 있음</text><text x="880" y="572">Zn·빈틈·탄소층이 변형을 나눠 받도록 설계</text></g>
<text x="70" y="637" font-family="sans-serif" font-size="19" fill="#5a6776">실제 구조: Si 입자 약 2.5 µm, 표면 탄소층 약 5 nm. 도식 크기는 비례하지 않습니다.</text>
</svg>
