<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Static 3D and dynamic 4D reconstruction</title>
  <desc id="desc">Three-dimensional reconstruction estimates shape at one instant. Adding correspondence over time requires accounting for occlusion and camera motion. The diagram is illustrative.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">4D adds time to 3D reconstruction</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">Track the same point while separating object motion, camera motion, and occlusion.</text>
  <rect x="80" y="184" width="470" height="372" rx="24" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="112" y="234" fill="#242a28" font-family="system-ui, sans-serif" font-size="27" font-weight="750">Static 3D reconstruction</text>
  <text x="112" y="270" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">Shape, depth, and pose at one instant</text>
  <path d="M144 448 L274 350 L454 448 L330 516 Z" fill="#dcebea" stroke="#78a39b" stroke-width="3"/>
  <path d="M274 350 L274 300 L454 400 L454 448" fill="#c9dbe8" stroke="#6f91aa" stroke-width="3"/>
  <path d="M144 448 L144 400 L274 300" fill="#f2e2b9" stroke="#c6a45b" stroke-width="3"/>
  <circle cx="300" cy="425" r="26" fill="#d7654c"/>
  <text x="112" y="530" fill="#65706b" font-family="system-ui, sans-serif" font-size="18">How far is this point from the camera now?</text>
  <rect x="650" y="184" width="470" height="372" rx="24" fill="#eef1f7" stroke="#c7cedc" stroke-width="2"/>
  <text x="682" y="234" fill="#334764" font-family="system-ui, sans-serif" font-size="27" font-weight="750">Dynamic 4D reconstruction</text>
  <text x="682" y="270" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">3D geometry and correspondence over time</text>
  <rect x="698" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="739" cy="370" r="20" fill="#d7654c"/>
  <text x="712" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=0</text>
  <rect x="836" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="877" cy="370" r="20" fill="#d7654c"/>
  <text x="850" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=1</text>
  <rect x="974" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="1015" cy="370" r="20" fill="#d7654c"/>
  <text x="988" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=2</text>
  <path d="M759 370 C795 328 821 328 857 370 S931 412 995 370" fill="none" stroke="#d7654c" stroke-width="5" stroke-dasharray="8 8"/>
  <text x="682" y="526" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">Follow a point and distinguish camera motion from object motion.</text>
  <rect x="80" y="592" width="1040" height="48" rx="12" fill="#efeae0"/>
  <text x="104" y="624" fill="#444c48" font-family="system-ui, sans-serif" font-size="20">The fourth dimension is time: the task is to estimate how a three-dimensional scene changes.</text>
</svg>
