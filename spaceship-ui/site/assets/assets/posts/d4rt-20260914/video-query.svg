<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">D4RT의 동영상 입력과 4D 질의 과정을 설명하는 교육용 그림</title>
  <desc id="desc">동영상 여러 프레임을 encoder가 장면 표현으로 만든 다음, 픽셀·시간·카메라 관점을 질의해 3D 위치를 답하는 과정을 나타낸다. 실제 D4RT 모델의 내부 수치나 원본 그림이 아니다.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">동영상 한 편을, 필요한 4D 질문에 답하는 표현으로 바꾼다</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">자체 제작 개념도 · D4RT의 query 기반 구조를 읽기 쉽게 재구성</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5e6b65"/></marker></defs>
  <text x="80" y="188" fill="#53605a" font-family="system-ui, sans-serif" font-size="20" font-weight="750">입력: 시간 순서의 영상 프레임</text>
  <rect x="80" y="214" width="176" height="132" rx="16" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <rect x="106" y="242" width="124" height="67" rx="8" fill="#6da6ab"/>
  <circle cx="146" cy="270" r="18" fill="#f4d69a"/><path d="M125 306 Q162 276 202 306" fill="none" stroke="#f4d69a" stroke-width="11" stroke-linecap="round"/>
  <text x="96" y="382" fill="#365c55" font-family="system-ui, sans-serif" font-size="19">t = 0</text>
  <rect x="284" y="214" width="176" height="132" rx="16" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <rect x="310" y="242" width="124" height="67" rx="8" fill="#6da6ab"/>
  <circle cx="342" cy="270" r="18" fill="#f4d69a"/><path d="M321 306 Q358 276 398 306" fill="none" stroke="#f4d69a" stroke-width="11" stroke-linecap="round"/>
  <text x="300" y="382" fill="#365c55" font-family="system-ui, sans-serif" font-size="19">t = 1</text>
  <rect x="488" y="214" width="176" height="132" rx="16" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <rect x="514" y="242" width="124" height="67" rx="8" fill="#6da6ab"/>
  <circle cx="542" cy="270" r="18" fill="#f4d69a"/><path d="M521 306 Q558 276 598 306" fill="none" stroke="#f4d69a" stroke-width="11" stroke-linecap="round"/>
  <text x="504" y="382" fill="#365c55" font-family="system-ui, sans-serif" font-size="19">t = 2</text>
  <line x1="664" y1="280" x2="758" y2="280" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="780" y="194" width="330" height="174" rx="22" fill="#e9edf6" stroke="#aab8d2" stroke-width="2"/>
  <text x="810" y="246" fill="#334764" font-family="system-ui, sans-serif" font-size="26" font-weight="750">Encoder</text>
  <text x="810" y="283" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">동영상 전체의 geometry와</text>
  <text x="810" y="312" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">motion을 담은 장면 표현</text>
  <text x="810" y="341" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">(모든 답을 미리 만들지는 않음)</text>
  <line x1="944" y1="370" x2="944" y2="446" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="220" y="470" width="742" height="124" rx="22" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="252" y="514" fill="#242a28" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Query: 어느 픽셀 · 어느 시각 · 어느 카메라 관점?</text>
  <text x="252" y="552" fill="#59635e" font-family="system-ui, sans-serif" font-size="21">예: “t=0의 이 픽셀이 t=2에서 3D 공간 어디에 있나?”</text>
  <text x="252" y="580" fill="#59635e" font-family="system-ui, sans-serif" font-size="19">여러 질문은 병렬로 처리할 수 있다.</text>
</svg>
