<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">정적인 3D 재구성과 시간까지 포함한 4D 재구성의 차이를 설명하는 교육용 그림</title>
  <desc id="desc">정적인 한 순간의 깊이와 위치를 추정하는 3D 재구성에 시간에 따른 점의 대응, 가림, 카메라 움직임을 더하면 4D 재구성이 됨을 나타낸다. 실측 데이터는 아니다.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">4D는 3D에 시간을 덧붙이는 일이다</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">움직이는 영상에서는 물체·카메라·가림을 동시에 분리해 같은 점을 이어 봐야 한다</text>
  <rect x="80" y="184" width="470" height="372" rx="24" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="112" y="234" fill="#242a28" font-family="system-ui, sans-serif" font-size="27" font-weight="750">정적인 3D 재구성</text>
  <text x="112" y="270" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">한 순간의 모양·깊이·카메라 위치</text>
  <path d="M144 448 L274 350 L454 448 L330 516 Z" fill="#dcebea" stroke="#78a39b" stroke-width="3"/>
  <path d="M274 350 L274 300 L454 400 L454 448" fill="#c9dbe8" stroke="#6f91aa" stroke-width="3"/>
  <path d="M144 448 L144 400 L274 300" fill="#f2e2b9" stroke="#c6a45b" stroke-width="3"/>
  <circle cx="300" cy="425" r="26" fill="#d7654c"/>
  <text x="112" y="530" fill="#65706b" font-family="system-ui, sans-serif" font-size="18">질문: 이 점은 지금 카메라에서 얼마나 떨어져 있나?</text>
  <rect x="650" y="184" width="470" height="372" rx="24" fill="#eef1f7" stroke="#c7cedc" stroke-width="2"/>
  <text x="682" y="234" fill="#334764" font-family="system-ui, sans-serif" font-size="27" font-weight="750">동적인 4D 재구성</text>
  <text x="682" y="270" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">3D geometry + 시간에 따른 대응 관계</text>
  <rect x="698" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="739" cy="370" r="20" fill="#d7654c"/>
  <text x="712" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=0</text>
  <rect x="836" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="877" cy="370" r="20" fill="#d7654c"/>
  <text x="850" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=1</text>
  <rect x="974" y="316" width="102" height="128" rx="12" fill="#dcebea" stroke="#87aba4" stroke-width="2"/>
  <circle cx="1015" cy="370" r="20" fill="#d7654c"/>
  <text x="988" y="476" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">t=2</text>
  <path d="M759 370 C795 328 821 328 857 370 S931 412 995 370" fill="none" stroke="#d7654c" stroke-width="5" stroke-dasharray="8 8"/>
  <text x="682" y="526" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="18">같은 점을 계속 이어 보고, 카메라 이동과 물체 이동을 구분한다.</text>
  <rect x="80" y="592" width="1040" height="48" rx="12" fill="#efeae0"/>
  <text x="104" y="624" fill="#444c48" font-family="system-ui, sans-serif" font-size="20">‘4D’는 네 번째 공간축이 아니라, 3차원 장면이 시간에 따라 어떻게 변하는지를 함께 추정한다는 뜻이다.</text>
</svg>
