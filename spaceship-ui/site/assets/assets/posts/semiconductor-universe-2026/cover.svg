<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Global Semiconductor Supply-Chain Universe</title>
  <desc id="desc">수요시장부터 칩, 설계, 웨이퍼, 전공정, 소재, 장비 핵심부품, 팹 인프라, 패키징, HBM, 테스트와 서비스까지 연결한 반도체 공급망 관계도 포스터</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030711"/>
      <stop offset="0.52" stop-color="#07111d"/>
      <stop offset="1" stop-color="#10091b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="840" cy="315" r="330" fill="url(#halo)"/>
  <circle cx="1060" cy="80" r="150" fill="#c026d3" opacity="0.08" filter="url(#soft)"/>
  <circle cx="160" cy="540" r="180" fill="#0891b2" opacity="0.08" filter="url(#soft)"/>

  <g font-family="Inter, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="66" y="66" fill="#94a3b8" font-size="17" font-weight="750" letter-spacing="3">FINANCE &amp; INDUSTRY · 2026-08-20 KST</text>
    <text x="66" y="130" fill="#f8fafc" font-size="54" font-weight="900" letter-spacing="-2.5">Global Semiconductor</text>
    <text x="66" y="190" fill="url(#titleGradient)" font-size="56" font-weight="900" letter-spacing="-2.8">Supply-Chain Universe</text>
    <text x="68" y="232" fill="#cbd5e1" font-size="20" font-weight="520">공정 × 소재 × 부품 × 장비 × 팹 인프라 × 패키징 × 기업 관계도</text>

    <g transform="translate(66 276)">
      <rect width="168" height="82" rx="16" fill="#0b1322" stroke="#22d3ee" stroke-opacity="0.42"/>
      <text x="18" y="34" fill="#67e8f9" font-size="31" font-weight="900">875</text>
      <text x="18" y="60" fill="#94a3b8" font-size="13" font-weight="700">BASELINE NODES</text>

      <rect x="182" width="168" height="82" rx="16" fill="#0b1322" stroke="#818cf8" stroke-opacity="0.42"/>
      <text x="200" y="34" fill="#a5b4fc" font-size="31" font-weight="900">790</text>
      <text x="200" y="60" fill="#94a3b8" font-size="13" font-weight="700">TAXONOMY LEAVES</text>

      <rect x="364" width="168" height="82" rx="16" fill="#0b1322" stroke="#e879f9" stroke-opacity="0.42"/>
      <text x="382" y="34" fill="#f0abfc" font-size="31" font-weight="900">406</text>
      <text x="382" y="60" fill="#94a3b8" font-size="13" font-weight="700">SUPPLY-SIDE LEAVES</text>
    </g>

    <g transform="translate(66 390)">
      <text x="0" y="0" fill="#64748b" font-size="13" font-weight="800" letter-spacing="2">PROCESS WALK</text>
      <g transform="translate(0 25)" font-size="14" font-weight="780">
        <rect x="0" y="0" width="92" height="38" rx="10" fill="#082f49" stroke="#0e7490"/><text x="46" y="24" text-anchor="middle" fill="#a5f3fc">Demand</text>
        <path d="M96 19H118" stroke="#475569" stroke-width="2"/><path d="m114 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="124" y="0" width="92" height="38" rx="10" fill="#172554" stroke="#3730a3"/><text x="170" y="24" text-anchor="middle" fill="#c7d2fe">Design</text>
        <path d="M220 19H242" stroke="#475569" stroke-width="2"/><path d="m238 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="248" y="0" width="92" height="38" rx="10" fill="#312e81" stroke="#6366f1"/><text x="294" y="24" text-anchor="middle" fill="#e0e7ff">Wafer</text>
        <path d="M344 19H366" stroke="#475569" stroke-width="2"/><path d="m362 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="372" y="0" width="92" height="38" rx="10" fill="#3b0764" stroke="#a855f7"/><text x="418" y="24" text-anchor="middle" fill="#f3e8ff">FEOL</text>
        <path d="M468 19H490" stroke="#475569" stroke-width="2"/><path d="m486 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="496" y="0" width="92" height="38" rx="10" fill="#4a044e" stroke="#d946ef"/><text x="542" y="24" text-anchor="middle" fill="#fae8ff">BEOL</text>
      </g>
      <g transform="translate(0 76)" font-size="14" font-weight="780">
        <rect x="0" y="0" width="112" height="38" rx="10" fill="#431407" stroke="#ea580c"/><text x="56" y="24" text-anchor="middle" fill="#ffedd5">Wafer Test</text>
        <path d="M116 19H138" stroke="#475569" stroke-width="2"/><path d="m134 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="144" y="0" width="112" height="38" rx="10" fill="#422006" stroke="#d97706"/><text x="200" y="24" text-anchor="middle" fill="#fef3c7">Packaging</text>
        <path d="M260 19H282" stroke="#475569" stroke-width="2"/><path d="m278 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="288" y="0" width="112" height="38" rx="10" fill="#052e16" stroke="#16a34a"/><text x="344" y="24" text-anchor="middle" fill="#dcfce7">Final Test</text>
        <path d="M404 19H426" stroke="#475569" stroke-width="2"/><path d="m422 14 6 5-6 5" fill="none" stroke="#475569" stroke-width="2"/>
        <rect x="432" y="0" width="156" height="38" rx="10" fill="#042f2e" stroke="#0d9488"/><text x="510" y="24" text-anchor="middle" fill="#ccfbf1">System Integration</text>
      </g>
    </g>

    <g transform="translate(730 80)">
      <g fill="none" stroke-linecap="round">
        <path d="M180 225 70 95M180 225 300 70M180 225 390 175M180 225 338 338M180 225 178 430M180 225 18 346M180 225 -30 210" stroke="#38bdf8" stroke-opacity="0.42" stroke-width="2"/>
        <path d="M70 95 300 70M300 70 390 175M390 175 338 338M338 338 178 430M178 430 18 346M18 346 -30 210M-30 210 70 95" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1.5"/>
        <path d="M70 95 15 20M300 70 378 18M390 175 455 132M338 338 414 410M178 430 172 505M18 346 -66 412M-30 210 -100 174" stroke="#e879f9" stroke-opacity="0.22" stroke-width="1.5"/>
      </g>
      <circle cx="180" cy="225" r="54" fill="#071827" stroke="#67e8f9" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="180" cy="225" r="7" fill="#67e8f9"/>
      <text x="180" y="210" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="900">SEMICONDUCTOR</text>
      <text x="180" y="232" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="800">RELATION GRAPH</text>
      <text x="180" y="253" text-anchor="middle" fill="#64748b" font-size="11">many-to-many ontology</text>

      <g font-size="13" font-weight="850" text-anchor="middle">
        <g><circle cx="70" cy="95" r="30" fill="#082f49" stroke="#22d3ee"/><text x="70" y="100" fill="#cffafe">MASK</text></g>
        <g><circle cx="300" cy="70" r="31" fill="#172554" stroke="#818cf8"/><text x="300" y="75" fill="#e0e7ff">FE / BE</text></g>
        <g><circle cx="390" cy="175" r="31" fill="#3b0764" stroke="#c084fc"/><text x="390" y="180" fill="#f3e8ff">EQUIP</text></g>
        <g><circle cx="338" cy="338" r="33" fill="#4a044e" stroke="#e879f9"/><text x="338" y="343" fill="#fae8ff">PARTS</text></g>
        <g><circle cx="178" cy="430" r="34" fill="#431407" stroke="#fb923c"/><text x="178" y="435" fill="#ffedd5">PKG / HBM</text></g>
        <g><circle cx="18" cy="346" r="31" fill="#052e16" stroke="#4ade80"/><text x="18" y="351" fill="#dcfce7">FAB</text></g>
        <g><circle cx="-30" cy="210" r="31" fill="#042f2e" stroke="#2dd4bf"/><text x="-30" y="215" fill="#ccfbf1">MAT</text></g>
      </g>

      <g font-size="11" font-weight="750" fill="#94a3b8" text-anchor="middle">
        <text x="15" y="12">EUV · blank · pellicle</text>
        <text x="378" y="10">etch · ALD · CMP</text>
        <text x="455" y="130" text-anchor="end">vacuum · RF · motion</text>
        <text x="455" y="427" text-anchor="end">MFC · ESC · optics</text>
        <text x="172" y="525">TSV · bonding · test</text>
        <text x="-70" y="430">UPW · gas · abatement</text>
        <text x="-108" y="170">resist · gas · precursor</text>
      </g>
    </g>

    <g transform="translate(68 574)">
      <rect width="102" height="30" rx="15" fill="#052e16" stroke="#22c55e" stroke-opacity="0.55"/>
      <circle cx="15" cy="15" r="5" fill="#4ade80"/><text x="28" y="20" fill="#bbf7d0" font-size="12" font-weight="850">VERIFIED</text>
      <rect x="114" width="92" height="30" rx="15" fill="#422006" stroke="#f59e0b" stroke-opacity="0.55"/>
      <circle cx="129" cy="15" r="5" fill="#fbbf24"/><text x="142" y="20" fill="#fef3c7" font-size="12" font-weight="850">PARTIAL</text>
      <text x="225" y="20" fill="#64748b" font-size="12" font-weight="700">UNKNOWN을 숨기지 않는 evidence-first map</text>
    </g>
  </g>
</svg>
