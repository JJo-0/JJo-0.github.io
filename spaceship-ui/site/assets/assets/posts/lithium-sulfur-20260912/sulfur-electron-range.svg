 <title id="title">황 원자 하나의 2전자와 3전자 산화수 범위</title><desc id="desc">기존 반응의 산화수 범위는 -2에서 0, 확장한 범위는 -2에서 +1이다. 각 차이는 2와 3이다. 가로축은 전압, 에너지 또는 시간 축이 아니며 실험 데이터가 아니다.</desc><defs>
