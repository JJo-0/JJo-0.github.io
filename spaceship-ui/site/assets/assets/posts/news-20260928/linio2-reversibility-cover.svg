<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Reversible high-voltage LiNiO2 nanorod cathode</title>
  <desc id="desc">Wide H2 layers contract into H3 layers at high voltage. A microcrystal with internal boundaries is contrasted with three nanorods designed for reversible bulk structure.</desc>
  <rect width="1200" height="675" fill="#f4efe3"/>
  <text x="70" y="70" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#315c58" letter-spacing="4">FRONTIER CANDIDATE · BATTERY MATERIALS</text>
  <text x="70" y="145" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#252924">H2 ↔ H3, but reversible</text>
  <text x="70" y="198" font-family="system-ui,sans-serif" font-size="25" fill="#5d625c">LiNiO₂ nanorod cathode · cycling up to 4.95 V</text>
  <rect x="70" y="245" width="470" height="205" rx="26" fill="#e9e3d5"/>
  <text x="130" y="292" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#252924">H2</text>
  <g stroke="#567a8c" stroke-width="17" stroke-linecap="round"><path d="M130 330h250"/><path d="M130 380h250"/><path d="M130 430h250"/></g>
  <path d="M410 380h70" stroke="#315c58" stroke-width="6"/><path d="M480 380l-24-14v28z" fill="#315c58"/>
  <text x="440" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#315c58">high V</text>
  <text x="495" y="292" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#252924">H3</text>
  <g stroke="#567a8c" stroke-width="17" stroke-linecap="round"><path d="M415 335h85"/><path d="M415 380h85"/><path d="M415 425h85"/></g>
  <rect x="585" y="245" width="545" height="330" rx="26" fill="#e9e3d5"/>
  <path d="M675 350c15-75 160-102 205-15 37 72-35 130-115 125-71-4-103-52-90-110z" fill="none" stroke="#607d8a" stroke-width="8"/>
  <g stroke="#607d8a" stroke-width="7"><path d="M710 318l100 132"/><path d="M752 292l105 135"/><path d="M675 365l70 91"/></g>
  <path d="M870 390h95" stroke="#315c58" stroke-width="6"/><path d="M965 390l-24-14v28z" fill="#315c58"/>
  <g stroke="#607d8a" stroke-width="25" stroke-linecap="round"><path d="M1005 315l-25 155"/><path d="M1048 315l-25 155"/><path d="M1091 315l-25 155"/></g>
  <text x="768" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#252924">microcrystal</text>
  <text x="1035" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#252924">nanorods</text>
  <rect x="70" y="495" width="470" height="80" rx="18" fill="#f0ddd2" stroke="#b56452" stroke-width="3"/>
  <text x="105" y="545" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#884735">Material-level evidence ≠ commercial pack</text>
  <text x="70" y="635" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#315c58">Design the return path, not only the phase transition.</text>
</svg>
