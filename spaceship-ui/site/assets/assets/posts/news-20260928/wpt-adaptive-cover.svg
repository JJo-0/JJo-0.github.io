<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive wearable-to-implant wireless power transfer</title>
  <desc id="desc">A wearable transmitter automatically retunes to a displaced soft implant receiver. Separate labels distinguish coil-to-coil PTE above 50 percent from 0.4 watt input and 24 milliwatt regulated output.</desc>
  <rect width="1200" height="675" fill="#f4efe3"/>
  <path d="M0 90h1200M0 585h1200" stroke="#d5cbb8" stroke-width="2"/>
  <text x="70" y="70" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#315c58" letter-spacing="4">FRONTIER ONE · BIOELECTRONICS</text>
  <text x="70" y="145" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#252924">Adaptive wireless power</text>
  <text x="70" y="200" font-family="system-ui,sans-serif" font-size="25" fill="#5d625c">motion · deformation · load variation</text>
  <rect x="90" y="260" width="330" height="105" rx="28" fill="#3f6275"/>
  <ellipse cx="255" cy="328" rx="105" ry="30" fill="none" stroke="#f0c457" stroke-width="15"/>
  <text x="255" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#252924">wearable transmitter</text>
  <rect x="80" y="445" width="470" height="80" rx="30" fill="#e6baa0" stroke="#ab6b4e" stroke-width="4"/>
  <text x="315" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#5a3425">skin · tissue</text>
  <rect x="215" y="555" width="330" height="72" rx="26" fill="#52786f"/>
  <path d="M265 590c60-45 140-45 215 0" fill="none" stroke="#e3e7e2" stroke-width="10"/>
  <path d="M270 360c-60 120 20 176 65 196" fill="none" stroke="#5b9ac0" stroke-width="6" stroke-dasharray="15 12"/>
  <path d="M410 360c80 100 35 160-8 195" fill="none" stroke="#5b9ac0" stroke-width="6" stroke-dasharray="15 12"/>
  <path d="M520 365l80 35" stroke="#b44d4d" stroke-width="6"/><path d="M600 400l-27-2 12-24z" fill="#b44d4d"/>
  <text x="595" y="350" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#b44d4d">misalignment</text>
  <rect x="670" y="260" width="440" height="128" rx="24" fill="#e9e3d5" stroke="#c8bda9" stroke-width="3"/>
  <text x="710" y="306" font-family="system-ui,sans-serif" font-size="22" fill="#62675f">resonator ↔ resonator</text>
  <text x="710" y="360" font-family="system-ui,sans-serif" font-size="42" font-weight="800" fill="#315c58">PTE &gt; 50%</text>
  <rect x="670" y="420" width="440" height="128" rx="24" fill="#e9e3d5" stroke="#c8bda9" stroke-width="3"/>
  <text x="710" y="466" font-family="system-ui,sans-serif" font-size="22" fill="#62675f">input → regulated DC</text>
  <text x="710" y="520" font-family="system-ui,sans-serif" font-size="42" font-weight="800" fill="#9b5a43">0.4 W → 24 mW</text>
  <text x="890" y="610" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#252924">Do not merge the measurement boundaries.</text>
</svg>
