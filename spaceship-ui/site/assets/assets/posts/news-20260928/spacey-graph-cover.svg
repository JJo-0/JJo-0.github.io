<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">SpaCEy spatial graph and predictive tissue motif</title>
  <desc id="desc">Colored cell nodes and spatial edges feed a GNN prediction and edge-mask explainer. Performance boxes show LUAD AUC 0.62 and breast-cancer survival C-index values, with a warning that prediction is not causation.</desc>
  <rect width="1200" height="675" fill="#f4efe3"/>
  <text x="70" y="70" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#315c58" letter-spacing="4">FRONTIER CANDIDATE · EXPLAINABLE AI</text>
  <text x="70" y="145" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#252924">From tissue graph to motif</text>
  <text x="70" y="198" font-family="system-ui,sans-serif" font-size="25" fill="#5d625c">SpaCEy · spatial proteomics · outcome prediction</text>
  <g stroke="#92958e" stroke-width="7"><path d="M145 315L255 375 150 480 255 375 370 300 255 375 390 485 150 480 390 485 520 350 390 485 535 505 520 350"/></g>
  <g stroke="#315c58" stroke-width="5"><circle cx="145" cy="315" r="34" fill="#d7bb72"/><circle cx="255" cy="375" r="40" fill="#7f9fac"/><circle cx="150" cy="480" r="36" fill="#cc9187"/><circle cx="370" cy="300" r="35" fill="#d7bb72"/><circle cx="390" cy="485" r="43" fill="#7f9fac"/><circle cx="520" cy="350" r="40" fill="#d7bb72"/><circle cx="535" cy="505" r="36" fill="#cc9187"/></g>
  <path d="M585 405h90" stroke="#315c58" stroke-width="7"/><path d="M675 405l-28-16v32z" fill="#315c58"/>
  <rect x="700" y="270" width="420" height="92" rx="22" fill="#e9e3d5" stroke="#c8bda9" stroke-width="3"/>
  <text x="910" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#252924">GNN prediction</text>
  <rect x="700" y="390" width="420" height="92" rx="22" fill="#e9e3d5" stroke="#c8bda9" stroke-width="3"/>
  <text x="910" y="448" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#252924">edge mask → connected motif</text>
  <rect x="70" y="575" width="300" height="62" rx="16" fill="#e9e3d5"/><text x="220" y="615" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#252924">LUAD AUC 0.62</text>
  <rect x="395" y="575" width="350" height="62" rx="16" fill="#e9e3d5"/><text x="570" y="615" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#252924">Survival C-index 0.720</text>
  <rect x="770" y="575" width="350" height="62" rx="16" fill="#f0ddd2" stroke="#b56452" stroke-width="3"/><text x="945" y="615" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#884735">Predictive ≠ causal</text>
</svg>
