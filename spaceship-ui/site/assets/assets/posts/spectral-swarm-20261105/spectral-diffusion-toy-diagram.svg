<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">이웃 교환에서 연결성 추정까지</title>
  <desc id="desc">일반적인 예시 그래프에서 이웃끼리 내부 숫자를 교환하고, 시간이 지나 두 모드의 부호가 나타나며, 한 노드의 로그 절댓값을 시간에 맞춰 직선 기울기로 연결도 점수를 추정하는 과정을 그린 설명용 그림입니다.</desc>
  <rect width="1200" height="470" rx="24" fill="#f7f8fa"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif" fill="#182230">
    <text x="48" y="52" font-size="26" font-weight="700">로컬 정보가 전역 점수가 되는 세 단계</text>
    <text x="48" y="82" font-size="15" fill="#536273">직접 제작한 일반 개념도 · 실제 로봇 배치나 논문 도판이 아님</text>
    <g transform="translate(48 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">1. 이웃 그래프</text>
      <text x="22" y="64" font-size="14" fill="#536273">가까운 로봇 쌍만 연결</text>
      <g stroke="#9ba8b6" stroke-width="3">
        <path d="M85 125 L160 98 L242 130 L220 210 L132 232 L70 190 Z" fill="none"/>
        <path d="M85 125 L132 232 M160 98 L220 210 M85 125 L220 210" fill="none"/>
      </g>
      <g fill="#eef2f6" stroke="#34495e" stroke-width="3">
        <circle cx="85" cy="125" r="17"/><circle cx="160" cy="98" r="17"/><circle cx="242" cy="130" r="17"/>
        <circle cx="220" cy="210" r="17"/><circle cx="132" cy="232" r="17"/><circle cx="70" cy="190" r="17"/>
      </g>
      <text x="22" y="276" font-size="14" fill="#536273">노드 = 로봇 · 선 = 통신 가능성</text>
    </g>
    <g transform="translate(435 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">2. 상태가 퍼짐</text>
      <text x="22" y="64" font-size="14" fill="#536273">이웃과 값 차이를 반복 갱신</text>
      <g stroke="#c8d0d9" stroke-width="3">
        <path d="M85 125 L160 98 L242 130 L220 210 L132 232 L70 190 Z" fill="none"/>
        <path d="M85 125 L132 232 M160 98 L220 210 M85 125 L220 210" fill="none"/>
      </g>
      <g stroke="#fff" stroke-width="3">
        <circle cx="85" cy="125" r="18" fill="#3973c6"/><circle cx="160" cy="98" r="18" fill="#3973c6"/><circle cx="242" cy="130" r="18" fill="#3973c6"/>
        <circle cx="220" cy="210" r="18" fill="#d7684a"/><circle cx="132" cy="232" r="18" fill="#d7684a"/><circle cx="70" cy="190" r="18" fill="#d7684a"/>
      </g>
      <text x="22" y="276" font-size="14" fill="#536273">색은 상태 부호 예시 · 모양 판정 아님</text>
    </g>
    <g transform="translate(822 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">3. 감쇠 기울기</text>
      <text x="22" y="64" font-size="14" fill="#536273">충분히 지난 뒤 로그 상태를 맞춤</text>
      <path d="M55 230 L55 100 M55 230 L286 230" fill="none" stroke="#566575" stroke-width="2"/>
      <text x="15" y="111" font-size="13" fill="#536273">log |sᵢ|</text>
      <text x="250" y="258" font-size="13" fill="#536273">시간</text>
      <path d="M72 120 L266 210" fill="none" stroke="#3973c6" stroke-width="5" stroke-linecap="round"/>
      <path d="M112 139 L112 201 M107 139 L117 139 M107 201 L117 201" fill="none" stroke="#d7684a" stroke-width="2"/>
      <text x="127" y="172" font-size="16" font-weight="700" fill="#a64632">기울기 ↔ −λ₂</text>
      <text x="22" y="276" font-size="14" fill="#536273">각자 추정 후 이웃 간 평균화</text>
    </g>
  </g>
</svg>
