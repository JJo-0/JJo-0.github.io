<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">From neighbor exchanges to a connectivity estimate</title>
  <desc id="desc">Robots exchange states along undirected edges. After faster modes decay, the slope of a node’s log state magnitude estimates graph connectivity.</desc>
  <rect width="1200" height="470" rx="24" fill="#f7f8fa"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif" fill="#182230">
    <text x="48" y="52" font-size="26" font-weight="700">How local exchanges reveal global connectivity</text>
    <text x="48" y="82" font-size="15" fill="#536273">Conceptual diagram. Robot positions and curves are illustrative.</text>
    <g transform="translate(48 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">1. Neighbor graph</text>
      <text x="22" y="64" font-size="14" fill="#536273">Only nearby robot pairs are linked</text>
      <g stroke="#9ba8b6" stroke-width="3">
        <path d="M85 125 L160 98 L242 130 L220 210 L132 232 L70 190 Z" fill="none"/>
        <path d="M85 125 L132 232 M160 98 L220 210 M85 125 L220 210" fill="none"/>
      </g>
      <g fill="#eef2f6" stroke="#34495e" stroke-width="3">
        <circle cx="85" cy="125" r="17"/><circle cx="160" cy="98" r="17"/><circle cx="242" cy="130" r="17"/>
        <circle cx="220" cy="210" r="17"/><circle cx="132" cy="232" r="17"/><circle cx="70" cy="190" r="17"/>
      </g>
      <text x="22" y="276" font-size="14" fill="#536273">Node = robot. Edge = communication link.</text>
    </g>
    <g transform="translate(435 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">2. States diffuse</text>
      <text x="22" y="64" font-size="14" fill="#536273">Update from differences with neighbors</text>
      <g stroke="#c8d0d9" stroke-width="3">
        <path d="M85 125 L160 98 L242 130 L220 210 L132 232 L70 190 Z" fill="none"/>
        <path d="M85 125 L132 232 M160 98 L220 210 M85 125 L220 210" fill="none"/>
      </g>
      <g stroke="#fff" stroke-width="3">
        <circle cx="85" cy="125" r="18" fill="#3973c6"/><circle cx="160" cy="98" r="18" fill="#3973c6"/><circle cx="242" cy="130" r="18" fill="#3973c6"/>
        <circle cx="220" cy="210" r="18" fill="#d7684a"/><circle cx="132" cy="232" r="18" fill="#d7684a"/><circle cx="70" cy="190" r="18" fill="#d7684a"/>
      </g>
      <text x="22" y="276" font-size="14" fill="#536273">Colors indicate the sign of the state.</text>
    </g>
    <g transform="translate(822 116)">
      <rect width="330" height="300" rx="18" fill="#fff" stroke="#d9e0e8"/>
      <text x="22" y="38" font-size="19" font-weight="700">3. Decay slope</text>
      <text x="22" y="64" font-size="14" fill="#536273">Fit log magnitude after the transient</text>
      <path d="M55 230 L55 100 M55 230 L286 230" fill="none" stroke="#566575" stroke-width="2"/>
      <text x="15" y="111" font-size="13" fill="#536273">log |sᵢ|</text>
      <text x="250" y="258" font-size="13" fill="#536273">Time</text>
      <path d="M72 120 L266 210" fill="none" stroke="#3973c6" stroke-width="5" stroke-linecap="round"/>
      <path d="M112 139 L112 201 M107 139 L117 139 M107 201 L117 201" fill="none" stroke="#d7684a" stroke-width="2"/>
      <text x="127" y="172" font-size="16" font-weight="700" fill="#a64632">Slope ↔ −λ₂</text>
      <text x="22" y="276" font-size="14" fill="#536273">Estimate locally, then average with neighbors.</text>
    </g>
  </g>
</svg>
