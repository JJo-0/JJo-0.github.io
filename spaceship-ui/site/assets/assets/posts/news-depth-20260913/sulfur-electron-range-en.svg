 <title id="title">Two-electron and three-electron oxidation-state ranges</title><desc id="desc">Conventional sulfur range: -2 to 0. Expanded range: -2 to +1. Differences are 2 and 3. This is an accounting illustration, not voltage, energy, time or experimental data.</desc><defs>
