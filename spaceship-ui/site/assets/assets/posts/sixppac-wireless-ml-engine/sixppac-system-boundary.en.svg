<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">SIXPPAC processing paths</title><desc id="desc">Two SAR ADCs supply I/Q samples to the engine for two-layer streaming. Six-layer block processing uses a separate input path. Localization uses external CSI.</desc><rect width="600" height="790" fill="#fff"/><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#183a34}.main{font-size:30px;font-weight:700}.label{font-size:27px}.small{font-size:24px}.accent{fill:#276b58;font-weight:700}.muted{fill:#53665f}</style><text id="title" x="300" y="48" text-anchor="middle" class="main">SIXPPAC processing paths</text><text x="300" y="103" text-anchor="middle" class="label">I/Q samples</text><path d="M300 122v38" stroke="#397462" stroke-width="3"/><path d="M292 151l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="203" text-anchor="middle" class="label">Two 8-bit SAR ADCs</text><path d="M300 222v38" stroke="#397462" stroke-width="3"/><path d="M292 251l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="305" text-anchor="middle" class="main">SIXPPAC neural engine</text><line x1="48" y1="341" x2="552" y2="341" stroke="#ccd7d2" stroke-width="2"/><text x="300" y="383" text-anchor="middle" class="small muted">Two processing paths</text><text x="70" y="435" class="label accent">Streaming</text><text x="70" y="477" class="label">128 I/Q samples · 2 layers</text><text x="70" y="516" class="small muted">Time sync and SNR</text><line x1="70" y1="545" x2="530" y2="545" stroke="#e0e6e3" stroke-width="2"/><text x="70" y="590" class="label accent">Block mode</text><text x="70" y="632" class="label">256-D vector · 6 layers</text><text x="70" y="672" class="small muted">Test memory input</text><text x="70" y="711" class="small">Location: external CSI</text><text x="70" y="758" class="small muted">The modes use distinct compute paths.</text></svg>