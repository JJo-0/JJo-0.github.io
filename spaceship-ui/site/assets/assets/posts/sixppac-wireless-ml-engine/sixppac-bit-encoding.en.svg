<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img" aria-labelledby="title desc"><title id="title">How ±1 values map to 0/1 codes</title><desc id="desc">The two bipolar values correspond to circuit bits 0 and 1. Matching bits give a positive product, differing bits a negative product. XNOR match counts or AND products and correction sums yield the dot product.</desc><rect width="600" height="710" fill="#fff"/><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#183a34}.main{font-size:30px;font-weight:700}.label{font-size:28px;font-weight:650}.small{font-size:25px}.accent{fill:#276b58;font-weight:700}.muted{fill:#53665f}</style><text id="title" x="300" y="48" text-anchor="middle" class="main">Two encodings, one dot product</text><text x="64" y="108" class="label">Value</text><text x="300" y="108" text-anchor="middle" class="label">Circuit bit</text><text x="500" y="108" text-anchor="middle" class="label">Sign</text><text x="91" y="160" class="label">−1</text><text x="202" y="160" class="label muted">↔</text><text x="294" y="160" class="label">0 (LO)</text><text x="466" y="160" class="label accent">Negative</text><text x="91" y="207" class="label">+1</text><text x="202" y="207" class="label muted">↔</text><text x="294" y="207" class="label">1 (HI)</text><text x="466" y="207" class="label accent">Positive</text><line x1="64" y1="239" x2="536" y2="239" stroke="#ccd7d2" stroke-width="2"/><text x="64" y="291" class="label">Bits match</text><text x="290" y="291" class="small">XNOR = 1</text><text x="470" y="291" class="label accent">+1</text><text x="64" y="343" class="label">Bits differ</text><text x="290" y="343" class="small">XNOR = 0</text><text x="470" y="343" class="label accent">−1</text><path d="M300 370v37" stroke="#397462" stroke-width="3"/><path d="M292 398l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="453" text-anchor="middle" class="label">Sum N signed products</text><text x="300" y="495" text-anchor="middle" class="small muted">XNOR matches → dot product</text><line x1="64" y1="526" x2="536" y2="526" stroke="#e0e6e3" stroke-width="2"/><text x="300" y="580" text-anchor="middle" class="label accent">Same result using</text><text x="300" y="624" text-anchor="middle" class="label">AND + correction sums</text><text x="300" y="673" text-anchor="middle" class="small muted">Paper equations (1)–(4)</text></svg>