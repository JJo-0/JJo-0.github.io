<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1080" viewBox="0 0 780 1080" role="img" aria-labelledby="title desc">
  <title id="title">4비트 예제로 두 내적 계산 경로 비교</title>
  <desc id="desc">설명용 벡터 b는 1, 0, 1, 1이고 c는 1, 1, 0, 1이다. 같은 비트는 첫째와 넷째 두 곳이라 XNOR 경로의 내적은 2 곱하기 2 빼기 4, 즉 0이다. AND 합은 2, b의 1 개수와 c의 1 개수는 각각 3이어서 AND와 보정합 경로도 0이다. 마지막 c 비트를 0으로 바꾸면 두 경로는 모두 -2가 된다. 연구 칩 측정값이 아닌 가상 예시다.</desc>
  <defs>
    <style>
      .bg{fill:#f5f8fb}.card{fill:#fff;stroke:#d9e2ec;stroke-width:2}.ink{fill:#13283f;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.muted{fill:#50657b;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.blue{fill:#1f4e78}.teal{fill:#0c706c}.amber{fill:#8a4b08}.white{fill:#fff;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.line{stroke:#d9e2ec;stroke-width:2}.pill{fill:#fff1d6;stroke:#e9c783;stroke-width:1.5}.same{fill:#e7f4f1}.diff{fill:#f0f3f7}
    </style>
  </defs>
  <rect class="bg" width="780" height="1080" rx="24"/>
  <text class="ink" x="40" y="62" font-size="32" font-weight="700">4자리로 두 계산 경로를 확인하기</text>
  <rect class="pill" x="40" y="82" width="322" height="40" rx="20"/>
  <text class="amber" x="58" y="109" font-size="20" font-weight="700">가상 예시 · 논문 측정값 아님</text>
  <text class="muted" x="40" y="158" font-size="22">b=(1,0,1,1), c=(1,1,0,1) · 1은 +1, 0은 −1</text>

  <rect class="card" x="32" y="186" width="716" height="332" rx="18"/>
  <text class="blue" x="56" y="224" font-size="21" font-weight="700">자리별 비교</text>
  <text class="muted" x="62" y="270" font-size="17" font-weight="700">자리 i</text>
  <text class="muted" x="178" y="270" font-size="17" font-weight="700">bᵢ</text>
  <text class="muted" x="302" y="270" font-size="17" font-weight="700">cᵢ</text>
  <text class="muted" x="425" y="270" font-size="17" font-weight="700">XNOR</text>
  <text class="muted" x="555" y="270" font-size="17" font-weight="700">부호 곱</text>
  <line class="line" x1="52" y1="284" x2="728" y2="284"/>
  <g font-size="22" font-weight="700">
    <rect class="same" x="50" y="295" width="678" height="48" rx="10"/><text class="ink" x="74" y="327">1</text><text class="ink" x="185" y="327">1 (HI)</text><text class="ink" x="309" y="327">1 (HI)</text><text class="teal" x="437" y="327">1 · 같음</text><text class="teal" x="573" y="327">+1</text>
    <rect class="diff" x="50" y="350" width="678" height="48" rx="10"/><text class="ink" x="74" y="382">2</text><text class="ink" x="185" y="382">0 (LO)</text><text class="ink" x="309" y="382">1 (HI)</text><text class="muted" x="437" y="382">0 · 다름</text><text class="muted" x="573" y="382">−1</text>
    <rect class="diff" x="50" y="405" width="678" height="48" rx="10"/><text class="ink" x="74" y="437">3</text><text class="ink" x="185" y="437">1 (HI)</text><text class="ink" x="309" y="437">0 (LO)</text><text class="muted" x="437" y="437">0 · 다름</text><text class="muted" x="573" y="437">−1</text>
    <rect class="same" x="50" y="460" width="678" height="48" rx="10"/><text class="ink" x="74" y="492">4</text><text class="ink" x="185" y="492">1 (HI)</text><text class="ink" x="309" y="492">1 (HI)</text><text class="teal" x="437" y="492">1 · 같음</text><text class="teal" x="573" y="492">+1</text>
  </g>

  <rect class="card" x="32" y="542" width="716" height="174" rx="18"/>
  <circle cx="75" cy="584" r="22" fill="#1f4e78"/><text class="white" x="68" y="592" font-size="21" font-weight="700">A</text>
  <text class="blue" x="112" y="591" font-size="21" font-weight="700">XNOR로 일치 수 세기</text>
  <text class="ink" x="58" y="641" font-size="23">2곳 일치, 2곳 불일치</text>
  <text class="ink" x="58" y="682" font-size="26" font-weight="700">2 × 2 − 4 = 0</text>

  <rect class="card" x="32" y="740" width="716" height="190" rx="18"/>
  <circle cx="75" cy="782" r="22" fill="#0c706c"/><text class="white" x="68" y="790" font-size="21" font-weight="700">B</text>
  <text class="teal" x="112" y="789" font-size="21" font-weight="700">AND와 보정합</text>
  <text class="ink" x="58" y="836" font-size="20">Σbᵢcᵢ=2 · Σbᵢ=3 · Σcᵢ=3 · N=4</text>
  <text class="ink" x="58" y="887" font-size="24" font-weight="700">4 × 2 − 2 × 3 − 2 × 3 + 4 = 0</text>

  <rect x="32" y="954" width="716" height="92" rx="16" fill="#e8f0f8" stroke="#b9cde0" stroke-width="2"/>
  <text class="blue" x="56" y="990" font-size="19" font-weight="700">조건을 바꿔 보기</text>
  <text class="ink" x="56" y="1023" font-size="19">c₄를 1→0으로 바꾸면 일치가 2→1, 내적은 0→−2.</text>
</svg>
