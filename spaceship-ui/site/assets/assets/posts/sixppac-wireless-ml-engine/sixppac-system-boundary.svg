<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title desc"><title id="title">SIXPPAC 처리 경로</title><desc id="desc">I/Q 표본이 두 SAR ADC와 SIXPPAC 엔진으로 들어가며, 두 층 스트리밍과 여섯 층 블록 처리라는 두 경로로 나뉜다. 위치추정의 입력은 외부 CSI다.</desc><rect width="600" height="790" fill="#fff"/><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#183a34}.main{font-size:30px;font-weight:700}.label{font-size:27px}.small{font-size:24px}.accent{fill:#276b58;font-weight:700}.muted{fill:#53665f}</style><text id="title" x="300" y="48" text-anchor="middle" class="main">SIXPPAC 처리 경로</text><text x="300" y="103" text-anchor="middle" class="label">I/Q 표본</text><path d="M300 122v38" stroke="#397462" stroke-width="3"/><path d="M292 151l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="203" text-anchor="middle" class="label">2개 SAR ADC · 8비트</text><path d="M300 222v38" stroke="#397462" stroke-width="3"/><path d="M292 251l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="305" text-anchor="middle" class="main">SIXPPAC 신경망 엔진</text><line x1="48" y1="341" x2="552" y2="341" stroke="#ccd7d2" stroke-width="2"/><text x="300" y="383" text-anchor="middle" class="small muted">두 가지 처리 경로</text><text x="70" y="435" class="label accent">스트리밍</text><text x="70" y="477" class="label">128 I/Q 표본 · 2개 층</text><text x="70" y="516" class="small muted">시간 동기화 · SNR 추정</text><line x1="70" y1="545" x2="530" y2="545" stroke="#e0e6e3" stroke-width="2"/><text x="70" y="590" class="label accent">블록 처리</text><text x="70" y="632" class="label">256차원 벡터 · 6개 층</text><text x="70" y="672" class="small muted">입력: 테스트 메모리</text><text x="70" y="711" class="small">위치추정 입력: 외부 CSI</text><text x="70" y="758" class="small muted">모드는 서로 다른 계산 경로다.</text></svg>