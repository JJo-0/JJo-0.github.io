<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img" aria-labelledby="title desc"><title id="title">±1과 0/1 표기 관계</title><desc id="desc">수학적 bipolar 값은 회로 논리 비트로 0과 1에 대응한다. 같은 비트의 곱은 양의 값, 다른 비트의 곱은 음의 값이며 XNOR 일치수 또는 AND와 보정 합으로 벡터 내적을 계산한다.</desc><rect width="600" height="710" fill="#fff"/><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#183a34}.main{font-size:30px;font-weight:700}.label{font-size:28px;font-weight:650}.small{font-size:25px}.accent{fill:#276b58;font-weight:700}.muted{fill:#53665f}</style><text id="title" x="300" y="48" text-anchor="middle" class="main">두 표기, 같은 내적</text><text x="64" y="108" class="label">수학값</text><text x="300" y="108" text-anchor="middle" class="label">회로 비트</text><text x="500" y="108" text-anchor="middle" class="label">부호</text><text x="91" y="160" class="label">−1</text><text x="202" y="160" class="label muted">↔</text><text x="294" y="160" class="label">0 (LO)</text><text x="466" y="160" class="label accent">음수</text><text x="91" y="207" class="label">+1</text><text x="202" y="207" class="label muted">↔</text><text x="294" y="207" class="label">1 (HI)</text><text x="466" y="207" class="label accent">양수</text><line x1="64" y1="239" x2="536" y2="239" stroke="#ccd7d2" stroke-width="2"/><text x="64" y="291" class="label">비트가 같음</text><text x="290" y="291" class="small">XNOR = 1</text><text x="470" y="291" class="label accent">+1</text><text x="64" y="343" class="label">비트가 다름</text><text x="290" y="343" class="small">XNOR = 0</text><text x="470" y="343" class="label accent">−1</text><path d="M300 370v37" stroke="#397462" stroke-width="3"/><path d="M292 398l8 12 8-12" fill="none" stroke="#397462" stroke-width="3"/><text x="300" y="453" text-anchor="middle" class="label">N자리 부호를 합산</text><text x="300" y="495" text-anchor="middle" class="small muted">XNOR 일치수 → 부호 내적</text><line x1="64" y1="526" x2="536" y2="526" stroke="#e0e6e3" stroke-width="2"/><text x="300" y="580" text-anchor="middle" class="label accent">같은 결과를</text><text x="300" y="624" text-anchor="middle" class="label">AND 곱 + 보정합으로 계산</text><text x="300" y="673" text-anchor="middle" class="small muted">논문 식 (1)–(4)</text></svg>