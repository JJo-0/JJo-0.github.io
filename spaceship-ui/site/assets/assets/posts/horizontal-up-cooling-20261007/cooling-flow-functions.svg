<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">매니폴드가 함께 수행하는 두 기능</title>
<desc id="desc">두 개의 나란한 동등한 설명 패널은 차가운 액체 보충과 가열된 유체 및 증기 배출이 동시에 수행되는 기능임을 보여 준다. 이 그림은 시간 순서나 실제 장치 형상, 채널 배치, 축척을 나타내지 않는다.</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#142536}
.title{font-size:32px;font-weight:750}.sub{font-size:18px;fill:#465b6e}.head{font-size:27px;font-weight:750}.body{font-size:21px;font-weight:650}.note{font-size:17px;fill:#3c5367}.citation{font-size:15px;fill:#41576a}.symbol{font-size:22px;font-weight:800;fill:#fff}
</style></defs>
<rect width="960" height="560" rx="26" fill="#f5f8fb"/>
<text x="44" y="58" class="title">매니폴드가 함께 수행하는 두 기능</text>
<text x="44" y="91" class="sub">동시 기능 설명 · 시간 순서·장치 외형·채널 배치·축척은 나타내지 않음</text>
<rect x="32" y="136" width="414" height="300" rx="24" fill="#fff" stroke="#a9cbe2" stroke-width="2.5"/>
<rect x="514" y="136" width="414" height="300" rx="24" fill="#fff" stroke="#e3c2aa" stroke-width="2.5"/>
<circle cx="239" cy="226" r="54" fill="#e3f2fd"/>
<path d="M239 184C226 202 215 216 215 231a24 24 0 0 0 48 0c0-15-11-29-24-47Z" fill="#1769aa"/>
<text x="239" y="326" text-anchor="middle" class="head">차가운 액체 보충</text>
<text x="239" y="365" text-anchor="middle" class="body">가열 구간에 액체 공급</text>
<text x="239" y="400" text-anchor="middle" class="note">논문에서 설명한 유동 기능</text>
<circle cx="721" cy="226" r="54" fill="#fff0e5"/>
<path d="M721 256V197M701 218L721 196L741 218" fill="none" stroke="#bb5b22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="704" cy="269" r="5" fill="#d7834d"/><circle cx="738" cy="270" r="6" fill="#d7834d"/>
<text x="721" y="326" text-anchor="middle" class="head">가열된 유체·증기 배출</text>
<text x="721" y="365" text-anchor="middle" class="body">액체·기체 혼합물도 포함</text>
<text x="721" y="400" text-anchor="middle" class="note">증기는 위쪽 출구로 빠져나감</text>
<circle cx="480" cy="277" r="24" fill="#526a7d"/><text x="480" y="285" text-anchor="middle" class="symbol">+</text>
<rect x="32" y="462" width="896" height="48" rx="15" fill="#e9eef3"/>
<text x="480" y="493" text-anchor="middle" class="note">두 기능은 한 구조에서 함께 작동하며, 그림은 실제 기하 형상이 아닌 개념 설명임</text>
<text x="44" y="539" class="citation">Xiao et al., Nature Electronics (2026), Fig. 1 및 구조 설명 · DOI: 10.1038/s41928-026-01724-y</text>
</svg>
