<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">측정한 값과 계산한 값</title>
<desc id="desc">왼쪽은 히터 입력, 유량, DUT 양단 압력차, 아홉 RTD 온도처럼 측정한 값을 묶고, 오른쪽은 무유량 열평형 보정으로 정한 열손실과 가열면적으로 나눈 열유속 계산을 분리한다. 전체 펌프 전력을 직접 측정했다는 뜻은 아니다.</desc>
<defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#142536}
    .title{font-size:32px;font-weight:750}.sub{font-size:18px;fill:#465b6e}.head{font-size:27px;font-weight:750}.row{font-size:21px;font-weight:650}.detail{font-size:17px;fill:#465b6e}.formula{font-size:27px;font-weight:750}.warn{font-size:19px;font-weight:700;fill:#713a1c}.citation{font-size:15px;fill:#41576a}
  </style>
  <marker id="calcArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6b7e8e"/></marker>
</defs>
<rect width="960" height="640" rx="26" fill="#f5f8fb"/>
<text x="42" y="58" class="title">측정한 값과 계산한 값</text>
<text x="42" y="91" class="sub">측정 경계와 열유속 산정 경계를 나누어 읽기</text>
<rect x="32" y="124" width="414" height="340" rx="22" fill="#fff" stroke="#8bb8d7" stroke-width="3"/>
<rect x="514" y="124" width="414" height="340" rx="22" fill="#fff" stroke="#e0aa83" stroke-width="3"/>
<rect x="32" y="124" width="414" height="58" rx="20" fill="#e3f2fd"/>
<rect x="514" y="124" width="414" height="58" rx="20" fill="#fff0e5"/>
<text x="239" y="163" text-anchor="middle" class="head">측정·기록</text>
<text x="721" y="163" text-anchor="middle" class="head">보정·계산</text>
<g fill="#f4f9fc" stroke="#d5e4ed" stroke-width="1.5">
  <rect x="58" y="205" width="362" height="64" rx="14"/><rect x="58" y="286" width="362" height="64" rx="14"/><rect x="58" y="367" width="362" height="64" rx="14"/>
</g>
<text x="82" y="245" class="row">히터 입력 Q</text>
<text x="82" y="326" class="row">유량 f · DUT 양단 압력차 ΔP</text>
<text x="82" y="407" class="row">아홉 RTD의 온도</text>
<text x="82" y="266" class="detail"></text>
<g fill="#fff8f3" stroke="#eed8c8" stroke-width="1.5">
  <rect x="540" y="205" width="362" height="64" rx="14"/><rect x="540" y="286" width="362" height="64" rx="14"/><rect x="540" y="367" width="362" height="64" rx="14"/>
</g>
<text x="564" y="235" class="row">열손실 Q_loss</text><text x="564" y="258" class="detail">냉매 무유량 열평형 보정</text>
<text x="564" y="326" class="row">활성 가열면적 A_chip</text><text x="564" y="349" class="detail">3 × 3 mm²</text>
<text x="564" y="408" class="formula">q = (Q − Q_loss) / A_chip</text>
<text x="564" y="431" class="detail">열유속 단위: W/cm²</text>
<path d="M456 292H502" fill="none" stroke="#6b7e8e" stroke-width="4" marker-end="url(#calcArrow)"/>
<rect x="32" y="486" width="896" height="88" rx="18" fill="#fff2df" stroke="#e9c28d" stroke-width="1.5"/>
<text x="58" y="520" class="warn">경계 주의</text>
<text x="58" y="550" class="detail">유량 × DUT 압력차는 유압 동력 항이다. 펌프의 콘센트 전력이나 랙 전체 소비전력을 직접 뜻하지 않는다.</text>
<text x="42" y="612" class="citation">Xiao et al., Nature Electronics (2026), Methods / Data reduction, 물리 PDF pp. 6–7 · DOI: 10.1038/s41928-026-01724-y</text>
</svg>
