<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Measured and calculated quantities</title>
<desc id="desc">The left lists heater input, flow, DUT pressure drop and nine RTD temperatures. The right separates calibrated no-flow heat loss and area-normalized heat flux. Pump electricity was not measured here.</desc>
<defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#142536}
    .title{font-size:32px;font-weight:750}.sub{font-size:18px;fill:#465b6e}.head{font-size:27px;font-weight:750}.row{font-size:21px;font-weight:650}.detail{font-size:17px;fill:#465b6e}.formula{font-size:27px;font-weight:750}.warn{font-size:19px;font-weight:700;fill:#713a1c}.citation{font-size:15px;fill:#41576a}
  </style>
  <marker id="calcArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6b7e8e"/></marker>
</defs>
<rect width="960" height="640" rx="26" fill="#f5f8fb"/>
<text x="42" y="58" class="title">Measured and calculated quantities</text>
<text x="42" y="91" class="sub">Read the measurement boundary before interpreting heat flux</text>
<rect x="32" y="124" width="414" height="340" rx="22" fill="#fff" stroke="#8bb8d7" stroke-width="3"/>
<rect x="514" y="124" width="414" height="340" rx="22" fill="#fff" stroke="#e0aa83" stroke-width="3"/>
<rect x="32" y="124" width="414" height="58" rx="20" fill="#e3f2fd"/>
<rect x="514" y="124" width="414" height="58" rx="20" fill="#fff0e5"/>
<text x="239" y="163" text-anchor="middle" class="head">Measured</text>
<text x="721" y="163" text-anchor="middle" class="head">Calculated</text>
<g fill="#f4f9fc" stroke="#d5e4ed" stroke-width="1.5">
  <rect x="58" y="205" width="362" height="64" rx="14"/><rect x="58" y="286" width="362" height="64" rx="14"/><rect x="58" y="367" width="362" height="64" rx="14"/>
</g>
<text x="82" y="245" class="row">Heater input Q</text>
<text x="82" y="326" class="row">Flow f · DUT pressure drop ΔP</text>
<text x="82" y="407" class="row">Nine RTD temperatures</text>
<text x="82" y="266" class="detail"/>
<g fill="#fff8f3" stroke="#eed8c8" stroke-width="1.5">
  <rect x="540" y="205" width="362" height="64" rx="14"/><rect x="540" y="286" width="362" height="64" rx="14"/><rect x="540" y="367" width="362" height="64" rx="14"/>
</g>
<text x="564" y="235" class="row">Heat loss Q_loss</text><text x="564" y="258" class="detail">No-flow equilibrium calibration</text>
<text x="564" y="326" class="row">Heated area A_chip</text><text x="564" y="349" class="detail">3 × 3 mm²</text>
<text x="564" y="408" class="formula">q = (Q − Q_loss) / A_chip</text>
<text x="564" y="431" class="detail">Heat flux in W/cm²</text>
<path d="M456 292H502" fill="none" stroke="#6b7e8e" stroke-width="4" marker-end="url(#calcArrow)"/>
<rect x="32" y="486" width="896" height="88" rx="18" fill="#fff2df" stroke="#e9c28d" stroke-width="1.5"/>
<text x="58" y="520" class="warn">System boundary</text>
<text x="58" y="550" class="detail">Flow × DUT pressure drop gives hydraulic power. Pump electricity and rack power have wider boundaries.</text>
<text x="42" y="612" class="citation">Xiao et al., Nature Electronics (2026), Methods, PDF pp. 6–7 · DOI 10.1038/s41928-026-01724-y</text>
</svg>
