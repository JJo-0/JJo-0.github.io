<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Two simultaneous manifold functions</title>
<desc id="desc">Parallel panels show liquid replenishment and removal of heated fluid and vapor. They depict functions rather than sequence, device shape, channel layout or scale.</desc>
<defs><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#142536}
.title{font-size:32px;font-weight:750}.sub{font-size:18px;fill:#465b6e}.head{font-size:27px;font-weight:750}.body{font-size:21px;font-weight:650}.note{font-size:17px;fill:#3c5367}.citation{font-size:15px;fill:#41576a}.symbol{font-size:22px;font-weight:800;fill:#fff}
</style></defs>
<rect width="960" height="560" rx="26" fill="#f5f8fb"/>
<text x="44" y="58" class="title">Two functions in one manifold</text>
<text x="44" y="91" class="sub">Simultaneous roles · schematic, not to scale</text>
<rect x="32" y="136" width="414" height="300" rx="24" fill="#fff" stroke="#a9cbe2" stroke-width="2.5"/>
<rect x="514" y="136" width="414" height="300" rx="24" fill="#fff" stroke="#e3c2aa" stroke-width="2.5"/>
<circle cx="239" cy="226" r="54" fill="#e3f2fd"/>
<path d="M239 184C226 202 215 216 215 231a24 24 0 0 0 48 0c0-15-11-29-24-47Z" fill="#1769aa"/>
<text x="239" y="326" text-anchor="middle" class="head">Replenish liquid</text>
<text x="239" y="365" text-anchor="middle" class="body">Feed the heated region</text>
<text x="239" y="400" text-anchor="middle" class="note">Liquid supply path</text>
<circle cx="721" cy="226" r="54" fill="#fff0e5"/>
<path d="M721 256V197M701 218L721 196L741 218" fill="none" stroke="#bb5b22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="704" cy="269" r="5" fill="#d7834d"/><circle cx="738" cy="270" r="6" fill="#d7834d"/>
<text x="721" y="326" text-anchor="middle" class="head">Remove fluid and vapor</text>
<text x="721" y="365" text-anchor="middle" class="body">Includes two-phase flow</text>
<text x="721" y="400" text-anchor="middle" class="note">Vapor exits upward</text>
<circle cx="480" cy="277" r="24" fill="#526a7d"/><text x="480" y="285" text-anchor="middle" class="symbol">+</text>
<rect x="32" y="462" width="896" height="48" rx="15" fill="#e9eef3"/>
<text x="480" y="493" text-anchor="middle" class="note">Both roles operate together. The panels do not show the actual manifold geometry.</text>
<text x="44" y="539" class="citation">Xiao et al., Nature Electronics (2026), Fig. 1 · DOI 10.1038/s41928-026-01724-y</text>
</svg>
