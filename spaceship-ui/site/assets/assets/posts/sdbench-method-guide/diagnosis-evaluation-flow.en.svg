<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
<title id="title">Text-based sequential diagnosis benchmark</title>
<desc id="desc">The AI requests more history or tests. The Gatekeeper returns case-grounded or permitted synthetic findings. After a final diagnosis, accuracy and estimated costs are assessed separately.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#315e51" stroke-width="2"/></marker></defs>
<rect width="720" height="1050" fill="#fafaf7"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle" fill="#172b32">
<text x="360" y="58" font-size="34" font-weight="700">How is a diagnostic AI scored?</text>
<g fill="#fff" stroke="#93aaa5" stroke-width="2"><rect x="110" y="94" width="500" height="120" rx="16"/><rect x="110" y="266" width="500" height="120" rx="16"/><rect x="110" y="438" width="500" height="150" rx="16"/><rect x="110" y="660" width="500" height="120" rx="16"/></g>
<text x="360" y="140" font-size="32" font-weight="700">1 · Short case summary</text><text x="360" y="184" font-size="27">Simulated text encounter</text>
<text x="360" y="312" font-size="32" font-weight="700">2 · Choose a question or test</text><text x="360" y="356" font-size="27">Request more information</text>
<text x="360" y="484" font-size="32" font-weight="700">3 · Gatekeeper response</text><text x="360" y="528" font-size="27">Case data or synthetic findings</text><text x="360" y="566" font-size="25">Repeat if more evidence is needed</text>
<text x="360" y="706" font-size="32" font-weight="700">4 · Submit a final diagnosis</text><text x="360" y="750" font-size="27">Score accuracy and cost separately</text>
<g stroke="#315e51" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M360 217V250"/><path d="M360 390V423"/><path d="M360 592V645"/><path d="M110 514H52V326H94"/><path d="M360 784V823H186V850"/><path d="M360 823H534V850"/></g>
<g fill="#e8f1ef" stroke="#93aaa5" stroke-width="2"><rect x="32" y="870" width="308" height="132" rx="14"/><rect x="380" y="870" width="308" height="132" rx="14"/></g>
<text x="186" y="916" font-size="32" font-weight="700">Accuracy</text><text x="186" y="958" font-size="27">Share scoring ≥4</text>
<text x="534" y="916" font-size="32" font-weight="700">Estimated cost</text><text x="534" y="955" font-size="25">$300 per visit + tests</text>
</g></svg>
