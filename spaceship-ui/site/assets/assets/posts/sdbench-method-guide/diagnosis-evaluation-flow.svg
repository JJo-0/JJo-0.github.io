<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
<title id="title">텍스트 기반 순차 진단 벤치마크의 정보 요청과 채점 흐름</title>
<desc id="desc">짧은 사례 요약에서 시작해 진단 AI가 질문이나 검사를 선택한다. Gatekeeper가 사례에 근거한 응답 또는 허용된 합성 응답을 반환한다. 정보가 더 필요하면 요청을 반복하고, 최종 진단 뒤 정확도와 추산 비용을 따로 평가한다. 논문 도판을 복제하지 않은 설명용 흐름도이다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#315e51" stroke-width="2"/></marker></defs>
<rect width="720" height="1050" fill="#fafaf7"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" text-anchor="middle" fill="#172b32">
<text x="360" y="58" font-size="34" font-weight="700">진단 AI의 점수는 어떻게 나올까?</text>
<g fill="#fff" stroke="#93aaa5" stroke-width="2"><rect x="110" y="94" width="500" height="120" rx="16"/><rect x="110" y="266" width="500" height="120" rx="16"/><rect x="110" y="438" width="500" height="150" rx="16"/><rect x="110" y="660" width="500" height="120" rx="16"/></g>
<text x="360" y="140" font-size="32" font-weight="700">1 · 짧은 사례 요약</text><text x="360" y="184" font-size="27">실제 진료가 아닌 텍스트 사례</text>
<text x="360" y="312" font-size="32" font-weight="700">2 · 다음 질문·검사 선택</text><text x="360" y="356" font-size="27">진단 AI가 추가 정보를 요청</text>
<text x="360" y="484" font-size="32" font-weight="700">3 · Gatekeeper의 응답</text><text x="360" y="528" font-size="27">사례 정보 또는 허용된 합성 정보</text><text x="360" y="566" font-size="25">정보가 더 필요하면 요청을 반복</text>
<text x="360" y="706" font-size="32" font-weight="700">4 · 최종 진단 제출</text><text x="360" y="750" font-size="27">진단의 정확도와 비용을 따로 평가</text>
<g stroke="#315e51" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M360 217V250"/><path d="M360 390V423"/><path d="M360 592V645"/><path d="M110 514H52V326H94"/><path d="M360 784V823H186V850"/><path d="M360 823H534V850"/></g>
<g fill="#e8f1ef" stroke="#93aaa5" stroke-width="2"><rect x="32" y="870" width="308" height="132" rx="14"/><rect x="380" y="870" width="308" height="132" rx="14"/></g>
<text x="186" y="916" font-size="32" font-weight="700">정확도</text><text x="186" y="958" font-size="27">Judge ≥ 4 사례 비율</text>
<text x="534" y="916" font-size="32" font-weight="700">추산 비용</text><text x="534" y="955" font-size="25">방문당 $300 + 검사비</text>
</g></svg>
