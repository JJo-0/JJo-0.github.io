<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 635" width="660" height="635" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">안전 보장은 현재 구간에 묶인다</title><desc id="limits-desc">가정 네 가지와 유한 계획 구간 T=Ndt를 표시했다. 미관측 영역 보호에는 unknown-space inflation 활성화도 필요하며 계획 끝 이후 안전·재계획 성공을 보장하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="635" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">안전 보장은 현재 구간에 묶인다</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">설명용 재구성 도식 · 원 논문 도판 아님</text><text x="30" y="126" font-size="26" fill="#13213b" text-anchor="start" font-weight="700">증명의 조건</text><rect x="30" y="153" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="184" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">장애물 속도 상한이 맞음</text><rect x="30" y="211" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="242" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">위치·크기 오차가 보수적으로 덮임</text><rect x="30" y="269" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="300" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">계획한 운동을 정확히 추종함</text><rect x="30" y="327" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="358" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">미추적 장애물은 미관측 영역에서 시작</text><line x1="50" y1="437" x2="610" y2="437" stroke="#13213b" stroke-width="3"/><rect x="65" y="405" width="325" height="64" rx="0" fill="#dfeaff" stroke="none" stroke-width="2"/><rect x="390" y="405" width="210" height="64" rx="0" fill="#fff1e9" stroke="none" stroke-width="2"/><line x1="390" y1="384" x2="390" y2="493" stroke="#bc4513" stroke-width="3"/><text x="220" y="445" font-size="25" fill="#195ce0" text-anchor="middle" font-weight="700">현재 계획 구간</text><text x="495" y="445" font-size="25" fill="#bc4513" text-anchor="middle" font-weight="700">이후는 별도</text><text x="65" y="516" font-size="25" fill="#13213b" text-anchor="start" font-weight="400">t₀</text><text x="390" y="516" font-size="24" fill="#bc4513" text-anchor="middle" font-weight="400">t₀ + T,  T = N·dt</text><text x="30" y="562" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">말단에서 멈춰도 무기한 안전한 것은 아니다.</text><text x="30" y="599" font-size="23" fill="#465774" text-anchor="start" font-weight="400">조건 위반 감지·비상 동작 검증은 추가 과제</text></g></svg>