<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 635" width="660" height="635" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">Safety is bounded by the horizon</title><desc id="limits-desc">Four assumptions and the finite planning horizon T=Ndt. Protection from unknown space also requires boundary inflation. Safety beyond the horizon and subsequent planning success are not guaranteed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="635" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">Safety is bounded by the horizon</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">Original explanatory diagram</text><text x="30" y="126" font-size="26" fill="#13213b" text-anchor="start" font-weight="700">Proof assumptions</text><rect x="30" y="153" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="184" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">Obstacle speed stays within its bound</text><rect x="30" y="211" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="242" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">Margins cover size and position error</text><rect x="30" y="269" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="300" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">The drone follows the planned trajectory exactly</text><rect x="30" y="327" width="600" height="45" rx="12" fill="#eef3fc" stroke="none" stroke-width="2"/><text x="47" y="358" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">Untracked obstacles start in unobserved space</text><line x1="50" y1="437" x2="610" y2="437" stroke="#13213b" stroke-width="3"/><rect x="65" y="405" width="325" height="64" rx="0" fill="#dfeaff" stroke="none" stroke-width="2"/><rect x="390" y="405" width="210" height="64" rx="0" fill="#fff1e9" stroke="none" stroke-width="2"/><line x1="390" y1="384" x2="390" y2="493" stroke="#bc4513" stroke-width="3"/><text x="220" y="445" font-size="25" fill="#195ce0" text-anchor="middle" font-weight="700">Current horizon</text><text x="495" y="445" font-size="25" fill="#bc4513" text-anchor="middle" font-weight="700">Beyond T</text><text x="65" y="516" font-size="25" fill="#13213b" text-anchor="start" font-weight="400">t₀</text><text x="390" y="516" font-size="24" fill="#bc4513" text-anchor="middle" font-weight="400">t₀ + T,  T = N·dt</text><text x="30" y="562" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">Stopping at the endpoint does not ensure indefinite safety.</text><text x="30" y="599" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Test assumption monitoring and emergency actions.</text></g></svg>