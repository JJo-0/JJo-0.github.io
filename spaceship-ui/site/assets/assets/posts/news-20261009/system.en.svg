<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 800" width="660" height="800" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">Where SANDO fits</title><desc id="system-desc">Sensors and estimation feed route selection, time-layered corridors, the MIQP, and tracking control. Safety depends on the corridor and model assumptions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="800" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">Where SANDO fits</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">Original explanatory diagram</text><rect x="40" y="110" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="143" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">Sensing and mapping</text><text x="62" y="175" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Observed and unobserved space</text><line x1="330" y1="194" x2="330" y2="212" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="214" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="247" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">Obstacle estimation</text><text x="62" y="279" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Position, size, and speed limits</text><line x1="330" y1="298" x2="330" y2="316" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="318" width="580" height="82" rx="12" fill="#fff1e9" stroke="none" stroke-width="2"/><text x="62" y="351" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">Heat map and global path</text><text x="62" y="383" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Heuristic for a candidate route</text><line x1="330" y1="402" x2="330" y2="420" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="422" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="455" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">Time-layered safe corridors</text><text x="62" y="487" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Space outside inflated obstacles</text><line x1="330" y1="506" x2="330" y2="524" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="526" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="559" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">MIQP trajectory planning</text><text x="62" y="591" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Control points, motion, and boundaries</text><line x1="330" y1="610" x2="330" y2="628" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="630" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="663" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">Tracking controller</text><text x="62" y="695" font-size="23" fill="#465774" text-anchor="start" font-weight="400">Physical tracking error is a separate assumption</text><text x="40" y="764" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">A heat map alone cannot guarantee collision avoidance.</text></g></svg>