<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" width="660" height="620" role="img" aria-labelledby="control-points-title control-points-desc">
<title id="control-points-title">점 네 개로 곡선 전체를 제한한다</title><desc id="control-points-desc">임의의 사각 통로 안에 네 Bezier 제어점과 이들의 볼록껍질, 3차 곡선을 그렸다. 좌표는 설명용이며 원 연구 경로가 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="620" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">점 네 개로 곡선 전체를 제한한다</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">설명용 재구성 도식 · 원 논문 도판 아님</text><rect x="55" y="157" width="550" height="295" rx="10" fill="#f3f7ff" stroke="#195ce0" stroke-width="2"/><text x="74" y="194" font-size="24" fill="#195ce0" text-anchor="start" font-weight="400">선택한 볼록 통로</text><polygon points="150,380 140,235 500,215 510,380" fill="#dbe5f9" stroke="#718fbf" stroke-width="2" stroke-dasharray="7 5"/><path d="M150,380 C140,235 500,215 510,380" fill="none" stroke="#8e2389" stroke-width="7"/><circle cx="150" cy="380" r="8" fill="#195ce0"/><text x="162" y="368" font-size="24" fill="#195ce0" text-anchor="start" font-weight="700">p0</text><circle cx="140" cy="235" r="8" fill="#195ce0"/><text x="152" y="223" font-size="24" fill="#195ce0" text-anchor="start" font-weight="700">p1</text><circle cx="500" cy="215" r="8" fill="#195ce0"/><text x="512" y="203" font-size="24" fill="#195ce0" text-anchor="start" font-weight="700">p2</text><circle cx="510" cy="380" r="8" fill="#195ce0"/><text x="522" y="368" font-size="24" fill="#195ce0" text-anchor="start" font-weight="700">p3</text><text x="30" y="507" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">네 제어점이 통로 안 → 곡선 전체도 통로 안</text><text x="30" y="547" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">볼록껍질 성질 · 장애물 팽창이 정확해야 안전</text><text x="30" y="582" font-size="23" fill="#465774" text-anchor="start" font-weight="400">제어점은 실제 비행 중간점을 뜻하지 않는다.</text></g></svg>