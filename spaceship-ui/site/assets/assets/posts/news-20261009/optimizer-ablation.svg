<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 630" width="660" height="630" role="img" aria-labelledby="optimizer-ablation-title optimizer-ablation-desc">
<title id="optimizer-ablation-title">빠른 부분은 어디인가</title><desc id="optimizer-ablation-desc">Table IX의 N=4 최적화 시간 1.3ms와 9.6ms를 0부터 시작하는 축으로 비교했다. 전체 파이프라인 지연이나 모든 환경의 7.4배 개선을 뜻하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="630" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">빠른 부분은 어디인가</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">설명용 재구성 도식 · 원 논문 도판 아님</text><text x="30" y="125" font-size="24" fill="#13213b" text-anchor="start" font-weight="400">N=4 · 최적화 시간만 비교 (Table IX)</text><text x="30" y="158" font-size="23" fill="#465774" text-anchor="start" font-weight="400">두 설정의 최적화 성공률은 모두 93.4%</text><line x1="92" y1="475" x2="610" y2="475" stroke="#d6ddeb" stroke-width="1"/><text x="78" y="483" font-size="22" fill="#465774" text-anchor="end" font-weight="400">0</text><line x1="92" y1="340" x2="610" y2="340" stroke="#d6ddeb" stroke-width="1"/><text x="78" y="348" font-size="22" fill="#465774" text-anchor="end" font-weight="400">5</text><line x1="92" y1="205" x2="610" y2="205" stroke="#d6ddeb" stroke-width="1"/><text x="78" y="213" font-size="22" fill="#465774" text-anchor="end" font-weight="400">10</text><text x="36" y="194" font-size="23" fill="#465774" text-anchor="start" font-weight="400">ms</text><line x1="92" y1="190" x2="92" y2="475" stroke="#13213b" stroke-width="2"/><line x1="92" y1="475" x2="610" y2="475" stroke="#13213b" stroke-width="2"/><rect x="170" y="439.9" width="130" height="35.1" rx="0" fill="#195ce0" stroke="none" stroke-width="2"/><text x="235" y="422.9" font-size="29" fill="#195ce0" text-anchor="middle" font-weight="700">1.3 ms</text><text x="235" y="516" font-size="23" fill="#13213b" text-anchor="middle" font-weight="400">변수 제거 사용</text><rect x="395" y="215.8" width="130" height="259.2" rx="0" fill="#bc4513" stroke="none" stroke-width="2"/><text x="460" y="198.8" font-size="29" fill="#bc4513" text-anchor="middle" font-weight="700">9.6 ms</text><text x="460" y="516" font-size="23" fill="#13213b" text-anchor="middle" font-weight="400">변수 제거 없음</text><text x="30" y="561" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">약 7.4배: 센서·지도·전체 실행 시간은 제외</text><text x="30" y="597" font-size="21" fill="#465774" text-anchor="start" font-weight="400">논문 숫자를 별도로 도식화 · 신뢰구간 미표시</text></g></svg>