<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 800" width="660" height="800" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">SANDO는 어디에서 작동하나</title><desc id="system-desc">센서·추정에서 길 후보·시간별 통로·MIQP·제어까지의 개념 흐름. 안전성은 통로와 모델 가정에 묶인다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="800" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">SANDO는 어디에서 작동하나</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">설명용 재구성 도식 · 원 논문 도판 아님</text><rect x="40" y="110" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="143" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">센서·지도</text><text x="62" y="175" font-size="23" fill="#465774" text-anchor="start" font-weight="400">관측 영역과 미관측 영역</text><line x1="330" y1="194" x2="330" y2="212" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="214" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="247" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">장애물 추정</text><text x="62" y="279" font-size="23" fill="#465774" text-anchor="start" font-weight="400">현재 위치·크기·속도 상한</text><line x1="330" y1="298" x2="330" y2="316" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="318" width="580" height="82" rx="12" fill="#fff1e9" stroke="none" stroke-width="2"/><text x="62" y="351" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">열지도 + 전역 경로</text><text x="62" y="383" font-size="23" fill="#465774" text-anchor="start" font-weight="400">길 후보를 찾는 휴리스틱</text><line x1="330" y1="402" x2="330" y2="420" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="422" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="455" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">시간별 안전 통로</text><text x="62" y="487" font-size="23" fill="#465774" text-anchor="start" font-weight="400">팽창 영역과 겹치지 않는 공간</text><line x1="330" y1="506" x2="330" y2="524" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="526" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="559" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">MIQP 곡선 계획</text><text x="62" y="591" font-size="23" fill="#465774" text-anchor="start" font-weight="400">제어점·운동·경계 조건</text><line x1="330" y1="610" x2="330" y2="628" stroke="#195ce0" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="630" width="580" height="82" rx="12" fill="#eaf1ff" stroke="none" stroke-width="2"/><text x="62" y="663" font-size="27" fill="#13213b" text-anchor="start" font-weight="700">추종 제어기</text><text x="62" y="695" font-size="23" fill="#465774" text-anchor="start" font-weight="400">실제 실행 오차는 별도 가정</text><text x="40" y="764" font-size="23" fill="#bc4513" text-anchor="start" font-weight="400">열지도 자체가 충돌 안전성을 보장하지는 않는다.</text></g></svg>