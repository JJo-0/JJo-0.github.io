<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 610" width="660" height="610" role="img" aria-labelledby="layers-title layers-desc">
<title id="layers-title">How much inflation at each layer?</title><desc id="layers-desc">With per-axis speed bounds, the half-width is 1.6 m at 0.5 s, 2.6 m at 1 s, and 3.6 m at 1.5 s. These first three layers illustrate the calculation, not an experiment or a total speed bound.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="610" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">How much inflation at each layer?</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">Original explanatory diagram</text><text x="30" y="126" font-size="24" fill="#13213b" text-anchor="start" font-weight="400">One axis: 2 m/s bound, 0.5 s per layer</text><text x="30" y="159" font-size="21" fill="#465774" text-anchor="start" font-weight="400">Half-width = 0.2 + 2t + 0.1 + 0.3 m</text><text x="30" y="207" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 0.5 s  →  half-width 1.6 m</text><rect x="221.2" y="220" width="217.60000000000002" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="214" x2="330" y2="264" stroke="#13213b" stroke-width="2"/><text x="30" y="309" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 1.0 s  →  half-width 2.6 m</text><rect x="153.2" y="322" width="353.6" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="316" x2="330" y2="366" stroke="#13213b" stroke-width="2"/><text x="30" y="411" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 1.5 s  →  half-width 3.6 m</text><rect x="85.19999999999999" y="424" width="489.6" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="418" x2="330" y2="468" stroke="#13213b" stroke-width="2"/><text x="30" y="543" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">Later layers allow more motion from the same observation.</text><text x="30" y="577" font-size="21" fill="#bc4513" text-anchor="start" font-weight="400">First three layers of a worked example, not measurements</text></g></svg>