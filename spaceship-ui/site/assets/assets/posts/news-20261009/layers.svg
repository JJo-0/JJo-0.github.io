<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 610" width="660" height="610" role="img" aria-labelledby="layers-title layers-desc">
<title id="layers-title">시간별로 얼마나 부풀리나</title><desc id="layers-desc">좌표별 속도 상한에서 팽창 반폭은 0.5초 1.6m, 1초 2.6m, 1.5초 3.6m가 된다. 계산 예의 첫 세 층이며 유클리드 총속도나 실제 실험값을 뜻하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#195ce0"/></marker></defs>
<rect width="660" height="610" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif"><text x="30" y="48" font-size="30" fill="#13213b" text-anchor="start" font-weight="700">시간별로 얼마나 부풀리나</text><text x="30" y="80" font-size="20" fill="#465774" text-anchor="start" font-weight="400">설명용 재구성 도식 · 원 논문 도판 아님</text><text x="30" y="126" font-size="24" fill="#13213b" text-anchor="start" font-weight="400">1개 축: 속도 상한 2 m/s, 층 간격 0.5 s</text><text x="30" y="159" font-size="21" fill="#465774" text-anchor="start" font-weight="400">반폭 = 장애물 0.2 + 2t + 오차 0.1 + 기체 0.3 m</text><text x="30" y="207" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 0.5 s   →   반폭 1.6 m</text><rect x="221.2" y="220" width="217.60000000000002" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="214" x2="330" y2="264" stroke="#13213b" stroke-width="2"/><text x="30" y="309" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 1.0 s   →   반폭 2.6 m</text><rect x="153.2" y="322" width="353.6" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="316" x2="330" y2="366" stroke="#13213b" stroke-width="2"/><text x="30" y="411" font-size="25" fill="#13213b" text-anchor="start" font-weight="700">t = 1.5 s   →   반폭 3.6 m</text><rect x="85.19999999999999" y="424" width="489.6" height="38" rx="3" fill="#d8e6ff" stroke="#195ce0" stroke-width="2"/><line x1="330" y1="418" x2="330" y2="468" stroke="#13213b" stroke-width="2"/><text x="30" y="543" font-size="23" fill="#13213b" text-anchor="start" font-weight="400">같은 관측값이어도 뒤 층의 가능 영역은 더 크다.</text><text x="30" y="577" font-size="21" fill="#bc4513" text-anchor="start" font-weight="400">설명 계산: 처음 3개 층만 표시 · 실험값 아님</text></g></svg>