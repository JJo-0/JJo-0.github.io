<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Transparent is not traversable</title><desc>A geometric teaching sketch, not a sensor image or a calibrated scale.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#376b61"/></marker></defs><rect width="1200" height="700" fill="#fbfaf5"/><text x="50" y="64" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183b38">Transparent is not traversable</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#586c67">A geometric teaching sketch, not a sensor image or a calibrated scale.</text><rect x="62" y="300" width="165" height="100" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="83" y="343" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183b38">RGB-D</text><text x="82" y="375" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#183b38">camera</text><rect x="492" y="170" width="26" height="340" fill="#cce5ed" stroke="#427588" stroke-width="3"/><path d="M495 170 L518 200 M495 240 L518 270 M495 310 L518 340 M495 380 L518 410 M495 450 L518 480" stroke="#7caebc" stroke-width="2"/><rect x="983" y="150" width="42" height="380" fill="#d6d1c6" stroke="#807c72" stroke-width="2"/><path d="M227 332 L482 332" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M230 370 L977 370" stroke="#ba673e" stroke-width="4" stroke-dasharray="12 9" fill="none"/><text x="419" y="142" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b38">Glass barrier</text><text x="925" y="125" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b38">Background</text><text x="255" y="288" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183b38">Needed: surface depth</text><text x="570" y="415" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#a4512b">Possible corrupted background return</text><rect x="60" y="555" width="1060" height="52" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="82" y="590" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183b38">A distant or missing measurement does not prove free space.</text><text x="50" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586c67">JJo teaching illustration · Not experimental data · CC BY 4.0</text></svg>