<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>LACE: separate responsibilities before searching</title><desc>A conceptual interface map based on the public I-O-T-H description.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#376b61"/></marker></defs><rect width="1200" height="700" fill="#fbfaf5"/><text x="50" y="64" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183b38">LACE: separate responsibilities before searching</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#586c67">A conceptual interface map based on the public I-O-T-H description.</text><rect x="45" y="155" width="230" height="165" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="68" y="199" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183b38">Problem + cases</text><text x="68" y="242" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">Rules, resources</text><text x="68" y="275" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">and objectives</text><rect x="340" y="145" width="300" height="110" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="365" y="187" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183b38">I · Input</text><text x="365" y="225" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">Read the instance</text><rect x="340" y="290" width="300" height="110" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="365" y="332" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183b38">O · Output</text><text x="365" y="370" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">Represent a solution</text><rect x="340" y="435" width="300" height="110" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="365" y="477" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183b38">T · Tools</text><text x="365" y="515" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">Check and evaluate</text><path d="M275 220 L328 200" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M275 240 L328 340" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M275 260 L328 480" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="755" y="225" width="390" height="240" rx="16" fill="#fff0d8" stroke="#ac7935" stroke-width="2"/><text x="781" y="276" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183b38">H · Heuristic portfolio</text><text x="781" y="323" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183b38">Generate → run → evaluate</text><text x="781" y="367" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#183b38">Repair failures; keep specialists</text><text x="781" y="411" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b38">Same contract for every candidate</text><path d="M640 200 L745 275" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M640 345 L745 345" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M640 490 L745 415" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="50" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586c67">JJo teaching illustration · Not experimental data · CC BY 4.0</text></svg>