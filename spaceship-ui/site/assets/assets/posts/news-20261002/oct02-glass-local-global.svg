<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Local hypotheses, global alignment</title><desc>Conceptual local-RANSAC workflow; not a measured parameter plot.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#376b61"/></marker></defs><rect width="1200" height="700" fill="#fbfaf5"/><text x="50" y="64" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183b38">Local hypotheses, global alignment</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#586c67">Conceptual local-RANSAC workflow; not a measured parameter plot.</text><text x="72" y="175" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183b38">1 · Sample patches</text><rect x="65" y="215" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="132" y="215" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="199" y="215" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><rect x="266" y="215" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><rect x="65" y="287" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="132" y="287" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="199" y="287" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><rect x="266" y="287" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><rect x="65" y="359" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="132" y="359" width="57" height="62" rx="16" fill="#d4e9dc" stroke="#92a49a" stroke-width="2"/><rect x="199" y="359" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><rect x="266" y="359" width="57" height="62" rx="16" fill="#f4dfcc" stroke="#92a49a" stroke-width="2"/><text x="64" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#183b38">No ground-truth glass mask</text><text x="64" y="499" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#183b38">is assumed at inference.</text><path d="M337 330 L402 330" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="420" y="210" width="290" height="220" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="444" y="252" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183b38">2 · Propose s, t</text><text x="445" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b38">Candidate from patch A</text><text x="445" y="345" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b38">Candidate from patch B</text><text x="445" y="390" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#183b38">Candidate from patch C</text><path d="M714 330 L781 330" stroke="#376b61" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="800" y="210" width="335" height="220" rx="16" fill="#fff0d8" stroke="#ac7935" stroke-width="2"/><text x="824" y="252" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183b38">3 · Validate globally</text><text x="824" y="303" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183b38">Score over the image</text><text x="824" y="348" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183b38">Select one scale + shift</text><text x="824" y="393" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#183b38">Align the whole prior</text><rect x="65" y="553" width="1070" height="57" rx="16" fill="#edf4ef" stroke="#376b61" stroke-width="2"/><text x="88" y="590" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183b38">Local sampling creates hypotheses, not independently scaled depth tiles.</text><text x="50" y="658" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586c67">JJo teaching illustration · Not experimental data · CC BY 4.0</text></svg>