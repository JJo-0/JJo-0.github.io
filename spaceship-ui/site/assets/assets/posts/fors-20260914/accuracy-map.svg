<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">정확도 요구가 커질 때 단계 수의 성장 양식을 비교하는 교육용 그림</title>
  <desc id="desc">오차 허용치가 작아질수록 전통적 다항식 의존은 가파르게, 논문이 보이는 polylog 의존은 완만하게 증가할 수 있음을 개념적으로 비교한다. 실제 GPU 시간이나 실측 수치는 아니다.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">정확도를 더 요구하면, 단계 수는 어떻게 늘어날까?</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">교육용 성장 양식 비교 · 실제 모델의 시간·해상도·상수항은 포함하지 않음</text>
  <rect x="80" y="172" width="1040" height="396" rx="20" fill="#fffdf8" stroke="#d9d1c2" stroke-width="2"/>
  <line x1="182" y1="504" x2="1045" y2="504" stroke="#7c8781" stroke-width="3"/>
  <line x1="182" y1="504" x2="182" y2="220" stroke="#7c8781" stroke-width="3"/>
  <text x="530" y="550" fill="#53605a" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">목표 오차 δ를 더 작게 요구함  →</text>
  <text x="124" y="368" fill="#53605a" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" transform="rotate(-90 124 368)">필요한 score 평가 단계의 이론적 규모</text>
  <path d="M220 478 C380 466 508 424 626 342 C752 254 885 224 1000 224" fill="none" stroke="#c85d43" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 478 C382 468 510 454 635 430 C772 402 886 375 1000 352" fill="none" stroke="#2f7a70" stroke-width="10" stroke-linecap="round"/>
  <circle cx="998" cy="224" r="11" fill="#c85d43"/>
  <circle cx="998" cy="352" r="11" fill="#2f7a70"/>
  <rect x="742" y="190" width="270" height="72" rx="14" fill="#fff0e9"/>
  <text x="764" y="219" fill="#933c2b" font-family="system-ui, sans-serif" font-size="21" font-weight="700">기존 직관: 1/δ의</text>
  <text x="764" y="246" fill="#933c2b" font-family="system-ui, sans-serif" font-size="21" font-weight="700">다항식 의존</text>
  <rect x="714" y="368" width="298" height="72" rx="14" fill="#e4f4ef"/>
  <text x="736" y="397" fill="#17675e" font-family="system-ui, sans-serif" font-size="21" font-weight="700">FORS의 이론 결과:</text>
  <text x="736" y="424" fill="#17675e" font-family="system-ui, sans-serif" font-size="21" font-weight="700">polylog(1/δ) 의존</text>
  <rect x="80" y="600" width="1040" height="48" rx="12" fill="#efeae0"/>
  <text x="104" y="632" fill="#444c48" font-family="system-ui, sans-serif" font-size="20">핵심: 이는 ‘모든 이미지 생성기가 즉시 몇 배 빨라진다’는 실측 그래프가 아니라, 목표 오차에 대한 복잡도 결과다.</text>
</svg>
