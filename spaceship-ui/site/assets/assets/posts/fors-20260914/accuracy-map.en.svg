<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How step counts scale with tighter accuracy requirements</title>
  <desc id="desc">The curves illustrate polynomial and polylogarithmic dependence on inverse error as tolerance shrinks. They do not report measured GPU times.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">How do step counts grow as accuracy requirements tighten?</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">Illustrative growth rates. Model runtime, resolution, and constants are omitted.</text>
  <rect x="80" y="172" width="1040" height="396" rx="20" fill="#fffdf8" stroke="#d9d1c2" stroke-width="2"/>
  <line x1="182" y1="504" x2="1045" y2="504" stroke="#7c8781" stroke-width="3"/>
  <line x1="182" y1="504" x2="182" y2="220" stroke="#7c8781" stroke-width="3"/>
  <text x="530" y="550" fill="#53605a" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">Smaller target error δ  →</text>
  <text x="124" y="368" fill="#53605a" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" transform="rotate(-90 124 368)">Theoretical scale of score evaluations</text>
  <path d="M220 478 C380 466 508 424 626 342 C752 254 885 224 1000 224" fill="none" stroke="#c85d43" stroke-width="10" stroke-linecap="round"/>
  <path d="M220 478 C382 468 510 454 635 430 C772 402 886 375 1000 352" fill="none" stroke="#2f7a70" stroke-width="10" stroke-linecap="round"/>
  <circle cx="998" cy="224" r="11" fill="#c85d43"/>
  <circle cx="998" cy="352" r="11" fill="#2f7a70"/>
  <rect x="742" y="190" width="270" height="72" rx="14" fill="#fff0e9"/>
  <text x="764" y="219" fill="#933c2b" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Earlier bounds:</text>
  <text x="764" y="246" fill="#933c2b" font-family="system-ui, sans-serif" font-size="21" font-weight="700">polynomial in 1/δ</text>
  <rect x="714" y="368" width="298" height="72" rx="14" fill="#e4f4ef"/>
  <text x="736" y="397" fill="#17675e" font-family="system-ui, sans-serif" font-size="21" font-weight="700">FORS bound:</text>
  <text x="736" y="424" fill="#17675e" font-family="system-ui, sans-serif" font-size="21" font-weight="700">polylogarithmic in 1/δ</text>
  <rect x="80" y="600" width="1040" height="48" rx="12" fill="#efeae0"/>
  <text x="104" y="632" fill="#444c48" font-family="system-ui, sans-serif" font-size="20">The curves compare complexity as tolerance shrinks. They do not measure a generator's speedup.</text>
</svg>
