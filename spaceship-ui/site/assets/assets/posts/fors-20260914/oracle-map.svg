<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FORS가 score 정보로 샘플을 만드는 과정을 설명하는 교육용 그림</title>
  <desc id="desc">목표 분포에 가까운 score 추정기를 여러 번 질의해 후보를 받아들이거나 버리고 최종 샘플을 만드는 개념 흐름이다. 실제 알고리즘의 전체 증명이나 실행 비용을 나타내지는 않는다.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">FORS는 무엇을 알고, 무엇을 모르는가</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">밀도값을 직접 읽지 않고 score(방향 정보)만 질의해 거절 샘플링을 구현하는 발상</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5e6b65"/></marker></defs>
  <rect x="80" y="212" width="218" height="176" rx="22" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="108" y="258" fill="#242a28" font-family="system-ui, sans-serif" font-size="25" font-weight="750">목표 분포</text>
  <text x="108" y="298" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">원하는 결과들이</text>
  <text x="108" y="327" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">어디에 모여 있는가</text>
  <text x="108" y="365" fill="#9b4c37" font-family="system-ui, sans-serif" font-size="18" font-weight="700">밀도값은 직접 보지 않음</text>
  <line x1="300" y1="300" x2="412" y2="300" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="430" y="196" width="246" height="208" rx="22" fill="#e4f4ef" stroke="#9cc9bd" stroke-width="2"/>
  <text x="458" y="248" fill="#17675e" font-family="system-ui, sans-serif" font-size="25" font-weight="750">score 추정기</text>
  <text x="458" y="288" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">‘더 그럴듯한 쪽’</text>
  <text x="458" y="317" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">방향을 답해 주는</text>
  <text x="458" y="346" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">1차 정보 oracle</text>
  <line x1="678" y1="300" x2="790" y2="300" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="808" y="196" width="312" height="208" rx="22" fill="#eef1f7" stroke="#c7cedc" stroke-width="2"/>
  <text x="836" y="248" fill="#334764" font-family="system-ui, sans-serif" font-size="25" font-weight="750">FORS</text>
  <text x="836" y="288" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">후보를 만들고</text>
  <text x="836" y="317" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">여러 score 질의로</text>
  <text x="836" y="346" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">채택·거절을 구현</text>
  <line x1="964" y1="406" x2="964" y2="478" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="808" y="500" width="312" height="90" rx="22" fill="#fff1d6" stroke="#e2bd70" stroke-width="2"/>
  <text x="836" y="540" fill="#77551d" font-family="system-ui, sans-serif" font-size="24" font-weight="750">고정확도 샘플</text>
  <text x="836" y="570" fill="#77551d" font-family="system-ui, sans-serif" font-size="18">조건이 성립할 때의 이론적 결과</text>
  <rect x="80" y="486" width="620" height="110" rx="18" fill="#efeae0"/>
  <text x="108" y="527" fill="#444c48" font-family="system-ui, sans-serif" font-size="21" font-weight="700">중요한 조건</text>
  <text x="108" y="560" fill="#444c48" font-family="system-ui, sans-serif" font-size="19">목표 오차 δ가 작아질수록 score 추정도 대략 Õ(δ) 수준으로</text>
  <text x="108" y="587" fill="#444c48" font-family="system-ui, sans-serif" font-size="19">정확해야 한다. 샘플링만 쉬워지고 모델 오차가 사라지는 것은 아니다.</text>
</svg>
