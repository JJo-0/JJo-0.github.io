<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Sampling through a score oracle</title>
  <desc id="desc">First-order rejection sampling uses repeated queries to an accurate score estimator to implement acceptance or rejection. The diagram omits proof details and execution costs.</desc>
  <rect width="1200" height="680" fill="#fbf8f1"/>
  <text x="80" y="84" fill="#242a28" font-family="system-ui, sans-serif" font-size="36" font-weight="750">What information does FORS use?</text>
  <text x="80" y="126" fill="#64706b" font-family="system-ui, sans-serif" font-size="22">Rejection sampling from score queries without directly evaluating the density</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5e6b65"/></marker></defs>
  <rect x="80" y="212" width="218" height="176" rx="22" fill="#fffdf8" stroke="#d7cfbf" stroke-width="2"/>
  <text x="108" y="258" fill="#242a28" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Target law</text>
  <text x="108" y="298" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">Where probable</text>
  <text x="108" y="327" fill="#59635e" font-family="system-ui, sans-serif" font-size="20">outcomes cluster</text>
  <text x="108" y="365" fill="#9b4c37" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Density unobserved</text>
  <line x1="300" y1="300" x2="412" y2="300" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="430" y="196" width="246" height="208" rx="22" fill="#e4f4ef" stroke="#9cc9bd" stroke-width="2"/>
  <text x="458" y="248" fill="#17675e" font-family="system-ui, sans-serif" font-size="25" font-weight="750">Score estimator</text>
  <text x="458" y="288" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">Direction of</text>
  <text x="458" y="317" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">increasing density</text>
  <text x="458" y="346" fill="#365c55" font-family="system-ui, sans-serif" font-size="20">First-order oracle</text>
  <line x1="678" y1="300" x2="790" y2="300" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="808" y="196" width="312" height="208" rx="22" fill="#eef1f7" stroke="#c7cedc" stroke-width="2"/>
  <text x="836" y="248" fill="#334764" font-family="system-ui, sans-serif" font-size="25" font-weight="750">FORS</text>
  <text x="836" y="288" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">Draw a candidate</text>
  <text x="836" y="317" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">Use score queries</text>
  <text x="836" y="346" fill="#4d5d73" font-family="system-ui, sans-serif" font-size="20">to accept or reject</text>
  <line x1="964" y1="406" x2="964" y2="478" stroke="#5e6b65" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="808" y="500" width="312" height="90" rx="22" fill="#fff1d6" stroke="#e2bd70" stroke-width="2"/>
  <text x="836" y="540" fill="#77551d" font-family="system-ui, sans-serif" font-size="24" font-weight="750">Accurate sample</text>
  <text x="836" y="570" fill="#77551d" font-family="system-ui, sans-serif" font-size="18">Under theorem assumptions</text>
  <rect x="80" y="486" width="620" height="110" rx="18" fill="#efeae0"/>
  <text x="108" y="527" fill="#444c48" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Accuracy requirement</text>
  <text x="108" y="560" fill="#444c48" font-family="system-ui, sans-serif" font-size="19">Target error δ requires roughly Õ(δ) score accuracy.</text>
  <text x="108" y="587" fill="#444c48" font-family="system-ui, sans-serif" font-size="19">Sampler accuracy is limited by model error.</text>
</svg>
