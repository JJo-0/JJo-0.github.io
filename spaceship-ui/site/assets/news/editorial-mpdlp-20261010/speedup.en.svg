<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc"><title id="title">Reported speedups for iterations and the full solve</title><desc id="desc">Speedups of 11.4× and 4.2× for the same instance. An original chart using NVIDIA's reported ratios.</desc><rect width="960" height="320" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="34" class="small">NVIDIA measurements · tsp-gaia-10m · single B200 baseline</text><text x="28" y="122" class="">Iterations (peak)</text><rect x="280" y="100" width="551.00" height="44" rx="4" fill="#377c9d"/><text x="841.0" y="128" class="">11.4×</text><text x="28" y="222" class="">Full solve</text><rect x="280" y="200" width="203.00" height="44" rx="4" fill="#377c9d"/><text x="493.0" y="228" class="">4.2×</text><text x="30" y="286" class="small">Ratios for one instance. No absolute times, averages, or independent replication.</text></svg>
