<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="title desc"><title id="title">최적화 시스템의 세 역할</title><desc id="desc">입력, 분할과 반복, 반복 중 종료 판정과 최종 검증을 역할별로 구분한 설명용 도식. 엄격한 실행 순서나 실행시간 비율 아님.</desc><rect width="960" height="260" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="36" class="small">설명용 재구성 · JJo</text><rect class="box" x="30.0" y="80" width="284.0" height="110" rx="12"/><text x="44.0" y="121" class="">입력 모델</text><text x="44.0" y="158" class="small">비용·제약·변수 범위</text><rect class="box" x="338.0" y="80" width="284.0" height="110" rx="12"/><text x="352.0" y="121" class="">분할과 반복</text><text x="352.0" y="158" class="small">필요한 값 교환</text><rect class="box" x="646.0" y="80" width="284.0" height="110" rx="12"/><text x="660.0" y="121" class="">종료 판정·최종 검증</text><text x="660.0" y="158" class="small">반복 중 판정 / 최종 해 확인</text><text x="30" y="230" class="small">작업 역할의 구분 · 엄격한 실행 순서나 시간 비율이 아님</text></svg>
