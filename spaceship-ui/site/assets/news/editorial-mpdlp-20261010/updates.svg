<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc"><title id="title">PDHG 반복식의 역할</title><desc id="desc">수학적 역할을 설명한 개념도이며 GPU 커널의 실제 스케줄을 나타내지 않음.</desc><rect width="960" height="330" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="36" class="small">설명용 재구성 · JJo</text><rect class="box" x="30.0" y="80" width="284.0" height="110" rx="12"/><text x="44.0" y="121" class="">x 갱신</text><text x="44.0" y="158" class="small">비용·쌍대 영향 → 투영</text><path class="line" d="M317.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="338.0" y="80" width="284.0" height="110" rx="12"/><text x="352.0" y="121" class="">외삽 값</text><text x="352.0" y="158" class="small">2 × 새 x − 이전 x</text><path class="line" d="M625.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="646.0" y="80" width="284.0" height="110" rx="12"/><text x="660.0" y="121" class="">y 갱신</text><text x="660.0" y="158" class="small">제약 잔차 반영</text><text x="40" y="285" class="small">Aᵀy와 Ax의 연결 계산에 다른 장치의 값이 필요할 수 있다.</text><path d="M792 192 V213 H170 V192 l-6 6 m6 -6 l6 6" stroke="#c87533" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="295" y="245" class="small">새 y의 영향은 다음 x 갱신에 반영</text></svg>
