<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc"><title id="title">다음 검증을 위한 질문</title><desc id="desc">문제 조건, 구현 버전, 원시 결과, 실제 제약에 대한 질문. 검수 완료나 상용화 단계 아님.</desc><rect width="960" height="300" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="36" class="small">설명용 재구성 · JJo</text><rect class="box" x="30.0" y="80" width="207.0" height="110" rx="12"/><text x="44.0" y="121" class="">대표 입력</text><text x="44.0" y="158" class="small">무엇과 비교하나?</text><path class="line" d="M240.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="261.0" y="80" width="207.0" height="110" rx="12"/><text x="275.0" y="121" class="">구현 버전</text><text x="275.0" y="158" class="small">어떤 코드인가?</text><path class="line" d="M471.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="492.0" y="80" width="207.0" height="110" rx="12"/><text x="506.0" y="121" class="">원시 결과</text><text x="506.0" y="158" class="small">조건을 확인했나?</text><path class="line" d="M702.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="723.0" y="80" width="207.0" height="110" rx="12"/><text x="737.0" y="121" class="">실제 제약</text><text x="737.0" y="158" class="small">실행 가능한가?</text><text x="30" y="253" class="small">독립 실행과 실제 운영 조건의 검증은 별도 과제다.</text></svg>
