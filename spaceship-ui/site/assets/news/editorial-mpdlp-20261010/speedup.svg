<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc"><title id="title">반복 단계와 전체 실행의 보고된 속도 향상 배율</title><desc id="desc">같은 사례의 11.4배와 4.2배를 비교. NVIDIA 수치의 자체 해석 그림; 원문 도판 복제 아님.</desc><rect width="960" height="320" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="34" class="small">NVIDIA 자체 보고 · tsp-gaia-10m · 단일 B200 기준</text><text x="28" y="122" class="">반복 단계 (최대)</text><rect x="280" y="100" width="551.00" height="44" rx="4" fill="#377c9d"/><text x="841.0" y="128" class="">11.4배</text><text x="28" y="222" class="">전체 실행</text><rect x="280" y="200" width="203.00" height="44" rx="4" fill="#377c9d"/><text x="493.0" y="228" class="">4.2배</text><text x="30" y="286" class="small">배율이며 초·평균·독립 재현 결과가 아니다.</text></svg>
