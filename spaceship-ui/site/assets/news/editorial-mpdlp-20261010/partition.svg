<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc"><title id="title">변수와 제약의 연결을 나눌 때 경계를 넘는 값</title><desc id="desc">이 글이 만든 2개 변수와 2개 제약 연결 예시. NVIDIA 원문 Figure 아님.</desc><rect width="960" height="340" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="34" class="small">설명용 장난감 그래프 · 실제 분할 결과 아님</text><rect class="box" x="50" y="65" width="390" height="230" rx="12"/><rect class="box" x="520" y="65" width="390" height="230" rx="12"/><text x="75" y="95" class="">장치 영역 A</text><text x="545" y="95" class="">장치 영역 B</text><circle cx="130" cy="155" r="26" fill="#d5efeb" stroke="#47738f"/><text x="90" y="215" class="small">변수 1</text><rect class="box" x="324" y="129" width="52" height="52" rx="12"/><text x="310" y="215" class="small">제약 1</text><circle cx="600" cy="240" r="26" fill="#d5efeb" stroke="#47738f"/><text x="560" y="300" class="small">변수 2</text><rect class="box" x="794" y="214" width="52" height="52" rx="12"/><text x="780" y="300" class="small">제약 2</text><path class="line" d="M156 155H324 M626 240H794"/><path d="M376 155L574 240" stroke="#c87533" stroke-width="4" stroke-dasharray="10 6"/><text x="437" y="146" class="small">경계 너머 값</text></svg>
