<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="title desc"><title id="title">Three roles in an optimization system</title><desc id="desc">The input, partitioning and iteration, stopping tests during iteration, and final verification have different roles. Box sizes and order do not represent runtimes or an execution schedule.</desc><rect width="960" height="260" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="36" class="small">Explanatory diagram · JJo</text><rect class="box" x="30.0" y="80" width="284.0" height="110" rx="12"/><text x="44.0" y="121" class="">Input model</text><text x="44.0" y="158" class="small">Cost, constraints, bounds</text><rect class="box" x="338.0" y="80" width="284.0" height="110" rx="12"/><text x="352.0" y="121" class="">Partition and iterate</text><text x="352.0" y="158" class="small">Exchange required values</text><rect class="box" x="646.0" y="80" width="284.0" height="110" rx="12"/><text x="660.0" y="121" class="">Stop and verify</text><text x="660.0" y="158" class="small">In-loop test / final check</text><text x="30" y="230" class="small">Boxes identify roles. Their size and order do not represent timing.</text></svg>
