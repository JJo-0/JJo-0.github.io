<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc"><title id="title">Roles of the PDHG updates</title><desc id="desc">The diagram explains mathematical roles. It does not show the scheduling of GPU kernels.</desc><rect width="960" height="330" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="36" class="small">Explanatory diagram · JJo</text><rect class="box" x="30.0" y="80" width="284.0" height="110" rx="12"/><text x="44.0" y="121" class="">Update x</text><text x="44.0" y="158" class="small">Cost + dual term → project</text><path class="line" d="M317.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="338.0" y="80" width="284.0" height="110" rx="12"/><text x="352.0" y="121" class="">Extrapolate</text><text x="352.0" y="158" class="small">2 × new x − old x</text><path class="line" d="M625.0 134 h18 l-6 -6 m6 6 l-6 6"/><rect class="box" x="646.0" y="80" width="284.0" height="110" rx="12"/><text x="660.0" y="121" class="">Update y</text><text x="660.0" y="158" class="small">Use constraint residual</text><text x="40" y="285" class="small">Computing Aᵀy and Ax may require values held on another device.</text><path d="M792 192 V213 H170 V192 l-6 6 m6 -6 l6 6" stroke="#c87533" stroke-width="3" fill="none" stroke-dasharray="8 5"/><text x="295" y="245" class="small">The next x update uses the new y</text></svg>
