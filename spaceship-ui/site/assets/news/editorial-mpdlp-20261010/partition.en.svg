<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc"><title id="title">Values crossing the variable–constraint partition</title><desc id="desc">A two-variable, two-constraint graph created for this article. It does not reproduce NVIDIA's figures.</desc><rect width="960" height="340" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#152b40;font-size:23px}.small{font-size:19px}.box{fill:#f0f7fc;stroke:#47738f;stroke-width:2}.line{stroke:#47738f;stroke-width:3;fill:none}.note{fill:#42596b}</style><text x="28" y="34" class="small">Illustrative graph · no measured partition</text><rect class="box" x="50" y="65" width="390" height="230" rx="12"/><rect class="box" x="520" y="65" width="390" height="230" rx="12"/><text x="75" y="95" class="">Device A</text><text x="545" y="95" class="">Device B</text><circle cx="130" cy="155" r="26" fill="#d5efeb" stroke="#47738f"/><text x="90" y="215" class="small">Variable 1</text><rect class="box" x="324" y="129" width="52" height="52" rx="12"/><text x="310" y="215" class="small">Constraint 1</text><circle cx="600" cy="240" r="26" fill="#d5efeb" stroke="#47738f"/><text x="560" y="286" class="small">Variable 2</text><rect class="box" x="794" y="214" width="52" height="52" rx="12"/><text x="780" y="286" class="small">Constraint 2</text><path class="line" d="M156 155H324 M626 240H794"/><path d="M376 155L574 240" stroke="#c87533" stroke-width="4" stroke-dasharray="10 6"/><text x="480" y="135" class="small" text-anchor="middle">Remote</text><text x="480" y="158" class="small" text-anchor="middle">value</text></svg>
